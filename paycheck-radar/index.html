<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>PayCheck Radar</title><style>:root{--bg:#080b10;--p:#101620;--p2:#151d29;--line:#243044;--t:#eef4ff;--m:#91a0b6;--g:#72e0aa;--y:#ffd176;--r:#ff8b95;--b:#8ab6ff;--btc:#ffb44f}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(900px 420px at 10% -10%,#153e3033,transparent 60%),radial-gradient(700px 380px at 95% 0,#6c481a33,transparent 60%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:#080b10e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top{max-width:1200px;margin:auto;padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#2e9c72,#15523e);display:grid;place-items:center;font-weight:950}.brand b{display:block}.brand small{display:block;color:var(--m);font-size:10px;margin-top:2px}.tabs{max-width:1200px;margin:auto;padding:0 14px 11px;display:flex;gap:7px;overflow:auto}.tab,.f{border:1px solid var(--line);background:var(--p);color:var(--m);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;white-space:nowrap}.tab.active,.f.active{background:var(--t);color:var(--bg);border-color:var(--t)}.tab.btc.active{background:var(--btc);color:#241504;border-color:var(--btc)}main{max-width:1200px;margin:auto;padding:26px 14px 60px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:end;margin-bottom:16px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--g);font-weight:900}h1{font-size:clamp(38px,6vw,64px);line-height:.98;letter-spacing:-.055em;margin:8px 0 13px}.hero p{color:var(--m);font-size:13px;line-height:1.65}.method{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:16px}.method b{display:block;font-size:13px;margin:5px 0}.method small{color:var(--m);font-size:10px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat,.controls,.card,.box{background:var(--p);border:1px solid var(--line);border-radius:14px}.stat{padding:12px}.stat span,.stat small{display:block;color:var(--m);font-size:8px;text-transform:uppercase;letter-spacing:.07em}.stat strong{display:block;font-size:22px;margin:4px 0}.controls{padding:10px}.search{display:flex;gap:7px;align-items:center;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:0 11px}.search input{width:100%;height:43px;background:transparent;border:0;outline:0;color:var(--t)}.filters{display:flex;gap:6px;align-items:center;overflow:auto;margin-top:8px}.filters select{margin-left:auto;border:1px solid var(--line);background:var(--p2);color:var(--t);border-radius:9px;padding:7px;font-size:10px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--m);font-size:9px;margin:9px 2px;flex-wrap:wrap}.discover{border:1px solid #2e745c;background:#13372d;color:#bdf9df;border-radius:9px;padding:8px 10px;font-size:9px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}.ico{width:52px;height:52px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--p2)}.fallback{display:grid;place-items:center;color:var(--m);font-weight:900}.title{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}.title h3{margin:0;font-size:13px}.badge{padding:4px 6px;border-radius:999px;font-size:7px;font-weight:900;text-transform:uppercase}.VERIFIED{background:#173d2d;color:#83efbc}.PAYING{background:#18304f;color:#9bc5ff}.MIXED{background:#493714;color:#ffda87}.AVOID{background:#4a1f26;color:#ff9ca5}.CANDIDATE{background:#202a39;color:#a9b5c6}.desc{color:var(--m);font-size:9px;line-height:1.5;margin:5px 0 8px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.meta div{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:6px}.meta span{display:block;color:var(--m);font-size:6px;text-transform:uppercase}.meta b{display:block;font-size:8px;margin-top:3px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.chip{background:#1b2533;color:var(--m);border-radius:999px;padding:3px 5px;font-size:7px}.open{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}.open small{font-size:7px;color:var(--m)}.open a{font-size:8px;color:var(--b);font-weight:900;text-decoration:none}.sats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{padding:17px}.box h2{margin:0 0 6px;font-size:22px}.box p{color:var(--m);font-size:10px;line-height:1.6}.box input{width:100%;background:var(--p2);border:1px solid var(--line);color:var(--t);border-radius:9px;padding:10px}.alloc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.alloc div{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:9px}.alloc strong,.alloc b,.alloc span{display:block}.alloc strong{font-size:16px}.alloc b{font-size:9px;margin-top:3px}.alloc span{font-size:7px;color:var(--m)}footer{max-width:1200px;margin:auto;padding:18px 14px 35px;border-top:1px solid var(--line);color:var(--m);font-size:8px;line-height:1.5}@media(max-width:820px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.brand small{display:none}.meta{grid-template-columns:1fr 1fr 1fr}.sats{grid-template-columns:1fr}.alloc{grid-template-columns:1fr 1fr 1fr}}</style></head><body><header><div class="top"><div class="brand"><div class="logo">$</div><div><b>PayCheck Radar</b><small>Free payout research dashboard</small></div></div><button id="theme" class="tab">◐</button></div><div id="tabs" class="tabs"></div></header><main id="app"></main><footer>Free static site. No backend, account, paid API, wallet connection, or seed phrase collection. Mass-discovered App Store results are always marked Unverified candidate until payout evidence is manually checked.</footer><script>const S=[['PAYPAL','iOS','JustPlay: Earn Loyalty Rewards','6444946155','VERIFIED','3 hours','Any earned amount','Fast / varies','Reward hub with a recurring three-hour redemption cycle.',['3-hour','games','PayPal']],['PAYPAL','iOS','Water Garden Life','6764007607','VERIFIED','~3 hours','$0.05 reported','Very fast reported','Tiny-cash style app with penny-scale withdrawals.',['3-hour','penny','$0.05','PayPal']],['PAYPAL','iOS','Scratch Storm','6758199653','VERIFIED','2–3 hours','Tiny / variable','Minutes reported','Small cashouts with a short cycle; earning can fall later.',['3-hour','ads','PayPal']],['PAYPAL','iOS','Cabinet Crush','6756050489','PAYING','~3 hours','$0.01 reported','Small PayPal','Literal penny-cashout pattern; extremely ad-heavy.',['3-hour','penny','$0.01','PayPal']],['PAYPAL','iOS','Word Word — Fun Letters Game','6746229970','PAYING','Anytime','$0.01 reported','Under a minute reported','Older evidence documents one-cent and five-cent withdrawals.',['penny','$0.01','word','PayPal']],['PAYPAL','iOS','Color Dot Connect','6739795394','PAYING','Anytime','$0.01 reported','Fast reported','Older evidence documents several tiny payout tiers.',['penny','$0.01','puzzle','PayPal']],['PAYPAL','iOS','Meow Sort — Color Game','6751991448','VERIFIED','3 hours','~$0.05 reported','Small PayPal','A real tiny-payment game rather than fake hundreds.',['3-hour','penny','$0.05','PayPal']],['PAYPAL','iOS','Bingo Bear — Fun Adventure','6746153715','PAYING','3 hours','$0.05 reported','Small payout','Diamond-to-cash three-hour mechanic; high-dollar ads may exaggerate.',['3-hour','diamonds','$0.05','PayPal']],['PAYPAL','iOS','Movaway Puzzloo','6756287479','MIXED','3 hours','Tiny / variable','Minutes for some','Detailed payouts exist but later missing withdrawals were reported.',['3-hour','penny','ads','PayPal']],['PAYPAL','iOS','Blingz','6759068218','MIXED','~3 hours','Small / variable','Seconds reported','Current tiny-cash pattern with withdrawal/account-block complaints.',['3-hour','games','PayPal']],['PAYPAL','iOS','Coin Fall Mania','6755102188','AVOID','3-hour style','Huge threshold','Unverified','High threshold and non-payment reports.',['warning','ads']],['BITCOIN','iOS','ZBD: Play. Earn. Cash Out.','1484394401','VERIFIED','Anytime','No minimum advertised','Lightning','Bitcoin reward hub for games and tasks.',['Bitcoin','Lightning','sats','games']],['BITCOIN','iOS','Blocks of Bitcoin: Puzzle Game','6743409638','VERIFIED','Gameplay','Small sats','Via ZBD','Puzzle game routing sat rewards through ZBD.',['Bitcoin','sats','puzzle','ZBD']],['BITCOIN','iOS','Bitcoin Miner: Idle Tycoon','1413770650','MIXED','Daily / variable','Third-party rules','Via ZBD','Long-running idle game with reward reductions and complaints.',['Bitcoin','sats','idle','ZBD']],['BITCOIN','iOS','sMiles: Bitcoin Rewards','1492458803','MIXED','Anytime after confirmation','Varies','Lightning','Walking, games and tasks for sats; payout/support complaints need caution.',['Bitcoin','Lightning','walking','games']],['BITCOIN','iOS','BitWalk — Earn Bitcoin every day','1634543016','VERIFIED','Multi-day cycle','Threshold based','Days to weeks','Walking/ad reward app with BTC withdrawal reports.',['Bitcoin','walking','ads']],['BITCOIN','iOS','Club Bitcoin: Solitaire','1619992672','PAYING','Prize draw','Prize dependent','Lightning claim','Solitaire prize draw using Lightning for winnings.',['Bitcoin','Lightning','solitaire']],['WEB','Telegram','Telegram PayPal research queue','', 'CANDIDATE','Unknown','Unknown','Unknown','Bots change often; only promote after a real PayPal withdrawal is confirmed.',['Telegram','PayPal','unverified']],['WEB','Web','Web PayPal penny research queue','', 'CANDIDATE','Unknown','Target $0.01–$0.10','Target instant / ≤3h','Browser games/sites belong here only after strict payout checking.',['Web','PayPal','unverified']]].map((x,i)=>({id:i,rail:x[0],platform:x[1],name:x[2],appleId:x[3],status:x[4],timer:x[5],min:x[6],speed:x[7],desc:x[8],tags:x[9],url:x[3]?'https://apps.apple.com/us/app/id'+x[3]:x[1]==='Telegram'?'https://t.me/':'https://www.google.com/search?q=paypal+penny+cashout+game'}));let tab='PAYPAL',fil='ALL',q='',disc=[],busy=false;try{disc=JSON.parse(localStorage.prdisc||'[]')}catch{}const lanes=['paypal earn cash games','paypal rewards game','cash out paypal games','penny cashout paypal','watch ads earn paypal','3 hour paypal rewards','bitcoin rewards','earn bitcoin games','lightning bitcoin rewards','satoshi rewards games','zbd bitcoin games','walk earn bitcoin','bitcoin solitaire rewards','earn sats'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function rail(x){let t=((x.trackName||'')+' '+(x.description||'')).toLowerCase();return /bitcoin|satoshi|\bsats\b|lightning|zbd/.test(t)?'BITCOIN':'PAYPAL'}function cands(){return disc.map(x=>({rail:rail(x),platform:'iOS',name:x.trackName||'Unknown',appleId:String(x.trackId||''),status:'CANDIDATE',timer:'Unknown',min:'Unknown',speed:'Unknown',desc:(x.description||'Public App Store candidate').slice(0,150),tags:[rail(x)==='BITCOIN'?'Bitcoin':'PayPal','unverified'],url:x.trackViewUrl,art:x.artworkUrl100}))}async function discover(){if(busy)return;busy=true;render();let m=new Map(disc.map(x=>[x.trackId,x]));let rs=await Promise.all(lanes.map(t=>fetch('https://itunes.apple.com/search?country=us&entity=software&limit=200&term='+encodeURIComponent(t)).then(r=>r.json()).catch(()=>null)));for(let d of rs)for(let x of(d?.results||[])){let t=((x.trackName||'')+' '+(x.description||'')).toLowerCase();if(/paypal|reward|cash|bitcoin|satoshi|\bsats\b|lightning|zbd|earn/.test(t))m.set(x.trackId,x)}disc=[...m.values()];try{localStorage.prdisc=JSON.stringify(disc.slice(0,2500))}catch{}busy=false;render()}function list(){let a=[...S,...cands()];if(tab==='WARN')a=a.filter(x=>x.status==='MIXED'||x.status==='AVOID');else a=a.filter(x=>x.rail===tab);if(fil==='VERIFIED')a=a.filter(x=>x.status==='VERIFIED');if(fil==='FAST')a=a.filter(x=>/anytime|minute|1 hour|2 hour|3 hour|2–3|~3/i.test(x.timer));if(fil==='PENNY')a=a.filter(x=>/\$0\.0[1-9]|\$0\.10|penny/i.test(x.min+' '+x.tags.join(' ')));if(fil==='GAMES')a=a.filter(x=>x.tags.some(t=>/game|puzzle|solitaire|word|bingo/i.test(t)));if(fil==='CANDIDATE')a=a.filter(x=>x.status==='CANDIDATE');if(q)a=a.filter(x=>(x.name+' '+x.desc+' '+x.tags.join(' ')+' '+x.min+' '+x.timer).toLowerCase().includes(q.toLowerCase()));return a}function card(x){let ic=x.art?'<img class="ico" src="'+esc(x.art)+'" loading="lazy">':'<div class="ico fallback">'+esc(x.name.slice(0,2).toUpperCase())+'</div>';return'<article class="card">'+ic+'<div><div class="title"><h3>'+esc(x.name)+'</h3><span class="badge '+x.status+'">'+esc(x.status==='CANDIDATE'?'Unverified':x.status)+'</span></div><div class="desc">'+esc(x.desc)+'</div><div class="meta"><div><span>Cycle</span><b>'+esc(x.timer)+'</b></div><div><span>Minimum</span><b>'+esc(x.min)+'</b></div><div><span>Speed</span><b>'+esc(x.speed)+'</b></div></div><div class="chips">'+x.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div><div class="open"><small>'+esc(x.platform)+' · '+(x.status==='CANDIDATE'?'Discovery only — not payout proof':'Editorial seed')+'</small><a href="'+esc(x.url)+'" target="_blank">Open ↗</a></div></article>'}function browser(){let a=list(),ver=S.filter(x=>(tab==='WARN'?(x.status==='MIXED'||x.status==='AVOID'):x.rail===tab)&&x.status==='VERIFIED').length,w=S.filter(x=>(tab==='WARN'?(x.status==='MIXED'||x.status==='AVOID'):x.rail===tab)&&(x.status==='MIXED'||x.status==='AVOID')).length,title=tab==='BITCOIN'?'Which Bitcoin / Lightning apps actually pay sats?':tab==='WEB'?'Web + Telegram payout research':tab==='WARN'?'Warnings and mixed reports':'Which PayPal apps actually cash out?';return'<section class="hero"><div><div class="ey">'+(tab==='BITCOIN'?'Bitcoin / Lightning':tab==='WEB'?'Web + Telegram':'PayPal payout rail')+'</div><h1>'+title+'</h1><p>Strict payout research with penny and ≤3-hour filters. The large App Store index is discovery only and never auto-claims an app pays.</p></div><div class="method"><div class="ey">Evidence rule</div><b>Discovery is not verification.</b><small>Only researched seed entries get payout labels. Everything fetched from Apple search stays Unverified.</small></div></section><section class="stats"><div class="stat"><span>Verified</span><strong>'+ver+'</strong><small>seed entries</small></div><div class="stat"><span>Warnings</span><strong>'+w+'</strong><small>mixed / avoid</small></div><div class="stat"><span>Discovery</span><strong>'+disc.length+'</strong><small>App Store candidates</small></div><div class="stat"><span>Visible</span><strong>'+a.length+'</strong><small>current filter</small></div></section><section class="controls"><div class="search">⌕<input id="search" placeholder="Search $0.01, 3 hours, Lightning…" value="'+esc(q)+'"></div><div class="filters">'+[['ALL','All'],['VERIFIED','Verified'],['FAST','≤3 hours'],['PENNY','$0.01–$0.10'],['GAMES','Games'],['CANDIDATE','Unverified']].map(x=>'<button class="f '+(fil===x[0]?'active':'')+'" data-f="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></section><div class="bar"><span>'+a.length+' results · discovery cached on this device</span><button id="discover" class="discover">'+(busy?'Loading…':disc.length?'Refresh candidate index':'Load large candidate index')+'</button></div><section class="grid">'+a.map(card).join('')+'</section>'}function sats(){return'<section class="hero"><div><div class="ey">Sats strategy</div><h1>Keep more of what you earned.</h1><p>Bitcoin itself does not promise interest. Grow sats by earning more, saving more, or deliberately buying more — not by trusting guaranteed-yield schemes.</p></div><div class="method"><b>100,000,000 sats = 1 BTC</b><small>No wallet connection. Never enter a recovery phrase here or into an earning app.</small></div></section><section class="sats"><div class="box"><h2>Stack-first planner</h2><p>Example split only.</p><input id="sat" type="number" value="10000"><div id="alloc" class="alloc"></div></div><div class="box"><h2>Simple rules</h2><p><b>1.</b> Withdraw from earning apps instead of using them as savings accounts.</p><p><b>2.</b> Use Lightning for small everyday transfers.</p><p><b>3.</b> Learn stronger self-custody before storing meaningful long-term balances.</p><p><b>4.</b> Avoid guaranteed APY, doubling, cloud-mining deposits, and anyone asking for your seed phrase.</p></div></section>'}function alloc(){let n=Math.max(0,Math.floor(+$('#sat').value||0)),a=Math.floor(n*.8),b=Math.floor(n*.1),c=n-a-b;$('#alloc').innerHTML=[['80%',a,'Stack'],['10%',b,'Spend'],['10%',c,'Learn']].map(x=>'<div><strong>'+x[0]+'</strong><b>'+x[1].toLocaleString()+' sats</b><span>'+x[2]+'</span></div>').join('')}function tabs(){let ts=[['PAYPAL','💵 PayPal'],['BITCOIN','⚡ Bitcoin / Lightning'],['WEB','🌐 Web + Telegram'],['WARN','⚠️ Warnings'],['SATS','🪙 Sats strategy']];$('#tabs').innerHTML=ts.map(x=>'<button class="tab '+(x[0]==='BITCOIN'?'btc ':'')+(tab===x[0]?'active':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;fil='ALL';q='';render()})}function render(){tabs();$('#app').innerHTML=tab==='SATS'?sats():browser();if(tab==='SATS'){alloc();$('#sat').oninput=alloc;return}$('#search').oninput=e=>{q=e.target.value;render()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fil=b.dataset.f;render()});$('#discover').onclick=discover}$('#theme').onclick=()=>{document.documentElement.style.filter=document.documentElement.style.filter?'':'invert(.92) hue-rotate(180deg)';};render();</script></body></html>
