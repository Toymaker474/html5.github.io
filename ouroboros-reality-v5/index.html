<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080b0d"><title>OUROBOROS REALITY V5 — Material Civilization</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;color:#eafff7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));max-width:82vw;padding:10px 12px;border:1px solid #9affd544;border-radius:12px;background:#071018cf;backdrop-filter:blur(10px);font-size:11px;line-height:1.45;pointer-events:none}.title{font-weight:900;letter-spacing:.11em;color:#9affd5}.hot{color:#ffb36b}.hint{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:5;padding:8px 10px;border-radius:10px;background:#071018c2;border:1px solid #ffffff20;font-size:10px;opacity:.86;pointer-events:none}.err{color:#ff8e8e;white-space:pre-wrap}</style><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="renderCanvas"></canvas><div class="hud"><div class="title">OUROBOROS REALITY V5 / MATERIAL CIVILIZATION</div><div id="stats">booting material world…</div><div id="mode" class="hot">stone → dust → melt → lava → solid</div></div><div class="hint">drag orbit • pinch zoom • tap goblin/stone • watch materials transform</div><script>addEventListener('error',e=>{stats.textContent='BOOT ERROR';mode.className='err';mode.textContent=(e.message||'unknown')+(e.filename?'\n'+e.filename+':'+e.lineno:'')});addEventListener('unhandledrejection',e=>{stats.textContent='MODULE ERROR';mode.className='err';mode.textContent=String(e.reason&&e.reason.message||e.reason||'unknown')});</script><script src="./world.js?v=1"></script></body></html>
