<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0b" />
  <title>NEXUS V7 — MuJoCo Locomotion Research</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --text: #e8e9e5;
      --muted: #989c98;
      --line: #343837;
      --surface: #0d1010;
      --surface-raised: #141818;
      --accent: #df5538;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0b;
    }

    #world {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #identity {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      width: min(310px, calc(100vw - 96px));
      pointer-events: none;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .9);
    }

    #identity-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(232, 233, 229, .24);
    }

    #identity-title b {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    #identity-title span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    #status {
      padding-top: 8px;
      color: rgba(232, 233, 229, .82);
      font: 500 9px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    #status strong {
      color: var(--accent);
      font-weight: 720;
    }

    #telemetry-toggle {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      min-width: 56px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(232, 233, 229, .32);
      border-radius: 6px;
      background: rgba(13, 16, 16, .92);
      color: var(--text);
      font: 650 9px/1 Inter, ui-sans-serif, sans-serif;
      touch-action: manipulation;
      z-index: 5;
    }

    #telemetry-toggle[aria-expanded="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    #research-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(292px, 78vw);
      padding: max(76px, calc(env(safe-area-inset-top) + 62px)) 20px max(22px, env(safe-area-inset-bottom));
      border-left: 1px solid var(--line);
      background: var(--surface);
      box-shadow: -18px 0 44px rgba(0, 0, 0, .46);
      transform: translateX(100%);
      transition: transform 180ms cubic-bezier(.2, .8, .2, 1);
      overflow: auto;
      z-index: 4;
    }

    #research-panel[data-open="true"] { transform: translateX(0); }

    .panel-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    #mode-value {
      margin-bottom: 20px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font: 600 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 14px;
      margin-bottom: 28px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
    }

    .metric b {
      display: block;
      margin-top: 5px;
      color: var(--text);
      font: 620 17px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    #controller-value {
      margin: 0 0 12px;
      color: var(--text);
      font: 560 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    #archive-map {
      display: block;
      width: 100%;
      height: 132px;
      border: 1px solid var(--line);
      image-rendering: pixelated;
    }

    .axis-row {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 550;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(4, minmax(66px, 82px));
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(232, 233, 229, .18);
      border-radius: 9px;
      background: rgba(13, 16, 16, .90);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
      z-index: 3;
    }

    #controls button {
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      border-radius: 5px;
      background: var(--surface-raised);
      color: var(--text);
      font: 650 9px/1 Inter, ui-sans-serif, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #controls button:active {
      transform: translateY(1px);
      background: #202525;
    }

    #controls button[aria-pressed="true"] {
      box-shadow: inset 0 0 0 1px var(--accent);
      color: var(--accent);
    }

    @media (max-width: 390px) {
      #identity { width: calc(100vw - 90px); }
      #identity-title span { display: none; }
      #status { font-size: 8px; }
      #controls { grid-template-columns: repeat(4, 63px); }
      #controls button { padding: 0 4px; font-size: 8px; }
    }

    @media (min-width: 900px) {
      #research-panel { width: 330px; }
      #archive-map { height: 170px; }
      #controls { gap: 8px; }
      #controls button { min-width: 88px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #research-panel { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="world" aria-label="MuJoCo hexapod locomotion experiment"></canvas>

  <section id="identity" aria-live="polite">
    <div id="identity-title">
      <b>NEXUS V7</b>
      <span>MuJoCo locomotion research</span>
    </div>
    <div id="status"><strong>Starting</strong><br />Loading MuJoCo WebAssembly…</div>
  </section>

  <button id="telemetry-toggle" type="button" aria-controls="research-panel" aria-expanded="false">Data</button>

  <aside id="research-panel" data-open="false" aria-label="Experiment diagnostics">
    <div class="panel-label">Quality-diversity run</div>
    <div id="mode-value">Manual experiment</div>

    <div class="metric-grid">
      <div class="metric"><span>Generation</span><b id="generation-value">0</b></div>
      <div class="metric"><span>Coverage</span><b id="coverage-value">0.0%</b></div>
      <div class="metric"><span>Best fitness</span><b id="fitness-value">—</b></div>
      <div class="metric"><span>Metres / joule</span><b id="efficiency-value">—</b></div>
    </div>

    <div class="panel-label">Controller state</div>
    <div id="controller-value">—</div>
    <canvas id="archive-map" width="250" height="132"></canvas>
    <div class="axis-row"><span>Contact duty →</span><span>Stability ↑</span></div>
  </aside>

  <nav id="controls" aria-label="Experiment controls">
    <button id="pause" type="button">Pause</button>
    <button id="reset" type="button">Reset</button>
    <button id="mutate" type="button">Mutate</button>
    <button id="evolve" type="button" aria-pressed="false">Evolve</button>
  </nav>

  <script>
    const telemetryToggle = document.querySelector('#telemetry-toggle');
    const researchPanel = document.querySelector('#research-panel');
    telemetryToggle?.addEventListener('click', () => {
      const open = researchPanel?.dataset.open !== 'true';
      if (researchPanel) researchPanel.dataset.open = String(open);
      telemetryToggle.setAttribute('aria-expanded', String(open));
      telemetryToggle.textContent = open ? 'Close' : 'Data';
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
