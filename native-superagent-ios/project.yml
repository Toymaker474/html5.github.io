name: SuperAgentNative
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM.git
    from: 0.17.0
targets:
  SuperAgentNative:
    type: application
    platform: iOS
    sources:
      - path: SuperAgentNative
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - framework: NativeRustCore/SuperAgentRust.xcframework
      - sdk: libsqlite3.tbd
      - sdk: Accelerate.framework
      - sdk: NaturalLanguage.framework
      - sdk: PDFKit.framework
      - sdk: AVFoundation.framework
      - sdk: Metal.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: CoreMotion.framework
      - sdk: CoreImage.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toymaker474.superagentnative
        PRODUCT_NAME: SuperAgentNative
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: SuperAgentNative/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: SuperAgentNative/SuperAgentNative-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_C_LANGUAGE_STANDARD: c11
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: []
