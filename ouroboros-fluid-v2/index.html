<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070b"><title>OUROBOROS CONTINUOUS FLUID WORLD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070b;color:#dff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}#c{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;background:#02070bcc;border:1px solid #8fffff44;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.45;pointer-events:none;backdrop-filter:blur(10px)}b{color:#9ff}.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}.toolbar button{border:1px solid #ffffff2c;background:#07131ccc;color:#eaffff;padding:10px 12px;border-radius:999px;font:600 12px ui-monospace,monospace}.toolbar button.on{border-color:#8fffff99;background:#123047dd}.err{color:#ff9999;white-space:pre-wrap}</style><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="c"></canvas><div class="hud"><b>OUROBOROS / CONTINUOUS MATERIAL WORLD</b><div id="stats">booting solver…</div><div id="mode">water • lava • steam • sediment • erosion</div></div><div class="toolbar"><button id="water" class="on">WATER</button><button id="lava">LAVA</button><button id="rain">RAIN</button></div><script>addEventListener('error',e=>{stats.textContent='BOOT ERROR';mode.className='err';mode.textContent=e.message||'unknown'});addEventListener('unhandledrejection',e=>{stats.textContent='MODULE ERROR';mode.className='err';mode.textContent=String(e.reason?.message||e.reason||'unknown')});</script><script src="./world.js?v=1"></script></body></html>
