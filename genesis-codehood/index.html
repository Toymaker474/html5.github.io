<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070910">
<title>GENESIS // PIXELLIFE V9</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app pixel-app">
<header>
  <span class="brand">GENESIS // PIXELLIFE V9</span>
  <span class="badge">ALIFE + EVOLVED SOFTWARE</span>
  <button id="pause">⏸ PAUSE</button>
  <button id="turbo" class="primary">⚡ SPEED ×1</button>
  <button id="rain">⛈ STORM</button>
  <button id="zero">🌍 NEW WORLD</button>
</header>
<main class="world-wrap pixel-world">
  <canvas id="world" aria-label="Pixel artificial-life world with evolving animals, humans and software"></canvas>
  <div id="hud" class="hud"></div>
</main>
<aside class="side">
  <nav class="tabs">
    <button data-tab="lives" class="on">🧬 LIVES</button>
    <button data-tab="software">💻 SOFTWARE</button>
    <button data-tab="history">📜 HISTORY</button>
    <button data-tab="world">🌎 WORLD</button>
  </nav>
  <div id="panel" class="panel"></div>
</aside>
<footer>
  <span>PIXEL ENGINE</span><span>• wildlife worker</span><span>• 384 regions</span><span>• zero solved programs</span><span>• tap a human to inspect</span>
</footer>
</div>
<script type="module" src="./src/main_v9.js"></script>
</body>
</html>
