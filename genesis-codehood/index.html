<script>
'use strict';
const C=document.querySelector('#game'),X=C.getContext('2d',{alpha:false}),stats=document.querySelector('#stats'),inspect=document.querySelector('#inspect');
let DPR=1,SW=innerWidth,SH=innerHeight;
function resize(){DPR=Math.min(devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;C.width=SW*DPR;C.height=SH*DPR;X.setTransform(DPR,0,0,DPR,0,0);X.imageSmoothingEnabled=true}addEventListener('resize',resize);resize();
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let seed=(Math.random()*0xffffffff)>>>0;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function hash(n){n|=0;n=(n+0x7ed55d16)+(n<<12);n=(n^0xc761c23c)^(n>>>19);n=(n+0x165667b1)+(n<<5);n=(n+0xd3a2646c)^(n<<9);n=(n+0xfd7046c5)+(n<<3);n=(n^0xb55a4f09)^(n>>>16);return(n>>>0)/4294967296}
function noise1(x,s=0){const a=Math.floor(x),t=x-a,u=t*t*(3-2*t);return lerp(hash(a*928371+s*97),hash((a+1)*928371+s*97),u)}function fbm1(x,s=0){let a=.56,f=.008,v=0,n=0;for(let i=0;i<5;i++){v+=noise1(x*f,s+i*19)*a;n+=a;a*=.5;f*=2.05}return v/n}
const TILE=28,COLS=280,ROWS=38,WORLD_W=COLS*TILE,WORLD_H=ROWS*TILE;
const solid=new Uint8Array(COLS*ROWS),wet=new Float32Array(COLS*ROWS);const tidx=(x,y)=>y*COLS+x;
function inGrid(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS}function isSolidCell(x,y){return !inGrid(x,y)||solid[tidx(x,y)]===1}function isSolidAt(x,y){return isSolidCell(Math.floor(x/TILE),Math.floor(y/TILE))}
const surfaceY=new Float32Array(COLS);
function genWorld(){solid.fill(0);wet.fill(0);for(let x=0;x<COLS;x++){let h=26+Math.floor((fbm1(x,5)-.5)*8+(fbm1(x+70,8)-.5)*5);h=clamp(h,19,31);surfaceY[x]=h*TILE;for(let y=h;y<ROWS;y++)solid[tidx(x,y)]=1}for(let cave=0;cave<20;cave++){let cx=8+Math.floor(rnd()*(COLS-16)),cy=21+Math.floor(rnd()*9),len=10+Math.floor(rnd()*25),rad=1+Math.floor(rnd()*2);for(let k=0;k<len;k++){cx=clamp(cx+(rnd()<.55?1:(rnd()<.5?-1:0)),2,COLS-3);cy=clamp(cy+(rnd()<.22?(rnd()<.5?-1:1):0),15,ROWS-3);for(let oy=-rad;oy<=rad;oy++)for(let ox=-rad;ox<=rad;ox++)if(inGrid(cx+ox,cy+oy))solid[tidx(cx+ox,cy+oy)]=0}}for(let p=0;p<38;p++){const x=4+Math.floor(rnd()*(COLS-10)),y=10+Math.floor(rnd()*14),w=3+Math.floor(rnd()*8);for(let xx=x;xx<x+w&&xx<COLS-1;xx++)solid[tidx(xx,y)]=1;if(rnd()<.45){const hh=3+Math.floor(rnd()*6);for(let yy=y;yy<y+hh&&yy<ROWS-1;yy++)solid[tidx(x,yy)]=1}}for(let x=2;x<18;x++)for(let y=10;y<25;y++)solid[tidx(x,y)]=0}
function exposedSurfacePoint(cx,cy,px,py){if(!isSolidCell(cx,cy))return null;const x=cx*TILE,y=cy*TILE;let best=null,bd=1e9;const test=(sx,sy,nx,ny)=>{if(isSolidCell(cx+nx,cy+ny))return;const d=(sx-px)**2+(sy-py)**2;if(d<bd){bd=d;best={x:sx,y:sy,nx:-nx,ny:-ny}}};test(x+TILE*.5,y,0,-1);test(x+TILE*.5,y+TILE,0,1);test(x,y+TILE*.5,-1,0);test(x+TILE,y+TILE*.5,1,0);return best}
function findContact(px,py,desX,desY,rad,front=0){const minX=Math.floor((desX-rad)/TILE),maxX=Math.floor((desX+rad)/TILE),minY=Math.floor((desY-rad)/TILE),maxY=Math.floor((desY+rad)/TILE);let best=null,bs=1e9;for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){const p=exposedSurfacePoint(x,y,desX,desY);if(!p)continue;const d=Math.hypot(p.x-desX,p.y-desY);const reach=Math.hypot(p.x-px,p.y-py);if(reach>rad*1.35)continue;const score=d-front*(p.x-px);if(score<bs){bs=score;best=p}}return best}
function pointCollide(n){const minX=Math.floor((n.x-n.r)/TILE),maxX=Math.floor((n.x+n.r)/TILE),minY=Math.floor((n.y-n.r)/TILE),maxY=Math.floor((n.y+n.r)/TILE);for(let cy=minY;cy<=maxY;cy++)for(let cx=minX;cx<=maxX;cx++){if(!isSolidCell(cx,cy))continue;const rx=cx*TILE,ry=cy*TILE,qx=clamp(n.x,rx,rx+TILE),qy=clamp(n.y,ry,ry+TILE),dx=n.x-qx,dy=n.y-qy,d2=dx*dx+dy*dy;if(d2<n.r*n.r){let d=Math.sqrt(d2),nx=0,ny=-1;if(d>.0001){nx=dx/d;ny=dy/d}else{const dl=Math.abs(n.x-rx),dr=Math.abs(n.x-(rx+TILE)),dt=Math.abs(n.y-ry),db=Math.abs(n.y-(ry+TILE)),m=Math.min(dl,dr,dt,db);if(m===dl){nx=-1;ny=0}else if(m===dr){nx=1;ny=0}else if(m===db){nx=0;ny=1}}const push=n.r-(d||0);n.x+=nx*push;n.y+=ny*push;const vx=n.x-n.px,vy=n.y-n.py,dot=vx*nx+vy*ny;if(dot<0){n.px+=nx*dot*.55;n.py+=ny*dot*.55}n.contact=Math.max(n.contact,ny<-.5?1:0)}}}
function Node(x,y,r=8,mass=1){return{x,y,px:x,py:y,r,inv:1/Math.max(.001,mass),contact:0}}
function integrateNode(n,gravity=.38,drag=.994){n.contact=0;const vx=(n.x-n.px)*drag,vy=(n.y-n.py)*drag;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+gravity;pointCollide(n)}
function constrain(a,b,len,stiff=1){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001,diff=(d-len)/d*stiff,wa=a.inv/(a.inv+b.inv),wb=1-wa;a.x+=dx*diff*wa;a.y+=dy*diff*wa;b.x-=dx*diff*wb;b.y-=dy*diff*wb}
function spring(a,b,len,k=.04){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-len)*k,fx=dx/d*f,fy=dy/d*f;a.x+=fx*a.inv;b.x-=fx*b.inv;a.y+=fy*a.inv;b.y-=fy*b.inv}
function velocity(n){return{x:n.x-n.px,y:n.y-n.py}}function impulse(n,x,y){n.px-=x;n.py-=y}
const SPEC={miregrazer:{name:'Miregrazer',role:'herb',color:'#85976a',hi:'#c2c993',body:3,legs:4,arms:0,tail:3,baseSpeed:.32},needlejaw:{name:'Needlejaw',role:'pred',color:'#87494a',hi:'#d17768',body:3,legs:4,arms:0,tail:4,baseSpeed:.45},gutterclaw:{name:'Gutterclaw',role:'scav',color:'#67757d',hi:'#a5b7bd',body:2,legs:2,arms:2,tail:2,baseSpeed:.38}};
function genes(base=null){const keys=['size','speed','vision','fear','aggression','grip','limb','metabolism','fertility','stamina'];const o={};for(const k of keys)o[k]=base?clamp(base[k]+gauss()*.045,.55,1.55):.82+rnd()*.36;return o}function crossGenes(a,b){const o={};for(const k of Object.keys(a))o[k]=clamp((rnd()<.5?a[k]:b[k])+gauss()*.035,.5,1.65);return o}
let nextId=1,maxGen=0;
class Creature{constructor(type,x,y,gene=null,gen=0){this.id=nextId++;this.type=type;this.spec=SPEC[type];this.g=gene||genes();this.gen=gen;maxGen=Math.max(maxGen,gen);this.alive=true;this.health=100;this.energy=70+rnd()*25;this.age=0;this.state='ROAM';this.stateT=0;this.face=rnd()<.5?-1:1;this.homeX=x;this.memory={food:null,threat:null,corpse:null};this.mateCooldown=600+rnd()*600;this.grab=null;this.biteCooldown=0;this.stun=0;this.nodes=[];this.constraints=[];this.limbs=[];this.tail=[];this.parts=[];this.struggle=0;this.buildBody(x,y)}buildBody(x,y){const s=this.g.size,n=this.spec.body;for(let i=0;i<n;i++)this.nodes.push(Node(x-i*13*s,y-i*2,7*s*(i===0?1:.95),1));for(let i=0;i<n-1;i++)this.constraints.push([i,i+1,13*s]);if(n>2)this.constraints.push([0,2,25*s]);for(let i=0;i<this.spec.tail;i++){const prev=i?this.tail[i-1]:this.nodes[n-1],q=Node(prev.x-9*this.face,prev.y,3.2*s,.6);this.tail.push(q)}const limbCount=this.spec.legs+this.spec.arms;for(let i=0;i<limbCount;i++){const arm=i>=this.spec.legs,anchor=arm?0:(i%2===0?0:Math.min(1,n-1)),side=i%2===0?-1:1;this.limbs.push({arm,anchor,side,phase:(i/Math.max(1,limbCount))*TAU,hand:Node(x,y,2.7*s,.35),planted:false,target:null,reach:(arm?24:28)*this.g.limb*s,cool:rnd()*20,disabled:false})}}head(){return this.nodes[0]}center(){let x=0,y=0;for(const n of this.nodes){x+=n.x;y+=n.y}return{x:x/this.nodes.length,y:y/this.nodes.length}}speed(){return Math.abs(velocity(this.head()).x)}}
const creatures=[],plants=[],looseParts=[];
function randomFloorX(){for(let t=0;t<100;t++){const x=3+Math.floor(rnd()*(COLS-6)),sy=surfaceY[x];if(sy>0)return{x:x*TILE+TILE*.5,y:sy-22}}return{x:200,y:500}}function spawnCreature(type,parentA=null,parentB=null,x=null,y=null){const p=x==null?randomFloorX():{x,y},g=parentA?crossGenes(parentA.g,parentB?.g||parentA.g):genes(),gen=parentA?Math.max(parentA.gen,parentB?.gen||0)+1:0;const c=new Creature(type,p.x,p.y,g,gen);creatures.push(c);return c}function spawnPlant(x,y){plants.push({x,y,food:18+rnd()*16,phase:rnd()*TAU,alive:true})}
function seedLife(){creatures.length=0;plants.length=0;looseParts.length=0;nextId=1;maxGen=0;for(let i=0;i<13;i++)spawnCreature('miregrazer');for(let i=0;i<5;i++)spawnCreature('needlejaw');for(let i=0;i<5;i++)spawnCreature('gutterclaw');for(let x=3;x<COLS-3;x+=2){if(rnd()<.62){const y=surfaceY[x]/TILE|0;if(y>2&&!isSolidCell(x,y-1))spawnPlant(x*TILE+5+rnd()*(TILE-10),y*TILE-2)}}}
function nearest(c,pred,r=420){const cc=c.center();let best=null,bd=r*r;for(const o of creatures){if(o===c||!pred(o))continue;const q=o.center(),d=(q.x-cc.x)**2+(q.y-cc.y)**2;if(d<bd){bd=d;best=o}}return best}function nearestPlant(c,r=320){const q=c.center();let best=null,bd=r*r;for(const p of plants){if(!p.alive||p.food<=0)continue;const d=(p.x-q.x)**2+(p.y-q.y)**2;if(d<bd){bd=d;best=p}}return best}function lineClear(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.ceil(d/(TILE*.55));for(let i=1;i<steps;i++){const t=i/steps;if(isSolidAt(lerp(a.x,b.x,t),lerp(a.y,b.y,t)))return false}return true}
function chooseAI(c){if(!c.alive)return;if(c.stun>0){c.state='STUN';return}const q=c.center(),storm=weather.rain;let target=null;if(c.spec.role==='herb'){const threat=nearest(c,o=>o.alive&&o.spec.role==='pred',c.g.vision*360);if(threat&&lineClear(q,threat.center())){c.memory.threat=threat.center();c.state='FLEE';target=threat}else if(storm>.72&&rnd()<.7){c.state='SHELTER'}else if(c.energy<82){const p=nearestPlant(c,c.g.vision*300);if(p){c.memory.food={x:p.x,y:p.y};c.state='FORAGE';target=p}else c.state='ROAM'}else c.state='ROAM'}else if(c.spec.role==='pred'){const prey=nearest(c,o=>o.alive&&o.spec.role==='herb',c.g.vision*430),corpse=nearest(c,o=>!o.alive&&o.decay<6000,c.g.vision*260);if(c.energy<38&&corpse){c.state='SCAVENGE';target=corpse}else if(prey&&lineClear(q,prey.center())){const d=dist(q,prey.center());c.state=d<110?'POUNCE':'STALK';target=prey}else if(storm>.85&&c.energy>45)c.state='SHELTER';else c.state='ROAM'}else{const corpse=nearest(c,o=>!o.alive&&o.decay<7000,c.g.vision*420),threat=nearest(c,o=>o.alive&&o.spec.role==='pred',c.g.vision*280);if(threat&&c.energy>28){c.state='EVADE';target=threat}else if(corpse){c.memory.corpse=corpse.center();c.state='SCAVENGE';target=corpse}else if(c.energy<55){const p=nearestPlant(c,220);c.state=p?'FORAGE':'ROAM';target=p}else c.state='ROAM'}c.aiTarget=target;c.stateT=50+Math.floor(rnd()*80)}
function desiredMotion(c){let dx=c.face,dy=0,speed=c.spec.baseSpeed*c.g.speed,state=c.state,q=c.center(),t=c.aiTarget;const tx=t?(t.x??t.center?.().x):null,ty=t?(t.y??t.center?.().y):null;if(tx!=null){dx=Math.sign(tx-q.x)||c.face;dy=clamp((ty-q.y)/100,-1,1);c.face=dx||c.face}if(state==='FLEE'||state==='EVADE'){if(t){dx=Math.sign(q.x-(t.center?t.center().x:t.x))||c.face;c.face=dx}speed*=1.45}if(state==='STALK')speed*=.7;if(state==='POUNCE')speed*=1.8;if(state==='SHELTER'){const roof=findRoofPoint(q.x,q.y);if(roof){dx=Math.sign(roof.x-q.x)||c.face;dy=clamp((roof.y-q.y)/100,-1,1)}speed*=.95}if(state==='REST'||state==='STUN')speed=0;return{dx,dy,speed}}
function findRoofPoint(x,y){for(let s=1;s<18;s++){for(const dir of [-1,1]){const px=x+dir*s*TILE,cy=Math.floor(y/TILE);for(let yy=cy-1;yy>=Math.max(1,cy-5);yy--){if(isSolidAt(px,yy*TILE)&&!isSolidAt(px,(yy+1)*TILE))return{x:px,y:(yy+1)*TILE+20}}}}return null}
function updateLimb(c,l,dt){if(l.disabled)return;const body=c.nodes[l.anchor],motion=desiredMotion(c),reach=l.reach,bx=body.x,by=body.y;l.cool-=dt;if(l.planted){l.hand.x=l.target.x;l.hand.y=l.target.y;l.hand.px=l.hand.x;l.hand.py=l.hand.y;const stretched=Math.hypot(l.hand.x-bx,l.hand.y-by)>reach*1.18,behind=(l.hand.x-bx)*c.face<-(l.arm?8:15);if(stretched||behind||!isSolidAt(l.target.x+l.target.nx*3,l.target.y+l.target.ny*3)){l.planted=false;l.target=null;l.cool=4+rnd()*8}}if(!l.planted){integrateNode(l.hand,.30,.91);const desiredX=bx+c.face*(l.arm?18:22)+c.face*motion.speed*34+Math.sin(simTick*.10+l.phase)*9,desiredY=by+(l.arm?-4:reach*.78)+motion.dy*12;if(l.cool<=0){const hit=findContact(bx,by,desiredX,desiredY,reach*1.05,c.face*.15);if(hit){l.target=hit;l.planted=true;l.hand.x=hit.x;l.hand.y=hit.y;l.cool=7+rnd()*7}}}if(l.planted){const dx=l.hand.x-bx,dy=l.hand.y-by,d=Math.hypot(dx,dy)||1,rest=l.arm?reach*.70:reach*.78,f=(d-rest)*.055*c.g.grip;body.x+=dx/d*f;body.y+=dy/d*f;const drive=motion.speed*(l.arm?.25:.55);body.x+=motion.dx*drive;body.y+=motion.dy*drive*.35}constrain(body,l.hand,reach*.82,.45)}
function detectWall(c){const h=c.head(),fx=h.x+c.face*18;return isSolidAt(fx,h.y)||isSolidAt(fx,h.y-15)}function bodyController(c){if(!c.alive)return;const m=desiredMotion(c),h=c.head();if(c.stun>0)return;const ground=c.nodes.some(n=>n.contact>0),wall=detectWall(c);let drive=m.speed*(ground?1:.18);for(const n of c.nodes){n.x+=m.dx*drive;n.y+=m.dy*drive*.08}if(wall){for(const l of c.limbs)if(l.arm||c.spec.role==='pred')l.cool=0;if(c.limbs.some(l=>l.planted&&l.target&&Math.abs(l.target.nx)>.5))for(const n of c.nodes)n.y-=.24*c.g.grip}if(c.state==='POUNCE'&&c.biteCooldown<=0&&ground&&c.aiTarget){for(const n of c.nodes)impulse(n,c.face*(2.1+.9*c.g.speed),-1.5*c.g.stamina);c.biteCooldown=34;c.state='STALK'}if(c.state==='FLEE'&&wall&&ground)for(const n of c.nodes)impulse(n,c.face*1.0,-2.0*c.g.stamina)}
function solveCreature(c){for(const n of c.nodes)integrateNode(n,.39,.994);for(const t of c.tail)integrateNode(t,.41,.992);for(const l of c.limbs)updateLimb(c,l,1);for(let iter=0;iter<5;iter++){for(const [a,b,len] of c.constraints)constrain(c.nodes[a],c.nodes[b],len*c.g.size,.72);for(let i=0;i<c.tail.length;i++){const a=i?c.tail[i-1]:c.nodes[c.nodes.length-1],b=c.tail[i];constrain(a,b,9*c.g.size,.75)}for(const l of c.limbs)constrain(c.nodes[l.anchor],l.hand,l.reach*.82,.35);for(const n of c.nodes)pointCollide(n);for(const t of c.tail)pointCollide(t)}bodyController(c);handleInteractions(c)}
function closestNode(creature,p){let best=creature.nodes[0],bd=1e9;for(const n of creature.nodes){const d=(n.x-p.x)**2+(n.y-p.y)**2;if(d<bd){bd=d;best=n}}return best}
function handleInteractions(c){if(c.biteCooldown>0)c.biteCooldown--;if(c.stun>0)c.stun--;if(!c.alive)return;const q=c.head();if(c.spec.role==='herb'&&c.state==='FORAGE'){const p=c.aiTarget;if(p&&p.alive&&Math.hypot(q.x-p.x,q.y-p.y)<22){const eat=Math.min(.18,p.food);p.food-=eat;c.energy=Math.min(105,c.energy+eat*3.2);if(p.food<=0)p.alive=false}}if(c.spec.role==='pred'&&(c.state==='POUNCE'||c.state==='STALK'||c.grab)){let prey=c.grab||c.aiTarget;if(prey&&prey.alive){const pn=closestNode(prey,q),d=Math.hypot(pn.x-q.x,pn.y-q.y);if(!c.grab&&d<22&&c.biteCooldown<=0){c.grab=prey;c.biteCooldown=18;prey.health-=12+10*c.g.aggression;prey.stun=8;particlesBlood(pn.x,pn.y,5)}if(c.grab){const gn=closestNode(prey,q);spring(q,gn,10,.12*c.g.grip);gn.x-=c.face*.15*c.g.grip;prey.struggle+=.05;prey.health-=.11*c.g.aggression;if(prey.struggle>2&&rnd()<.015*prey.g.stamina){c.grab=null;prey.struggle=0}if(prey.health<=0){killCreature(prey,c);c.grab=prey}}}else c.grab=null}if((c.spec.role==='scav'||c.spec.role==='pred')&&c.state==='SCAVENGE'){const corpse=c.aiTarget;if(corpse&&!corpse.alive){const cn=closestNode(corpse,q),d=Math.hypot(cn.x-q.x,cn.y-q.y);if(d<28){c.grab=corpse;spring(q,cn,13,.08*c.g.grip);if(simTick%8===0&&corpse.meat>0){const e=Math.min(1.5,corpse.meat);corpse.meat-=e;c.energy=Math.min(105,c.energy+e*.8)}if(c.spec.role==='scav')cn.x-=c.face*.20*c.g.grip}}}if(c.energy>84&&c.age>900&&c.mateCooldown<=0&&creatures.length<48){const mate=nearest(c,o=>o.alive&&o.type===c.type&&o!==c&&o.energy>78&&o.mateCooldown<=0,75);if(mate&&dist(c.center(),mate.center())<50&&rnd()<.006*c.g.fertility){const p=c.center();spawnCreature(c.type,c,mate,p.x+8,p.y-8);c.energy-=18;mate.energy-=18;c.mateCooldown=900;mate.mateCooldown=900}}}
function killCreature(c,killer=null){if(!c.alive)return;c.alive=false;c.decay=0;c.meat=22*c.g.size;c.state='CORPSE';c.grab=null;for(const l of c.limbs){l.planted=false;l.target=null}if(killer)killer.energy=Math.min(105,killer.energy+5);if(rnd()<.28){const l=c.limbs[(rnd()*c.limbs.length)|0];if(l&&!l.disabled){l.disabled=true;looseParts.push({node:l.hand,type:c.type,life:2200,color:c.spec.color})}}}
function stepDead(c){c.decay++;for(const n of c.nodes)integrateNode(n,.42,.993);for(const t of c.tail)integrateNode(t,.42,.992);for(const l of c.limbs)if(!l.disabled){integrateNode(l.hand,.42,.992);constrain(c.nodes[l.anchor],l.hand,l.reach*.84,.20)}for(let i=0;i<4;i++){for(const [a,b,len] of c.constraints)constrain(c.nodes[a],c.nodes[b],len*c.g.size,.55);for(let j=0;j<c.tail.length;j++)constrain(j?c.tail[j-1]:c.nodes[c.nodes.length-1],c.tail[j],9*c.g.size,.55)}if(c.meat<=0&&c.decay>4000)c.gone=true}
function stepCreature(c){c.age++;c.mateCooldown--;c.energy-=c.alive?.0045*c.g.metabolism:0;if(c.alive){c.stateT--;if(c.stateT<=0||simTick%20===c.id%20)chooseAI(c);solveCreature(c);if(c.energy<=0||c.health<=0||c.age>24000*c.g.stamina)killCreature(c)}else stepDead(c)}
const weather={rain:.18,target:.18,lightning:0,cycle:0};const fx=[];function particlesBlood(x,y,n){for(let i=0;i<n;i++)fx.push({x,y,vx:(rnd()-.5)*2,vy:-rnd()*1.5,life:40+Math.floor(rnd()*30),c:'#8e3e43'})}
function stepWeather(){weather.cycle++;weather.rain+=(weather.target-weather.rain)*.002;if(weather.cycle%1800===0)weather.target=rnd()<.55?.15:.88;if(weather.rain>.75&&rnd()<.0018){weather.lightning=1;camera.shake=10}weather.lightning*=.86;for(let i=0;i<wet.length;i++)wet[i]=clamp(wet[i]+weather.rain*.00015-.00005,0,1);for(const p of plants)if(!p.alive&&rnd()<.0007*(1+weather.rain*3)){p.alive=true;p.food=8+rnd()*10}else if(p.alive)p.food=Math.min(34,p.food+.002*(1+weather.rain))}
function stepFx(){for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.98;p.life--}for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);for(const p of looseParts)if(p.life-->0){integrateNode(p.node,.42,.992);pointCollide(p.node)}}
const camera={x:500,y:520,zoom:1.05,follow:true,shake:0};let selected=null;function worldToScreen(x,y){const z=camera.zoom;return{x:(x-camera.x)*z+SW*.5,y:(y-camera.y)*z+SH*.52}}function screenToWorld(x,y){return{x:(x-SW*.5)/camera.zoom+camera.x,y:(y-SH*.52)/camera.zoom+camera.y}}
const ptr=new Map();let drag=false,pinch=0,pinchZoom=1;C.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});C.setPointerCapture(e.pointerId);drag=false;if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=camera.zoom}});C.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const prev=ptr.get(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);camera.zoom=clamp(pinchZoom*d/Math.max(1,pinch),.55,2.4);drag=true;return}const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>2)drag=true;if(drag){camera.follow=false;camera.x=clamp(camera.x-dx/camera.zoom,0,WORLD_W);camera.y=clamp(camera.y-dy/camera.zoom,200,WORLD_H)}});C.addEventListener('pointerup',e=>{if(!drag&&ptr.size===1){const w=screenToWorld(e.clientX,e.clientY);let best=null,bd=42*42;for(const c of creatures){if(c.gone)continue;const q=c.center(),d=(q.x-w.x)**2+(q.y-w.y)**2;if(d<bd){bd=d;best=c}}selected=best}ptr.delete(e.pointerId)});
function drawBackground(t){const grad=X.createLinearGradient(0,0,0,SH);grad.addColorStop(0,'#111b20');grad.addColorStop(.52,'#172024');grad.addColorStop(1,'#080c0d');X.fillStyle=grad;X.fillRect(0,0,SW,SH);for(let layer=0;layer<3;layer++){const par=.08+layer*.08,base=SH*(.50+layer*.09);X.fillStyle=['#0b1215','#0d1517','#101817'][layer];X.beginPath();X.moveTo(0,SH);for(let sx=-80;sx<SW+100;sx+=60){const wx=(camera.x*par+sx)*.012,hh=40+hash((wx|0)+layer*991)*120;X.lineTo(sx,base-hh);X.lineTo(sx+35,base-hh*(.65+hash((wx|0)+77)*.25))}X.lineTo(SW,SH);X.closePath();X.fill()}if(weather.rain>.25){X.fillStyle=`rgba(72,93,102,${weather.rain*.10})`;X.fillRect(0,0,SW,SH)}if(weather.lightning>.02){X.fillStyle=`rgba(220,238,244,${weather.lightning*.35})`;X.fillRect(0,0,SW,SH)}}
function tileVisibleBounds(){const z=camera.zoom,l=(camera.x-SW/(2*z))/TILE-2,r=(camera.x+SW/(2*z))/TILE+2,t=(camera.y-SH/(2*z))/TILE-2,b=(camera.y+SH/(2*z))/TILE+2;return{l:clamp(Math.floor(l),0,COLS-1),r:clamp(Math.ceil(r),0,COLS-1),t:clamp(Math.floor(t),0,ROWS-1),b:clamp(Math.ceil(b),0,ROWS-1)}}
function drawTerrain(t){const b=tileVisibleBounds(),z=camera.zoom;for(let y=b.t;y<=b.b;y++)for(let x=b.l;x<=b.r;x++){if(!isSolidCell(x,y))continue;const p=worldToScreen(x*TILE,y*TILE),top=!isSolidCell(x,y-1),left=!isSolidCell(x-1,y),right=!isSolidCell(x+1,y),w=TILE*z+1;X.fillStyle=top?'#35423b':'#242c29';X.fillRect(p.x,p.y,w,w);if(top){X.fillStyle='#52644d';X.fillRect(p.x,p.y,w,Math.max(2,z*3));if(hash(x*71+y*337)>.52){X.strokeStyle='#708262';X.lineWidth=Math.max(1,z);X.beginPath();const gx=p.x+(hash(x*13+y)*TILE)*z;X.moveTo(gx,p.y);X.lineTo(gx+Math.sin(t*.002+x)*4,p.y-8*z);X.stroke()}}if(left){X.fillStyle='#171d1b';X.fillRect(p.x,p.y,Math.max(2,z*3),w)}if(right){X.fillStyle='#3f4a45';X.fillRect(p.x+w-Math.max(2,z*2),p.y,Math.max(2,z*2),w)}if(hash(x*913+y*117)>.90){X.strokeStyle='#1a201e';X.beginPath();X.moveTo(p.x+w*.2,p.y+w*.3);X.lineTo(p.x+w*.55,p.y+w*.65);X.lineTo(p.x+w*.45,p.y+w*.9);X.stroke()}}}
function drawPlants(t){for(const p of plants){if(!p.alive)continue;const s=worldToScreen(p.x,p.y);if(s.x<-30||s.x>SW+30||s.y<-30||s.y>SH+30)continue;const sway=Math.sin(t*.002+p.phase)*3*weather.rain;X.strokeStyle='#5c7754';X.lineWidth=2*camera.zoom;X.beginPath();X.moveTo(s.x,s.y);X.quadraticCurveTo(s.x+sway,s.y-12*camera.zoom,s.x+sway*.7,s.y-20*camera.zoom);X.stroke();X.fillStyle='#8d9e68';X.beginPath();X.ellipse(s.x+sway*.7,s.y-20*camera.zoom,5*camera.zoom,3*camera.zoom,.2,0,TAU);X.fill()}}
function drawLimb(c,l,col){if(l.disabled)return;const a=c.nodes[l.anchor],h=l.hand,A=worldToScreen(a.x,a.y),H=worldToScreen(h.x,h.y),dx=H.x-A.x,dy=H.y-A.y,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,bend=(l.side*(l.arm?1:-1))*Math.min(12*camera.zoom,d*.28),mx=(A.x+H.x)*.5+nx*bend,my=(A.y+H.y)*.5+ny*bend;X.strokeStyle='#161b19';X.lineWidth=5.5*camera.zoom*c.g.size;X.lineCap='round';X.beginPath();X.moveTo(A.x,A.y);X.quadraticCurveTo(mx,my,H.x,H.y);X.stroke();X.strokeStyle=col;X.lineWidth=3.2*camera.zoom*c.g.size;X.beginPath();X.moveTo(A.x,A.y);X.quadraticCurveTo(mx,my,H.x,H.y);X.stroke();X.fillStyle=l.planted?'#c7d0bb':col;X.beginPath();X.arc(H.x,H.y,2.8*camera.zoom*c.g.size,0,TAU);X.fill()}
function drawCreature(c,t){if(c.gone)return;const q=c.center(),s=worldToScreen(q.x,q.y);if(s.x<-120||s.x>SW+120||s.y<-120||s.y>SH+120)return;const col=c.alive?c.spec.color:'#4b4b46',hi=c.alive?c.spec.hi:'#68645f';for(const l of c.limbs)drawLimb(c,l,col);if(c.tail.length){X.strokeStyle='#151918';X.lineWidth=7*camera.zoom*c.g.size;X.beginPath();let a=worldToScreen(c.nodes[c.nodes.length-1].x,c.nodes[c.nodes.length-1].y);X.moveTo(a.x,a.y);for(const n of c.tail){const p=worldToScreen(n.x,n.y);X.lineTo(p.x,p.y)}X.stroke();X.strokeStyle=col;X.lineWidth=4*camera.zoom*c.g.size;X.stroke()}for(let i=c.nodes.length-1;i>=0;i--){const n=c.nodes[i],p=worldToScreen(n.x,n.y),r=n.r*camera.zoom;X.fillStyle='#111715';X.beginPath();X.arc(p.x+2*camera.zoom,p.y+4*camera.zoom,r*1.08,0,TAU);X.fill();X.fillStyle=col;X.beginPath();X.ellipse(p.x,p.y,r*1.18,r*.88,0,0,TAU);X.fill();if(i===0){X.fillStyle=hi;X.beginPath();X.ellipse(p.x-c.face*r*.12,p.y-r*.28,r*.7,r*.28,0,0,TAU);X.fill();X.fillStyle=c.alive?'#e6ddb3':'#181818';X.beginPath();X.arc(p.x+c.face*r*.68,p.y-r*.17,Math.max(1.2,1.6*camera.zoom),0,TAU);X.fill();if(c.spec.role==='pred'){X.strokeStyle='#e5d7bd';X.lineWidth=1.2*camera.zoom;X.beginPath();X.moveTo(p.x+c.face*r*.8,p.y+r*.12);X.lineTo(p.x+c.face*r*1.2,p.y+r*.25);X.stroke()}}}if(debugBody){X.strokeStyle='#8fe0be66';X.lineWidth=1;for(const n of c.nodes){const p=worldToScreen(n.x,n.y);X.beginPath();X.arc(p.x,p.y,n.r*camera.zoom,0,TAU);X.stroke()}for(const l of c.limbs)if(l.target){const p=worldToScreen(l.target.x,l.target.y);X.fillStyle='#f3df78';X.fillRect(p.x-2,p.y-2,4,4)}}if(selected===c){X.strokeStyle='#f1d878';X.lineWidth=1.5;X.strokeRect(s.x-34*camera.zoom,s.y-30*camera.zoom,68*camera.zoom,58*camera.zoom)}}
function drawWeather(t){if(weather.rain>.08){X.strokeStyle=`rgba(150,184,197,${.22+.42*weather.rain})`;X.lineWidth=1;const n=Math.floor(40+weather.rain*120);for(let i=0;i<n;i++){const x=(hash(i*313+(simTick>>1))*SW)|0,y=(hash(i*991+(simTick>>1)+7)*SH)|0;X.beginPath();X.moveTo(x,y);X.lineTo(x-4-weather.rain*4,y+14+weather.rain*12);X.stroke()}}if(weather.rain>.55){const grad=X.createLinearGradient(0,SH*.4,0,SH);grad.addColorStop(0,'rgba(70,85,86,0)');grad.addColorStop(1,`rgba(65,78,76,${weather.rain*.18})`);X.fillStyle=grad;X.fillRect(0,0,SW,SH)}for(const p of fx){const s=worldToScreen(p.x,p.y);X.fillStyle=p.c;X.fillRect(s.x,s.y,2.5,2.5)}for(const p of looseParts)if(p.life>0){const s=worldToScreen(p.node.x,p.node.y);X.fillStyle=p.color;X.beginPath();X.ellipse(s.x,s.y,5*camera.zoom,2.5*camera.zoom,0,0,TAU);X.fill()}}
function render(t){let shakeX=0,shakeY=0;if(camera.shake>0){shakeX=(rnd()-.5)*camera.shake;shakeY=(rnd()-.5)*camera.shake;camera.shake*=.88;X.save();X.translate(shakeX,shakeY)}drawBackground(t);drawTerrain(t);drawPlants(t);for(const c of creatures.filter(c=>!c.gone).sort((a,b)=>a.center().y-b.center().y))drawCreature(c,t);drawWeather(t);if(shakeX||shakeY)X.restore();updateUI()}
let paused=false,speed=1,debugBody=false,simTick=0;
function updateUI(){const alive=creatures.filter(c=>c.alive),herb=alive.filter(c=>c.spec.role==='herb').length,pred=alive.filter(c=>c.spec.role==='pred').length,scav=alive.filter(c=>c.spec.role==='scav').length,corpses=creatures.filter(c=>!c.alive&&!c.gone).length;stats.innerHTML=`${alive.length} living · ${corpses} corpses<br>${herb} grazer · ${pred} hunter · ${scav} scavenger<br>gen ${maxGen} · rain ${Math.round(weather.rain*100)}% · ${debugBody?'contact solver':'body render'}`;if(!selected||selected.gone){inspect.style.display='none';return}inspect.style.display='block';inspect.innerHTML=`<b class="gold">${selected.spec.name} #${selected.id}</b><div class="row"><span>state</span><b>${selected.alive?selected.state:'CORPSE'}</b></div><div class="row"><span>generation</span><b>${selected.gen}</b></div><div class="row"><span>energy</span><b>${selected.energy.toFixed(0)}</b></div><div class="row"><span>health</span><b>${selected.health.toFixed(0)}</b></div><div class="row"><span>grip</span><b>${selected.g.grip.toFixed(2)}</b></div><div class="row"><span>limb length</span><b>${selected.g.limb.toFixed(2)}</b></div><div class="row"><span>speed</span><b>${selected.g.speed.toFixed(2)}</b></div><div class="row"><span>aggression</span><b>${selected.g.aggression.toFixed(2)}</b></div><div class="dim" style="margin-top:6px">Body chunks collide with the tile world. Limbs independently search exposed surfaces and pin to them. Dead bodies keep the same physics and can be dragged/eaten.</div>`}
function reset(){seed=(Math.random()*0xffffffff)>>>0;genWorld();seedLife();selected=creatures[0];camera.x=selected.center().x;camera.y=selected.center().y;camera.follow=true;weather.rain=.15;weather.target=.15;simTick=0}
function step(){simTick++;stepWeather();for(const c of creatures)if(!c.gone)stepCreature(c);stepFx();if(simTick%300===0){for(let i=creatures.length-1;i>=0;i--)if(creatures[i].gone)creatures.splice(i,1)}if(camera.follow&&selected&&!selected.gone){const q=selected.center();camera.x=lerp(camera.x,q.x,0.06);camera.y=lerp(camera.y,q.y,0.05)}}
let last=performance.now(),acc=0;const FIX=1000/60;function loop(t){const dt=Math.min(60,t-last);last=t;acc+=dt;if(!paused){while(acc>=FIX){for(let i=0;i<speed;i++)step();acc-=FIX}}render(t);requestAnimationFrame(loop)}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};document.querySelector('#speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;document.querySelector('#speed').textContent='×'+speed};document.querySelector('#follow').onclick=()=>{camera.follow=!!selected&&!camera.follow;document.querySelector('#follow').textContent=camera.follow?'●':'◎'};document.querySelector('#storm').onclick=()=>{weather.target=weather.target>.6?.12:.95};document.querySelector('#debug').onclick=()=>{debugBody=!debugBody;document.querySelector('#debug').textContent=debugBody?'HIDE':'BODY'};document.querySelector('#reset').onclick=reset;
reset();requestAnimationFrame(loop);
</script>
