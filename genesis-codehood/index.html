<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030506;color:#eef5f0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.glass{position:absolute;background:#06100dd4;border:1px solid #d9ffe51b;backdrop-filter:blur(8px);box-shadow:0 10px 32px #000a}#hud{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));padding:8px 10px;border-radius:10px;font-size:9px;line-height:1.45;pointer-events:none}#brand{font-weight:900;letter-spacing:.11em;color:#c0f5d0}#dock{left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:12px}button{border:1px solid #425b4c;background:#121d17;color:#eef7f0;border-radius:8px;padding:8px 10px;font:inherit;font-size:10px;min-width:44px}#inspect{left:8px;right:8px;bottom:66px;padding:9px;border-radius:10px;font-size:10px;display:none;max-height:30vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #ffffff0c}.gold{color:#efd678}.bad{color:#f09a8f}.dim{color:#8da096}@media(min-width:760px){#inspect{left:auto;right:8px;top:8px;bottom:auto;width:320px;max-height:70vh}}</style>

<body>
<canvas id="game"></canvas>
<div id="hud" class="glass"><div id="brand">GENESIS // SIDEWORLD</div><div id="stats"></div></div>

<div id="dock" class="glass"><button id="pause">Ⅱ</button><button id="speed">×1</button><button id="follow">◎</button><button id="storm">☂</button><button id="reset">↻</button></div>
<script>
'use strict';
const C=document.querySelector('#game'),X=C.getContext('2d',{alpha:false}),stats=document.querySelector('#stats'),inspect=document.querySelector('#inspect');
let DPR=1,W=innerWidth,H=innerHeight;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0);X.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
let seed=(Math.random()*0xffffffff)>>>0;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function hash(n){n|=0;n=(n+0x7ed55d16)+(n<<12);n=(n^0xc761c23c)^(n>>>19);n=(n+0x165667b1)+(n<<5);n=(n+0xd3a2646c)^(n<<9);n=(n+0xfd7046c5)+(n<<3);n=(n^0xb55a4f09)^(n>>>16);return(n>>>0)/4294967296}
function noise1(x,s=0){const a=Math.floor(x),t=x-a,u=t*t*(3-2*t);return lerp(hash(a*928371+s*97),hash((a+1)*928371+s*97),u)}function fbm1(x,s=0){let a=.56,f=.004,v=0,n=0;for(let i=0;i<5;i++){v+=noise1(x*f,s+i*19)*a;n+=a;a*=.5;f*=2.05}return v/n}
const WORLD_W=9200,WORLD_H=900,GROUND_BASE=660;
let heights=new Float32Array(WORLD_W+1),wet=new Float32Array(WORLD_W+1),caves=[],platforms=[],plants=[],foods=[],corpses=[],parts=[],creatures=[];
function terrainY(x){x=clamp(x|0,0,WORLD_W);return heights[x]||GROUND_BASE}
function genWorld(){heights=new Float32Array(WORLD_W+1);wet=new Float32Array(WORLD_W+1);caves=[];platforms=[];plants=[];foods=[];corpses=[];parts=[];creatures=[];for(let x=0;x<=WORLD_W;x++){const n=fbm1(x,1),r=Math.abs(fbm1(x+340,9)-.5)*2;let y=GROUND_BASE+(n-.5)*170-r*r*110+Math.sin(x*.0018)*35;heights[x]=clamp(y,380,790);wet[x]=clamp(fbm1(x+700,12)*.9+.1,0,1)}for(let i=0;i<26;i++){const x=250+rnd()*(WORLD_W-500),w=120+rnd()*280,y=terrainY(x)-70-rnd()*120;caves.push({x,w,y,h:50+rnd()*75});if(rnd()<.8)platforms.push({x:x+20,w:w-40,y:y+20+rnd()*30})}for(let i=0;i<48;i++){const x=120+rnd()*(WORLD_W-240);platforms.push({x,w:50+rnd()*120,y:terrainY(x)-80-rnd()*180})}for(let x=30;x<WORLD_W;x+=18+rnd()*22){if(rnd()<.72){const y=terrainY(x);plants.push({x,y,type:rnd()<.12?'fungus':'reed',mass:.5+rnd()*.8});if(rnd()<.28)foods.push({x:x+(rnd()-.5)*8,y:y-10,value:10+rnd()*10})}}for(let i=0;i<18;i++)spawnCreature('grazer',350+i*120+rnd()*80);for(let i=0;i<7;i++)spawnCreature('stalker',900+i*530+rnd()*180);for(let i=0;i<6;i++)spawnCreature('scavenger',600+i*720+rnd()*260);camera.x=900;camera.y=500;selected=creatures[0]||null}
function supportAt(x,y,vy){let best=terrainY(x);for(const p of platforms)if(x>=p.x&&x<=p.x+p.w&&y<=p.y+16&&y>=p.y-120&&vy>=-2)best=Math.min(best,p.y);return best}function caveCover(x,y){for(const c of caves)if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h+100)return 1;return 0}
const TYPES={grazer:{name:'Mire Grazer',body:'#8b9b73',light:'#c5c99d',pred:false,scav:false},stalker:{name:'Needle Stalker',body:'#8c4a46',light:'#d67b70',pred:true,scav:false},scavenger:{name:'Ash Scavenger',body:'#6f6975',light:'#aaa0b3',pred:false,scav:true}};let nextId=1,maxGen=0;
function genome(a=null,b=null){const keys=['speed','vision','fear','aggr','met','fert','size','limb','grip','curiosity','stormFear'],g={};for(const k of keys){if(a){const base=rnd()<.5?a[k]:b[k];g[k]=clamp(base+gauss()*.045,.45,1.65)}else g[k]=.72+rnd()*.58}return g}
function spawnCreature(type,x,pa=null,pb=null){const t=TYPES[type],g=genome(pa?.g,pb?.g),y=terrainY(x)-18,c={id:nextId++,type,name:t.name,pred:t.pred,scav:t.scav,body:t.body,light:t.light,g,x,y,vx:0,vy:0,face:rnd()<.5?-1:1,energy:65+rnd()*30,health:100,age:0,generation:pa?Math.max(pa.generation,pb.generation)+1:0,state:'ROAM',target:null,dead:false,onGround:false,step:rnd()*6,attackCool:0,mateCool:300+rnd()*700};maxGen=Math.max(maxGen,c.generation);creatures.push(c);return c}
function nearestCreature(c,test,r=220){let best=null,bd=r*r;for(const o of creatures){if(o===c||o.dead||!test(o))continue;const dx=o.x-c.x,dy=o.y-c.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o}}return best}function nearestFood(c,r=220){let best=null,bd=r*r;for(const f of foods){const dx=f.x-c.x,dy=f.y-c.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=f}}return best}function nearestCorpse(c,r=280){let best=null,bd=r*r;for(const o of corpses){if(o.mass<=0)continue;const dx=o.x-c.x,dy=o.y-c.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o}}return best}function steer(c,tx,str=1){const dir=Math.sign(tx-c.x)||c.face;c.face=dir;c.vx+=dir*.075*c.g.speed*str}
function jumpIfBlocked(c,dir){const gy=terrainY(c.x+dir*18),here=terrainY(c.x);if(c.onGround&&gy<here-18&&rnd()<.08){c.vy=-3.4*c.g.limb;c.vx+=dir*.5;c.state='JUMP'}}function randInt(n){return(rnd()*n)|0}
function killCreature(c,violent=false){if(c.dead)return;c.dead=true;corpses.push({id:c.id,type:c.type,x:c.x,y:c.y,vx:c.vx*.3,vy:-.5,mass:20*c.g.size,rot:0,draggedBy:null});if(violent){for(let i=0,n=2+randInt(3);i<n;i++)parts.push({x:c.x+(rnd()-.5)*10,y:c.y-4-rnd()*8,vx:(rnd()-.5)*2.4,vy:-1-rnd()*2.5,life:500+randInt(400),size:2+rnd()*3,color:i?'#6c2f32':'#aa514d'})}}
function updateCreature(c,dt){if(c.dead)return;c.age+=dt;c.energy-=.0055*c.g.met*c.g.size*dt;c.attackCool=Math.max(0,c.attackCool-dt);c.mateCool-=dt;const stormStress=rain>.65&&!caveCover(c.x,c.y)?c.g.stormFear:0;let prey=null,threat=null,food=null,corpse=null;if(c.pred)prey=nearestCreature(c,o=>o.type==='grazer'||o.type==='scavenger',280*c.g.vision);else threat=nearestCreature(c,o=>o.pred,240*c.g.vision);if(c.type==='grazer')food=nearestFood(c,220*c.g.vision);if(c.scav)corpse=nearestCorpse(c,320*c.g.vision);
if(stormStress>.8){let best=null,bd=1e9;for(const cave of caves){const cx=cave.x+cave.w*.5,d=Math.abs(cx-c.x);if(d<bd){bd=d;best=cx}}if(best!=null){c.target=best;c.state='SEEK COVER';steer(c,best,1.2)}}else if(threat&&c.g.fear>.55){c.state='FLEE';c.target=c.x-(threat.x-c.x);steer(c,c.target,1.5)}else if(c.pred&&prey){c.state='HUNT';c.target=prey.x;steer(c,prey.x,1.35);if(Math.abs(prey.x-c.x)<18&&Math.abs(prey.y-c.y)<25&&c.attackCool<=0){c.attackCool=45;prey.health-=24*c.g.aggr;prey.vx+=c.face*1.4;prey.vy=-1.2;parts.push({x:prey.x,y:prey.y-8,vx:c.face*.8,vy:-.8,life:80,size:2,color:'#84393b'});if(prey.health<=0){killCreature(prey,true);c.energy=Math.min(110,c.energy+18)}}}else if(c.scav&&corpse){c.state='SCAVENGE';c.target=corpse.x;steer(c,corpse.x,1);if(Math.abs(corpse.x-c.x)<18&&Math.abs(corpse.y-c.y)<24){corpse.mass-=.12*dt;c.energy=Math.min(105,c.energy+.08*dt);if(rnd()<.03)corpse.draggedBy=c}}else if(c.type==='grazer'&&food){c.state='FORAGE';c.target=food.x;steer(c,food.x,.8);if(Math.abs(food.x-c.x)<15&&Math.abs(food.y-c.y)<28){c.energy=Math.min(105,c.energy+food.value);foods.splice(foods.indexOf(food),1)}}else{c.state='ROAM';if(!c.target||Math.abs(c.target-c.x)<30||rnd()<.003)c.target=clamp(c.x+(rnd()-.5)*500,20,WORLD_W-20);steer(c,c.target,.55+.45*c.g.curiosity)}
const dir=Math.sign(c.vx)||c.face;jumpIfBlocked(c,dir);c.vy+=.17*dt;c.vx*=Math.pow(.89,dt);c.vy*=Math.pow(.995,dt);c.x=clamp(c.x+c.vx*dt,4,WORLD_W-4);c.y+=c.vy*dt;const ground=supportAt(c.x,c.y,c.vy),bodyH=14*c.g.size;if(c.y+bodyH>=ground){c.y=ground-bodyH;c.vy=0;c.onGround=true}else c.onGround=false;c.step+=Math.abs(c.vx)*.24*dt;if(c.energy<=0||c.health<=0||c.age>28000)c.health<=0?killCreature(c,true):killCreature(c,false);if(c.energy>88&&c.age>900*c.g.size&&c.mateCool<=0&&creatures.filter(o=>!o.dead).length<65){const mate=nearestCreature(c,o=>o.type===c.type&&o.energy>80&&o.mateCool<=0,70);if(mate&&rnd()<.015*c.g.fert){c.energy-=15;mate.energy-=12;c.mateCool=700;mate.mateCool=700;spawnCreature(c.type,(c.x+mate.x)*.5,c,mate)}}}
function updateCorpse(o,dt){o.vy+=.17*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=Math.pow(.93,dt);const gy=supportAt(o.x,o.y,o.vy);if(o.y+8>=gy){o.y=gy-8;o.vy=0}if(o.draggedBy&&!o.draggedBy.dead){o.x=lerp(o.x,o.draggedBy.x-o.draggedBy.face*13,.18);o.y=lerp(o.y,o.draggedBy.y+5,.18)}o.rot+=o.vx*.02}
function regrow(dt){if(tick%10)return;for(const p of plants)if(rnd()<.0015*(1+.5*rain)*dt&&foods.length<220)foods.push({x:p.x+(rnd()-.5)*10,y:p.y-8,value:8+rnd()*8})}
let rain=.28,stormPulse=0,lightning=0,tick=0,season=0;const seasons=['SPRING','SUMMER','AUTUMN','WINTER'];function simStep(dt=1){tick++;stormPulse+=.001;rain=clamp(rain+(Math.sin(stormPulse*.7)-.1)*.0007,0,1);if(rain>.72&&rnd()<.0008)lightning=10;if(lightning>0)lightning-=dt;for(const c of creatures)updateCreature(c,dt);for(const o of corpses)updateCorpse(o,dt);for(const p of parts){p.vy+=.12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;const gy=terrainY(p.x);if(p.y>=gy){p.y=gy;p.vy*=-.15;p.vx*=.5}}for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);for(let i=corpses.length-1;i>=0;i--)if(corpses[i].mass<=0)corpses.splice(i,1);regrow(dt);if(tick%4500===0)season=(season+1)%4}
const camera={x:900,y:500,zoom:1.15,follow:true};let selected=null;function sx(x){return(x-camera.x)*camera.zoom+W*.5}function sy(y){return(y-camera.y)*camera.zoom+H*.5}
function drawBackground(time){const dusk=.5+.5*Math.sin(time*.00003),sky=rain>.65?'#10161a':dusk>.45?'#243544':'#0d1720';X.fillStyle=sky;X.fillRect(0,0,W,H);const layers=[{amp:34,base:H*.56,col:'#172620',par:.12},{amp:52,base:H*.62,col:'#112019',par:.22},{amp:76,base:H*.70,col:'#0b1712',par:.36}];for(const L of layers){X.fillStyle=L.col;X.beginPath();X.moveTo(0,H);for(let px=0;px<=W;px+=12){const wx=camera.x+(px-W*.5)/camera.zoom*L.par,yy=L.base+Math.sin(wx*.0013)*L.amp*.45+Math.sin(wx*.0031+2)*L.amp*.2;X.lineTo(px,yy)}X.lineTo(W,H);X.closePath();X.fill()}if(lightning>0){X.fillStyle=`rgba(220,235,255,${lightning/18})`;X.fillRect(0,0,W,H)}}
function drawWorld(time){drawBackground(time);const left=clamp(Math.floor(camera.x-W/(2*camera.zoom))-100,0,WORLD_W),right=clamp(Math.ceil(camera.x+W/(2*camera.zoom))+100,0,WORLD_W);X.fillStyle='#0a100d';X.beginPath();X.moveTo(sx(left),H);for(let x=left;x<=right;x+=8)X.lineTo(sx(x),sy(terrainY(x)));X.lineTo(sx(right),H);X.closePath();X.fill();X.strokeStyle='#263a2d';X.lineWidth=2;X.beginPath();for(let x=left;x<=right;x+=10){const px=sx(x),py=sy(terrainY(x));if(x===left)X.moveTo(px,py);else X.lineTo(px,py)}X.stroke();for(const cave of caves){if(cave.x+cave.w<left||cave.x>right)continue;X.fillStyle='#030405';X.fillRect(sx(cave.x),sy(cave.y),cave.w*camera.zoom,cave.h*camera.zoom)}for(const p of platforms){if(p.x+p.w<left||p.x>right)continue;X.fillStyle='#263027';X.fillRect(sx(p.x),sy(p.y),p.w*camera.zoom,6*camera.zoom)}for(const p of plants){if(p.x<left||p.x>right)continue;const wind=Math.sin(time*.003+p.x*.01)*(2+rain*3),x=sx(p.x),y=sy(p.y);X.strokeStyle=p.type==='fungus'?'#8bc0a5':'#617e58';X.lineWidth=1.5;X.beginPath();X.moveTo(x,y);X.lineTo(x+wind,y-12-p.mass*5);X.stroke()}for(const f of foods){if(f.x<left||f.x>right)continue;X.fillStyle='#d0a157';X.beginPath();X.arc(sx(f.x),sy(f.y),2.2,0,TAU);X.fill()}}
function limbIK(x0,y0,tx,ty,l1,l2,flip,col,w){let dx=tx-x0,dy=ty-y0,d=Math.hypot(dx,dy);d=clamp(d,1,Math.max(1,l1+l2-.1));const a=Math.atan2(dy,dx),k=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1))*flip,ex=x0+Math.cos(a+k)*l1,ey=y0+Math.sin(a+k)*l1;X.strokeStyle=col;X.lineWidth=w;X.lineCap='round';X.beginPath();X.moveTo(x0,y0);X.lineTo(ex,ey);X.lineTo(tx,ty);X.stroke()}
function drawCreature(c,time){if(c.dead)return;const x=sx(c.x),y=sy(c.y),z=c.g.size*camera.zoom,t=TYPES[c.type],moving=Math.abs(c.vx)>.08,phase=c.step,dir=c.face,bodyW=(c.pred?22:25)*z,bodyH=(c.pred?9:11)*z,bob=moving?Math.sin(phase*2)*1.2*z:Math.sin(time*.004+c.id)*.6*z,ground=sy(supportAt(c.x,c.y,c.vy)),hipX=x-dir*bodyW*.2,shoulderX=x+dir*bodyW*.23,bodyY=y+bob;X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(x,ground+2,bodyW*.55,3*z,0,0,TAU);X.fill();const stride=moving?Math.sin(phase)*9*z:0,back=moving?Math.sin(phase+Math.PI)*9*z:0;limbIK(hipX,bodyY+2*z,hipX+stride,ground,8*z,9*z,dir>0?1:-1,'#352f2b',2.2*z);limbIK(shoulderX,bodyY+2*z,shoulderX+back,ground,8*z,9*z,dir>0?-1:1,'#352f2b',2.2*z);let hx=shoulderX+dir*7*z,hy=bodyY+8*z;if(c.state==='SCAVENGE'&&c.target!=null){hx=sx(c.target);hy=ground-3*z}else if(c.state==='HUNT'){hx=shoulderX+dir*13*z;hy=bodyY+3*z}limbIK(shoulderX,bodyY,hx,hy,6*z,6*z,dir>0?1:-1,t.body,2.8*z);X.fillStyle=t.body;X.beginPath();X.ellipse(x,bodyY,bodyW*.5,bodyH*.5,0,0,TAU);X.fill();X.fillStyle=t.light;X.beginPath();X.ellipse(x+dir*bodyW*.08,bodyY-bodyH*.18,bodyW*.34,bodyH*.16,0,0,TAU);X.fill();const headX=x+dir*bodyW*.55,headY=bodyY-bodyH*.12;X.fillStyle=t.body;X.beginPath();X.ellipse(headX,headY,6*z,5*z,0,0,TAU);X.fill();X.fillStyle='#e7e0b0';X.fillRect(headX+dir*3*z,headY-2*z,1.5*z,1.5*z);X.strokeStyle=t.body;X.lineWidth=3*z;X.beginPath();X.moveTo(x-dir*bodyW*.48,bodyY);X.quadraticCurveTo(x-dir*bodyW*.8,bodyY-4*z+Math.sin(time*.005+c.id)*3*z,x-dir*bodyW,bodyY+1*z);X.stroke();if(selected===c){X.strokeStyle='#efd56d';X.strokeRect(x-bodyW*.7,y-bodyH*1.8,bodyW*1.4,bodyH*2.4)}}
function drawCorpse(o){const x=sx(o.x),y=sy(o.y),z=camera.zoom;X.save();X.translate(x,y);X.rotate(o.rot);X.fillStyle=o.type==='stalker'?'#5f3131':o.type==='scavenger'?'#4f4b53':'#626b50';X.beginPath();X.ellipse(0,0,12*z,5*z,0,0,TAU);X.fill();X.strokeStyle='#2e2927';X.lineWidth=2*z;X.beginPath();X.moveTo(-5*z,2*z);X.lineTo(-10*z,8*z);X.moveTo(4*z,2*z);X.lineTo(10*z,8*z);X.stroke();X.restore()}
function updateUI(){const living=creatures.filter(c=>!c.dead),h=living.filter(c=>c.type==='grazer').length,p=living.filter(c=>c.type==='stalker').length,s=living.filter(c=>c.type==='scavenger').length;stats.innerHTML=`${seasons[season]} · rain ${(rain*100)|0}%<br>grazer ${h} · stalker ${p} · scav ${s}<br>corpses ${corpses.length} · gen ${maxGen}`;if(!selected||selected.dead){inspect.style.display='none';return}inspect.style.display='block';inspect.innerHTML=`<div class="gold">${selected.name} #${selected.id}</div><div class="row"><span>state</span><b>${selected.state}</b></div><div class="row"><span>generation</span><b>${selected.generation}</b></div><div class="row"><span>energy</span><b>${selected.energy.toFixed(0)}</b></div><div class="row"><span>health</span><b>${selected.health.toFixed(0)}</b></div><div class="row"><span>speed</span><b>${selected.g.speed.toFixed(2)}</b></div><div class="row"><span>vision</span><b>${selected.g.vision.toFixed(2)}</b></div><div class="row"><span>grip</span><b>${selected.g.grip.toFixed(2)}</b></div>`}
function render(time){if(camera.follow&&selected&&!selected.dead){camera.x=lerp(camera.x,selected.x,.08);camera.y=lerp(camera.y,selected.y-80,.06)}camera.x=clamp(camera.x,W/(2*camera.zoom),WORLD_W-W/(2*camera.zoom));camera.y=clamp(camera.y,220,WORLD_H-120);drawWorld(time);const drawables=[];for(const o of corpses)drawables.push({y:o.y,k:0,o});for(const c of creatures)if(!c.dead)drawables.push({y:c.y,k:1,o:c});drawables.sort((a,b)=>a.y-b.y);for(const d of drawables)d.k?drawCreature(d.o,time):drawCorpse(d.o);for(const p of parts){X.fillStyle=p.color;X.fillRect(sx(p.x),sy(p.y),p.size*camera.zoom,p.size*camera.zoom)}X.strokeStyle=`rgba(160,190,205,${.18+rain*.38})`;for(let i=0,n=Math.floor(80+rain*180);i<n;i++){const rx=(hash(i*91+tick*3)*W)|0,ry=(hash(i*37+tick*5)*H)|0;X.beginPath();X.moveTo(rx,ry);X.lineTo(rx-5,ry+14+rain*10);X.stroke()}if(rain>.55){const fog=X.createLinearGradient(0,H*.45,0,H);fog.addColorStop(0,'rgba(160,178,170,0)');fog.addColorStop(1,`rgba(120,140,132,${(rain-.5)*.18})`);X.fillStyle=fog;X.fillRect(0,H*.4,W,H*.6)}updateUI()}
let paused=false,speed=1,last=performance.now(),acc=0;function loop(now){const dt=Math.min(50,now-last);last=now;acc+=dt;if(!paused){while(acc>=16.666){for(let i=0;i<speed;i++)simStep(1);acc-=16.666}}render(now);requestAnimationFrame(loop)}
const ptrs=new Map();let drag=false,lastP=null,pinch=0,pinchZoom=1;C.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});C.setPointerCapture(e.pointerId);lastP={x:e.clientX,y:e.clientY};drag=false;if(ptrs.size===2){const a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=camera.zoom}});C.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const old=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);camera.zoom=clamp(pinchZoom*d/Math.max(1,pinch),.65,2.2);drag=true;return}const dx=e.clientX-old.x,dy=e.clientY-old.y;if(Math.abs(dx)+Math.abs(dy)>2)drag=true;camera.follow=false;camera.x-=dx/camera.zoom;camera.y-=dy/camera.zoom});C.addEventListener('pointerup',e=>{if(!drag&&ptrs.size===1){const wx=camera.x+(e.clientX-W*.5)/camera.zoom,wy=camera.y+(e.clientY-H*.5)/camera.zoom;let best=null,bd=35*35;for(const c of creatures){if(c.dead)continue;const d=(c.x-wx)**2+(c.y-wy)**2;if(d<bd){bd=d;best=c}}selected=best}ptrs.delete(e.pointerId);lastP=null});
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};document.querySelector('#speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;document.querySelector('#speed').textContent='×'+speed};document.querySelector('#follow').onclick=()=>{camera.follow=!!selected&&!camera.follow;document.querySelector('#follow').textContent=camera.follow?'●':'◎'};document.querySelector('#storm').onclick=()=>{rain=rain>.75?.2:1};document.querySelector('#reset').onclick=()=>{seed=(Math.random()*0xffffffff)>>>0;nextId=1;maxGen=0;genWorld()};
genWorld();requestAnimationFrame(loop);
</script>
