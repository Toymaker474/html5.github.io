+ry+4*camera.zoom,5*camera.zoom,2.6*camera.zoom,0,0,TAU);ctx.fill();ctx.fillStyle='#777b79';ctx.beginPath();ctx.moveTo(q.x+rx-4*camera.zoom,q.y+ry+2*camera.zoom);ctx.lineTo(q.x+rx-1*camera.zoom,q.y+ry-4*camera.zoom);ctx.lineTo(q.x+rx+5*camera.zoom,q.y+ry-2*camera.zoom);ctx.lineTo(q.x+rx+4*camera.zoom,q.y+ry+3*camera.zoom);ctx.closePath();ctx.fill()}if(quality===2&&flowerMask[i])for(let k=0;k<5;k++){const fx=q.x+hash(x*11+k,y,80)*s,fy=q.y+hash(x,y*11+k,81)*s;ctx.fillStyle=k%2?'#f3d36c':'#d48bb6';ctx.fillRect(fx,fy,1.5*camera.zoom,1.5*camera.zoom)}}}
function drawAnimal(a,time){const p=worldToScreen(a.x,a.y);if(p.x<-40||p.y<-40||p.x>innerWidth+40||p.y>innerHeight+40)return;const adult=clamp(a.age/(650*a.g.maturity),.35,1),scale=(5.5+5.5*a.g.size*adult)*camera.zoom,dir=a.heading,cs=Math.cos(dir),sn=Math.sin(dir),bodyColor=a.kind===PRED?'#b35f45':a.kind===BOAR?'#6f5b49':'#b0a06d',light=a.kind===PRED?'#df8565':a.kind===BOAR?'#9b8067':'#d8ca93',speed=Math.hypot(a.vx,a.vy),step=Math.sin(a.gait*2.1),headX=p.x+cs*scale*.82,headY=p.y+sn*scale*.82-scale*.10;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(dir);ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(2*camera.zoom,4*camera.zoom,scale*.85,scale*.30,0,0,TAU);ctx.fill();ctx.fillStyle=bodyColor;ctx.beginPath();ctx.ellipse(0,-scale*.22,scale*.72,scale*.38,0,0,TAU);ctx.fill();ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(scale*.18,-scale*.30,scale*.34,scale*.14,0,0,TAU);ctx.fill();const legY=scale*.06,legLen=scale*.65,front=step*scale*.18*(speed>.03?1:0),back=-front;ctx.strokeStyle='#3b302a';ctx.lineWidth=Math.max(1.4,camera.zoom*1.8);ctx.lineCap='round';for(const [lx,off] of [[scale*.32,front],[-scale*.28,back]]){ctx.beginPath();ctx.moveTo(lx,-legY);ctx.lineTo(lx+off,legLen*.25);ctx.lineTo(lx-off*.35,legLen*.62);ctx.stroke()}ctx.strokeStyle=bodyColor;ctx.lineWidth=Math.max(2,camera.zoom*2.2);ctx.beginPath();ctx.moveTo(-scale*.64,-scale*.28);ctx.quadraticCurveTo(-scale*.98,-scale*.42+Math.sin(time*.004+a.id)*scale*.12,-scale*1.18,-scale*.15);ctx.stroke();ctx.restore();ctx.fillStyle=bodyColor;ctx.beginPath();ctx.arc(headX,headY,scale*.26,0,TAU);ctx.fill();ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(headX+cs*scale*.22,headY+sn*scale*.22,scale*.20,scale*.12,dir,0,TAU);ctx.fill();ctx.fillStyle='#1f1b19';ctx.beginPath();ctx.arc(headX+cs*scale*.10-sn*scale*.08,headY+sn*scale*.10+cs*scale*.08,Math.max(1,camera.zoom*1.2),0,TAU);ctx.fill();if(a.kind!==PRED){ctx.strokeStyle=bodyColor;ctx.lineWidth=Math.max(1,camera.zoom*1.5);ctx.beginPath();ctx.moveTo(headX-sn*scale*.13,headY+cs*scale*.13);ctx.lineTo(headX-sn*scale*.26-cs*scale*.10,headY+cs*scale*.26-sn*scale*.10);ctx.moveTo(headX+sn*scale*.13,headY-cs*scale*.13);ctx.lineTo(headX+sn*scale*.26-cs*scale*.10,headY-cs*scale*.26-sn*scale*.10);ctx.stroke()}if(selected===a){ctx.strokeStyle='#ffe67b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,scale*1.25,0,TAU);ctx.stroke()}}
let selected=null;function drawAtmosphere(){const daylight=.5+.5*Math.sin(TAU*(dayClock-.25)),night=clamp(1-daylight,0,1);if(night>.03){ctx.fillStyle=`rgba(18,31,54,${night*.48})`;ctx.fillRect(0,0,innerWidth,innerHeight)}const warm=Math.max(0,1-Math.abs(dayClock-.25)/.16)+Math.max(0,1-Math.abs(dayClock-.75)/.16);if(warm>.02){ctx.fillStyle=`rgba(255,137,71,${warm*.08})`;ctx.fillRect(0,0,innerWidth,innerHeight)}if(weather>.05){ctx.fillStyle=`rgba(61,79,92,${Math.min(.18,weather*.18)})`;ctx.fillRect(0,0,innerWidth,innerHeight);const n=quality===2?90:55;ctx.strokeStyle='rgba(181,214,226,.58)';ctx.lineWidth=1;for(let i=0;i<n;i++){const x=(hash(i,(tick/2)|0,130)*innerWidth)|0,y=(hash(i,(tick/2)|0,131)*innerHeight)|0;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+10);ctx.stroke()}}if(quality===2){const fog=.03+.05*(1-daylight);ctx.fillStyle=`rgba(210,229,221,${fog})`;ctx.fillRect(0,0,innerWidth,innerHeight)}}
function render(time){ctx.fillStyle='#07100d';ctx.fillRect(0,0,innerWidth,innerHeight);drawTerrain(time);const sorted=animals.filter(a=>a.alive).sort((a,b)=>a.y-b.y);for(const a of sorted)drawAnimal(a,time);for(const p of particles){const s=worldToScreen(p.x,p.y);ctx.globalAlpha=clamp(p.life/30,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(s.x,s.y,p.size*camera.zoom,0,TAU);ctx.fill()}ctx.globalAlpha=1;drawAtmosphere();updateUI()}
function updateUI(){const herb=animals.filter(a=>a.kind===HERB).length,boar=animals.filter(a=>a.kind===BOAR).length,pred=animals.filter(a=>a.kind===PRED).length,plantAvg=plants.reduce((a,b)=>a+b,0)/plants.length;stats.innerHTML=`${seasons[seasonIndex]} · day ${Math.floor(dayClock*24).toString().padStart(2,'0')}:00<br>herb ${herb} · boar ${boar} · predators ${pred}<br>generation ${maxGeneration} · biomass ${(plantAvg*100).toFixed(0)}%`;if(!selected||!selected.alive){inspect.style.display='none';return}inspect.style.display='block';inspect.innerHTML=`<div class="gold"><b>${selected.kind===PRED?'Rust Fox':selected.kind===BOAR?'Marsh Boar':'Reed Deer'} #${selected.id}</b></div><div class="row"><span>state</span><b>${selected.state}</b></div><div class="row"><span>generation</span><b>${selected.generation}</b></div><div class="row"><span>energy</span><b>${selected.energy.toFixed(1)}</b></div><div class="row"><span>health</span><b>${selected.health.toFixed(0)}</b></div><div class="row"><span>speed gene</span><b>${selected.g.speed.toFixed(2)}</b></div><div class="row"><span>vision gene</span><b>${selected.g.vision.toFixed(2)}</b></div><div class="row"><span>fear</span><b>${selected.g.fear.toFixed(2)}</b></div><div class="row"><span>fertility</span><b>${selected.g.fertility.toFixed(2)}</b></div>`}
const pointers=new Map();let drag=null,pinch=0,pinchZoom=1,moved=false;canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);moved=false;if(pointers.size===1)drag={x:e.clientX,y:e.clientY};if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchZoom=camera.zoom}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.zoom=clamp(pinchZoom*d/Math.max(1,pinch),.45,2.8);moved=true;return}if(drag){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)moved=true;camera.follow=false;camera.x=clamp(camera.x-dx/camera.zoom,0,WW);camera.y=clamp(camera.y-dy/camera.zoom,0,WH)}});canvas.addEventListener('pointerup',e=>{if(!moved&&pointers.size===1){const w=screenToWorld(e.clientX,e.clientY);let best=null,bd=35*35;for(const a of animals){const d=(a.x-w.x)**2+(a.y-w.y)**2;if(d<bd){bd=d;best=a}}selected=best}pointers.delete(e.pointerId);if(!pointers.size){drag=null;pinch=0}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(!pointers.size){drag=null;pinch=0}});
let paused=false,speed=1,last=0,acc=0;const FIXED=1000/60;function frame(t){const dt=Math.min(50,t-last||16.7);last=t;acc+=dt;if(!paused)while(acc>=FIXED){for(let i=0;i<speed;i++)simulationStep();acc-=FIXED}if(camera.follow&&selected&&selected.alive){camera.x=lerp(camera.x,selected.x,.08);camera.y=lerp(camera.y,selected.y,.08)}render(t);requestAnimationFrame(frame)}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};document.querySelector('#speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;document.querySelector('#speed').textContent='×'+speed};document.querySelector('#follow').onclick=()=>{camera.follow=!!selected&&!camera.follow;document.querySelector('#follow').textContent=camera.follow?'●':'◎'};document.querySelector('#quality').onclick=()=>{quality=quality===2?1:2;document.querySelector('#quality').textContent=quality===2?'ULTRA':'HIGH'};document.querySelector('#weather').onclick=()=>{weather=1};document.querySelector('#reset').onclick=()=>start();
function start(){seed=(Math.random()*0xffffffff)>>>0;animals.length=0;particles.length=0;nextId=1;tick=0;seasonIndex=0;seasonTick=0;weather=0;dayClock=.24;maxGeneration=0;selected=null;generateWorld();for(let i=0;i<42;i++)spawn(HERB);for(let i=0;i<9;i++)spawn(BOAR);for(let i=0;i<7;i++)spawn(PRED);camera.x=WW*.5;camera.y=WH*.52;camera.zoom=1.15;camera.follow=false}start();requestAnimationFrame(frame);
