<body>
<canvas id="c"></canvas>
<div class="hud"><b>GENESIS // WILD ECOLOGY</b><div id="stats"></div></div>

<div class="dock"><button id="pause">Ⅱ</button><button id="speed">×1</button><button id="follow">◎</button><button id="rain">☂</button><button id="reset">↻</button></div>
<script>
'use strict';
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d',{alpha:false}),stats=document.querySelector('#stats'),inspect=document.querySelector('#inspect');
let DPR=1,PIX=3;const buf=document.createElement('canvas'),g=buf.getContext('2d',{alpha:false});
function resize(){DPR=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*DPR;canvas.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);PIX=innerWidth<700?3:4;buf.width=Math.max(240,Math.ceil(innerWidth/PIX));buf.height=Math.max(150,Math.ceil(innerHeight/PIX));ctx.imageSmoothingEnabled=false;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const BW=()=>buf.width,BH=()=>buf.height,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
let seed=(Math.random()*0xffffffff)>>>0;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}

function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}function line(x1,y1,x2,y2,c,w=1){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(Math.round(x1),Math.round(y1));g.lineTo(Math.round(x2),Math.round(y2));g.stroke()}
const COLS=96,ROWS=64,CELL=30,COUNT=COLS*ROWS,WW=COLS*CELL,WH=ROWS*CELL;const WATER=0,GRASS=1,FOREST=2,DRY=3,HILL=4;
let elev=new Float32Array(COUNT),moist=new Float32Array(COUNT),biome=new Uint8Array(COUNT),plants=new Float32Array(COUNT),fertility=new Float32Array(COUNT);const idx=(x,y)=>y*COLS+x;
function genWorld(){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const i=idx(x,y),nx=x/(COLS-1)*2-1,ny=y/(ROWS-1)*2-1,edge=clamp(1-Math.pow(Math.max(Math.abs(nx),Math.abs(ny)),1.7),0,1),r=Math.pow(Math.abs(fbm(x-18,y+11,4)-.5)*2,3);elev[i]=clamp(.13+fbm(x,y,1)*.50+edge*.28+r*.13,0,1);moist[i]=clamp(fbm(x+20,y-14,8)*.72+(1-elev[i])*.20,0,1);let b=WATER;if(elev[i]>.38){if(elev[i]>.75)b=HILL;else if(moist[i]>.67)b=FOREST;else if(moist[i]<.32)b=DRY;else b=GRASS}biome[i]=b;fertility[i]=b===FOREST?.95:b===GRASS?.82:b===DRY?.38:b===HILL?.25:.04;plants[i]=fertility[i]*(.55+hash(x,y,22)*.42)}}
const palette=[['#163a48','#1d5062'],['#557642','#678b4d'],['#24482f','#315c3a'],['#927249','#aa8553'],['#646865','#7a7f7b']];
const camera={x:WW*.5,y:WH*.52,zoom:1.35,follow:false};function w2s(x,y){return{x:Math.round(BW()/2+(x-camera.x)*camera.zoom/PIX),y:Math.round(BH()/2+(y-camera.y)*camera.zoom/PIX)}}function s2w(x,y){return{x:camera.x+(x-innerWidth/2)/camera.zoom,y:camera.y+(y-innerHeight/2)/camera.zoom}}function cellAt(x,y){return idx(clamp(Math.floor(x/CELL),0,COLS-1),clamp(Math.floor(y/CELL),0,ROWS-1))}
let tick=0,seasonIndex=0,seasonTick=0,raining=0;const seasons=['SPRING','SUMMER','AUTUMN','WINTER'];function seasonFactor(){return [1.25,1.0,.72,.32][seasonIndex]}
const animals=[];let nextId=1,maxGen=0;const HERB=0,PRED=1;
function gene(){return{speed:.8+rnd()*.4,vision:.75+rnd()*.5,metabolism:.75+rnd()*.5,size:.8+rnd()*.4,fear:.6+rnd()*.7,aggression:.55+rnd()*.75,fertility:.65+rnd()*.65,maturity:.8+rnd()*.4,memory:.65+rnd()*.7,social:.5+rnd()*.8,turn:.75+rnd()*.5}}
function cross(a,b){const c={};for(const k of Object.keys(a)){c[k]=(rnd()<.5?a[k]:b[k])+(gauss()*.035);c[k]=clamp(c[k],.4,1.65)}return c}
function randomLand(){for(let t=0;t<300;t++){const x=rnd()*WW,y=rnd()*WH,b=biome[cellAt(x,y)];if(b!==WATER&&b!==HILL)return{x,y}}return{x:WW*.5,y:WH*.5}}
function spawn(kind,x=null,y=null,parents=null){const p=x==null?randomLand():{x,y};const genome=parents?cross(parents[0].genome,parents[1].genome):gene();const gen=parents?Math.max(parents[0].generation,parents[1].generation)+1:0;const a={id:nextId++,kind,x:p.x,y:p.y,vx:0,vy:0,heading:rnd()*TAU,energy:70+rnd()*22,health:100,age:0,generation:gen,genome,mateCooldown:300+rnd()*400,state:'ROAM',memory:{food:null,threat:null},kills:0,children:0,alive:true};animals.push(a);maxGen=Math.max(maxGen,gen);return a}
function initLife(){animals.length=0;nextId=1;maxGen=0;for(let i=0;i<38;i++)spawn(HERB);for(let i=0;i<8;i++)spawn(PRED)}
const HASH=100,buckets=new Map();function rebuildHash(){buckets.clear();for(const a of animals){if(!a.alive)continue;const k=((a.x/HASH)|0)+','+((a.y/HASH)|0);let q=buckets.get(k);if(!q)buckets.set(k,q=[]);q.push(a)}}function near(a,r){const out=[],bx=(a.x/HASH)|0,by=(a.y/HASH)|0,n=Math.ceil(r/HASH);for(let yy=by-n;yy<=by+n;yy++)for(let xx=bx-n;xx<=bx+n;xx++){const q=buckets.get(xx+','+yy);if(!q)continue;for(const o of q){if(o===a||!o.alive)continue;const dx=o.x-a.x,dy=o.y-a.y;if(dx*dx+dy*dy<=r*r)out.push(o)}}return out}
function nearest(a,test,r){let best=null,bd=r*r;for(const o of near(a,r)){if(!test(o))continue;const dx=o.x-a.x,dy=o.y-a.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=o}}return best}
function bestFoodTile(a,rCells=3){const cx=clamp(Math.floor(a.x/CELL),0,COLS-1),cy=clamp(Math.floor(a.y/CELL),0,ROWS-1);let best=null,score=-1;for(let oy=-rCells;oy<=rCells;oy++)for(let ox=-rCells;ox<=rCells;ox++){const x=cx+ox,y=cy+oy;if(x<0||y<0||x>=COLS||y>=ROWS)continue;const i=idx(x,y);if(biome[i]===WATER)continue;const d=Math.hypot(ox,oy),s=plants[i]-.08*d;if(s>score){score=s;best={x:(x+.5)*CELL,y:(y+.5)*CELL,i}}}return best}
function turnToward(a,tx,ty,str=.12){const target=Math.atan2(ty-a.y,tx-a.x),d=Math.atan2(Math.sin(target-a.heading),Math.cos(target-a.heading));a.heading+=clamp(d,-str*a.genome.turn,str*a.genome.turn)}function turnAway(a,tx,ty,str=.14){turnToward(a,a.x-(tx-a.x),a.y-(ty-a.y),str)}
function tryMate(a){if(a.mateCooldown>0||a.energy<76||a.age<650*a.genome.maturity||animals.length>95)return;const mate=nearest(a,o=>o.kind===a.kind&&o.mateCooldown<=0&&o.energy>72&&o.age>650*o.genome.maturity,55*a.genome.social);if(!mate)return;if(Math.hypot(mate.x-a.x,mate.y-a.y)<14){if(rnd()<.018*a.genome.fertility){const litter=a.kind===HERB?(rnd()<.18*a.genome.fertility?2:1):1;for(let n=0;n<litter;n++)spawn(a.kind,(a.x+mate.x)/2+(rnd()-.5)*8,(a.y+mate.y)/2+(rnd()-.5)*8,[a,mate]);a.energy-=16;mate.energy-=14;a.children+=litter;mate.children+=litter;a.mateCooldown=700;mate.mateCooldown=700}}else turnToward(a,mate.x,mate.y,.10)}
function stepHerb(a){const vision=80*a.genome.vision,threat=nearest(a,o=>o.kind===PRED,vision);if(threat){a.state='FLEE';a.memory.threat={x:threat.x,y:threat.y,t:180*a.genome.memory};turnAway(a,threat.x,threat.y,.20+.05*a.genome.fear)}else if(a.memory.threat&&a.memory.threat.t>0){a.state='EVADE';turnAway(a,a.memory.threat.x,a.memory.threat.y,.10);a.memory.threat.t--}else if(a.energy<68){const food=bestFoodTile(a,Math.max(2,Math.round(2+a.genome.vision)));if(food&&plants[food.i]>.04){a.state='FORAGE';a.memory.food={x:food.x,y:food.y,t:240*a.genome.memory};turnToward(a,food.x,food.y,.11);if(Math.hypot(food.x-a.x,food.y-a.y)<18){const bite=Math.min(plants[food.i],.010+.008*a.genome.size);plants[food.i]-=bite;a.energy=Math.min(105,a.energy+bite*165)}}else if(a.memory.food&&a.memory.food.t>0){turnToward(a,a.memory.food.x,a.memory.food.y,.08);a.memory.food.t--}}else{a.state='ROAM';a.heading+=(rnd()-.5)*.045*a.genome.turn;tryMate(a)}}
function stepPred(a){const prey=nearest(a,o=>o.kind===HERB,95*a.genome.vision);if(prey&&a.energy<86){a.state='HUNT';turnToward(a,prey.x,prey.y,.16+.04*a.genome.aggression);const d=Math.hypot(prey.x-a.x,prey.y-a.y);if(d<10*a.genome.size){const hit=4.5*a.genome.size*a.genome.aggression;prey.health-=hit;a.energy-=.4;if(prey.health<=0){prey.alive=false;a.energy=Math.min(110,a.energy+42*prey.genome.size);a.kills++}}}else{a.state='ROAM';a.heading+=(rnd()-.5)*.05*a.genome.turn;tryMate(a)}}

function environmentStep(){seasonTick++;if(seasonTick>2400){seasonTick=0;seasonIndex=(seasonIndex+1)%4}const sf=seasonFactor();for(let n=0;n<42;n++){const i=(tick*43+n*137)%COUNT;if(biome[i]===WATER)continue;const rainBoost=1+raining*.5;const cap=fertility[i]*(biome[i]===FOREST?1.15:1);plants[i]=Math.min(cap,plants[i]+(.00065+.0012*fertility[i])*sf*rainBoost*(1-plants[i]/Math.max(.01,cap)))}raining=Math.max(0,raining-.0008)}
function simStep(){tick++;environmentStep();if(tick%2===0)rebuildHash();for(const a of animals)stepAnimal(a);if(tick%120===0){for(let i=animals.length-1;i>=0;i--)if(!animals[i].alive)animals.splice(i,1);if(animals.filter(a=>a.kind===HERB).length<10)for(let n=0;n<3;n++)spawn(HERB);if(animals.filter(a=>a.kind===PRED).length<2)spawn(PRED)}}
let selected=null;function drawWorld(time){const cw=CELL*camera.zoom/PIX,left=clamp(Math.floor((camera.x-innerWidth/(2*camera.zoom))/CELL)-1,0,COLS-1),right=clamp(Math.ceil((camera.x+innerWidth/(2*camera.zoom))/CELL)+1,0,COLS-1),top=clamp(Math.floor((camera.y-innerHeight/(2*camera.zoom))/CELL)-1,0,ROWS-1),bottom=clamp(Math.ceil((camera.y+innerHeight/(2*camera.zoom))/CELL)+1,0,ROWS-1);rect(0,0,BW(),BH(),'#07100d');for(let y=top;y<=bottom;y++)for(let x=left;x<=right;x++){const i=idx(x,y),q=w2s(x*CELL,y*CELL),p=palette[biome[i]],h=Math.max(0,(elev[i]-.38))*12*camera.zoom/PIX;rect(q.x,q.y-h,cw+1,cw+1,p[hash(x,y,7)>.5?1:0]);if(biome[i]===FOREST&&hash(x,y,8)<plants[i]){const tx=q.x+Math.round(cw*(.25+hash(x,y,9)*.5)),ty=q.y-h+Math.round(cw*.62);rect(tx,ty-5,1,6,'#493321');rect(tx-2,ty-8,5,4,'#2a5b35')}else if((biome[i]===GRASS||biome[i]===DRY)&&plants[i]>.28&&hash(x,y,10)<plants[i]){const gx=q.x+Math.round(cw*hash(x,y,11)),gy=q.y-h+Math.round(cw*.72);line(gx,gy,gx+(Math.sin(time*.002+x+y)>.0?1:0),gy-2,biome[i]===DRY?'#b19b65':'#88a864',1)}if(biome[i]===WATER&&Math.sin(time*.004+x*.8+y)>.25)rect(q.x+2,q.y+3,Math.max(2,cw-4),1,'#5f9fb0')}}
function drawAnimal(a,time){const q=w2s(a.x,a.y);if(q.x<-20||q.x>BW()+20||q.y<-20||q.y>BH()+20)return;const juv=clamp(a.age/(620*a.genome.maturity),.45,1),s=a.genome.size*juv,bodyW=(a.kind===PRED?7:8)*s,bodyH=(a.kind===PRED?3.6:4.5)*s,ang=a.heading,moving=Math.hypot(a.vx,a.vy)>.1,step=Math.sin(time*.012+a.id)*(moving?2:0),base=a.kind===PRED?'#a2533f':'#a4b376',light=a.kind===PRED?'#dc8064':'#d7daa5';rect(q.x-bodyW/2,q.y+3,bodyW,2,'#02040355');g.save();g.translate(Math.round(q.x),Math.round(q.y));g.rotate(ang);rect(-bodyW/2,-bodyH/2,bodyW,bodyH,base);rect(-bodyW/2+1,-bodyH/2,bodyW-2,1,light);rect(bodyW/2-1,-bodyH/2-1,3,3,base);rect(bodyW/2+1,-1,2,1,light);line(-bodyW*.25,bodyH*.25,-bodyW*.25+step,bodyH*.25+4*s,'#3a2f29',1);line(bodyW*.2,bodyH*.25,bodyW*.2-step,bodyH*.25+4*s,'#3a2f29',1);line(-bodyW/2,0,-bodyW/2-4*s,Math.sin(time*.009+a.id)*1.5,base,2);if(a.kind===HERB){line(bodyW/2,-bodyH*.5,bodyW/2-1,-bodyH*.5-3*s,base,1);line(bodyW/2+1,-bodyH*.5,bodyW/2+2,-bodyH*.5-3*s,base,1)}g.restore();if(selected===a){g.strokeStyle='#ffe477';g.strokeRect(q.x-8*s,q.y-10*s,16*s,18*s)}}
function render(time){drawWorld(time);for(const a of animals.slice().sort((a,b)=>a.y-b.y))drawAnimal(a,time);if(raining>0){rect(0,0,BW(),BH(),'#39556a12');for(let i=0;i<34;i++){const x=hash(i,(tick/2)|0,90)*BW(),y=hash(i,(tick/2)|0,91)*BH();line(x,y,x-1,y+3,'#aacbd8',1)}}ctx.fillStyle='#040706';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.drawImage(buf,0,0,innerWidth,innerHeight);updateUI()}
function updateUI(){const herb=animals.filter(a=>a.kind===HERB).length,pred=animals.length-herb,avgPlant=plants.reduce((a,b)=>a+b,0)/COUNT;stats.innerHTML=`${seasons[seasonIndex]} · year ${(tick/9600).toFixed(1)}<br>herb ${herb} · predators ${pred} · gen ${maxGen}<br>plant biomass ${(avgPlant*100).toFixed(0)}%`;if(!selected||!selected.alive){inspect.style.display='none';return}inspect.style.display='block';inspect.innerHTML=`<h2>${selected.kind===HERB?'Herbivore':'Predator'} #${selected.id}</h2><div class="row"><span>state</span><b>${selected.state}</b></div><div class="row"><span>generation</span><b>${selected.generation}</b></div><div class="row"><span>energy</span><b>${selected.energy.toFixed(0)}</b></div><div class="row"><span>health</span><b>${selected.health.toFixed(0)}</b></div><div class="row"><span>age</span><b>${selected.age}</b></div><div class="row"><span>speed gene</span><b>${selected.genome.speed.toFixed(2)}</b></div><div class="row"><span>vision gene</span><b>${selected.genome.vision.toFixed(2)}</b></div><div class="row"><span>metabolism</span><b>${selected.genome.metabolism.toFixed(2)}</b></div><div class="row"><span>${selected.kind===HERB?'fear':'aggression'}</span><b>${(selected.kind===HERB?selected.genome.fear:selected.genome.aggression).toFixed(2)}</b></div><div class="row"><span>children</span><b>${selected.children}</b></div>`}
const pointers=new Map();let drag=null,pinch=0,pinchZoom=1,moved=false;canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);moved=false;if(pointers.size===1)drag={x:e.clientX,y:e.clientY};if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchZoom=camera.zoom}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.zoom=clamp(pinchZoom*d/pinch,.55,3.4);moved=true;return}if(drag&&pointers.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)moved=true;camera.follow=false;camera.x=clamp(camera.x-dx/camera.zoom,0,WW);camera.y=clamp(camera.y-dy/camera.zoom,0,WH)}});canvas.addEventListener('pointerup',e=>{if(!moved&&pointers.size===1){const w=s2w(e.clientX,e.clientY);let best=null,bd=30*30;for(const a of animals){const d=(a.x-w.x)**2+(a.y-w.y)**2;if(d<bd){bd=d;best=a}}selected=best}pointers.delete(e.pointerId);if(!pointers.size){drag=null;pinch=0}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId)});
let paused=false,speed=1,last=0,acc=0;const STEP=1000/60;function frame(t){const dt=Math.min(50,t-last||16.7);last=t;acc+=dt;if(!paused){while(acc>=STEP){for(let i=0;i<speed;i++)simStep();acc-=STEP}}if(camera.follow&&selected&&selected.alive){camera.x=lerp(camera.x,selected.x,.08);camera.y=lerp(camera.y,selected.y,.08)}render(t);requestAnimationFrame(frame)}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};document.querySelector('#speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;document.querySelector('#speed').textContent='×'+speed};document.querySelector('#follow').onclick=()=>{camera.follow=!!selected&&!camera.follow;document.querySelector('#follow').textContent=camera.follow?'●':'◎'};document.querySelector('#rain').onclick=()=>{raining=Math.min(1,raining+.9)};document.querySelector('#reset').onclick=()=>{seed=(Math.random()*0xffffffff)>>>0;tick=0;seasonIndex=0;seasonTick=0;raining=0;genWorld();initLife();camera.x=WW*.5;camera.y=WH*.52;selected=null};
genWorld();initLife();requestAnimationFrame(frame);
</script>
