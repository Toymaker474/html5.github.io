<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071009">
<title>GENESIS // CODEHOOD FORTRESS</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-box">
    <pre class="boot-logo">   ☺    ☺    ☺
  /|\  /|\  /|\     CODEHOOD FORTRESS
  / \  / \  / \     generate → survive → learn → build</pre>
    <div class="row"><b id="bootLabel">BOOT</b><span id="bootPercent">0%</span></div>
    <div class="loadbar"><i id="bootBar"></i></div>
    <div id="bootDetail" class="boot-detail">generating a readable world…</div>
  </div>
</div>
<div class="app">
<header>
  <span class="brand">CODEHOOD FORTRESS</span>
  <span class="badge">ZERO-SOLUTION EVOLUTION</span>
  <button id="pause">⏸ PAUSE</button>
  <button id="turbo" class="primary">⚡ SPEED ×1</button>
  <button id="rain">🌧 STORM</button>
  <button id="zero">🧬 NEW WORLD</button>
</header>
<main class="world-wrap">
  <canvas id="world" aria-label="Fortress-style ASCII world with learning agents"></canvas>
  <div id="hud" class="hud"></div>
</main>
<aside class="side">
  <nav class="tabs" aria-label="Simulation panels">
    <button data-tab="person" class="on">☺ PERSON</button>
    <button data-tab="projects">🎮 PROJECTS</button>
    <button data-tab="learning">🧠 LEARNING</button>
    <button data-tab="world">🗺 WORLD</button>
  </nav>
  <div id="panel" class="panel"></div>
</aside>
<footer>
  PEOPLE LIMIT <input id="popCap" type="range" min="1000" max="10000" step="500" value="3500"><span id="popValue">3500</span>
  <span>• render <b id="fps">0</b> FPS</span>
  <span>• chunk work <b id="bps">0</b>/s</span>
  <span>• sweeps <b id="sps">0</b>/s</span>
  <button id="save">💾 SAVE</button>
  <button id="export">📦 EXPORT</button>
</footer>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
