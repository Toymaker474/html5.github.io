[package]
name = "sandbox-god-genic-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional Rust/WASM acceleration core for Sandbox God Genic."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
