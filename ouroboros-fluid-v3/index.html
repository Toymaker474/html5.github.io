<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#010408"><title>OUROBOROS FLUID V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010408;color:#dff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}#c{width:100%;height:100%;display:block}.hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:9;background:#02070bcc;border:1px solid #7ff4ff42;border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.45;backdrop-filter:blur(12px);pointer-events:none}.title{font-weight:900;letter-spacing:.11em;color:#9ff}.hint{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:9;background:#02070bbb;border:1px solid #fff2;border-radius:10px;padding:8px 10px;font-size:10px}.err{color:#ff9999;white-space:pre-wrap}</style><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="c"></canvas><div class="hud"><div class="title">OUROBOROS FLUID V3</div><div id="stats">booting reconstructed fluid…</div><div id="mode">canyon breach • waterfall • lava • steam</div></div><div class="hint">drag orbit • pinch zoom • tap basin = inject water</div><script>addEventListener('error',e=>{stats.textContent='BOOT ERROR';mode.className='err';mode.textContent=e.message||'unknown'});addEventListener('unhandledrejection',e=>{stats.textContent='MODULE ERROR';mode.className='err';mode.textContent=String(e.reason?.message||e.reason||'unknown')});</script><script src="./fluid.js?v=1"></script></body></html>
