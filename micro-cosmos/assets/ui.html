<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Micro Cosmos</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;flex-direction:column}.bar{display:flex;gap:6px;padding:7px;background:rgba(7,12,20,.94);border-bottom:1px solid #243142;align-items:center}.title{font-weight:750;font-size:13px;margin-right:auto}.modes{display:flex;gap:4px}.modes button,.ctl button{border:1px solid #30435b;background:#0c1724;color:#dcecff;border-radius:8px;padding:6px 8px;font:11px system-ui}.modes button.on{background:#17324d;border-color:#6ea7dd}.stage{position:relative;flex:1;min-height:0}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#020409}.hud{position:absolute;left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,auto);gap:5px;pointer-events:none}.chip{background:rgba(5,10,17,.78);border:1px solid rgba(120,160,200,.2);border-radius:7px;padding:4px 6px;font-size:9px;font-variant-numeric:tabular-nums}.ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}.hint{position:absolute;top:8px;left:8px;background:rgba(5,10,17,.72);border:1px solid rgba(120,160,200,.18);border-radius:7px;padding:4px 7px;font-size:9px;color:#abc2d9;pointer-events:none}
</style>
</head>
<body>
<div class="bar"><div class="title">MICRO COSMOS</div><div class="modes"><button data-m="fluid">Fluid</button><button data-m="gravity">Gravity</button><button data-m="reaction">Chem</button><button data-m="waves">Waves</button></div></div>
<div class="stage"><canvas id="c"></canvas><div class="hint" id="hint"></div><div class="hud"><div class="chip" id="fps">0 fps</div><div class="chip" id="metric">—</div><div class="chip" id="count">—</div></div><div class="ctl"><button id="reset">Reset</button><button id="burst">Burst</button></div></div>
<script>
(()=>{'use strict';
const Q=new URLSearchParams(location.search);let mode=Q.get('mode')||'fluid';const intensity=Math.max(.5,Math.min(2,+Q.get('intensity')||1));let seed=(+Q.get('seed')||42)|0;
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});const fpsEl=document.getElementById('fps'),metricEl=document.getElementById('metric'),countEl=document.getElementById('count'),hintEl=document.getElementById('hint');
let dpr=1,CW=1,CH=1,last=performance.now(),fn=0,ft=last,pointer=null;
function rng(){seed=(seed*1664525+1013904223)|0;return (seed>>>0)/4294967296}
function resize(){dpr=Math.min(2,devicePixelRatio||1);CW=Math.max(1,innerWidth);CH=Math.max(1,innerHeight-44);c.width=Math.floor(CW*dpr);c.height=Math.floor(CH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const FW=110,FH=66,FN=FW*FH;let h=new Float32Array(FN),hu=new Float32Array(FN),hv=new Float32Array(FN),h2=new Float32Array(FN),u2=new Float32Array(FN),v2=new Float32Array(FN),fimg=document.createElement('canvas');fimg.width=FW;fimg.height=FH;let fctx=fimg.getContext('2d'),fid=fctx.createImageData(FW,FH);const fi=(x,y)=>x+y*FW;
function fluidReset(){h.fill(0);hu.fill(0);hv.fill(0);splash(FW*.5,FH*.5,1.2*intensity,9)}
function splash(x,y,a=1,r=7){x|=0;y|=0;for(let yy=Math.max(1,y-r);yy<Math.min(FH-1,y+r);yy++)for(let xx=Math.max(1,x-r);xx<Math.min(FW-1,x+r);xx++){let d=(xx-x)**2+(yy-y)**2;if(d<r*r)h[fi(xx,yy)]+=a*Math.exp(-d/(r*r*.26))}}
function fluidStep(){const g=8.5,dt=.055,nu=.018,drag=.02;for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){let i=fi(x,y),L=i-1,R=i+1,D=i-FW,U=i+FW;u2[i]=hu[i]+dt*(-g*(h[R]-h[L])*.5+nu*(hu[L]+hu[R]+hu[D]+hu[U]-4*hu[i])-drag*hu[i]);v2[i]=hv[i]+dt*(-g*(h[U]-h[D])*.5+nu*(hv[L]+hv[R]+hv[D]+hv[U]-4*hv[i])-drag*hv[i])}for(let y=1;y<FH-1;y++)for(let x=1;x<FW-1;x++){let i=fi(x,y);h2[i]=h[i]-dt*((u2[i+1]-u2[i-1]+v2[i+FW]-v2[i-FW])*.5)}for(let x=0;x<FW;x++){h2[x]=h2[fi(x,FH-1)]=0;u2[x]=u2[fi(x,FH-1)]=0;v2[x]=v2[fi(x,FH-1)]=0}for(let y=0;y<FH;y++){let a=fi(0,y),b=fi(FW-1,y);h2[a]=h2[b]=0;u2[a]=u2[b]=0;v2[a]=v2[b]=0}[h,h2]=[h2,h];[hu,u2]=[u2,hu];[hv,v2]=[v2,hv]}
function fluidDraw(){let p=fid.data,k=0,peak=0;for(let i=0;i<FN;i++){let z=clamp(.5+h[i]*.42,0,1);peak=Math.max(peak,Math.abs(h[i]));p[k++]=8+30*z;p[k++]=25+150*z;p[k++]=65+190*z;p[k++]=255}fctx.putImageData(fid,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(fimg,0,0,CW,CH);metricEl.textContent='peak '+peak.toFixed(3);countEl.textContent=FW+'×'+FH;hintEl.textContent='drag/tap = disturb water'}
let bodies=[],wells=[];function gravityReset(){bodies=[];wells=[{x:.5,y:.5,m:1.2}];for(let i=0;i<650;i++){let a=rng()*Math.PI*2,r=.08+rng()*.42;let x=.5+Math.cos(a)*r,y=.5+Math.sin(a)*r,s=Math.sqrt(0.00025/(r+.03));bodies.push({x,y,vx:-Math.sin(a)*s,vy:Math.cos(a)*s})}}
function gravityStep(){const dt=.55*intensity;for(const b of bodies){let ax=0,ay=0;for(const w of wells){let dx=w.x-b.x,dy=w.y-b.y,r2=dx*dx+dy*dy+.00022,inv=1/Math.pow(r2,1.5);ax+=dx*w.m*.00018*inv;ay+=dy*w.m*.00018*inv}b.vx+=ax*dt;b.vy+=ay*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-.1||b.x>1.1||b.y<-.1||b.y>1.1){let a=rng()*Math.PI*2,r=.28+rng()*.2;b.x=.5+Math.cos(a)*r;b.y=.5+Math.sin(a)*r;b.vx=-Math.sin(a)*.02;b.vy=Math.cos(a)*.02}}}
function gravityDraw(){ctx.fillStyle='#020409';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='rgba(130,205,255,.72)';for(const b of bodies)ctx.fillRect(b.x*CW,b.y*CH,1.2,1.2);for(const w of wells){let x=w.x*CW,y=w.y*CH,g=ctx.createRadialGradient(x,y,0,x,y,28);g.addColorStop(0,'#fff5b8');g.addColorStop(.2,'#ffd166');g.addColorStop(1,'rgba(255,160,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.fill()}metricEl.textContent='wells '+wells.length;countEl.textContent=bodies.length+' tracers';hintEl.textContent='tap = add gravity well'}
const RW=110,RH=66,RN=RW*RH;let A=new Float32Array(RN),B=new Float32Array(RN),A2=new Float32Array(RN),B2=new Float32Array(RN),rimg=document.createElement('canvas');rimg.width=RW;rimg.height=RH;let rctx=rimg.getContext('2d'),rid=rctx.createImageData(RW,RH);const ri=(x,y)=>x+y*RW;
function reactionReset(){A.fill(1);B.fill(0);for(let n=0;n<18;n++){let cx=(rng()*RW)|0,cy=(rng()*RH)|0;for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){let xx=clamp(cx+x,1,RW-2),yy=clamp(cy+y,1,RH-2);B[ri(xx,yy)]=1}}}
function reactionStep(){const Da=1,Db=.5,F=.036+(.004*(intensity-1)),K=.062;for(let y=1;y<RH-1;y++)for(let x=1;x<RW-1;x++){let i=ri(x,y),a=A[i],b=B[i],lapA=A[i-1]+A[i+1]+A[i-RW]+A[i+RW]-4*a,lapB=B[i-1]+B[i+1]+B[i-RW]+B[i+RW]-4*b,ab=a*b*b;A2[i]=clamp(a+(Da*lapA-ab+F*(1-a))*.7,0,1);B2[i]=clamp(b+(Db*lapB+ab-(K+F)*b)*.7,0,1)}[A,A2]=[A2,A];[B,B2]=[B2,B]}
function reactionPaint(px,py){let x=(px/CW*RW)|0,y=(py/CH*RH)|0;for(let yy=-4;yy<=4;yy++)for(let xx=-4;xx<=4;xx++){let X=clamp(x+xx,1,RW-2),Y=clamp(y+yy,1,RH-2);B[ri(X,Y)]=1}}
function reactionDraw(){let p=rid.data,k=0,mean=0;for(let i=0;i<RN;i++){let z=clamp(B[i]*1.7,0,1);mean+=z;p[k++]=10+160*z;p[k++]=20+210*(1-Math.abs(z-.55)*1.7);p[k++]=55+200*(1-z);p[k++]=255}rctx.putImageData(rid,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(rimg,0,0,CW,CH);metricEl.textContent='activity '+(mean/RN).toFixed(3);countEl.textContent=RW+'×'+RH;hintEl.textContent='draw = seed chemical B'}
const WW=120,WH=72,WN=WW*WH;let w0=new Float32Array(WN),w1=new Float32Array(WN),w2=new Float32Array(WN),wimg=document.createElement('canvas');wimg.width=WW;wimg.height=WH;let wctx=wimg.getContext('2d'),wid=wctx.createImageData(WW,WH);const wi=(x,y)=>x+y*WW;
function wavesReset(){w0.fill(0);w1.fill(0);w2.fill(0);waveDrop(WW*.5,WH*.5,1)}function waveDrop(x,y,a=1){x|=0;y|=0;let r=6;for(let yy=Math.max(1,y-r);yy<Math.min(WH-1,y+r);yy++)for(let xx=Math.max(1,x-r);xx<Math.min(WW-1,x+r);xx++){let d=(xx-x)**2+(yy-y)**2;if(d<r*r)w1[wi(xx,yy)]+=a*Math.exp(-d/(r*r*.22))}}
function wavesStep(){const c2=.24*intensity,damp=.997;for(let y=1;y<WH-1;y++)for(let x=1;x<WW-1;x++){let i=wi(x,y),lap=w1[i-1]+w1[i+1]+w1[i-WW]+w1[i+WW]-4*w1[i];w2[i]=(2*w1[i]-w0[i]+c2*lap)*damp}[w0,w1,w2]=[w1,w2,w0]}
function wavesDraw(){let p=wid.data,k=0,peak=0;for(let i=0;i<WN;i++){let z=clamp(.5+w1[i]*.55,0,1);peak=Math.max(peak,Math.abs(w1[i]));p[k++]=40+180*z;p[k++]=35+120*(1-Math.abs(z-.5)*1.6);p[k++]=80+175*(1-z);p[k++]=255}wctx.putImageData(wid,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(wimg,0,0,CW,CH);metricEl.textContent='amplitude '+peak.toFixed(3);countEl.textContent=WW+'×'+WH;hintEl.textContent='tap = wave source'}
function reset(){if(mode==='fluid')fluidReset();else if(mode==='gravity')gravityReset();else if(mode==='reaction')reactionReset();else wavesReset();document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mode))}
function burst(){if(mode==='fluid')for(let i=0;i<7;i++)splash(rng()*FW,rng()*FH,.5+rng(),5);else if(mode==='gravity'){for(let i=0;i<3;i++)wells.push({x:.2+rng()*.6,y:.2+rng()*.6,m:.5+rng()})}else if(mode==='reaction')for(let i=0;i<12;i++)reactionPaint(rng()*CW,rng()*CH);else for(let i=0;i<9;i++)waveDrop(rng()*WW,rng()*WH,.5+rng()*.7)}
function ppos(e){let r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointer=ppos(e);act(pointer[0],pointer[1],0,0)});c.addEventListener('pointermove',e=>{if(!pointer||!e.buttons)return;let p=ppos(e),dx=p[0]-pointer[0],dy=p[1]-pointer[1];act(p[0],p[1],dx,dy);pointer=p});c.addEventListener('pointerup',()=>pointer=null);c.addEventListener('pointercancel',()=>pointer=null);
function act(x,y,dx,dy){if(mode==='fluid')splash(x/CW*FW,y/CH*FH,.22+Math.hypot(dx,dy)*.015,5);else if(mode==='gravity'&&Math.hypot(dx,dy)<2){wells.push({x:x/CW,y:y/CH,m:.65});if(wells.length>5)wells.shift()}else if(mode==='reaction')reactionPaint(x,y);else if(mode==='waves')waveDrop(x/CW*WW,y/CH*WH,.75)}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;reset()});document.getElementById('reset').onclick=reset;document.getElementById('burst').onclick=burst;
function frame(t){if(mode==='fluid'){for(let i=0;i<2;i++)fluidStep();fluidDraw()}else if(mode==='gravity'){gravityStep();gravityDraw()}else if(mode==='reaction'){for(let i=0;i<5;i++)reactionStep();reactionDraw()}else{for(let i=0;i<3;i++)wavesStep();wavesDraw()}fn++;if(t-ft>600){fpsEl.textContent=(fn*1000/(t-ft)).toFixed(0)+' fps';fn=0;ft=t}last=t;requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
})();
</script>
</body></html>
