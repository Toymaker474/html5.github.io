<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edge Forge Program</title>
<style>
html,body{margin:0;height:100%;background:#090d14;color:#e9f2ff;font:14px system-ui,-apple-system,sans-serif}
#bar{height:44px;display:flex;align-items:center;gap:8px;padding:env(safe-area-inset-top) 10px 0;background:#111927;border-bottom:1px solid #263348}
#name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
button{border:1px solid #3a4a62;border-radius:10px;background:#182235;color:#fff;padding:8px 12px;font-weight:650}
#wrap{height:calc(100% - 45px);position:relative}
iframe{width:100%;height:100%;border:0;background:white}
#err{position:absolute;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;background:#240b0d;color:#ffbdc2;padding:9px;border-radius:10px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="bar"><div id="name">Program</div><button id="reload">Restart</button></div>
<div id="wrap"><iframe id="frame" sandbox="allow-scripts allow-pointer-lock allow-forms"></iframe><pre id="err"></pre></div>
<script>
(() => {
  const q=new URLSearchParams(location.search), n=q.get("n")||localStorage.getItem("efb.latest.v1")||"";
  const programs=(()=>{try{return JSON.parse(localStorage.getItem("efb.programs.v1")||"{}")}catch(e){return {}}})();
  const p=programs[n];
  const err=document.getElementById("err"), frame=document.getElementById("frame");
  document.getElementById("name").textContent=p?`▶ ${p.name}`:"Program not found";
  function show(msg){err.style.display="block";err.textContent=String(msg)}
  function boot(){
    if(!p){show("No saved program. Return to chat and use /make.");return}
    err.style.display="none";
    // The generated app runs in an opaque-origin iframe. It cannot access this skill's localStorage.
    frame.srcdoc=p.code;
  }
  window.addEventListener("message",e=>{
    if(e.source===frame.contentWindow && e.data && e.data.__edgeForgeError) show(e.data.__edgeForgeError);
  });
  document.getElementById("reload").onclick=boot;
  boot();
})();
</script>
</body>
</html>
