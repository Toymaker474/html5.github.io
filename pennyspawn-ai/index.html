<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050812">
  <title>Opening Sandbox God Genic</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050812;color:#f5f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    .orb{width:88px;height:88px;margin:auto;border-radius:30px;background:radial-gradient(circle at 35% 28%,#fff,#68ffac 14%,#62bfff 48%,#7446e8 72%,transparent 74%);filter:drop-shadow(0 0 34px #62bfff66)}
    p{color:#8491a9}a{color:#68ffac}
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>PennySpawn evolved.</h1>
    <p id="status" role="status" aria-live="polite">Cleaning the retired app, then opening Sandbox God Genic…</p>
    <a href="../?v=god-genic-1">Continue now</a>
  </main>
  <script>
    (() => {
      const destination = '../?v=god-genic-1';
      const timeout = new Promise(resolve => setTimeout(resolve, 1500));
      const cleanup = (async () => {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter(key => /pennyspawn|q-arena|revenue-lab/i.test(key))
            .map(key => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(registration => registration.scope.includes('/pennyspawn-ai/'))
            .map(registration => registration.unregister()));
        }
      })().catch(() => undefined);

      Promise.race([cleanup, timeout]).finally(() => location.replace(destination));
    })();
  </script>
</body>
</html>
