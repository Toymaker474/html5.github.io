<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Genesis GLX3 // Artificial Chemistry</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407;color:#eaffff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#gpu{z-index:0}#sim{z-index:1}.hud{position:fixed;z-index:2;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:rgba(2,9,15,.78);border:1px solid rgba(150,240,255,.16);border-radius:14px;backdrop-filter:blur(16px);box-shadow:0 16px 50px #0008}.brand{font-size:12px;font-weight:950;letter-spacing:.1em;color:#6effdf}.stat{font-size:10px;color:#91aeb8}.stat b{color:#fff}button,select{border:1px solid #ffffff20;background:#ffffff0e;color:#fff;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800}#inspect{position:fixed;z-index:3;display:none;left:8px;bottom:max(8px,env(safe-area-inset-bottom));width:min(360px,calc(100vw - 16px));padding:12px;background:rgba(2,9,15,.84);border:1px solid rgba(150,240,255,.16);border-radius:14px;backdrop-filter:blur(16px)}.small{font-size:10px;color:#91aeb8;line-height:1.5}.bar{height:7px;margin:4px 0 7px;background:#ffffff12;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#5effdd,#f7ff74)}#fatal{display:none;position:fixed;z-index:99;inset:10px;padding:14px;overflow:auto;white-space:pre-wrap;background:#130207f5;border:1px solid #ff5577;border-radius:12px;color:#ffb4c2;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<canvas id="gpu"></canvas><canvas id="sim"></canvas>
<div class="hud">
<span class="brand">GENESIS GLX3</span>
<span class="stat">GPU <b id="backend">BOOT</b></span>
<span class="stat">Cells <b id="cells">0</b></span>
<span class="stat">Molecules <b id="molecules">0</b></span>
<span class="stat">Gen <b id="generation">0</b></span>
<span class="stat">FPS <b id="fps">0</b></span>
<button id="pause">Pause</button><button id="energy">Energy</button><button id="organics">Organics</button><button id="lipids">Lipids</button><button id="rna">RNA</button><button id="seed">Seed Cell</button><button id="reset">Reset</button>
<select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
</div>
<div id="inspect"><b id="iname">Protocell</b><div id="isub" class="small"></div><div class="small">Energy</div><div class="bar"><div id="ebar" class="fill"></div></div><div class="small">Membrane</div><div class="bar"><div id="mbar" class="fill"></div></div><div id="idetail" class="small"></div></div>
<pre id="fatal"></pre>
<script>
(()=>{'use strict';
const gpuCanvas=document.querySelector('#gpu'),simCanvas=document.querySelector('#sim'),ctx=simCanvas.getContext('2d',{alpha:true,desynchronized:true});
const $=s=>document.querySelector(s),ui={backend:$('#backend'),cells:$('#cells'),molecules:$('#molecules'),generation:$('#generation'),fps:$('#fps'),inspect:$('#inspect'),iname:$('#iname'),isub:$('#isub'),ebar:$('#ebar'),mbar:$('#mbar'),idetail:$('#idetail'),fatal:$('#fatal')};
const WORLD={w:2400,h:1500};let W=innerWidth,H=innerHeight,DPR=1;const camera={x:WORLD.w/2,y:WORLD.h/2,z:.5};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const c of[gpuCanvas,simCanvas]){c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);c.style.width=W+'px';c.style.height=H+'px'}ctx.setTransform(DPR,0,0,DPR,0,0);renderer?.resize()}
addEventListener('resize',resize);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;let rs=0x71e57a11;function rand(){rs^=rs<<13;rs^=rs>>>17;rs^=rs<<5;return(rs>>>0)/4294967296}function rr(a,b){return a+rand()*(b-a)}
function w2s(x,y){return{x:(x-camera.x)*camera.z+W/2,y:(y-camera.y)*camera.z+H/2}}function s2w(x,y){return{x:(x-W/2)/camera.z+camera.x,y:(y-H/2)/camera.z+camera.y}}
function fatal(e){ui.fatal.style.display='block';ui.fatal.textContent='GENESIS GLX3 HALTED\n\n'+String(e?.stack||e)}
class GLX3{
 constructor(canvas){this.canvas=canvas;this.kind='';this.time=0}
 async init(){if(navigator.gpu){try{await this.initWebGPU();return}catch(e){console.warn('WebGPU init failed, falling back to WebGL2',e)}}this.initWebGL2()}
 async initWebGPU(){const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('No WebGPU adapter');this.device=await adapter.requestDevice();this.context=this.canvas.getContext('webgpu');if(!this.context)throw Error('No WebGPU canvas context');this.format=navigator.gpu.getPreferredCanvasFormat();this.context.configure({device:this.device,format:this.format,alphaMode:'opaque'});const code=`struct U{time:f32,aspect:f32,pad:vec2f}; @group(0) @binding(0) var<uniform> u:U; @vertex fn vs(@builtin(vertex_index)i:u32)->@builtin(position) vec4f{var p=array<vec2f,3>(vec2f(-1.,-1.),vec2f(3.,-1.),vec2f(-1.,3.));return vec4f(p[i],0.,1.)} fn h(p:vec2f)->f32{return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453)} fn n(p:vec2f)->f32{let i=floor(p);var f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2f(1,0)),f.x),mix(h(i+vec2f(0,1)),h(i+vec2f(1,1)),f.x),f.y)} @fragment fn fs(@builtin(position) q:vec4f)->@location(0) vec4f{let uv=q.xy/vec2f(f32(${Math.max(1,gpuCanvas.width)}),f32(${Math.max(1,gpuCanvas.height)}));var p=uv*6.;var z=0.;var a=.55;for(var i=0;i<5;i++){z+=n(p+u.time*.03)*a;p*=2.03;a*=.5;}let c=pow(max(0.,sin(uv.x*18.+z*4.+u.time*.2)*sin(uv.y*15.-z*3.-u.time*.16)),2.);var col=mix(vec3f(.003,.018,.026),vec3f(.008,.09,.11),uv.y);col+=vec3f(.02,.16,.15)*z*.45+vec3f(.06,.34,.28)*c*.13;return vec4f(pow(col,vec3f(.88)),1.)}`;const module=this.device.createShaderModule({label:'GLX3 ocean',code});const info=await module.getCompilationInfo();const errors=info.messages.filter(m=>m.type==='error');if(errors.length)throw Error(errors.map(x=>x.message).join('\n'));this.pipeline=this.device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format:this.format}]},primitive:{topology:'triangle-list'}});this.ub=this.device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});this.bg=this.device.createBindGroup({layout:this.pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:this.ub}}]});this.kind='WEBGPU';ui.backend.textContent='WEBGPU'}
 initWebGL2(){const gl=this.canvas.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});if(!gl)throw Error('Neither WebGPU nor WebGL2 is available');this.gl=gl;const vs=`#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;const fs=`#version 300 es\nprecision highp float;in vec2 uv;out vec4 o;uniform float t;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}void main(){vec2 p=uv*6.;float z=0.,a=.55;for(int i=0;i<5;i++){z+=n(p+t*.03)*a;p*=2.03;a*=.5;}float c=pow(max(0.,sin(uv.x*18.+z*4.+t*.2)*sin(uv.y*15.-z*3.-t*.16)),2.);vec3 col=mix(vec3(.003,.018,.026),vec3(.008,.09,.11),uv.y);col+=vec3(.02,.16,.15)*z*.45+vec3(.06,.34,.28)*c*.13;o=vec4(pow(col,vec3(.88)),1.);}`;const comp=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};const pr=gl.createProgram();gl.attachShader(pr,comp(gl.VERTEX_SHADER,vs));gl.attachShader(pr,comp(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));this.program=pr;this.tloc=gl.getUniformLocation(pr,'t');const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);this.kind='WEBGL2';ui.backend.textContent='WEBGL2'}
 resize(){if(this.gl)this.gl.viewport(0,0,this.canvas.width,this.canvas.height);if(this.kind==='WEBGPU'&&this.context)this.context.configure({device:this.device,format:this.format,alphaMode:'opaque'})}
 render(t){this.time=t;if(this.kind==='WEBGPU'){const d=new Float32Array([t,W/H,0,0]);this.device.queue.writeBuffer(this.ub,0,d);const e=this.device.createCommandEncoder(),pass=e.beginRenderPass({colorAttachments:[{view:this.context.getCurrentTexture().createView(),clearValue:{r:.002,g:.01,b:.015,a:1},loadOp:'clear',storeOp:'store'}]});pass.setPipeline(this.pipeline);pass.setBindGroup(0,this.bg);pass.draw(3);pass.end();this.device.queue.submit([e.finish()])}else{const gl=this.gl;gl.useProgram(this.program);gl.uniform1f(this.tloc,t);gl.drawArrays(gl.TRIANGLES,0,3)}}}
let renderer=null;
const OP={END:0,METAB:1,MEMBRANE:2,REPLICATE:3,TRANSPORT:4,REPAIR:5,HEAT_AVOID:6};const CODON={AUG:[OP.METAB,1],UUU:[OP.MEMBRANE,.8],UUC:[OP.MEMBRANE,1.15],GGA:[OP.REPLICATE,.8],GGC:[OP.REPLICATE,1.1],CCA:[OP.TRANSPORT,.8],CCG:[OP.TRANSPORT,1.1],AAA:[OP.REPAIR,.8],AAG:[OP.REPAIR,1.1],ACU:[OP.HEAT_AVOID,.8],ACC:[OP.HEAT_AVOID,1.1],UAA:[OP.END,0],UAG:[OP.END,0],UGA:[OP.END,0]};
function randomBase(){return'AUGC'[Math.floor(rand()*4)]}function randomSeq(n=30){let s='AUG';while(s.length<n)s+=randomBase();return s}function mutate(s,r=.025){return[...s].map(c=>rand()<r?randomBase():c).join('')}
function compileGenome(sequence){const clean=sequence.toUpperCase().replace(/T/g,'U').replace(/[^AUGC]/g,'');const code=[];for(let i=0;i+2<clean.length;i+=3){const c=clean.slice(i,i+3),ins=CODON[c];if(ins){code.push(ins);if(ins[0]===OP.END)break}}if(!code.length)code.push([OP.METAB,.35],[OP.MEMBRANE,.35]);code.push([OP.END,0]);return code}
const molecules=[];const cells=[];let nextCell=1,maxGen=0,selected=null;
function addMolecule(type,x,y,cell=null){const m={type,x,y,vx:rr(-12,12),vy:rr(-12,12),a:rr(0,Math.PI*2),cell,life:1};molecules.push(m);return m}
function seedCell(x,y,seq=randomSeq(),gen=0){const c={id:nextCell++,x,y,vx:rr(-5,5),vy:rr(-5,5),r:rr(30,42),energy:110,maxEnergy:210,membrane:1,age:0,gen,seq,code:compileGenome(seq),ip:0,metab:.25,transport:.2,repair:.2,replicate:.2,lipids:42,nutrients:5,reactions:0,copies:0,mutations:0};cells.push(c);maxGen=Math.max(maxGen,gen);return c}
function execute(c,dt,budget=8){for(let n=0;n<budget;n++){if(c.ip>=c.code.length)c.ip=0;const [op,arg]=c.code[c.ip++];if(op===OP.END){c.ip=0;continue}if(op===OP.METAB)c.metab=Math.max(c.metab,arg);else if(op===OP.MEMBRANE)c.lipids+=arg*dt*.25;else if(op===OP.TRANSPORT)c.transport=Math.max(c.transport,arg);else if(op===OP.REPAIR){c.repair=Math.max(c.repair,arg);if(c.energy>10&&c.membrane<1){c.membrane=Math.min(1,c.membrane+arg*dt*.01);c.energy-=arg*dt*.4}}else if(op===OP.REPLICATE)c.replicate=Math.max(c.replicate,arg);else if(op===OP.HEAT_AVOID){c.vx+=rr(-1,1)*arg*.02;c.vy+=rr(-1,1)*arg*.02}}}
function update(dt){for(const m of molecules){if(m.cell)continue;m.vx+=rr(-1,1)*dt*5;m.vy+=rr(-1,1)*dt*5;m.vx*=.995;m.vy*=.995;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<0||m.x>WORLD.w)m.vx*=-1;if(m.y<0||m.y>WORLD.h)m.vy*=-1;m.x=clamp(m.x,0,WORLD.w);m.y=clamp(m.y,0,WORLD.h)}for(const c of cells){execute(c,dt);c.age+=dt;c.vx+=rr(-1,1)*dt*.3;c.vy+=rr(-1,1)*dt*.3;c.vx*=.995;c.vy*=.995;c.x=clamp(c.x+c.vx*dt,c.r,WORLD.w-c.r);c.y=clamp(c.y+c.vy*dt,c.r,WORLD.h-c.r);let nearest=null,bd=Infinity;for(const m of molecules){if(m.cell||m.type!=='nutrient')continue;const dx=m.x-c.x,dy=m.y-c.y,d=dx*dx+dy*dy;if(d<bd&&d<(c.r+80)*(c.r+80)){bd=d;nearest=m}}if(nearest){const d=Math.sqrt(bd)||1;c.vx+=(nearest.x-c.x)/d*c.transport*.025;c.vy+=(nearest.y-c.y)/d*c.transport*.025;if(d<c.r+8&&rand()<dt*(.4+c.transport)){nearest.cell=c;c.nutrients++;}}if(c.nutrients>0&&rand()<dt*(.06+c.metab*.3)){c.nutrients--;c.energy=Math.min(c.maxEnergy,c.energy+28*(.5+c.metab));c.reactions++;if(rand()<.35)c.lipids++;}c.energy-=dt*(.55+c.r*.008+c.lipids*.0015);c.r=lerp(c.r,24+c.lipids*.32,dt*.08);c.membrane=clamp(c.lipids/(c.r*1.05),0,1);if(c.energy>c.maxEnergy*.72&&c.lipids>c.r*1.3&&rand()<dt*(.002+c.replicate*.008)){const ns=mutate(c.seq,.015+(1-c.repair)*.03),child=seedCell(c.x+rr(-c.r,c.r),c.y+rr(-c.r,c.r),ns,c.gen+1);child.energy=c.energy*.38;c.energy*=.5;c.lipids=Math.floor(c.lipids*.65);c.copies++;c.mutations+=[...ns].filter((v,i)=>v!==c.seq[i]).length;}if(c.energy<=0)c.membrane-=dt*.08}for(let i=cells.length-1;i>=0;i--)if(cells[i].membrane<=0){if(selected===cells[i])selected=null;cells.splice(i,1)}}
const color={nutrient:'#63ff9a',lipid:'#4affda',rna:'#d978ff'};function draw(){ctx.clearRect(0,0,W,H);for(const m of molecules){if(m.cell)continue;const p=w2s(m.x,m.y),r=Math.max(1.2,3*camera.z);ctx.fillStyle=color[m.type]||'#87dfff';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const c of cells){const p=w2s(c.x,c.y),r=c.r*camera.z,g=ctx.createRadialGradient(p.x-r*.3,p.y-r*.3,1,p.x,p.y,r);g.addColorStop(0,'rgba(120,255,220,.22)');g.addColorStop(1,'rgba(10,80,78,.05)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=selected===c?'#fff':`rgba(80,255,220,${.25+.65*c.membrane})`;ctx.lineWidth=selected===c?2:1;ctx.shadowColor='#4affd5';ctx.shadowBlur=8*camera.z;ctx.beginPath();for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,w=Math.sin(a*6+time*1.7+c.id)*1.2*camera.z,x=p.x+Math.cos(a)*(r+w),y=p.y+Math.sin(a)*(r+w);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.shadowBlur=0;const dots=Math.min(64,Math.floor(c.lipids));for(let i=0;i<dots;i++){const a=i/dots*Math.PI*2;ctx.fillStyle='#5effdf';ctx.beginPath();ctx.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,Math.max(1,camera.z*1.7),0,Math.PI*2);ctx.fill()}}
ui.cells.textContent=cells.length;ui.molecules.textContent=molecules.length;ui.generation.textContent=maxGen;if(selected){ui.inspect.style.display='block';ui.iname.textContent='Protocell '+selected.id;ui.isub.textContent='Generation '+selected.gen+' · '+renderer.kind+' genome VM';ui.ebar.style.width=clamp(selected.energy/selected.maxEnergy*100,0,100)+'%';ui.mbar.style.width=clamp(selected.membrane*100,0,100)+'%';ui.idetail.innerHTML=`RNA ${selected.seq}<br>Compiled instructions ${selected.code.length}<br>Metabolism ${selected.metab.toFixed(2)} · Transport ${selected.transport.toFixed(2)} · Repair ${selected.repair.toFixed(2)} · Replication ${selected.replicate.toFixed(2)}<br>Reactions ${selected.reactions} · Copies ${selected.copies} · Mutations ${selected.mutations}`}}
function reset(){rs=0x71e57a11;molecules.length=0;cells.length=0;nextCell=1;maxGen=0;selected=null;ui.inspect.style.display='none';for(let i=0;i<160;i++)addMolecule('nutrient',rr(0,WORLD.w),rr(0,WORLD.h));for(let i=0;i<130;i++)addMolecule('lipid',rr(0,WORLD.w),rr(0,WORLD.h));for(let i=0;i<24;i++)addMolecule('rna',rr(0,WORLD.w),rr(0,WORLD.h));seedCell(WORLD.w*.43,WORLD.h*.5,'AUGUUUGGACCAAAGGCUUAA');seedCell(WORLD.w*.57,WORLD.h*.52,'AUGUUCUGCGGCCCGAAAUAA');seedCell(WORLD.w*.5,WORLD.h*.39,'AUGUUUCCGGGAACUAAGUAA');camera.x=WORLD.w/2;camera.y=WORLD.h/2;camera.z=Math.min(W/WORLD.w,H/WORLD.h)*1.1}
let paused=false,speed=1,time=0,last=performance.now(),acc=0,frames=0,ft=0,fps=60;const STEP=1/60;function frame(now){const raw=Math.min(.06,(now-last)/1000);last=now;frames++;ft+=raw;if(ft>.5){fps=frames/ft;frames=0;ft=0;ui.fps.textContent=Math.round(fps)}if(!paused){acc+=raw*speed;let n=0;while(acc>=STEP&&n<8){update(STEP);time+=STEP;acc-=STEP;n++}if(n===8)acc=0}renderer.render(time);draw();requestAnimationFrame(frame)}
$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};$('#energy').onclick=()=>{for(const c of cells){const dx=c.x-camera.x,dy=c.y-camera.y,d=Math.hypot(dx,dy);if(d<260)c.energy=Math.min(c.maxEnergy,c.energy+(1-d/260)*80)}};$('#organics').onclick=()=>{for(let i=0;i<50;i++)addMolecule('nutrient',camera.x+rr(-300,300),camera.y+rr(-210,210))};$('#lipids').onclick=()=>{for(let i=0;i<40;i++)addMolecule('lipid',camera.x+rr(-260,260),camera.y+rr(-190,190))};$('#rna').onclick=()=>{for(let i=0;i<10;i++)addMolecule('rna',camera.x+rr(-200,200),camera.y+rr(-140,140))};$('#seed').onclick=()=>seedCell(camera.x,camera.y,randomSeq());$('#reset').onclick=reset;$('#speed').onchange=e=>speed=+e.target.value;
const pointers=new Map();let ds=null,cs=null,drag=false,pinch=0,z0=1,lastTap=0;simCanvas.onpointerdown=e=>{simCanvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){ds={x:e.clientX,y:e.clientY};cs={x:camera.x,y:camera.y};drag=false}else if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);z0=camera.z}};simCanvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&ds){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.hypot(dx,dy)>5)drag=true;camera.x=cs.x-dx/camera.z;camera.y=cs.y-dy/camera.z}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.z=clamp(z0*d/Math.max(1,pinch),.18,4)}};simCanvas.onpointerup=e=>{pointers.delete(e.pointerId);if(!drag){const w=s2w(e.clientX,e.clientY);let hit=null,bd=Infinity;for(const c of cells){const dx=w.x-c.x,dy=w.y-c.y,d=dx*dx+dy*dy;if(d<c.r*c.r&&d<bd){hit=c;bd=d}}const n=performance.now();if(n-lastTap<330){for(const c of cells){const dx=c.x-w.x,dy=c.y-w.y,d=Math.hypot(dx,dy);if(d<180)c.energy=Math.min(c.maxEnergy,c.energy+(1-d/180)*60)}}else selected=hit;lastTap=n;if(!hit)ui.inspect.style.display='none'}if(!pointers.size){ds=null;drag=false}};simCanvas.onwheel=e=>{e.preventDefault();const b=s2w(e.clientX,e.clientY);camera.z=clamp(camera.z*Math.exp(-e.deltaY*.0012),.18,4);const a=s2w(e.clientX,e.clientY);camera.x+=b.x-a.x;camera.y+=b.y-a.y};
(async()=>{try{renderer=new GLX3(gpuCanvas);resize();await renderer.init();resize();reset();requestAnimationFrame(frame)}catch(e){fatal(e)}})();
})();
</script>
