class LivingCell{constructor(name,center,scale=1,detail=1){this.name=name;this.center=center.clone();this.scale=scale;this.detail=detail;this.root=new pc.Entity(name);this.root.setPosition(center);app.root.addChild(this.root);this.energy=rr(.62,.9);this.integrity=rr(.78,.96);this.osmotic=rr(.1,.35);this.ph=rr(6.8,7.35);this.atp=rr(400,760);this.nutrient=rr(35,70);this.waste=rr(5,16);this.time=rr(0,100);this.membrane=[];this.organelles=[];this.vesicles=[];this.rna=[];this.fibers=[];this.radius=3.25*scale;this.cyto=primitive('sphere',name+' cytoplasm',materials.cyto,this.root);this.cyto.setLocalScale(this.radius*1.98,this.radius*1.9,this.radius*2.06);this.shell=primitive('sphere',name+' refractive membrane',materials.membrane,this.root);this.shell.setLocalScale(this.radius*2.02,this.radius*1.94,this.radius*2.08);this.buildMembrane();this.buildNucleus();this.buildCytoskeleton();this.buildMitochondria();this.buildRNA();this.buildRibosomes();this.buildVesicles()}

let frames=0,ft=0;app.on('update',dt=>{dt=Math.min(dt,.035);for(const c of cells)c.update(dt);for(const m of free){m.vel.x+=rr(-1,1)*dt*.03;m.vel.y+=rr(-1,1)*dt*.03;m.vel.z+=rr(-1,1)*dt*.03;m.p.add(m.vel.clone().mulScalar(dt));if(Math.abs(m.p.x)>11)m.vel.x*=-1;if(m.p.y<-5||m.p.y>6)m.vel.y*=-1;if(Math.abs(m.p.z)>11)m.vel.z*=-1;m.e.setPosition(m.p);m.vel.mulScalar(.998)}frames++;ft+=dt;if(ft>.5){ui.fps.textContent=Math.round(frames/ft);frames=0;ft=0}ui.cells.textContent=cells.length;ui.mem.textContent=cells.reduce((a,c)=>a+c.membrane.length,0);ui.org.textContent=cells.reduce((a,c)=>a+c.organelles.length+c.vesicles.length+c.rna.length,0);ui.mol.textContent=free.length;if(selected){ui.name.textContent=selected.name;ui.sub.textContent='3D membrane-node + cytosol + organelle simulation';ui.energy.style.width=(selected.energy*100).toFixed(0)+'%';ui.integrity.style.width=(selected.integrity*100).toFixed(0)+'%';ui.detail.innerHTML=`ATP ${selected.atp.toFixed(0)} · nutrients ${selected.nutrient.toFixed(1)} · waste ${selected.waste.toFixed(1)}<br>pH ${selected.ph.toFixed(2)} · osmotic pressure ${selected.osmotic.toFixed(2)}<br>Membrane nodes ${selected.membrane.length} · cytoskeleton fibers ${selected.fibers.length}<br>Mitochondria ${selected.organelles.filter(o=>o.type==='mitochondrion').length} · ribosomes ${selected.organelles.filter(o=>o.type==='ribosome').length}<br>RNA strands ${selected.rna.length} · vesicles ${selected.vesicles.length}`}});
const pointers=new Map();let last={x:0,y:0},pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const dx=e.clientX-last.x,dy=e.clientY-last.y;yaw-=dx*.22;pitch+=dy*.18;last={x:e.clientX,y:e.clientY};updateCamera()}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);distance=clamp(distance*pinch/Math.max(1,d),2.2,32);pinch=d;updateCamera()}});canvas.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(!pointers.size)last={x:0,y:0}});canvas.addEventListener('wheel',e=>{e.preventDefault();distance=clamp(distance*Math.exp(e.deltaY*.001),2.2,32);updateCamera()},{passive:false});$('overview').onclick=()=>{target.set(0,0,-2.3);pan.set(0,0,0);distance=22;pitch=14;yaw=-18;updateCamera()};$('dive').onclick=()=>{target.copy(selected.center);pan.set(0,0,0);distance=5.1;pitch=7;yaw=-25;updateCamera()};$('pulse').onclick=()=>{if(!selected)return;selected.nutrient+=22;selected.energy=clamp(selected.energy+.18,0,1);for(let i=0;i<18;i++){const m=free[Math.floor(rr(0,free.length))];if(m){m.p.copy(selected.center.clone().add(new pc.Vec3(rr(-4,4),rr(-3,3),rr(-4,4))));m.e.setPosition(m.p)}}};$('reset').onclick=()=>{resetWorld();selected=cells[0]};addEventListener('resize',()=>app.resizeCanvas());
}catch(e){fail(e)}
</script>
