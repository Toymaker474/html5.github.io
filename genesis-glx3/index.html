makeBuffers(){const d=this.device;this.globalBuffer=d.createBuffer({size:48,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});this.chemBuffer=d.createBuffer({size:FIELD.n*16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});this.opticalBuffer=d.createBuffer({size:FIELD.n*16,usage:GPUBufferUsage.STORAGE});this.computeParams=d.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});this.cellBuffer=d.createBuffer({size:MAX_GPU_CELLS*16*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});this.molBuffer=d.createBuffer({size:MAX_GPU_MOLS*8*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST})}
async module(label,code){const m=this.device.createShaderModule({label,code}),info=await m.getCompilationInfo(),errors=info.messages.filter(x=>x.type==='error');if(errors.length)throw new Error(label+' WGSL:\n'+errors.map(x=>`${x.lineNum}:${x.linePos} ${x.message}`).join('\n'));return m}
async makePipelines(){const compute=await this.module('GLX4 optical compute',`struct P{dims:vec4u}; @group(0) @binding(0) var<storage,read> chem:array<vec4f>; @group(0) @binding(1) var<storage,read_write> optical:array<vec4f>; @group(0) @binding(2) var<uniform> p:P; @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) gid:vec3u){let i=gid.x;let w=p.dims.x;let h=p.dims.y;if(i>=w*h){return;}let x=i%w;let y=i/w;let il=y*w+max(1u,x)-1u;let ir=y*w+min(w-1u,x+1u);let iu=max(1u,y)*w-w+x;let id=min(h-1u,y+1u)*w+x;let c=chem[i];let s=(c*4.0+chem[il]+chem[ir]+chem[iu]+chem[id])/8.0;let refr=0.018+s.x*.16+s.y*.38;let scatter=clamp(s.x*.28+s.y*.62,0.0,1.0);let thermal=clamp(s.z,0.0,1.0);let emission=clamp(s.w,0.0,1.0);optical[i]=vec4f(refr,scatter,thermal,emission);}`);this.computePipeline=this.device.createComputePipeline({layout:'auto',compute:{module:compute,entryPoint:'main'}});this.computeBind=this.device.createBindGroup({layout:this.computePipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:this.chemBuffer}},{binding:1,resource:{buffer:this.opticalBuffer}},{binding:2,resource:{buffer:this.computeParams}}]});const common=`struct G{camera:vec4f,screen:vec4f,misc:vec4f}; @group(0) @binding(0) var<uniform> g:G; @group(0) @binding(1) var<storage,read> optical:array<vec4f>; fn opticalAt(world:vec2f)->vec4f{let uv=clamp(world/g.screen.zw,vec2f(0.0),vec2f(0.9999));let x=u32(uv.x*128.0);let y=u32(uv.y*80.0);return optical[y*128u+x];} fn h(n:f32)->f32{return fract(sin(n*91.3458)*47453.5453);} `;const dish=await this.module('GLX4 dish',common+`struct O{@builtin(position)pos:vec4f,@location(0)world:vec2f,@location(1)uv:vec2f}; @vertex fn vs(@builtin(vertex_index)i:u32)->O{var q=array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));let p=q[i];var o:O;o.pos=vec4f(p,0,1);o.uv=p*.5+.5;let px=o.uv*g.screen.xy;o.world=g.camera.xy+(px-g.screen.xy*.5)/g.camera.z;return o;} @fragment fn fs(i:O)->@location(0) vec4f{let op=opticalAt(i.world);let dishUV=(i.uv-.5)*vec2f(g.screen.x/g.screen.y,1.0);let dr=length(dishUV);let inside=1.0-smoothstep(.47,.505,dr);let rim=smoothstep(.44,.505,dr)*inside;let micro=sin((i.world.x+i.world.y)*.018+op.x*90.0)+sin(i.world.x*.031-i.world.y*.022+op.z*8.0);let caustic=pow(max(0.0,micro*.5),3.0)*(.08+op.x*.8);var col=mix(vec3f(.004,.012,.016),vec3f(.025,.12,.13),inside);col+=vec3f(.05,.34,.30)*caustic;col+=vec3f(.02,.12,.10)*op.y;col+=vec3f(1.0,.38,.08)*op.z*.045;col+=vec3f(.75,.95,1.0)*rim*.22;col*=1.0-smoothstep(.50,.72,dr)*.55;let mode=i32(g.misc.y);if(mode==1){col+=vec3f(1,.45,.04)*op.w*1.4;}else if(mode==2){col+=vec3f(.05,1,.3)*op.y*.9;}else if(mode==3){col+=mix(vec3f(0,.2,1),vec3f(1,.08,0),op.z)*op.z*.7;}else if(mode==4){col+=vec3f(.1,1,.85)*op.x*1.2;}return vec4f(pow(col,vec3f(.82)),1);}`);this.dishPipeline=this.device.createRenderPipeline({layout:'auto',vertex:{module:dish,entryPoint:'vs'},fragment:{module:dish,entryPoint:'fs',targets:[{format:this.format}]},primitive:{topology:'triangle-list'}});this.dishBind=this.device.createBindGroup({layout:this.dishPipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:this.globalBuffer}},{binding:1,resource:{buffer:this.opticalBuffer}}]});const cell=await this.module('GLX4 cells',common+`@group(0) @binding(2) var<storage,read> data:array<vec4f>; struct O{@builtin(position)pos:vec4f,@location(0)local:vec2f,@location(1)d0:vec4f,@location(2)d1:vec4f,@location(3)d2:vec4f,@location(4)d3:vec4f,@location(5)world:vec2f}; @vertex fn vs(@builtin(vertex_index)v:u32,@builtin(instance_index)n:u32)->O{var q=array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(-1,1),vec2f(1,-1),vec2f(1,1));let l=q[v];let b=n*4u;let d0=data[b];let d1=data[b+1u];let d2=data[b+2u];let d3=data[b+3u];let stress=d1.z;let osm=d2.x;let shape=vec2f(1.0+osm*.06,1.0-stress*.035);let world=d0.xy+l*d0.z*1.22*shape;let px=(world-g.camera.xy)*g.camera.z+g.screen.xy*.5;var o:O;o.pos=vec4f(px.x/g.screen.x*2.0-1.0,1.0-px.y/g.screen.y*2.0,0,1);o.local=l;o.d0=d0;o.d1=d1;o.d2=d2;o.d3=d3;o.world=world;return o;} @fragment fn fs(i:O)->@location(0) vec4f{let r=length(i.local);if(r>1.0){discard;}let z=sqrt(max(0.0,1.0-r*r));let n=normalize(vec3f(i.local.x,-i.local.y,z));let light=normalize(vec3f(-.42,-.58,1.0));let diff=max(.0,dot(n,light));let fres=pow(1.0-z,3.0);let op=opticalAt(i.world);let energy=i.d1.x;let membrane=i.d1.y;let stress=i.d1.z;let ph=i.d1.w;let catalysts=i.d2.y;let rna=i.d2.z;let id=i.d3.w;var base=mix(vec3f(.05,.32,.30),vec3f(.16,.78,.68),energy);base=mix(base,vec3f(.45,.18,.70),clamp(abs(ph-.5)*.75,0.0,.55));base*=.42+.58*diff;let ref=vec3f(.04,.17,.18)+vec3f(.25,.8,.68)*op.y;var col=mix(ref,base,.52+.22*z);for(var k=0u;k<7u;k++){let fk=f32(k);let a=h(id*13.0+fk)*6.283185;let rad=.16+h(id*31.0+fk)*.48;let p=vec2f(cos(a),sin(a))*rad;let sz=.045+h(id*71.0+fk)*.045;let d=length(i.local-p);let presence=select(.25,.9,fk<rna*2.0+catalysts*1.3);let spot=smoothstep(sz,sz*.25,d)*presence;let organ=select(vec3f(.22,1,.8),vec3f(.74,.28,1),k%3u==0u);col=mix(col,organ,spot*.48);}let rim=smoothstep(.78,.98,r);col+=vec3f(.5,1,.92)*rim*(.25+.72*membrane);col+=vec3f(1,.98,.92)*pow(max(0.0,dot(n,normalize(vec3f(-.55,-.7,1.7)))),32.0)*(.25+energy*.75);col+=vec3f(.38,.9,1)*fres*.42;col=mix(col,vec3f(.82,.24,.3),stress*.09);let alpha=clamp(.22+z*.52+rim*.3,0.0,.96);return vec4f(col,alpha);}`);const blend={color:{srcFactor:'src-alpha',dstFactor:'one-minus-src-alpha',operation:'add'},alpha:{srcFactor:'one',dstFactor:'one-minus-src-alpha',operation:'add'}};this.cellPipeline=this.device.createRenderPipeline({layout:'auto',vertex:{module:cell,entryPoint:'vs'},fragment:{module:cell,entryPoint:'fs',targets:[{format:this.format,blend}]},primitive:{topology:'triangle-list'}});this.cellBind=this.device.createBindGroup({layout:this.cellPipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:this.globalBuffer}},{binding:1,resource:{buffer:this.opticalBuffer}},{binding:2,resource:{buffer:this.cellBuffer}}]});const mol=await this.module('GLX4 molecules',common+`@group(0) @binding(2) var<storage,read> data:array<vec4f>; struct O{@builtin(position)pos:vec4f,@location(0)local:vec2f,@location(1)meta:vec4f}; @vertex fn vs(@builtin(vertex_index)v:u32,@builtin(instance_index)n:u32)->O{var q=array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(-1,1),vec2f(1,-1),vec2f(1,1));let l=q[v];let b=n*2u;let a=data[b];let m=data[b+1u];let depth=.78+(a.z+1.0)*.16;let world=a.xy+l*a.w*depth;let px=(world-g.camera.xy)*g.camera.z+g.screen.xy*.5;var o:O;o.pos=vec4f(px.x/g.screen.x*2.0-1.0,1.0-px.y/g.screen.y*2.0,0,1);o.local=l;o.meta=m;return o;} @fragment fn fs(i:O)->@location(0) vec4f{let r=length(i.local);if(r>1.0){discard;}let z=sqrt(max(0.0,1.0-r*r));let t=i32(i.meta.x+.5);var c=vec3f(.45,.85,1);if(t==0){c=vec3f(.35,1,.55);}else if(t==1){c=vec3f(.25,1,.86);}else if(t==2){c=vec3f(.78,.35,1);}else if(t==3){c=vec3f(1,.92,.3);}else if(t==4){c=vec3f(.7,.36,.4);}let spec=pow(z,8.0);return vec4f(c*(.45+.55*z)+vec3f(1)*spec*.55,.38+.5*z);}`);this.molPipeline=this.device.createRenderPipeline({layout:'auto',vertex:{module:mol,entryPoint:'vs'},fragment:{module:mol,entryPoint:'fs',targets:[{format:this.format,blend}]},primitive:{topology:'triangle-list'}});this.molBind=this.device.createBindGroup({layout:this.molPipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:this.globalBuffer}},{binding:1,resource:{buffer:this.opticalBuffer}},{binding:2,resource:{buffer:this.molBuffer}}]})}
resize(){if(this.ready)this.context.configure({device:this.device,format:this.format,alphaMode:'opaque'})}
upload(time,view){this.globalsFloats.set([camera.x,camera.y,camera.z,DPR,W,H,WORLD.w,WORLD.h,time,view,0,0]);this.device.queue.writeBuffer(this.globalBuffer,0,this.globalsFloats);for(let i=0;i<FIELD.n;i++){const o=i*4;this.chemFloats[o]=F.nutrient[i];this.chemFloats[o+1]=F.lipid[i];this.chemFloats[o+2]=F.heat[i];this.chemFloats[o+3]=F.energy[i]}this.device.queue.writeBuffer(this.chemBuffer,0,this.chemFloats);this.device.queue.writeBuffer(this.computeParams,0,new Uint32Array([FIELD.w,FIELD.h,0,0]));const vc=cells.filter(c=>cameraDistance(c.x,c.y)<Math.max(W,H)/camera.z*1.1).sort((a,b)=>(a.z+a.y*.0001)-(b.z+b.y*.0001)).slice(0,MAX_GPU_CELLS);this.cellCount=vc.length;this.cellFloats.fill(0);for(let i=0;i<vc.length;i++){const c=vc[i],o=i*16;this.cellFloats.set([c.x,c.y,c.r,c.z,clamp(c.energy/c.maxEnergy,0,1),clamp(c.membrane,0,1),clamp(c.stress/2.5,0,1),clamp((c.internalPH-4)/6,0,1),clamp(c.osmotic/2,0,1),clamp(c.catalysts/4,0,2),clamp(c.rna/3,0,2),clamp(c.gen/20,0,1),c.vx,c.vy,clamp(c.lipids/(c.r*1.5),0,2),c.id],o)}this.device.queue.writeBuffer(this.cellBuffer,0,this.cellFloats);const vm=molecules.filter(m=>cameraDistance(m.x,m.y)<Math.max(W,H)/camera.z*1.1).sort((a,b)=>a.z-b.z).slice(0,MAX_GPU_MOLS);this.molCount=vm.length;this.molFloats.fill(0);for(let i=0;i<vm.length;i++){const m=vm[i],o=i*8,d=MOL[m.type];this.molFloats.set([m.x,m.y,m.z,d.size*3.0,d.type,m.energy,m.vx,m.vy],o)}this.device.queue.writeBuffer(this.molBuffer,0,this.molFloats)}
render(time,view){this.upload(time,view);const enc=this.device.createCommandEncoder();const cp=enc.beginComputePass();cp.setPipeline(this.computePipeline);cp.setBindGroup(0,this.computeBind);cp.dispatchWorkgroups(Math.ceil(FIELD.n/64));cp.end();const pass=enc.beginRenderPass({colorAttachments:[{view:this.context.getCurrentTexture().createView(),clearValue:{r:.002,g:.006,b:.008,a:1},loadOp:'clear',storeOp:'store'}]});pass.setPipeline(this.dishPipeline);pass.setBindGroup(0,this.dishBind);pass.draw(3);if(this.molCount){pass.setPipeline(this.molPipeline);pass.setBindGroup(0,this.molBind);pass.draw(6,this.molCount)}if(this.cellCount){pass.setPipeline(this.cellPipeline);pass.setBindGroup(0,this.cellBind);pass.draw(6,this.cellCount)}pass.end();this.device.queue.submit([enc.finish()])}}
function fallbackDraw(){fallbackCanvas.style.display='block';gpuCanvas.style.display='none';const g=fctx.createRadialGradient(W*.5,H*.48,10,W*.5,H*.48,Math.max(W,H)*.75);g.addColorStop(0,'#103236');g.addColorStop(.55,'#071b20');g.addColorStop(1,'#010506');fctx.fillStyle=g;fctx.fillRect(0,0,W,H);for(const m of molecules){const p=w2s(m.x,m.y);if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)continue;const c=m.type==='nutrient'?'#68ff9b':m.type==='lipid'?'#4affda':m.type==='rna'?'#d978ff':m.type==='energy'?'#fff06a':'#a27178';fctx.globalAlpha=.6;fctx.fillStyle=c;fctx.beginPath();fctx.arc(p.x,p.y,Math.max(1,MOL[m.type].size*camera.z),0,Math.PI*2);fctx.fill()}fctx.globalAlpha=1;for(const c of cells){const p=w2s(c.x,c.y),r=c.r*camera.z;if(r<1)continue;const ig=fctx.createRadialGradient(p.x-r*.28,p.y-r*.3,2,p.x,p.y,r);ig.addColorStop(0,'rgba(170,255,235,.35)');ig.addColorStop(.5,'rgba(50,210,185,.18)');ig.addColorStop(1,'rgba(10,80,80,.06)');fctx.fillStyle=ig;fctx.beginPath();fctx.arc(p.x,p.y,r,0,Math.PI*2);fctx.fill();fctx.strokeStyle=selected===c?'#fff':`rgba(110,255,230,${.3+.65*c.membrane})`;fctx.lineWidth=1.5;fctx.stroke()}}
function updateUI(){ui.cells.textContent=cells.length;ui.molecules.textContent=molecules.length;ui.generation.textContent=maxGen;ui.fieldmass.textContent=fieldMass().toFixed(1);if(selected){ui.inspect.style.display='block';ui.iname.textContent='Protocell '+selected.id;ui.isub.textContent='Generation '+selected.gen+' · LOD '+selected.lod+' · compiled RNA VM';ui.ebar.style.width=clamp(selected.energy/selected.maxEnergy*100,0,100)+'%';ui.mbar.style.width=clamp(selected.membrane*100,0,100)+'%';ui.idetail.innerHTML=`RNA ${selected.seq}<br>Instructions ${selected.code.length}<br>pH ${selected.internalPH.toFixed(2)} · Osmotic ${selected.osmotic.toFixed(2)} · Stress ${selected.stress.toFixed(2)}<br>Metabolism ${selected.metab.toFixed(2)} · Transport ${selected.transport.toFixed(2)} · Repair ${selected.repair.toFixed(2)} · Replication ${selected.replicate.toFixed(2)}<br>Reactions ${selected.reactions} · Copies ${selected.copies} · Mutations ${selected.mutations}`}}
let paused=false,speed=1,time=0,last=performance.now(),acc=0,frames=0,ft=0,fps=60,view='life';const STEP=1/60;function update(dt){updateFields();updateMolecules(dt);updateCells(dt);abiogenesis(dt);time+=dt}
function frame(now){const raw=Math.min(.06,(now-last)/1000);last=now;frames++;ft+=raw;if(ft>.5){fps=frames/ft;frames=0;ft=0;ui.fps.textContent=Math.round(fps)}if(!paused){acc+=raw*speed;let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++}if(n===8)acc=0}if(renderer?.ready)renderer.render(time,view==='energy'?1:view==='nutrient'?2:view==='heat'?3:view==='lipid'?4:0);else fallbackDraw();updateUI();requestAnimationFrame(frame)}
$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};$('#energy').onclick=()=>{addField(F.energy,camera.x,camera.y,1,7);addField(F.heat,camera.x,camera.y,.5,6);toast('Energy injected into chemistry field')};$('#organics').onclick=()=>{addField(F.nutrient,camera.x,camera.y,2.5,8);for(let i=0;i<50;i++)addMolecule('nutrient',camera.x+rr(-300,300),camera.y+rr(-210,210))};$('#lipids').onclick=()=>{addField(F.lipid,camera.x,camera.y,1.5,7);for(let i=0;i<40;i++)addMolecule('lipid',camera.x+rr(-260,260),camera.y+rr(-180,180))};$('#rna').onclick=()=>{addField(F.rna,camera.x,camera.y,.65,5);for(let i=0;i<10;i++)addMolecule('rna',camera.x+rr(-190,190),camera.y+rr(-130,130))};$('#seed').onclick=()=>newCell(camera.x,camera.y,randomSeq());$('#reset').onclick=reset;$('#speed').onchange=e=>speed=+e.target.value;$('#view').onchange=e=>view=e.target.value;
const pointers=new Map();let ds=null,cs=null,drag=false,pinch=0,z0=1,lastTap=0;inputCanvas.onpointerdown=e=>{inputCanvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){ds={x:e.clientX,y:e.clientY};cs={x:camera.x,y:camera.y};drag=false}else if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);z0=camera.z}};inputCanvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&ds){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.hypot(dx,dy)>5)drag=true;camera.x=cs.x-dx/camera.z;camera.y=cs.y-dy/camera.z}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.z=clamp(z0*d/Math.max(1,pinch),.18,4.5)}};inputCanvas.onpointerup=e=>{pointers.delete(e.pointerId);if(!drag){const w=s2w(e.clientX,e.clientY);let hit=null,bd=Infinity;for(const c of cells){const dx=w.x-c.x,dy=w.y-c.y,d=dx*dx+dy*dy;if(d<c.r*c.r&&d<bd){hit=c;bd=d}}const n=performance.now();if(n-lastTap<330){addField(F.energy,w.x,w.y,.8,5);addField(F.heat,w.x,w.y,.3,4);toast('Local energy pulse')}else selected=hit;lastTap=n;if(!hit)ui.inspect.style.display='none'}if(!pointers.size){ds=null;drag=false}};inputCanvas.onwheel=e=>{e.preventDefault();const b=s2w(e.clientX,e.clientY);camera.z=clamp(camera.z*Math.exp(-e.deltaY*.0012),.18,4.5);const a=s2w(e.clientX,e.clientY);camera.x+=b.x-a.x;camera.y+=b.y-a.y};
(async()=>{try{resize();reset();renderer=new GLX4Renderer(gpuCanvas);try{await renderer.init();gpuCanvas.style.display='block';fallbackCanvas.style.display='none'}catch(e){console.warn('[GLX4] WebGPU failed; CPU2D fallback active',e);ui.backend.textContent='GLX4 / CPU2D';gpuCanvas.style.display='none';fallbackCanvas.style.display='block';toast('WebGPU unavailable — simulation continues in CPU2D')}requestAnimationFrame(frame)}catch(e){fatal(e)}})();
})();
