class GLX3{constructor(){this.kind='CPU2D';this.fieldTexData=new Uint8Array(FIELD.n*4);this.view='life'}async init(){let webgpuError=null,webglError=null;if(navigator.gpu){try{await this.initWebGPU();this.kind='WEBGPU';ui.backend.textContent='WEBGPU';wgCanvas.style.display='block';return}catch(e){webgpuError=e;console.warn('[GLX3] WebGPU unavailable:',e)}}try{this.initWebGL2();this.kind='WEBGL2';ui.backend.textContent='WEBGL2';glCanvas.style.display='block';if(webgpuError)toast('WebGPU rejected; recovered on WebGL2');return}catch(e){webglError=e;console.warn('[GLX3] WebGL2 unavailable:',e)}this.kind='CPU2D';ui.backend.textContent='CPU2D';toast('GPU backends unavailable; simulation continues on CPU');console.warn('[GLX3] GPU fallback summary',webgpuError,webglError)}packFields(){const mode=this.view;for(let i=0;i<FIELD.n;i++){let r=0,g=0,b=0;if(mode==='life'){r=F.energy[i]*80+F.waste[i]*35;g=F.nutrient[i]*130+F.lipid[i]*70;b=F.rna[i]*160+F.heat[i]*45}else if(mode==='energy')r=F.energy[i]*255;else if(mode==='nutrient')g=F.nutrient[i]*255;else if(mode==='heat'){r=F.heat[i]*255;b=(1-F.heat[i])*180}else if(mode==='lipid'){g=F.lipid[i]*210;b=F.lipid[i]*255}else if(mode==='ph'){const ph=clamp(.5+(F.acid[i]-.5)*.7,0,1);r=(1-ph)*220;b=ph*220}this.fieldTexData[i*4]=clamp(r,0,255);this.fieldTexData[i*4+1]=clamp(g,0,255);this.fieldTexData[i*4+2]=clamp(b,0,255);this.fieldTexData[i*4+3]=255}}
async initWebGPU(){const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('No WebGPU adapter');const device=await adapter.requestDevice(),context=wgCanvas.getContext('webgpu');if(!context)throw Error('No WebGPU canvas context');const format=navigator.gpu.getPreferredCanvasFormat();context.configure({device,format,alphaMode:'opaque'});const code=`struct U{resolution:vec2f;time:f32;pad:f32};@group(0)@binding(0)var<uniform>u:U;@group(0)@binding(1)var s:sampler;@group(0)@binding(2)var tex:texture_2d<f32>;@vertex fn vs(@builtin(vertex_index)i:u32)->@builtin(position)vec4f{var p=array<vec2f,3>(vec2f(-1.,-1.),vec2f(3.,-1.),vec2f(-1.,3.));return vec4f(p[i],0.,1.);}@fragment fn fs(@builtin(position)q:vec4f)->@location(0)vec4f{let uv=q.xy/u.resolution;let field=textureSample(tex,s,uv).rgb;let col=vec3f(0.003,0.014,0.022)+vec3f(0.005,0.055,0.07)*uv.y+field*0.78;return vec4f(pow(col,vec3f(0.82)),1.);}`;const module=device.createShaderModule({label:'GLX3 field visualizer',code});if(module.getCompilationInfo){const info=await module.getCompilationInfo(),errs=info.messages.filter(m=>m.type==='error');if(errs.length)throw Error('WGSL: '+errs.map(m=>m.message).join(' | '))}const pipeline=device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}}),uniform=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST}),texture=device.createTexture({size:[FIELD.w,FIELD.h,1],format:'rgba8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST}),sampler=device.createSampler({magFilter:'linear',minFilter:'linear'}),bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:uniform}},{binding:1,resource:sampler},{binding:2,resource:texture.createView()}]});Object.assign(this,{device,context,format,pipeline,uniform,texture,bind})}
initWebGL2(){const gl=glCanvas.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});if(!gl)throw Error('WebGL2 context unavailable');const vs=`#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.0,1.0);}`,fs=`#version 300 es\nprecision highp float;in vec2 uv;out vec4 outColor;uniform sampler2D fieldTex;void main(){vec3 f=texture(fieldTex,uv).rgb;vec3 c=vec3(.003,.014,.022)+vec3(.005,.055,.07)*uv.y+f*.78;outColor=vec4(pow(c,vec3(.82)),1.0);}`;const compile=(type,src)=>{const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){const log=gl.getShaderInfoLog(sh);gl.deleteShader(sh);throw Error('GLSL compile failed: '+log)}return sh},pr=gl.createProgram(),v=compile(gl.VERTEX_SHADER,vs),f=compile(gl.FRAGMENT_SHADER,fs);gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);gl.deleteShader(v);gl.deleteShader(f);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error('GLSL link failed: '+gl.getProgramInfoLog(pr));const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);Object.assign(this,{gl,program:pr,glTexture:tex})}
resize(){if(this.gl)this.gl.viewport(0,0,glCanvas.width,glCanvas.height);if(this.kind==='WEBGPU'&&this.context)this.context.configure({device:this.device,format:this.format,alphaMode:'opaque'})}render(time){this.packFields();if(this.kind==='WEBGPU'){this.device.queue.writeBuffer(this.uniform,0,new Float32Array([wgCanvas.width,wgCanvas.height,time,0]));this.device.queue.writeTexture({texture:this.texture},this.fieldTexData,{bytesPerRow:FIELD.w*4,rowsPerImage:FIELD.h},{width:FIELD.w,height:FIELD.h,depthOrArrayLayers:1});const enc=this.device.createCommandEncoder(),pass=enc.beginRenderPass({colorAttachments:[{view:this.context.getCurrentTexture().createView(),clearValue:{r:.002,g:.008,b:.012,a:1},loadOp:'clear',storeOp:'store'}]});pass.setPipeline(this.pipeline);pass.setBindGroup(0,this.bind);pass.draw(3);pass.end();this.device.queue.submit([enc.finish()])}else if(this.kind==='WEBGL2'){const gl=this.gl;gl.useProgram(this.program);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,this.glTexture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,FIELD.w,FIELD.h,0,gl.RGBA,gl.UNSIGNED_BYTE,this.fieldTexData);gl.drawArrays(gl.TRIANGLES,0,3)}else{ctx.fillStyle='#031018';ctx.fillRect(0,0,W,H)}}}
function drawMolecule(m){if(!visible(m.x,m.y,20))return;const p=w2s(m.x,m.y),r=Math.max(1.2,2.8*camera.z);ctx.fillStyle=MOL[m.type].c;ctx.globalAlpha=.82;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}function cellShapePoint(c,a){const n1=hash01(c.id*13+1)*2-1,n2=hash01(c.id*13+2)*2-1,n3=hash01(c.id*13+3)*2-1,deform=(Math.sin(a*2)*n1+Math.sin(a*3)*n2+Math.cos(a*5)*n3)*c.stress*.07,osm=Math.cos(a)*clamp(c.osmotic*.025,0,.08);return c.r*(1+deform+osm)}function deterministicInside(c,k){const a=hash01(c.id*100003+k*17)*Math.PI*2,r=Math.sqrt(hash01(c.id*200003+k*29))*c.r*.68;return{x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r}}
function drawCell(c){if(!visible(c.x,c.y,c.r*camera.z+40))return;const p=w2s(c.x,c.y),r=c.r*camera.z,chemHue=clamp((c.internalPH-5)/4,0,1),heat=clamp(c.heatDamage,0,1),g=ctx.createRadialGradient(p.x-r*.25,p.y-r*.3,1,p.x,p.y,r);g.addColorStop(0,`rgba(${Math.floor(90+120*heat)},255,${Math.floor(180+60*chemHue)},.24)`);g.addColorStop(1,'rgba(8,70,78,.035)');ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<=56;i++){const a=i/56*Math.PI*2,rad=cellShapePoint(c,a)*camera.z,x=p.x+Math.cos(a)*rad,y=p.y+Math.sin(a)*rad;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();if(c.lod===0&&camera.z>.35){const sampleN=Math.min(42,Math.floor(c.nutrients*5)),sampleL=Math.min(54,Math.floor(c.lipids)),sampleR=Math.min(18,Math.floor(c.rna*6));for(let i=0;i<sampleN;i++){const q=deterministicInside(c,i),s=w2s(q.x,q.y);ctx.fillStyle='#65ff9b';ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(1,1.45*camera.z),0,Math.PI*2);ctx.fill()}for(let i=0;i<sampleR;i++){const q=deterministicInside(c,900+i),s=w2s(q.x,q.y);ctx.fillStyle='#d978ff';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(1,1.7*camera.z),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(let i=0;i<sampleL;i++){const a=i/Math.max(1,sampleL)*Math.PI*2,rad=cellShapePoint(c,a),q=w2s(c.x+Math.cos(a)*rad,c.y+Math.sin(a)*rad);ctx.fillStyle='#5effdf';ctx.beginPath();ctx.arc(q.x,q.y,Math.max(1,1.55*camera.z),0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.strokeStyle=selected===c?'#fff':`rgba(${Math.floor(80+120*heat)},255,220,${.25+.7*c.membrane})`;ctx.lineWidth=selected===c?2:1;ctx.shadowColor='#4affd5';ctx.shadowBlur=8*camera.z;ctx.beginPath();for(let i=0;i<=64;i++){const a=i/64*Math.PI*2,rad=cellShapePoint(c,a)*camera.z,x=p.x+Math.cos(a)*rad,y=p.y+Math.sin(a)*rad;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.shadowBlur=0}
function draw(){ctx.clearRect(0,0,W,H);for(const m of molecules)drawMolecule(m);for(const c of cells)drawCell(c);ui.cells.textContent=cells.length;ui.molecules.textContent=molecules.length;ui.fieldmass.textContent=fieldMass().toFixed(0);ui.generation.textContent=maxGen;if(selected&&cells.includes(selected)){ui.inspect.style.display='block';ui.iname.textContent='Protocell '+selected.id;ui.isub.textContent=`Generation ${selected.gen} · LOD ${selected.lod===0?'molecular':selected.lod===1?'cellular':'numeric'} · ${renderer.kind}`;ui.ebar.style.width=clamp(selected.energy/selected.maxEnergy*100,0,100)+'%';ui.mbar.style.width=clamp(selected.membrane*100,0,100)+'%';ui.idetail.innerHTML=`RNA ${selected.seq}<br>Compiled VM ops ${selected.code.length}<br>Nutrients ${selected.nutrients.toFixed(2)} · Lipids ${selected.lipids.toFixed(1)} · Catalysts ${selected.catalysts.toFixed(2)} · RNA ${selected.rna.toFixed(2)}<br>pH ${selected.internalPH.toFixed(2)} · Osmotic ${selected.osmotic.toFixed(2)} · Stress ${selected.stress.toFixed(2)}<br>Metabolism ${selected.metab.toFixed(2)} · Transport ${selected.transport.toFixed(2)} · Repair ${selected.repair.toFixed(2)} · Replication ${selected.replicate.toFixed(2)}<br>Reactions ${selected.reactions.toFixed(1)} · Copies ${selected.copies} · Mutations ${selected.mutations}`}}
function reset(){rs=0x61c88647;molecules.length=0;cells.length=0;nextCell=1;maxGen=0;selected=null;stepId=0;ui.inspect.style.display='none';for(const k in F)F[k].fill(0);for(let i=0;i<FIELD.n;i++){F.nutrient[i]=rr(.12,.36);F.lipid[i]=rr(.02,.12);F.rna[i]=rr(0,.035);F.energy[i]=rr(.03,.14);F.heat[i]=rr(.25,.48);F.acid[i]=rr(.35,.65)}for(let i=0;i<150;i++)addMolecule('nutrient',rr(0,WORLD.w),rr(0,WORLD.h));for(let i=0;i<90;i++)addMolecule('lipid',rr(0,WORLD.w),rr(0,WORLD.h));for(let i=0;i<18;i++)addMolecule('rna',rr(0,WORLD.w),rr(0,WORLD.h));newCell(WORLD.w*.44,WORLD.h*.49,'AUGUUUGGACCAAAGGCAUGUCAUUGCUAA',0,true);newCell(WORLD.w*.56,WORLD.h*.52,'AUGUUCUGCGGCCCGAAAACCCACUGCUAA',0,true);camera.x=WORLD.w/2;camera.y=WORLD.h/2;camera.z=Math.min(W/WORLD.w,H/WORLD.h)*1.08}
let paused=false,speed=1,time=0,last=performance.now(),acc=0,frames=0,ft=0,fps=60;const STEP=1/60;function frame(now){const raw=Math.min(.07,(now-last)/1000);last=now;frames++;ft+=raw;if(ft>.5){fps=frames/ft;frames=0;ft=0;ui.fps.textContent=Math.round(fps)}if(!paused){acc+=raw*speed;let n=0;while(acc>=STEP&&n<8){step(STEP);time+=STEP;acc-=STEP;n++}if(n===8)acc=0}renderer.render(time);draw();requestAnimationFrame(frame)}
$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};$('#energy').onclick=()=>{addField(F.energy,camera.x,camera.y,1.2,8);addField(F.heat,camera.x,camera.y,.45,7);toast('Energy and heat injected into the simulated field')};$('#organics').onclick=()=>{addField(F.nutrient,camera.x,camera.y,1.4,9);for(let i=0;i<35;i++)addMolecule('nutrient',camera.x+rr(-300,300),camera.y+rr(-210,210))};$('#lipids').onclick=()=>{addField(F.lipid,camera.x,camera.y,1.2,8);for(let i=0;i<30;i++)addMolecule('lipid',camera.x+rr(-270,270),camera.y+rr(-190,190))};$('#rna').onclick=()=>{addField(F.rna,camera.x,camera.y,.8,6);for(let i=0;i<8;i++)addMolecule('rna',camera.x+rr(-190,190),camera.y+rr(-135,135))};$('#seed').onclick=()=>{newCell(camera.x,camera.y,randomSeq(36),0,true);toast('Manual protocell seeded; chemistry remains simulated from here')};$('#reset').onclick=reset;$('#speed').onchange=e=>speed=+e.target.value;$('#view').onchange=e=>renderer.view=e.target.value;
const pointers=new Map();let ds=null,cs=null,drag=false,pinch=0,z0=1,lastTap=0;simCanvas.onpointerdown=e=>{simCanvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){ds={x:e.clientX,y:e.clientY};cs={x:camera.x,y:camera.y};drag=false}else if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);z0=camera.z}};simCanvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&ds){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.hypot(dx,dy)>5)drag=true;camera.x=clamp(cs.x-dx/camera.z,0,WORLD.w);camera.y=clamp(cs.y-dy/camera.z,0,WORLD.h)}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.z=clamp(z0*d/Math.max(1,pinch),.16,4)}};simCanvas.onpointerup=e=>{pointers.delete(e.pointerId);if(!drag){const w=s2w(e.clientX,e.clientY);let hit=null,bd=Infinity;for(const c of cells){const dx=w.x-c.x,dy=w.y-c.y,d=dx*dx+dy*dy;if(d<c.r*c.r&&d<bd){hit=c;bd=d}}const n=performance.now();if(n-lastTap<330){addField(F.energy,w.x,w.y,.8,5);addField(F.heat,w.x,w.y,.28,4);toast('Local energy pulse simulated')}else selected=hit;lastTap=n;if(!hit)ui.inspect.style.display='none'}if(!pointers.size){ds=null;drag=false}};simCanvas.onpointercancel=e=>pointers.delete(e.pointerId);simCanvas.onwheel=e=>{e.preventDefault();const b=s2w(e.clientX,e.clientY);camera.z=clamp(camera.z*Math.exp(-e.deltaY*.0012),.16,4);const a=s2w(e.clientX,e.clientY);camera.x+=b.x-a.x;camera.y+=b.y-a.y};
(async()=>{try{resize();renderer=new GLX3();await renderer.init();resize();reset();requestAnimationFrame(frame)}catch(e){fatal(e)}})();
})();
