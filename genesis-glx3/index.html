<style>

</div>

(()=>{'use strict';
const $=s=>document.querySelector(s),bgCanvas=$('#bg'),simCanvas=$('#sim'),ctx=simCanvas.getContext('2d',{alpha:true,desynchronized:true}),bctx=bgCanvas.getContext('2d',{alpha:false,desynchronized:true});

addEventListener('error',e=>console.error('[GLX3]',e.error||e.message));addEventListener('unhandledrejection',e=>console.error('[GLX3 promise]',e.reason));

const molecules=[],MOL={nutrient:{c:'#70ffa2',field:F.nutrient,mass:.12,size:2.8},lipid:{c:'#56ffe0',field:F.lipid,mass:.09,size:2.4},rna:{c:'#d98cff',field:F.rna,mass:.07,size:3.1},energy:{c:'#fff18a',field:F.energy,mass:.05,size:2.2},waste:{c:'#b47a86',field:F.waste,mass:.08,size:2.4}};

function materializeFromField(field,type,maxCount=3){const viewR=Math.max(W,H)/camera.z*.65;for(let k=0;k<maxCount;k++){const x=clamp(camera.x+rr(-viewR,viewR),0,WORLD.w),y=clamp(camera.y+rr(-viewR*.65,viewR*.65),0,WORLD.h),idx=fi(x,y),need=MOL[type].mass;if(field[idx]>need*1.4){field[idx]-=need;addMolecule(type,x,y)}}}

const OP={END:0,METAB:1,MEMBRANE:2,REPLICATE:3,TRANSPORT:4,REPAIR:5,HEAT:6,PH:7,WASTE:8},CODON={AUG:[OP.METAB,1],UUU:[OP.MEMBRANE,.75],UUC:[OP.MEMBRANE,1.15],GGA:[OP.REPLICATE,.8],GGC:[OP.REPLICATE,1.15],CCA:[OP.TRANSPORT,.8],CCG:[OP.TRANSPORT,1.15],AAA:[OP.REPAIR,.8],AAG:[OP.REPAIR,1.15],ACU:[OP.HEAT,.8],ACC:[OP.HEAT,1.15],CAU:[OP.PH,.8],CAC:[OP.PH,1.15],UGC:[OP.WASTE,.8],UGU:[OP.WASTE,1.15],UAA:[OP.END,0],UAG:[OP.END,0],UGA:[OP.END,0]};

const cells=[];let nextCell=1,maxGen=0,selected=null,stepId=0;
function newCell(x,y,seq=randomSeq(),gen=0,initial=true){const code=compileGenome(seq),c={id:nextCell++,x,y,z:rr(-.5,.5),vx:rr(-4,4),vy:rr(-4,4),r:rr(28,39),energy:rr(75,120),maxEnergy:220,membrane:.82,age:0,gen,seq,code,ip:0,lipids:initial?rr(38,55):26,nutrients:initial?rr(4,8):2,catalysts:initial?rr(1.2,2.7):1,rna:1,waste:0,internalPH:7,heatDamage:0,osmotic:0,stress:0,metab:.22,transport:.18,repair:.18,replicate:.15,heatTol:.2,phTol:.2,wasteEff:.2,reactions:0,copies:0,mutations:0,lod:2};cells.push(c);maxGen=Math.max(maxGen,gen);return c}

let view='life',time=0;
function renderDish(){const g=bctx.createRadialGradient(W*.5,H*.48,10,W*.5,H*.48,Math.max(W,H)*.78);g.addColorStop(0,'#0b2628');g.addColorStop(.46,'#071b20');g.addColorStop(.82,'#041116');g.addColorStop(1,'#010608');bctx.fillStyle=g;bctx.fillRect(0,0,W,H);const dishR=Math.min(W,H)*.49,dg=bctx.createRadialGradient(W*.5-dishR*.28,H*.46-dishR*.28,dishR*.08,W*.5,H*.5,dishR);dg.addColorStop(0,'rgba(180,255,246,.08)');dg.addColorStop(.72,'rgba(80,190,190,.025)');dg.addColorStop(.92,'rgba(220,255,255,.045)');dg.addColorStop(1,'rgba(0,0,0,.28)');bctx.fillStyle=dg;bctx.beginPath();bctx.arc(W*.5,H*.5,dishR,0,Math.PI*2);bctx.fill();bctx.strokeStyle='rgba(210,255,255,.16)';bctx.lineWidth=2;bctx.stroke();bctx.save();bctx.globalCompositeOperation='screen';for(let i=0;i<18;i++){const a=i*2.399+time*.015,r=dishR*(.18+.72*((i*37)%17)/17),x=W*.5+Math.cos(a)*r,y=H*.5+Math.sin(a)*r*.75,rg=bctx.createRadialGradient(x,y,0,x,y,18+((i*13)%30));rg.addColorStop(0,'rgba(140,255,240,.045)');rg.addColorStop(1,'rgba(0,0,0,0)');bctx.fillStyle=rg;bctx.fillRect(x-60,y-60,120,120)}bctx.restore()}
function fieldTint(){if(view==='life')return;ctx.save();ctx.globalCompositeOperation='screen';const sx=W/FIELD.w,sy=H/FIELD.h;for(let gy=0;gy<FIELD.h;gy+=2)for(let gx=0;gx<FIELD.w;gx+=2){const idx=gy*FIELD.w+gx,v=view==='energy'?F.energy[idx]:view==='nutrient'?F.nutrient[idx]:view==='heat'?F.heat[idx]:view==='lipid'?F.lipid[idx]:Math.abs(F.acid[idx]-.5);if(v<.03)continue;const a=clamp(v*.16,0,.16);ctx.fillStyle=view==='energy'?`rgba(255,190,80,${a})`:view==='nutrient'?`rgba(80,255,130,${a})`:view==='heat'?`rgba(255,80,70,${a})`:view==='lipid'?`rgba(80,255,225,${a})`:`rgba(150,90,255,${a})`;ctx.fillRect(gx*sx,gy*sy,sx*2,sy*2)}ctx.restore()}
function drawMolecule(m){const p=w2s(m.x,m.y);if(p.x<-30||p.x>W+30||p.y<-30||p.y>H+30)return;const depth=.72+(m.z+1)*.18,r=Math.max(.9,MOL[m.type].size*camera.z*depth);ctx.save();ctx.globalAlpha=.55+depth*.25;ctx.shadowColor=MOL[m.type].c;ctx.shadowBlur=5*camera.z*depth;ctx.fillStyle=MOL[m.type].c;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(p.x-r*.3,p.y-r*.35,Math.max(.6,r*.28),0,Math.PI*2);ctx.fill();ctx.restore()}
function drawCell(c){const p=w2s(c.x,c.y),zdepth=.9+c.z*.08,r=c.r*camera.z*zdepth;if(r<1)return;const stress=clamp(c.stress/2.5,0,1),phShift=clamp((c.internalPH-7)/3,-1,1),energy=clamp(c.energy/c.maxEnergy,0,1),wobble=1+c.osmotic*.05;ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,0.92);ctx.globalAlpha=.32;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(r*.08,r*.32,r*1.05,r*.38,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(p.x,p.y);ctx.beginPath();for(let i=0;i<=72;i++){const a=i/72*Math.PI*2,n=Math.sin(a*5+c.id*.9)*stress*r*.028 + Math.sin(a*11+c.id)*c.osmotic*r*.012,rrr=r*wobble+n,x=Math.cos(a)*rrr,y=Math.sin(a)*rrr*.96;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();const inner=ctx.createRadialGradient(-r*.32,-r*.36,r*.06,0,0,r*1.08);inner.addColorStop(0,`rgba(${145+Math.max(0,phShift)*45},255,235,.28)`);inner.addColorStop(.35,`rgba(70,210,190,${.11+energy*.12})`);inner.addColorStop(.76,'rgba(25,100,100,.08)');inner.addColorStop(1,'rgba(0,30,35,.02)');ctx.fillStyle=inner;ctx.fill();ctx.save();ctx.clip();const organelles=Math.min(16,4+Math.floor(c.catalysts*3+c.rna*2));for(let i=0;i<organelles;i++){const a=i*2.399+c.id*.73,rrr=r*(.18+.55*((i*31)%11)/11),ox=Math.cos(a)*rrr,oy=Math.sin(a)*rrr*.75,or=Math.max(1.2,r*(.035+.018*((i*7)%5)));ctx.shadowBlur=6;ctx.shadowColor=i%3===0?'#d889ff':'#7ffff0';ctx.fillStyle=i%3===0?'rgba(216,137,255,.55)':'rgba(120,255,235,.38)';ctx.beginPath();ctx.ellipse(ox,oy,or*1.25,or*.8,a*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(ox-or*.25,oy-or*.22,Math.max(.5,or*.24),0,Math.PI*2);ctx.fill()}ctx.restore();ctx.lineWidth=Math.max(1.1,camera.z*1.5);ctx.strokeStyle=selected===c?'rgba(255,255,255,.95)':`rgba(135,255,235,${.45+.45*c.membrane})`;ctx.shadowColor=selected===c?'#fff':'#65ffe0';ctx.shadowBlur=10+energy*12;ctx.stroke();ctx.globalCompositeOperation='screen';const hi=ctx.createLinearGradient(-r,-r,r,r);hi.addColorStop(0,'rgba(255,255,255,.38)');hi.addColorStop(.25,'rgba(255,255,255,.07)');hi.addColorStop(.6,'rgba(255,255,255,0)');ctx.strokeStyle=hi;ctx.lineWidth=Math.max(1.2,r*.045);ctx.beginPath();ctx.arc(-r*.05,-r*.08,r*.78,3.72,5.32);ctx.stroke();ctx.globalCompositeOperation='source-over';const dots=Math.min(72,Math.floor(c.lipids));for(let i=0;i<dots;i+=2){const a=i/dots*Math.PI*2,rrr=r*(1+.012*Math.sin(i+c.id));ctx.fillStyle='rgba(120,255,235,.7)';ctx.beginPath();ctx.arc(Math.cos(a)*rrr,Math.sin(a)*rrr*.96,Math.max(.65,camera.z*1.25),0,Math.PI*2);ctx.fill()}ctx.restore()}
function draw(){renderDish();ctx.clearRect(0,0,W,H);fieldTint();for(const m of molecules)drawMolecule(m);const sorted=[...cells].sort((a,b)=>(a.y+a.z*20)-(b.y+b.z*20));for(const c of sorted)drawCell(c);ui.cells.textContent=cells.length;ui.molecules.textContent=molecules.length;ui.generation.textContent=maxGen;ui.fieldmass.textContent=fieldMass().toFixed(1);if(selected){ui.inspect.style.display='block';ui.iname.textContent='Protocell '+selected.id;ui.isub.textContent='Generation '+selected.gen+' · LOD '+selected.lod+' · compiled genome VM';ui.ebar.style.width=clamp(selected.energy/selected.maxEnergy*100,0,100)+'%';ui.mbar.style.width=clamp(selected.membrane*100,0,100)+'%';ui.idetail.innerHTML=`RNA ${selected.seq}<br>Instructions ${selected.code.length}<br>pH ${selected.internalPH.toFixed(2)} · Osmotic ${selected.osmotic.toFixed(2)} · Stress ${selected.stress.toFixed(2)}<br>Metabolism ${selected.metab.toFixed(2)} · Transport ${selected.transport.toFixed(2)} · Repair ${selected.repair.toFixed(2)} · Replication ${selected.replicate.toFixed(2)}<br>Reactions ${selected.reactions} · Copies ${selected.copies} · Mutations ${selected.mutations}`}}
let paused=false,speed=1,last=performance.now(),acc=0,frames=0,ft=0,fps=60;const STEP=1/60;
function update(dt){updateFields();updateMolecules(dt);updateCells(dt);abiogenesis(dt);time+=dt}
function frame(now){const raw=Math.min(.06,(now-last)/1000);last=now;frames++;ft+=raw;if(ft>.5){fps=frames/ft;frames=0;ft=0;ui.fps.textContent=Math.round(fps)}if(!paused){acc+=raw*speed;let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++}if(n===8)acc=0}draw();requestAnimationFrame(frame)}
$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};$('#energy').onclick=()=>{addField(F.energy,camera.x,camera.y,1,7);addField(F.heat,camera.x,camera.y,.5,6);toast('Energy injected into field')};$('#organics').onclick=()=>{addField(F.nutrient,camera.x,camera.y,2.5,8);for(let i=0;i<40;i++)addMolecule('nutrient',camera.x+rr(-280,280),camera.y+rr(-190,190))};$('#lipids').onclick=()=>{addField(F.lipid,camera.x,camera.y,1.4,7);for(let i=0;i<32;i++)addMolecule('lipid',camera.x+rr(-240,240),camera.y+rr(-170,170))};$('#rna').onclick=()=>{addField(F.rna,camera.x,camera.y,.6,5);for(let i=0;i<8;i++)addMolecule('rna',camera.x+rr(-180,180),camera.y+rr(-120,120))};$('#seed').onclick=()=>newCell(camera.x,camera.y,randomSeq());$('#reset').onclick=reset;$('#speed').onchange=e=>speed=+e.target.value;$('#view').onchange=e=>view=e.target.value;
const pointers=new Map();let ds=null,cs=null,drag=false,pinch=0,z0=1,lastTap=0;
simCanvas.onpointerdown=e=>{simCanvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){ds={x:e.clientX,y:e.clientY};cs={x:camera.x,y:camera.y};drag=false}else if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);z0=camera.z}};
simCanvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&ds){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.hypot(dx,dy)>5)drag=true;camera.x=cs.x-dx/camera.z;camera.y=cs.y-dy/camera.z}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);camera.z=clamp(z0*d/Math.max(1,pinch),.18,4)}};
simCanvas.onpointerup=e=>{pointers.delete(e.pointerId);if(!drag){const w=s2w(e.clientX,e.clientY);let hit=null,bd=Infinity;for(const c of cells){const dx=w.x-c.x,dy=w.y-c.y,d=dx*dx+dy*dy;if(d<c.r*c.r&&d<bd){hit=c;bd=d}}const n=performance.now();if(n-lastTap<330){addField(F.energy,w.x,w.y,.8,5);addField(F.heat,w.x,w.y,.3,4);toast('Local energy pulse')}else selected=hit;lastTap=n;if(!hit)ui.inspect.style.display='none'}if(!pointers.size){ds=null;drag=false}};
simCanvas.onwheel=e=>{e.preventDefault();const b=s2w(e.clientX,e.clientY);camera.z=clamp(camera.z*Math.exp(-e.deltaY*.0012),.18,4);const a=s2w(e.clientX,e.clientY);camera.x+=b.x-a.x;camera.y+=b.y-a.y};
try{resize();reset();ui.backend.textContent='GLX3 CPU+2.5D';requestAnimationFrame(frame)}catch(e){fatal(e)}
})();
