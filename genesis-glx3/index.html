function drawCell(c){const path=cellPath(c),p=w2s(c.x,c.y),r=c.r*cam.z;ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=24*cam.z;ctx.shadowOffsetY=12*cam.z;ctx.fillStyle='rgba(0,0,0,.22)';ctx.translate(0,10*cam.z);ctx.fill(path);ctx.restore();ctx.save();ctx.clip(path);const g=ctx.createRadialGradient(p.x-r*.32,p.y-r*.38,r*.05,p.x,p.y,r*1.05);g.addColorStop(0,`rgba(${150+Math.floor(c.energy/c.maxEnergy*70)},255,235,.28)`);g.addColorStop(.35,'rgba(74,190,170,.18)');g.addColorStop(.72,`rgba(${80+Math.floor(c.stress*110)},130,145,.13)`);g.addColorStop(1,'rgba(5,30,34,.09)');ctx.fillStyle=g;ctx.fillRect(p.x-r*1.2,p.y-r*1.2,r*2.4,r*2.4);for(const b of c.bodies.sort((a,b)=>a.z-b.z)){const q=w2s(b.x,b.y,b.z),sz=(b.type==='rna'?9:b.type==='catalyst'?11:b.type==='vesicle'?14:7)*cam.z*(1+b.z/(c.r*2));const col=b.type==='rna'?['#f1c2ff','#8c3eb8']:b.type==='catalyst'?['#ffdeb0','#a55b23']:b.type==='vesicle'?['#baf5e8','#378e83']:['#e9f4ff','#5a7789'];const og=ctx.createRadialGradient(q.x-sz*.3,q.y-sz*.35,1,q.x,q.y,sz);og.addColorStop(0,col[0]);og.addColorStop(.35,col[1]);og.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=og;ctx.globalAlpha=.45+.35*(b.z/c.r+.5);ctx.beginPath();ctx.ellipse(q.x,q.y,sz,sz*(.55+.25*Math.sin(b.phase)),b.phase*.1,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(let i=0;i<Math.min(90,c.nutrients*5);i++){const a=i*2.399+c.id,d=Math.sqrt(((i*37)%97)/97)*r*.58;ctx.fillStyle='rgba(146,255,164,.35)';ctx.beginPath();ctx.arc(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d*.74,Math.max(.7,1.8*cam.z),0,6.28);ctx.fill()}ctx.restore();ctx.save();ctx.strokeStyle=selected===c?'rgba(255,255,255,.95)':`rgba(${110+Math.floor(c.integrity*80)},255,235,${.42+.5*c.integrity})`;ctx.lineWidth=Math.max(1.1,2.1*cam.z);ctx.shadowColor='rgba(150,255,240,.9)';ctx.shadowBlur=10*cam.z;ctx.stroke(path);ctx.globalCompositeOperation='screen';ctx.strokeStyle='rgba(255,255,255,.32)';ctx.lineWidth=Math.max(.8,1.1*cam.z);ctx.translate(-2*cam.z,-3*cam.z);ctx.stroke(path);ctx.restore();for(let i function draw(){ctx.clearRect(0,0,W,H);for(const m of free.sort((a,b)=>a.z-b.z)){const p=w2s(m.x,m.y,m.z),sz=(m.type==='lipid'?3.6:m.type==='rna'?3.3:2.8)*cam.z*(1+m.z/120);if(p.x<-20||p.y<-20||p.x>W+20||p.y>H+20)continue;const c=TCOL[m.type]||['#fff','#777'],g=ctx.createRadialGradient(p.x-sz*.3,p.y-sz*.3,.3,p.x,p.y,sz*2.2);g.addColorStop(0,c[0]);g.addColorStop(.35,c[1]);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.globalAlpha=.45+.35*(m.z+40)/80;ctx.beginPath();ctx.arc(p.x,p.y,sz*2.2,0,6.28);ctx.fill()}ctx.globalAlpha=1;for(const c of [...cells].sort((a,b)=>a.y-b.y))drawCell(c);ui.cells.textContent=cells.length;ui.nodes.textContent=cells.reduce((s,c)=>s+c.nodes.length,0);ui.inside.textContent=cells.reduce((s,c)=>s+c.bodies.length,0);ui.gen.textContent=maxGen;if(selected){ui.inspect.style.display='block';ui.iname.textContent='Cell '+selected.id;ui.isub.textContent='Generation '+selected.gen+' · deformable membrane / cytosol chemistry';ui.ebar.style.width=clamp(selected.energy/selected.maxEnergy*100,0,100)+'%';ui.mbar.style.width=clamp(selected.integrity*100,0,100)+'%';ui.detail.innerHTML=`Membrane nodes ${selected.nodes.length} · Interior bodies ${selected.bodies.length}<br>Lipids ${selected.lipid.toFixed(1)} · RNA ${selected.rna.toFixed(1)} · Catalysts ${selected.catalyst.toFixed(1)}<br>Nutrients ${selected.nutrients.toFixed(1)} · Waste ${selected.waste.toFixed(1)} · pH ${selected.ph.toFixed(2)}<br>Osmotic pressure ${selected.osmotic.toFixed(3)} · Stress ${(selected.stress*100).toFixed(0)}%<br>Reactions ${selected.reactions} · Mutations ${selected.mutations}`}}
function reset(){rs=0x91e10da5;free.length=0;cells.length=0;nextId=1;maxGen=0;selected=null;ui.inspect.style.display='none';for(let i=0;i<300;i++)addFree(i%5===0?'lipid':i%13===0?'rna':'nutrient',rr(0,WORLD.w),rr(0,WORLD.h),rr(-35,35));makeCell(WORLD.w*.44,WORLD.h*.50);makeCell(WORLD.w*.56,WORLD.h*.52);makeCell(WORLD.w*.50,WORLD.h*.38);cam.x=WORLD.w/2;cam.y=WORLD.h/2;cam.z=Math.min(W/WORLD.w,H/WORLD.h)*1.18}
let paused=false,speed=1,t=0,last=performance.now(),acc=0,frames=0,ft=0,fps=60;const STEP=1/60;function frame(now){const raw=Math.min(.05,(now-last)/1000);last=now;frames++;ft+=raw;if(ft>.5){fps=frames/ft;frames=0;ft=0;ui.fps.textContent=Math.round(fps)}if(!paused){acc+=raw*speed;let n=0;while(acc>=STEP&&n<6){update(STEP);t+=STEP;acc-=STEP;n++}if(n===6)acc=0}renderer.render(t);draw();requestAnimationFrame(frame)}
$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};$('#feed').onclick=()=>{for(let i=0;i<70;i++)addFree(i%7===0?'lipid':'nutrient',cam.x+rr(-340,340),cam.y+rr(-220,220),rr(-30,30))};$('#energy').onclick=()=>{for(const c of cells){const d=Math.hypot(c.x-cam.x,c.y-cam.y);if(d<300)c.energy=Math.min(c.maxEnergy,c.energy+(1-d/300)*110)}};$('#seed').onclick=()=>makeCell(cam.x,cam.y,0);$('#reset').onclick=reset;$('#speed').onchange=e=>speed=+e.target.value;
const pts=new Map();let ds=null,cs=null,drag=false,pinch=0,z0=1;sim.onpointerdown=e=>{sim.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){ds={x:e.clientX,y:e.clientY};cs={x:cam.x,y:cam.y};drag=false}else if(pts.size===2){const p=[...pts.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);z0=cam.z}};sim.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&ds){const dx=e.clientX-ds.x,dy=e.clientY-ds.y;if(Math.hypot(dx,dy)>5)drag=true;cam.x=cs.x-dx/cam.z;cam.y=cs.y-dy/cam.z}else if(pts.size===2){const p=[...pts.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);cam.z=clamp(z0*d/Math.max(1,pinch),.14,4)}};sim.onpointerup=e=>{pts.delete(e.pointerId);if(!drag){const w=s2w(e.clientX,e.clientY);let hit=null,bd=Infinity;for(const c of cells){const d=(w.x-c.x)**2+(w.y-c.y)**2;if(d<c.r*c.r&&d<bd){hit=c;bd=d}}selected=hit;if(!hit)ui.inspect.style.display='none'}if(!pts.size){ds=null;drag=false}};sim.onwheel=e=>{e.preventDefault();const b=s2w(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*.0012),.14,4);const a=s2w(e.clientX,e.clientY);cam.x+=b.x-a.x;cam.y+=b.y-a.y};
(async()=>{try{renderer=new Renderer(gpu);resize();await renderer.init();resize();reset();requestAnimationFrame(frame)}catch(e){fatal(e)}})();
})();
