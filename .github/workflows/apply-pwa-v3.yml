name: Apply God Genic PWA v3

on:
  push:
    branches: [pwa-god-genic-v3]
    paths:
      - '.github/workflows/apply-pwa-v3.yml'
      - 'sandbox-god-genic/src/upgrade-v3.js'
      - 'sandbox-god-genic/src/bootstrap-v3.js'
      - 'sandbox-god-genic/upgrade-v3.css'
      - 'sandbox-god-genic/sw.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pwa-god-genic-v3

      - name: Finalize PWA v3 shell and routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js=Path('sandbox-god-genic/src/upgrade-v3.js')
          s=js.read_text()
          s=s.replace(
            "document.getElementById('worldCanvas')?.addEventListener('pointerdown',e=>{const r=window.__godRenderer;if(!r)return;",
            "document.getElementById('worldCanvas')?.addEventListener('pointerdown',e=>{e.stopImmediatePropagation();const r=window.__godRenderer;if(!r)return;",
            1
          )
          old="cast(state.power,x,y)});document.querySelectorAll('[data-v3star]')"
          if old in s:
            s=s.replace(old,"cast(state.power,x,y)},{capture:true});const feedbackBtn=document.querySelector('.dock button[data-view=\"feedback\"]');if(feedbackBtn)feedbackBtn.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-feedback'));document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b===feedbackBtn));document.querySelector('.dashboard')?.scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('[data-v3star]')",1)
          js.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('manifest.webmanifest?v=1','manifest.webmanifest?v=3')
          s=s.replace('icon.svg?v=1','icon.svg?v=3')
          s=s.replace('./sandbox-god-genic/styles.css?v=1','./sandbox-god-genic/styles.css?v=3')
          if 'upgrade-v3.css?v=3' not in s:
            s=s.replace('<link rel="stylesheet" href="./sandbox-god-genic/styles.css?v=3">','<link rel="stylesheet" href="./sandbox-god-genic/styles.css?v=3"><link rel="stylesheet" href="./sandbox-god-genic/upgrade-v3.css?v=3">')
          s=s.replace('LOCAL EVOLUTION ENGINE · BUILD 0.1','PLAYABLE EMERGENCE ENGINE · BUILD 0.3')
          s=s.replace('./sandbox-god-genic/src/main.js?v=1','./sandbox-god-genic/src/bootstrap-v3.js?v=3')
          s=s.replace('hourly teacher agent','two-hour adaptive teacher agent')
          p.write_text(s)

          mpath=Path('manifest.webmanifest')
          m=json.loads(mpath.read_text())
          m['name']='Sandbox God Genic: Emergence Game'
          m['description']='A free playable evolution world with tiny neural creatures, god powers, emergent species, and a two-hour adaptive teacher.'
          m['start_url']='./?v=3'
          m['icons'][0]['src']='icon.svg?v=3'
          mpath.write_text(json.dumps(m,indent=2)+'\n')
          PY

      - name: Validate gameplay and caching
        run: |
          node --check sandbox-god-genic/src/upgrade-v3.js
          node --check sandbox-god-genic/src/bootstrap-v3.js
          node --check sandbox-god-genic/sw.js
          node --check sw.js
          grep -q 'capture:true' sandbox-god-genic/src/upgrade-v3.js
          grep -q 'data-view="feedback"' sandbox-god-genic/src/upgrade-v3.js
          grep -q 'PLAYABLE EMERGENCE ENGINE · BUILD 0.3' index.html
          grep -q 'manifest.webmanifest?v=3' index.html
          grep -q 'bootstrap-v3.js?v=3' index.html
          grep -q "sandbox-god-genic-v3" sandbox-god-genic/sw.js

      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.webmanifest sandbox-god-genic/src/upgrade-v3.js
          git diff --cached --quiet || git commit -m 'Finalize free playable God Genic PWA v3'
          git push origin HEAD:pwa-god-genic-v3
