name: GENESIS Foundation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and clean-room checks
        run: |
          set -euo pipefail
          test -f index.html
          test -f forge/index.html
          test -f forge/forge.js
          test -f forge/audit-core.js
          test -f project/state.json
          python -m json.tool project/state.json >/dev/null
          node --check forge/audit-core.js
          node --check forge/forge.js
          ! grep -R -E "living-bodies|pennyspawn|voin|genesis-glx3|fracture-wilds|nexus-glass-science-cube" --exclude-dir=.git .
      - name: Execute shared FORGE foundation audit
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const audit=require('./forge/audit-core.js');
          const state=JSON.parse(fs.readFileSync('project/state.json','utf8'));
          const files={};
          for(const p of audit.REQUIRED) files[p]=fs.existsSync(path.resolve(p));
          const input={state,files};
          const result=audit.audit(input);
          audit.receipt(result,{environment:`github-actions node ${process.version}`,source:process.env.GITHUB_SHA||'unknown'})
            .then(receipt=>{
              fs.writeFileSync('foundation-receipt.json',JSON.stringify(receipt,null,2)+'\n');
              console.log(JSON.stringify(receipt,null,2));
              if(receipt.status!=='PASS') process.exit(1);
            }).catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Execute controlled fail-closed recovery drill
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const audit=require('./forge/audit-core.js');
          const state=JSON.parse(fs.readFileSync('project/state.json','utf8'));
          const files={};
          for(const p of audit.REQUIRED) files[p]=fs.existsSync(path.resolve(p));
          const drill=audit.failureDrill({state,files});
          audit.receipt(drill,{environment:`github-actions node ${process.version}`,source:(process.env.GITHUB_SHA||'unknown')+'#fail-closed-drill'})
            .then(receipt=>{
              fs.writeFileSync('recovery-receipt.json',JSON.stringify(receipt,null,2)+'\n');
              console.log(JSON.stringify(receipt,null,2));
              if(receipt.status!=='PASS') process.exit(1);
              if(receipt.candidate_status!=='FAIL') process.exit(2);
              if(receipt.recovered_status!=='PASS') process.exit(3);
              if(receipt.stable_preserved!==true) process.exit(4);
            }).catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Preserve foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-foundation-evidence
          path: |
            foundation-receipt.json
            recovery-receipt.json
