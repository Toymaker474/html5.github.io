name: Hourly Teacher Health
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate teacher engines
        run: |
          node --check sandbox-god-genic/src/teacher.js
          python -m py_compile sandbox-god-genic/python/teacher.py
      - name: Check public Fracture Wilds v6 deployment
        run: |
          base="https://toymaker474.github.io/html5.github.io"
          curl --fail --retry 3 --retry-delay 8 --max-time 30 "$base/" \
            | grep -q "ENTERING FRACTURE WILDS"
          curl --fail --retry 3 --retry-delay 8 --max-time 30 "$base/fracture-wilds/" \
            | grep -q "FRACTURE WILDS"
          for asset in style.css debug.js game.js sim.js sw.js; do
            curl --fail --retry 3 --retry-delay 8 --max-time 30 \
              "$base/fracture-wilds/$asset?v=6" >/dev/null
          done
