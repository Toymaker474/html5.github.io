name: Hourly Teacher Health
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate teacher engines
        run: |
          node --check sandbox-god-genic/src/teacher.js
          python -m py_compile sandbox-god-genic/python/teacher.py
      - name: Check public Living Bodies v9 deployment
        run: |
          base="https://toymaker474.github.io/html5.github.io"
          curl --fail --retry 3 --retry-delay 8 --max-time 30 "$base/" \
            | grep -q "OPENING LIVING BODIES v9"
          curl --fail --retry 3 --retry-delay 8 --max-time 30 "$base/living-bodies/" \
            | grep -q "Build the organisms"
          for asset in style.css app.js sim.js core.js environment.js anatomy.js behavior.js; do
            curl --fail --retry 3 --retry-delay 8 --max-time 30 \
              "$base/living-bodies/$asset?v=9" >/dev/null
          done
          curl --fail --retry 3 --retry-delay 8 --max-time 30 \
            "$base/sw.js?v=9" >/dev/null
