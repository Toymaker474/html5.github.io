name: Check Retired PennySpawn Route

on:
  push:
    branches: ["main"]
    paths:
      - "pennyspawn-ai/**"
      - "netlify.toml"
      - ".github/workflows/pennyspawn-ui-check.yml"
  pull_request:
    paths:
      - "pennyspawn-ai/**"
      - "netlify.toml"
      - ".github/workflows/pennyspawn-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy redirect shell
        shell: bash
        run: |
          test -s pennyspawn-ai/index.html
          grep -q "Sandbox God Genic" pennyspawn-ai/index.html
          grep -q "location.replace(destination)" pennyspawn-ai/index.html
          grep -q "serviceWorker.getRegistrations" pennyspawn-ai/index.html
          grep -q "Promise.race" pennyspawn-ai/index.html
          ! grep -q 'http-equiv="refresh"' pennyspawn-ai/index.html
      - name: Confirm cleanup is narrowly scoped
        shell: bash
        run: |
          grep -q "pennyspawn|q-arena|revenue-lab" pennyspawn-ai/index.html
          grep -q "/pennyspawn-ai/" pennyspawn-ai/index.html
          ! grep -q "keys.map(key => caches.delete(key))" pennyspawn-ai/index.html
      - name: Confirm retired runtime files are absent
        shell: bash
        run: |
          test ! -e pennyspawn-ai/runtime.js
          test ! -e pennyspawn-ai/state.js
          test ! -e pennyspawn-ai/model-worker.js
          test ! -e pennyspawn-ai/monetization-config.js
          test ! -e pennyspawn-ai/rpc-ui.js
          test ! -e pennyspawn-ai/stability-ui.js
          test ! -e pennyspawn-ai/app.webmanifest
          test ! -e pennyspawn-ai/agent-catalog.json
      - name: Confirm retired runtime is unreachable from the public shell
        shell: bash
        run: |
          ! grep -qE "q\.js|q\.css|monetization-config\.js|sw\.js|app\.webmanifest|agent-catalog\.json|runtime\.js|state\.js|model-worker\.js|rpc-ui\.js|stability-ui\.js" pennyspawn-ai/index.html
          ! grep -q "navigator.serviceWorker.register" pennyspawn-ai/index.html
      - name: Confirm redirect shell contains no wallet or signing logic
        shell: bash
        run: |
          ! grep -qE "eth_call|mempool|seed phrase|private[_ -]?key|walletAddress|btcAddress|sendTransaction|signMessage" pennyspawn-ai/index.html
      - name: Confirm commercial guide documents retirement
        shell: bash
        run: |
          test -s pennyspawn-ai/COMMERCIAL_SETUP.md
          grep -q "PennySpawn is retired" pennyspawn-ai/COMMERCIAL_SETUP.md
          grep -q "monetization-config.js" pennyspawn-ai/COMMERCIAL_SETUP.md
          ! grep -q "Add only public Base USDC" pennyspawn-ai/COMMERCIAL_SETUP.md
          ! grep -q "Apply to Google AdSense" pennyspawn-ai/COMMERCIAL_SETUP.md
      - name: Confirm retired route is not a standalone Netlify deployment
        shell: bash
        run: |
          test ! -e netlify.toml
