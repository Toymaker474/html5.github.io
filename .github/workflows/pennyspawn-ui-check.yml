name: Check Retired PennySpawn Route

on:
  push:
    branches: ["main"]
    paths:
      - "pennyspawn-ai/**"
      - ".github/workflows/pennyspawn-ui-check.yml"
  pull_request:
    paths:
      - "pennyspawn-ai/**"
      - ".github/workflows/pennyspawn-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy redirect shell
        shell: bash
        run: |
          test -s pennyspawn-ai/index.html
          grep -q "Sandbox God Genic" pennyspawn-ai/index.html
          grep -q "location.replace('../?v=god-genic-1')" pennyspawn-ai/index.html
          grep -q "serviceWorker.getRegistrations" pennyspawn-ai/index.html
      - name: Confirm obsolete PennySpawn runtime is absent
        shell: bash
        run: |
          test ! -e pennyspawn-ai/q.js
          test ! -e pennyspawn-ai/q.css
          test ! -e pennyspawn-ai/monetization-config.js
          test ! -e pennyspawn-ai/sw.js
          test ! -e pennyspawn-ai/app.webmanifest
          test ! -e pennyspawn-ai/agent-catalog.json
      - name: Confirm no private or signing material is committed
        shell: bash
        run: |
          ! grep -R -E "seed phrase|private[_ -]?key|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" pennyspawn-ai --exclude=index.html
