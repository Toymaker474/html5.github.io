name: GENESIS Codehood Verify
on:
  push:
    paths: ['genesis-codehood/**','volume3d/**','project/state.json','forge/audit-core.js','.github/workflows/genesis-codehood.yml']
  pull_request:
    paths: ['genesis-codehood/**','volume3d/**','project/state.json','forge/audit-core.js','.github/workflows/genesis-codehood.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run deterministic VM tests
        working-directory: genesis-codehood
        run: npm test
      - name: Syntax check modules
        working-directory: genesis-codehood
        run: npm run check
      - name: Compile and test native C++ pressure projection
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 volume3d/solver_test.cpp -o /tmp/genesis-volume3d-test
          /tmp/genesis-volume3d-test
      - name: Rebuild WASM and prove exact promoted v3 payload
        run: |
          set -euo pipefail
          clang++ --target=wasm32 -std=c++17 -O3 -nostdlib -fno-exceptions -fno-rtti volume3d/solver.cpp \
            -Wl,--no-entry -Wl,--export-all -Wl,--export-memory -Wl,--initial-memory=4194304 -Wl,--max-memory=4194304 \
            -o /tmp/genesis-volume.wasm
          test -s /tmp/genesis-volume.wasm
          node volume3d/wasm.test.mjs /tmp/genesis-volume.wasm
