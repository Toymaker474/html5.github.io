name: Build NEXUS Authored Robots V6

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-authored-v6-build.yml'
      - '.nexus-authored-v6-trigger'
      - 'nexus-glass-science-cube/patch-authored-robots-v6.py'
      - 'nexus-glass-science-cube/patch-authored-scene-v6.py'

permissions:
  contents: write

concurrency:
  group: nexus-authored-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download official CC0 Quaternius archives
        run: |
          mkdir -p /tmp/quaternius/models /tmp/quaternius/textures
          curl --fail --location --retry 5 --retry-delay 3 \
            --user-agent 'NEXUS-Authored-V6/1.0' \
            'https://opengameart.org/sites/default/files/sci-fi_essentials_kit_models.zip' \
            --output /tmp/quaternius/models.zip
          curl --fail --location --retry 5 --retry-delay 3 \
            --user-agent 'NEXUS-Authored-V6/1.0' \
            'https://opengameart.org/sites/default/files/sci-fi_essentials_kit_textures.zip' \
            --output /tmp/quaternius/textures.zip
          unzip -q /tmp/quaternius/models.zip -d /tmp/quaternius/models
          unzip -q /tmp/quaternius/textures.zip -d /tmp/quaternius/textures

      - name: Extract selected authored models and dependencies
        shell: python
        run: |
          from pathlib import Path
          import json, shutil

          model_root = Path('/tmp/quaternius/models')
          texture_root = Path('/tmp/quaternius/textures')
          target_root = Path('nexus-glass-science-cube/assets/quaternius-scifi')
          target_root.mkdir(parents=True, exist_ok=True)
          candidates = ['Enemy_Trilobite', 'Enemy_QuadShell', 'Enemy_EyeDrone']
          files = [p for root in (model_root, texture_root) for p in root.rglob('*') if p.is_file()]
          by_name = {}
          for file in files:
              by_name.setdefault(file.name, file)

          manifest = []
          for candidate in candidates:
              matches = list(model_root.rglob(f'{candidate}.gltf'))
              if not matches:
                  raise SystemExit(f'Missing {candidate}.gltf')
              gltf = matches[0]
              document = json.loads(gltf.read_text(encoding='utf-8'))
              names = [gltf.name]
              names += [item['uri'] for item in document.get('buffers', []) if item.get('uri')]
              names += [item['uri'] for item in document.get('images', []) if item.get('uri')]
              out = target_root / candidate
              out.mkdir(parents=True, exist_ok=True)
              for name in names:
                  source = gltf.parent / name
                  if not source.exists():
                      source = by_name.get(Path(name).name)
                  if source is None or not source.exists():
                      raise SystemExit(f'Missing dependency {name} for {candidate}')
                  shutil.copy2(source, out / Path(name).name)
              manifest.append({
                  'name': candidate,
                  'source': 'Quaternius Sci-Fi Essentials Kit Standard',
                  'license': 'CC0-1.0',
                  'animations': [clip.get('name') for clip in document.get('animations', [])],
                  'files': sorted(path.name for path in out.iterdir()),
              })

          (target_root / 'ASSET-MANIFEST.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (target_root / 'LICENSE.md').write_text(
              '# Quaternius Sci-Fi Essentials assets\n\n'
              'Creator: Quaternius\n\n'
              'Source: https://opengameart.org/content/sci-fi-essentials-kit\n\n'
              'Original pack: https://quaternius.com/packs/scifiessentialskit.html\n\n'
              'License: Creative Commons Zero v1.0 Universal (CC0-1.0).\n\n'
              'Selected assets: Enemy_Trilobite, Enemy_QuadShell, Enemy_EyeDrone.\n',
              encoding='utf-8'
          )

      - name: Optimize textures for iPhone delivery
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('nexus-glass-science-cube/assets/quaternius-scifi')
          for path in root.rglob('*.png'):
              with Image.open(path) as image:
                  image.load()
                  original = image.size
                  image.thumbnail((1024, 1024), Image.Resampling.LANCZOS)
                  image.save(path, optimize=True, compress_level=9)
                  print(f'{path}: {original} -> {image.size}')
          PY

      - name: Install authored robot runtime and art direction
        run: |
          python nexus-glass-science-cube/patch-authored-robots-v6.py
          python nexus-glass-science-cube/patch-authored-scene-v6.py

      - name: Update V6 identity and caches
        shell: python
        run: |
          from pathlib import Path

          main = Path('nexus-glass-science-cube/main.js')
          text = main.read_text(encoding='utf-8')
          text = text.replace("robot-rig-v4-20260805", "authored-robots-v6-20260805")
          text = text.replace("sw.js?v=4", "sw.js?v=6")
          main.write_text(text, encoding='utf-8')

          sw = Path('nexus-glass-science-cube/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("nexus-field-lab-v4", "nexus-authored-robots-v6")
          text = text.replace("?v=4", "?v=6")
          sw.write_text(text, encoding='utf-8')

          index = Path('nexus-glass-science-cube/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace("?v=4", "?v=6")
          text = text.replace("NEXUS — Autonomous Systems Field Lab", "NEXUS — Autonomous Machine Ecology Lab")
          text = text.replace("NEXUS CONTAINMENT LAB", "NEXUS MACHINE ECOLOGY LAB")
          text = text.replace("ROBOT ASSEMBLY", "MACHINE FABRICATION")
          text = text.replace("<span>Robot</span>", "<span>Machine</span>")
          index.write_text(text, encoding='utf-8')

      - name: Validate authored assets and runtime
        run: |
          python -m py_compile nexus-glass-science-cube/patch-authored-robots-v6.py
          python -m py_compile nexus-glass-science-cube/patch-authored-scene-v6.py
          node --check nexus-glass-science-cube/runtime-source.js
          node --check nexus-glass-science-cube/main.js
          node --check nexus-glass-science-cube/sw.js
          test -f nexus-glass-science-cube/assets/quaternius-scifi/Enemy_Trilobite/Enemy_Trilobite.gltf
          test -f nexus-glass-science-cube/assets/quaternius-scifi/Enemy_QuadShell/Enemy_QuadShell.gltf
          test -f nexus-glass-science-cube/assets/quaternius-scifi/Enemy_EyeDrone/Enemy_EyeDrone.gltf
          grep -q 'GLTFLoader' nexus-glass-science-cube/runtime-source.js
          grep -q 'SkeletonUtils.clone' nexus-glass-science-cube/runtime-source.js
          grep -q 'version: 6' nexus-glass-science-cube/runtime-source.js
          grep -q 'authoredClipForRobot' nexus-glass-science-cube/runtime-source.js
          grep -q 'authored-robots-v6-20260805' nexus-glass-science-cube/main.js
          grep -q 'main.js?v=6' nexus-glass-science-cube/index.html

      - name: Install iPhone WebGL smoke-test runtime
        run: |
          mkdir -p v6-smoke artifacts
          cd v6-smoke
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run iPhone-sized authored-robot test
        run: |
          python3 -m http.server 4173 --directory nexus-glass-science-cube >/tmp/nexus-v6-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > v6-smoke/smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const page=await context.newPage();const failures=[];
          page.on('pageerror',error=>failures.push(`pageerror: ${error.message}`));
          page.on('console',message=>{if(message.type()==='error')failures.push(`console: ${message.text()}`)});
          await page.goto('http://127.0.0.1:4173/?authored-robots=v6',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>Number(document.querySelector('#robotCount')?.textContent||0)>=3&&Number(document.querySelector('#fps')?.textContent||0)>0,{timeout:120000});
          await page.locator('#startBtn').click({timeout:30000});
          await page.waitForFunction(()=>document.querySelector('#tutorial')?.classList.contains('hidden'),{timeout:30000});
          await page.waitForTimeout(7000);
          const report=await page.evaluate(()=>({units:Number(document.querySelector('#robotCount')?.textContent||0),fps:Number(document.querySelector('#fps')?.textContent||0),canvasWidth:document.querySelector('#world')?.width||0,bootFault:document.body.textContent.includes('FIELD LAB BOOT FAULT'),title:document.title}));
          console.log(JSON.stringify(report));
          await page.screenshot({path:'artifacts/nexus-authored-robots-v6-iphone.png',fullPage:true});
          await browser.close();
          if(report.bootFault||report.units<3||report.fps<=0||report.canvasWidth<=0)failures.push(`invalid report: ${JSON.stringify(report)}`);
          if(failures.length)throw new Error(failures.join('\n'));
          EOF
          node v6-smoke/smoke.mjs

      - name: Upload V6 iPhone render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-authored-robots-v6-iphone
          path: artifacts/nexus-authored-robots-v6-iphone.png
          if-no-files-found: warn

      - name: Commit authored assets and generated V6 build
        run: |
          if [ -z "$(git status --porcelain -- nexus-glass-science-cube/assets/quaternius-scifi nexus-glass-science-cube/runtime-source.js nexus-glass-science-cube/main.js nexus-glass-science-cube/sw.js nexus-glass-science-cube/index.html)" ]; then
            echo 'V6 build already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-glass-science-cube/assets/quaternius-scifi nexus-glass-science-cube/runtime-source.js nexus-glass-science-cube/main.js nexus-glass-science-cube/sw.js nexus-glass-science-cube/index.html
          git commit -m 'Integrate authored animated robot species V6'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
