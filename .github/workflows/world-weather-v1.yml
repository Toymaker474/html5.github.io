name: GENESIS World Weather V1 Legacy
on:
  push:
    paths:
      - 'world-weather/weather.cpp'
      - 'world-weather/weather_test.cpp'
      - 'world-weather/weather_wasm.test.mjs'
      - 'world-weather/weather.wasm.manifest.json'
      - 'world-weather/weather.wasm.part*.b64'
      - 'world-weather/MODEL.md'
      - '.github/workflows/world-weather-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'world-weather/weather.cpp'
      - 'world-weather/weather_test.cpp'
      - 'world-weather/weather_wasm.test.mjs'
      - 'world-weather/weather.wasm.manifest.json'
      - 'world-weather/weather.wasm.part*.b64'
      - 'world-weather/MODEL.md'
      - '.github/workflows/world-weather-v1.yml'
jobs:
  verify-world-weather-v1-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved V1 source boundary
        run: |
          set -euo pipefail
          test -f world-weather/weather.cpp
          test -f world-weather/weather_test.cpp
          test -f world-weather/weather_wasm.test.mjs
          test -f world-weather/wasm_runtime.cpp
          test -f world-weather/MODEL.md
          test -f world-weather/weather.wasm.manifest.json
          for f in weather.wasm.part0.b64 weather.wasm.part1.b64 weather.wasm.part2.b64 weather.wasm.part3a.b64 weather.wasm.part3b.b64 weather.wasm.part3c.b64 weather.wasm.part3d.b64; do test -s "world-weather/$f"; done
          ! grep -E '#include[[:space:]]*[<"](bullet|box2d|jolt|physx|three|babylon|unity|unreal|glm|eigen)' world-weather/weather.cpp world-weather/weather_test.cpp
          grep -q '192×128' world-weather/MODEL.md
          grep -q 'not DNS' world-weather/MODEL.md
      - name: Compile and execute preserved V1 native model
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -pedantic world-weather/weather_test.cpp -o /tmp/genesis-world-weather-v1
          /tmp/genesis-world-weather-v1 | tee world-weather-v1-native.txt
          grep -q 'PASS GENESIS high-resolution atmosphere hydrology' world-weather-v1-native.txt
      - name: Prove preserved V1 compiler payload
        run: |
          set -euo pipefail
          clang++ --target=wasm32 -std=c++17 -O3 -nostdlib -fno-exceptions -fno-rtti world-weather/weather.cpp world-weather/wasm_runtime.cpp \
            -Wl,--no-entry -Wl,--export-all -Wl,--export-memory -Wl,--initial-memory=8388608 -Wl,--max-memory=8388608 \
            -o /tmp/genesis-world-weather-v1.wasm
          cat world-weather/weather.wasm.part0.b64 world-weather/weather.wasm.part1.b64 world-weather/weather.wasm.part2.b64 world-weather/weather.wasm.part3a.b64 world-weather/weather.wasm.part3b.b64 world-weather/weather.wasm.part3c.b64 world-weather/weather.wasm.part3d.b64 > /tmp/weather-v1.b64
          base64 -d /tmp/weather-v1.b64 > /tmp/weather-v1-committed.wasm
          test "$(wc -c < /tmp/weather-v1-committed.wasm)" = "10669"
          test "$(sha256sum /tmp/weather-v1-committed.wasm | cut -d' ' -f1)" = "d95d030df7ca6594d1d8641c483fec234d185d5ad7de6ef0ded56207b627929c"
          cmp -s /tmp/genesis-world-weather-v1.wasm /tmp/weather-v1-committed.wasm
          node world-weather/weather_wasm.test.mjs /tmp/weather-v1-committed.wasm | tee world-weather-v1-wasm.txt
          grep -q 'PASS GENESIS world weather C++ -> WASM semantic parity' world-weather-v1-wasm.txt
      - name: Preserve legacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-world-weather-v1-legacy-${{ github.run_id }}
          path: |
            world-weather-v1-native.txt
            world-weather-v1-wasm.txt
          if-no-files-found: ignore
