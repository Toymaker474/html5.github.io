name: GENESIS World Weather V1
on:
  push:
    paths: ['world-weather/**','.github/workflows/world-weather-v1.yml','index.html']
  pull_request:
    branches: [main]
    paths: ['world-weather/**','.github/workflows/world-weather-v1.yml','index.html']
jobs:
  verify-world-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed source and truth gate
        run: |
          set -euo pipefail
          test -f world-weather/weather.cpp
          test -f world-weather/weather_test.cpp
          test -f world-weather/weather_wasm.test.mjs
          test -f world-weather/browser_contract.test.mjs
          test -f world-weather/wasm_runtime.cpp
          test -f world-weather/MODEL.md
          test -f world-weather/index.html
          test -f world-weather/weather-view.js
          test -f world-weather/weather.wasm.manifest.json
          for f in weather.wasm.part0.b64 weather.wasm.part1.b64 weather.wasm.part2.b64 weather.wasm.part3a.b64 weather.wasm.part3b.b64 weather.wasm.part3c.b64 weather.wasm.part3d.b64; do test -s "world-weather/$f"; done
          ! test -e world-weather/weather.wasm.part3.b64
          ! grep -R -E '#include[[:space:]]*[<"](bullet|box2d|jolt|physx|three|babylon|unity|unreal|glm|eigen)' world-weather
          grep -q '192×128' world-weather/MODEL.md
          grep -q 'not spawned or animated by a timer' world-weather/MODEL.md
          grep -q 'not DNS' world-weather/MODEL.md
          grep -q 'VISUAL INTERPOLATION ONLY' world-weather/index.html
      - name: Compile native atmosphere and hydrology
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -pedantic world-weather/weather_test.cpp -o /tmp/genesis-world-weather-v1
      - name: Execute causal native tests
        run: |
          set -euo pipefail
          /tmp/genesis-world-weather-v1 | tee world-weather-native.txt
          grep -q 'PASS GENESIS high-resolution atmosphere hydrology' world-weather-native.txt
      - name: Compile freestanding C++ to WebAssembly
        run: |
          set -euo pipefail
          clang++ --target=wasm32 -std=c++17 -O3 -nostdlib -fno-exceptions -fno-rtti world-weather/weather.cpp world-weather/wasm_runtime.cpp \
            -Wl,--no-entry -Wl,--export-all -Wl,--export-memory -Wl,--initial-memory=8388608 -Wl,--max-memory=8388608 \
            -o /tmp/genesis-world-weather-v1.wasm
          test -s /tmp/genesis-world-weather-v1.wasm
          sha256sum /tmp/genesis-world-weather-v1.wasm | tee world-weather-wasm.sha256
      - name: Reconstruct and prove exact promoted browser payload
        run: |
          set -euo pipefail
          cat \
            world-weather/weather.wasm.part0.b64 \
            world-weather/weather.wasm.part1.b64 \
            world-weather/weather.wasm.part2.b64 \
            world-weather/weather.wasm.part3a.b64 \
            world-weather/weather.wasm.part3b.b64 \
            world-weather/weather.wasm.part3c.b64 \
            world-weather/weather.wasm.part3d.b64 \
            > /tmp/weather-promoted.b64
          echo "promoted_b64_chars=$(wc -c < /tmp/weather-promoted.b64)"
          base64 -d /tmp/weather-promoted.b64 > /tmp/weather-promoted.wasm
          PROMOTED_BYTES="$(wc -c < /tmp/weather-promoted.wasm)"
          PROMOTED_SHA="$(sha256sum /tmp/weather-promoted.wasm | cut -d' ' -f1)"
          FRESH_SHA="$(sha256sum /tmp/genesis-world-weather-v1.wasm | cut -d' ' -f1)"
          echo "promoted_bytes=${PROMOTED_BYTES}"
          echo "promoted_sha=${PROMOTED_SHA}"
          echo "fresh_sha=${FRESH_SHA}"
          if [ "${PROMOTED_BYTES}" != "10669" ]; then echo 'BYTE_COUNT_MISMATCH'; exit 1; fi
          if [ "${PROMOTED_SHA}" != "d95d030df7ca6594d1d8641c483fec234d185d5ad7de6ef0ded56207b627929c" ]; then echo 'SHA_MISMATCH'; cmp -l /tmp/genesis-world-weather-v1.wasm /tmp/weather-promoted.wasm | head -20 || true; exit 1; fi
          if ! cmp -s /tmp/genesis-world-weather-v1.wasm /tmp/weather-promoted.wasm; then echo 'FRESH_BINARY_MISMATCH'; cmp -l /tmp/genesis-world-weather-v1.wasm /tmp/weather-promoted.wasm | head -20 || true; exit 1; fi
          node -e "const m=require('./world-weather/weather.wasm.manifest.json'); console.log(JSON.stringify(m)); if(m.compiled_bytes!==10669||m.sha256!=='d95d030df7ca6594d1d8641c483fec234d185d5ad7de6ef0ded56207b627929c'||m.cells!==24576)process.exit(1)"
      - name: Verify native and promoted WASM semantics
        run: |
          set -euo pipefail
          node world-weather/weather_wasm.test.mjs /tmp/genesis-world-weather-v1.wasm | tee world-weather-wasm.txt
          grep -q 'PASS GENESIS world weather C++ -> WASM semantic parity' world-weather-wasm.txt
          node world-weather/weather_wasm.test.mjs /tmp/weather-promoted.wasm | tee world-weather-promoted.txt
          grep -q 'PASS GENESIS world weather C++ -> WASM semantic parity' world-weather-promoted.txt
      - name: Verify browser native-state contract
        run: |
          set -euo pipefail
          node world-weather/browser_contract.test.mjs | tee world-weather-browser.txt
          grep -q 'PASS GENESIS browser payload contract' world-weather-browser.txt
      - name: Preserve weather evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-world-weather-v1-${{ github.run_id }}
          path: |
            world-weather-native.txt
            world-weather-wasm.txt
            world-weather-promoted.txt
            world-weather-browser.txt
            world-weather-wasm.sha256
          if-no-files-found: ignore
