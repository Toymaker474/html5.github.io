name: Repair Fracture Wilds v6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-fracture-wilds-v6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build direct public files
        shell: bash
        run: |
          set -euo pipefail
          cat fracture-wilds/.payload/sim.js.part* | base64 -d | gzip -d > fracture-wilds/sim.js
          cat fracture-wilds/.payload/game.js.part* | base64 -d | gzip -d > fracture-wilds/game.js
          cat fracture-wilds/.payload/style.css.part* | base64 -d | gzip -d > fracture-wilds/style.css
          sed -i "s#'./sim.js?v=5'#'./sim.js?v=6'#g" fracture-wilds/game.js
          node --check fracture-wilds/sim.js
          node --check fracture-wilds/game.js
      - name: Add compact network debugger
        shell: bash
        run: |
          cat > fracture-wilds/debug.js <<'JS'
          (()=>{'use strict';const A=['./style.css?v=6','./game.js?v=6','./sim.js?v=6','./sw.js?v=6'],S={build:'6.0.0',errors:[],tests:[]};addEventListener('error',e=>S.errors.push(String(e.error?.message||e.message)));addEventListener('unhandledrejection',e=>S.errors.push(String(e.reason?.message||e.reason)));const st=document.createElement('style');st.textContent='#fwdbg{position:fixed;right:12px;bottom:12px;z-index:9990;border:1px solid #70ffd566;border-radius:99px;background:#06131ddd;color:#cffff1;padding:10px 13px;font:900 11px system-ui}#fwpanel{display:none;position:fixed;inset:0;z-index:9999;background:#01060bed;color:#eafffa;padding:18px;overflow:auto;font:13px system-ui}#fwpanel.on{display:grid;place-items:center}#fwcard{width:min(620px,100%);background:#07131d;border:1px solid #70ffd544;border-radius:22px;padding:18px;box-shadow:0 20px 80px #000}#fwrows{display:grid;gap:7px}.fwrow{display:grid;grid-template-columns:1fr auto;gap:10px;background:#0d1d28;border-radius:11px;padding:9px}.ok{color:#70ffd5}.bad{color:#ff7893}.wait{color:#ffd66e}.fwbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.fwbtns button,#fwclose{min-height:44px;border:0;border-radius:12px;background:#173040;color:#fff;font-weight:800}.fwbtns .accent{background:#70ffd5;color:#03110d}#fwlog{white-space:pre-wrap;word-break:break-word;background:#02080d;padding:10px;border-radius:12px;max-height:180px;overflow:auto}';document.head.append(st);function boot(){const b=document.createElement('button');b.id='fwdbg';b.textContent='⚙ DEBUG';const p=document.createElement('section');p.id='fwpanel';p.innerHTML='<article id="fwcard"><button id="fwclose">CLOSE</button><h2>Fracture Debug Core</h2><p>Build 6 · direct files · no hidden payload loader</p><div id="fwrows"></div><div class="fwbtns"><button class="accent" id="fwtest">TEST NETWORK</button><button id="fwcopy">COPY REPORT</button><button id="fwfix">FIX CACHE + RELOAD</button><button id="fwsafe">SAFE GRAPHICS</button></div><pre id="fwlog">No errors captured.</pre></article>';document.body.append(b,p);b.onclick=()=>p.classList.add('on');p.querySelector('#fwclose').onclick=()=>p.classList.remove('on');p.querySelector('#fwtest').onclick=test;p.querySelector('#fwcopy').onclick=copy;p.querySelector('#fwfix').onclick=fix;p.querySelector('#fwsafe').onclick=()=>{document.documentElement.dataset.safe='1';localStorage.setItem('fw_safe','1')};if(localStorage.getItem('fw_safe')==='1')document.documentElement.dataset.safe='1';render();setTimeout(test,600)}async function test(){S.tests=A.map(url=>({url,pending:true}));render();S.tests=await Promise.all(A.map(async url=>{const t=performance.now();try{const r=await fetch(url,{cache:'no-store'});r.body?.cancel().catch(()=>{});return{url,ok:r.ok,status:r.status,ms:Math.round(performance.now()-t)}}catch(e){return{url,ok:false,status:0,ms:Math.round(performance.now()-t),error:String(e.message||e)}}));render()}function render(){const r=document.querySelector('#fwrows'),l=document.querySelector('#fwlog');if(!r)return;r.innerHTML=[`<div class="fwrow"><span>Network</span><b class="${navigator.onLine?'ok':'bad'}">${navigator.onLine?'ONLINE':'OFFLINE'}</b></div>`,`<div class="fwrow"><span>Service worker</span><b class="${navigator.serviceWorker?.controller?'ok':'wait'}">${navigator.serviceWorker?.controller?'ACTIVE':'WAITING'}</b></div>`,...S.tests.map(x=>`<div class="fwrow"><span>${x.url}</span><b class="${x.pending?'wait':x.ok?'ok':'bad'}">${x.pending?'TESTING':x.ok?`${x.status} · ${x.ms}ms`:`FAIL ${x.status}`}</b></div>`)].join('');l.textContent=S.errors.length?JSON.stringify(S.errors,null,2):'No errors captured.'}async function report(){return{...S,url:location.href,online:navigator.onLine,userAgent:navigator.userAgent,serviceWorker:!!navigator.serviceWorker?.controller,cores:navigator.hardwareConcurrency||null}}async function copy(){const v=JSON.stringify(await report(),null,2);try{await navigator.clipboard.writeText(v)}catch{prompt('Copy debug report',v)}}async function fix(){await Promise.all((await caches.keys()).map(k=>caches.delete(k)));await Promise.all((await navigator.serviceWorker?.getRegistrations?.()||[]).map(r=>r.unregister()));location.replace(`${location.pathname}?v=6&fresh=${Date.now()}`)}window.__FW_DEBUG__={state:S,test,report,fix};document.readyState==='loading'?addEventListener('DOMContentLoaded',boot,{once:true}):boot()})();
          JS
          node --check fracture-wilds/debug.js
      - name: Switch PWA to direct v6 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('fracture-wilds/index.html');s=p.read_text();s=s.replace('style.css?v=5','style.css?v=6').replace('<script type="module" src="./game.js?v=5"></script>','<script src="./debug.js?v=6"></script><script type="module" src="./game.js?v=6"></script>').replace('God Genic: Fracture Wilds</title>','God Genic: Fracture Wilds v6</title>');p.write_text(s)
          p=Path('index.html');s=p.read_text().replace('manifest.webmanifest?v=5','manifest.webmanifest?v=6').replace('sw.js?v=5','sw.js?v=6').replace('fracture-wilds/?v=5','fracture-wilds/?v=6');p.write_text(s)
          m=json.loads(Path('manifest.webmanifest').read_text());m.update({'name':'God Genic: Fracture Wilds v6','start_url':'./fracture-wilds/?v=6','description':'Fast direct-file alien survival game with built-in network debugging.'});m['icons'][0]['src']='icon.svg?v=6';Path('manifest.webmanifest').write_text(json.dumps(m,indent=2)+'\n')
          PY
          cat > fracture-wilds/sw.js <<'JS'
          const CACHE='fracture-wilds-v6',CORE=['./','./index.html','./style.css?v=6','./debug.js?v=6','./game.js?v=6','./sim.js?v=6','../manifest.webmanifest?v=6'];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(CORE.map(u=>c.add(new Request(u,{cache:'reload'}))))).then(()=>self.skipWaiting())));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CACHE).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==location.origin)return;const n=e.request.mode==='navigate'||['script','style','worker'].includes(e.request.destination);e.respondWith(n?fetch(e.request,{cache:'no-store'}).then(r=>{if(r.ok)caches.open(CACHE).then(c=>c.put(e.request,r.clone()));return r}).catch(()=>caches.match(e.request).then(x=>x||caches.match('./index.html'))):caches.match(e.request).then(x=>x||fetch(e.request)))});
          JS
          cat > sw.js <<'JS'
          const CACHE='fracture-wilds-root-v6',CORE=['./','./index.html','./manifest.webmanifest?v=6','./fracture-wilds/','./fracture-wilds/index.html','./fracture-wilds/style.css?v=6','./fracture-wilds/debug.js?v=6','./fracture-wilds/game.js?v=6','./fracture-wilds/sim.js?v=6','./fracture-wilds/sw.js?v=6'];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(CORE.map(u=>c.add(new Request(u,{cache:'reload'}))))).then(()=>self.skipWaiting())));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CACHE).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==location.origin)return;const n=e.request.mode==='navigate'||['script','style','worker'].includes(e.request.destination);e.respondWith(n?fetch(e.request,{cache:'no-store'}).then(r=>{if(r.ok)caches.open(CACHE).then(c=>c.put(e.request,r.clone()));return r}).catch(()=>caches.match(e.request).then(x=>x||caches.match('./fracture-wilds/index.html'))):caches.match(e.request).then(x=>x||fetch(e.request)))});
          JS
          node --check fracture-wilds/sw.js && node --check sw.js
      - name: Runtime test and commit
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import{World}from'./fracture-wilds/sim.js';const w=new World(474),i={x:.7,y:0,jump:false,grab:false,bite:false,dash:false};for(let n=0;n<2400;n++){i.jump=n%180===0;i.bite=n%95===0;w.step(1/60,i)}const s=w.stats();assert.ok(Number.isFinite(w.player.x));assert.ok(s.population>=20);assert.equal(w.map.dens.length,6);assert.ok(w.map.food.length>=100);console.log(s);
          JS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.webmanifest sw.js fracture-wilds/index.html fracture-wilds/style.css fracture-wilds/debug.js fracture-wilds/game.js fracture-wilds/sim.js fracture-wilds/sw.js
          git commit -m 'Repair Fracture Wilds with direct files and debugger'
          git push origin HEAD:main
