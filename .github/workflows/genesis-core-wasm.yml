name: Genesis Core Compiler + Diagnostic Lab

on:
  push:
    branches: [main]
    paths:
      - 'genesis-core/Cargo.toml'
      - 'genesis-core/src/**'
      - 'genesis-core/web/**'
      - 'genesis-core/tools/**'
      - '.github/workflows/genesis-core-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-core-lab
  cancel-in-progress: true

jobs:
  build-test-debug:
    if: ${{ !contains(github.event.head_commit.message || '', 'build(genesis-core): compiled wasm') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Install Rust + WASM target + tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust format gate
        working-directory: genesis-core
        run: cargo fmt --all -- --check

      - name: Rust compiler gate
        working-directory: genesis-core
        run: cargo check --all-targets

      - name: Rust Clippy diagnostic gate
        working-directory: genesis-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit-test gate
        working-directory: genesis-core
        run: cargo test --lib

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Compile optimized Rust → WebAssembly
        working-directory: genesis-core
        run: wasm-pack build --target web --release --out-dir web/pkg

      - name: Verify generated WASM package
        run: |
          test -s genesis-core/web/pkg/genesis_core_bg.wasm
          test -s genesis-core/web/pkg/genesis_core.js
          echo '--- WASM PACKAGE ---'
          ls -lh genesis-core/web/pkg
          echo '--- SHA256 ---'
          sha256sum genesis-core/web/pkg/genesis_core_bg.wasm genesis-core/web/pkg/genesis_core.js

      - name: JavaScript syntax gate
        run: |
          node --check genesis-core/web/app.js
          node --check genesis-core/tools/smoke.mjs

      - name: Install browser diagnostic runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@latest
          npx playwright install --with-deps chromium

      - name: Start local Genesis server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/genesis-http.log 2>&1 &
          echo $! > /tmp/genesis-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/genesis-core/web/diagnostics.html >/dev/null; then
              echo 'Genesis diagnostic server is ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/genesis-http.log
          exit 1

      - name: Browser/WASM automatic debugger
        run: node genesis-core/tools/smoke.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-core-diagnostics
          path: |
            genesis-core-diagnostic.png
            /tmp/genesis-http.log
          if-no-files-found: ignore

      - name: Commit compiler-approved WASM package
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f genesis-core/web/pkg
          if git diff --cached --quiet; then
            echo 'Compiled package already up to date.'
          else
            git commit -m 'build(genesis-core): compiled wasm'
            git push
          fi
