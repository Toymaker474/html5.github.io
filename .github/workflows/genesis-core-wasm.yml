name: Genesis Core WASM

on:
  push:
    branches: [main]
    paths:
      - 'genesis-core/Cargo.toml'
      - 'genesis-core/src/**'
      - 'genesis-core/web/**'
      - '.github/workflows/genesis-core-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-core-wasm
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', 'build(genesis-core): compiled wasm') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Install Rust wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Compile Genesis Core
        working-directory: genesis-core
        run: wasm-pack build --target web --release --out-dir web/pkg

      - name: Verify generated WASM
        run: |
          test -f genesis-core/web/pkg/genesis_core_bg.wasm
          test -f genesis-core/web/pkg/genesis_core.js
          ls -lh genesis-core/web/pkg

      - name: Commit compiled web package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f genesis-core/web/pkg
          if git diff --cached --quiet; then
            echo 'Compiled package already up to date.'
          else
            git commit -m 'build(genesis-core): compiled wasm'
            git push
          fi
