name: VOIN V3 Integrity

on:
  push:
    branches: [main]
    paths:
      - 'voin-genetic-minds-v2/**'
      - '.github/workflows/voin-v3-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'voin-genetic-minds-v2/**'
      - '.github/workflows/voin-v3-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct engine
        run: |
          cat voin-genetic-minds-v2/app-parts/{01,02,03,04,05,06,07}.txt > /tmp/voin-v3-engine.js
          test $(wc -c < /tmp/voin-v3-engine.js) -gt 45000
      - name: JavaScript syntax
        run: |
          node --check /tmp/voin-v3-engine.js
          node --check voin-genetic-minds-v2/app.js
          node --check voin-genetic-minds-v2/gear-data.js
          node --check voin-genetic-minds-v2/optimizer-worker.js
      - name: Static integration checks
        run: |
          grep -q 'NSGA-II' voin-genetic-minds-v2/index.html
          grep -q 'MAP-ELITES' voin-genetic-minds-v2/index.html
          grep -q 'class SoundEngine' /tmp/voin-v3-engine.js
          grep -q 'SEARCH 50K BUILDS' voin-genetic-minds-v2/index.html
          grep -q "partCount=7" voin-genetic-minds-v2/app.js
          grep -q 'Flamekeeper Sickles' voin-genetic-minds-v2/gear-data.js
      - name: Validate DOM references
        run: |
          python - <<'PY'
          import re, pathlib
          html=pathlib.Path('voin-genetic-minds-v2/index.html').read_text()
          js=pathlib.Path('/tmp/voin-v3-engine.js').read_text()
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set(re.findall(r"\$\('([^']+)'\)",js))
          missing=sorted(refs-ids)
          assert not missing, f'Missing DOM IDs: {missing}'
          print(f'validated {len(refs)} JS DOM references')
          PY
      - name: Published GitHub Pages smoke test
        run: |
          BASE='https://toymaker474.github.io/html5.github.io/voin-genetic-minds-v2'
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$BASE/?ci=$GITHUB_RUN_ID" -o /tmp/live-index.html \
              && grep -q 'GENETIC MINDS <span>V3' /tmp/live-index.html; then
              break
            fi
            sleep 10
          done
          grep -q 'GENETIC MINDS <span>V3' /tmp/live-index.html
          curl -fsSL "$BASE/app.js?ci=$GITHUB_RUN_ID" -o /tmp/live-bootstrap.js
          grep -q 'partCount=7' /tmp/live-bootstrap.js
          rm -f /tmp/live-engine.js
          for part in 01 02 03 04 05 06 07; do
            curl -fsSL "$BASE/app-parts/$part.txt?ci=$GITHUB_RUN_ID" >> /tmp/live-engine.js
          done
          curl -fsSL "$BASE/gear-data.js?ci=$GITHUB_RUN_ID" -o /tmp/live-gear.js
          curl -fsSL "$BASE/optimizer-worker.js?ci=$GITHUB_RUN_ID" -o /tmp/live-worker.js
          node --check /tmp/live-engine.js
          node --check /tmp/live-bootstrap.js
          node --check /tmp/live-gear.js
          node --check /tmp/live-worker.js
