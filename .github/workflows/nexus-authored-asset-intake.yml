name: Inventory NEXUS Authored Robot Assets

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-authored-asset-intake.yml'
      - '.nexus-authored-assets-trigger'

permissions:
  contents: write

concurrency:
  group: nexus-authored-asset-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download official CC0 Quaternius model archive
        run: |
          mkdir -p /tmp/quaternius nexus-glass-science-cube/asset-intake
          curl --fail --location --retry 5 --retry-delay 3 \
            --user-agent 'NEXUS-Asset-Intake/1.0' \
            'https://opengameart.org/sites/default/files/sci-fi_essentials_kit_models.zip' \
            --output /tmp/quaternius/models.zip
          test -s /tmp/quaternius/models.zip
          unzip -t /tmp/quaternius/models.zip
          ls -lh /tmp/quaternius/models.zip

      - name: Inventory model files, rigs and animation clips
        shell: python
        run: |
          from pathlib import Path
          import json, re, zipfile

          archive = Path('/tmp/quaternius/models.zip')
          output_dir = Path('nexus-glass-science-cube/asset-intake')
          output_dir.mkdir(parents=True, exist_ok=True)

          interesting = re.compile(r'(robot|enemy|mech|drone|turret|spider|alien|creature|android|bot)', re.I)
          records = []
          all_files = []

          with zipfile.ZipFile(archive) as zf:
              names = [name for name in zf.namelist() if not name.endswith('/')]
              for name in names:
                  suffix = Path(name).suffix.lower()
                  all_files.append({
                      'path': name,
                      'bytes': zf.getinfo(name).file_size,
                      'format': suffix.lstrip('.'),
                      'interesting_name': bool(interesting.search(name)),
                  })
                  if suffix != '.gltf':
                      continue
                  try:
                      document = json.loads(zf.read(name).decode('utf-8'))
                  except Exception as exc:
                      records.append({'path': name, 'parse_error': str(exc)})
                      continue
                  clips = [animation.get('name') or f'Animation_{i}' for i, animation in enumerate(document.get('animations', []))]
                  nodes = document.get('nodes', [])
                  skins = document.get('skins', [])
                  meshes = document.get('meshes', [])
                  materials = document.get('materials', [])
                  image_uris = [image.get('uri') for image in document.get('images', []) if image.get('uri')]
                  buffer_uris = [buffer.get('uri') for buffer in document.get('buffers', []) if buffer.get('uri')]
                  records.append({
                      'path': name,
                      'bytes': zf.getinfo(name).file_size,
                      'animations': clips,
                      'animation_count': len(clips),
                      'skins': len(skins),
                      'nodes': len(nodes),
                      'meshes': len(meshes),
                      'materials': len(materials),
                      'images': image_uris,
                      'buffers': buffer_uris,
                      'interesting_name': bool(interesting.search(name)),
                  })

          report = {
              'source': 'https://opengameart.org/content/sci-fi-essentials-kit',
              'archive': 'sci-fi_essentials_kit_models.zip',
              'license': 'CC0',
              'file_count': len(all_files),
              'gltf_count': len(records),
              'animated_gltf_count': sum(1 for item in records if item.get('animation_count', 0) > 0),
              'rigged_gltf_count': sum(1 for item in records if item.get('skins', 0) > 0),
              'records': records,
              'all_files': all_files,
          }
          (output_dir / 'quaternius-scifi-inventory.json').write_text(json.dumps(report, indent=2), encoding='utf-8')

          ranked = sorted(
              records,
              key=lambda item: (
                  item.get('interesting_name', False),
                  item.get('animation_count', 0),
                  item.get('skins', 0),
                  item.get('meshes', 0),
              ),
              reverse=True,
          )
          lines = [
              '# Quaternius Sci-Fi Essentials — NEXUS Asset Intake',
              '',
              f'- Files in archive: **{len(all_files)}**',
              f'- glTF scenes: **{len(records)}**',
              f'- Animated glTF scenes: **{report["animated_gltf_count"]}**',
              f'- Rigged glTF scenes: **{report["rigged_gltf_count"]}**',
              '',
              '## Highest-priority candidates',
              '',
              '| Asset | Animations | Skins | Meshes | Materials |',
              '|---|---:|---:|---:|---:|',
          ]
          for item in ranked[:50]:
              clips = ', '.join(item.get('animations', [])) or '—'
              lines.append(
                  f'| `{item.get("path")}`<br><sub>{clips}</sub> | {item.get("animation_count", 0)} | {item.get("skins", 0)} | {item.get("meshes", 0)} | {item.get("materials", 0)} |'
              )
          (output_dir / 'quaternius-scifi-inventory.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines[:20]))

      - name: Commit inventory report
        run: |
          if [ -z "$(git status --porcelain -- nexus-glass-science-cube/asset-intake)" ]; then
            echo 'Inventory already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-glass-science-cube/asset-intake
          git commit -m 'Inventory authored CC0 sci-fi robot assets'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
