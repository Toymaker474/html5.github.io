name: God Genic CI
on:
  push:
    paths: ['index.html','manifest.webmanifest','sw.js','god-sandbox/**','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml','.github/workflows/sandbox-god-genic-teacher.yml']
  pull_request:
    paths: ['index.html','manifest.webmanifest','sw.js','god-sandbox/**','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml','.github/workflows/sandbox-god-genic-teacher.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}

      - name: Remove generated compiler artifacts
        run: |
          rm -rf sandbox-god-genic/python/__pycache__
          rm -rf sandbox-god-genic/rust/target
          rm -f sandbox-god-genic/rust/Cargo.lock

      - name: Direct JavaScript syntax
        run: |
          node --check god-sandbox/app.js
          node --check god-sandbox/sim.js
          node --check fracture-wilds/debug.js
          node --check fracture-wilds/game.js
          node --check fracture-wilds/sim.js
          node --check fracture-wilds/debug-v7.js
          node --check fracture-wilds/science-game-v7.js
          node --check fracture-wilds/science-sim-v7.js
          node --check fracture-wilds/sw.js
          node --check sw.js
          for file in sandbox-god-genic/src/*.js; do node --check "$file"; done

      - name: Public boot architecture
        run: |
          test -f .nojekyll
          test -f god-sandbox/index.html
          test -f god-sandbox/style.css
          test -f god-sandbox/app.js
          test -f god-sandbox/sim.js
          test -f fracture-wilds/index.html
          test -f fracture-wilds/manifest.webmanifest
          test -f fracture-wilds/science-v7.css
          test -f fracture-wilds/debug-v7.js
          test -f fracture-wilds/science-game-v7.js
          test -f fracture-wilds/science-sim-v7.js
          test -f fracture-wilds/AI_ARCHITECTURE_V7.md
          grep -q './app.js?v=8' god-sandbox/index.html
          grep -q './sim.js?v=8' god-sandbox/app.js
          grep -q 'data-setting="device"' god-sandbox/index.html
          grep -q 'data-setting="science"' god-sandbox/index.html
          grep -q 'data-power="sun"' god-sandbox/index.html
          grep -q 'god-sandbox/?v=8' index.html
          grep -q 'god-sandbox/?v=8' manifest.webmanifest
          grep -q 'god-sandbox/sim.js?v=8' sw.js
          grep -q './science-game-v7.js?v=7' fracture-wilds/index.html
          grep -q './debug-v7.js?v=7' fracture-wilds/index.html
          grep -q './science-sim-v7.js?v=7' fracture-wilds/science-game-v7.js
          grep -q './manifest.webmanifest?v=7' fracture-wilds/index.html
          grep -q 'SCIENCE SURVIVAL SIM' fracture-wilds/index.html
          ! grep -R -q 'v7-stage\|\.payload' fracture-wilds/index.html fracture-wilds/debug-v7.js fracture-wilds/science-game-v7.js fracture-wilds/science-sim-v7.js

      - name: Local network asset test
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/god-genic-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          for asset in \
            index.html \
            manifest.webmanifest \
            sw.js \
            god-sandbox/index.html \
            god-sandbox/style.css \
            god-sandbox/app.js \
            god-sandbox/sim.js \
            fracture-wilds/index.html \
            fracture-wilds/manifest.webmanifest \
            fracture-wilds/science-v7.css \
            fracture-wilds/debug-v7.js \
            fracture-wilds/science-game-v7.js \
            fracture-wilds/science-sim-v7.js \
            fracture-wilds/sw.js
          do
            curl --fail --silent --show-error "http://127.0.0.1:8000/$asset" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:8000/index.html | grep -q 'OPENING SCIENTIFIC GENESIS'
          curl --fail --silent http://127.0.0.1:8000/god-sandbox/index.html | grep -q 'Build the laws first'
          curl --fail --silent http://127.0.0.1:8000/fracture-wilds/index.html | grep -q 'FRACTURE WILDS'
          curl --fail --silent http://127.0.0.1:8000/fracture-wilds/index.html | grep -q 'SCIENCE SURVIVAL SIM'

      - name: Scientific god sandbox runtime
        run: |
          cp god-sandbox/sim.js /tmp/god-sandbox-sim-v8.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';
          const { World } = await import(pathToFileURL('/tmp/god-sandbox-sim-v8.mjs').href);
          const world = new World(474, {
            device: 'iphone', science: 'deep', population: 82,
            maxPopulation: 130, evolution: 6, climate: 7
          });
          for (let tick = 0; tick < 3600; tick++) {
            if (tick === 300) world.applyPower('bloom', 3200, 900);
            if (tick === 700) world.applyPower('storm', 2800, 900);
            if (tick === 1100) world.applyPower('pull', 3500, 800);
            if (tick === 1500) world.applyPower('mutate', 3000, 900);
            if (tick === 1900) world.applyPower('sun', 3800, 700);
            world.step(1 / 60);
          }
          const stats = world.stats();
          assert.ok(stats.population > 20 && stats.population <= 130);
          assert.ok(stats.species >= 4);
          assert.ok(stats.deaths > 0);
          assert.ok(stats.biomass > 5);
          assert.ok(stats.meanMoisture > 0.05 && stats.meanMoisture < 0.98);
          assert.ok(Number.isFinite(stats.meanTemperature));
          assert.ok(Number.isFinite(stats.diversity));
          assert.ok(stats.climateCells >= 96);
          assert.ok(world.creatures.every(creature =>
            Number.isFinite(creature.x) && Number.isFinite(creature.y) &&
            Number.isFinite(creature.energy) && Number.isFinite(creature.bodyTemp)
          ));
          console.log(JSON.stringify(stats));
          JS

      - name: Science ecosystem runtime
        run: |
          cp fracture-wilds/science-sim-v7.js /tmp/science-sim-v7.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';
          globalThis.localStorage = { getItem: () => null, setItem: () => {} };
          const { World } = await import(pathToFileURL('/tmp/science-sim-v7.mjs').href);
          const world = new World(474, { performanceTier: 'low' });
          const input = { x: .72, y: 0, jump: false, grab: false, bite: false, dash: false, scan: false };
          for (let tick = 0; tick < 3600; tick++) {
            input.jump = tick % 170 === 0;
            input.bite = tick % 103 === 0;
            input.scan = tick % 240 === 0;
            if (world.pendingEvolution?.length) world.applyEvolution(world.pendingEvolution[0].id);
            if (world.gameOver) world.respawn();
            world.step(1 / 60, input);
          }
          const stats = world.stats();
          assert.ok(Number.isFinite(world.player.x) && Number.isFinite(world.player.y));
          assert.ok(stats.population > 10);
          assert.equal(world.map.dens.length, 8);
          assert.ok(world.map.food.length >= 140);
          assert.ok(stats.species > 0 && stats.species < stats.population);
          assert.ok(stats.mission?.title);
          assert.ok(Number.isFinite(stats.ecology.oxygen));
          assert.ok(world.creatures.some(creature => creature.meta.predator));
          console.log(JSON.stringify(stats));
          JS

      - name: Teacher and Rust/WASM validation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('sandbox-god-genic/python/teacher.py')
          compile(source.read_text(), str(source), 'exec')
          PY
          CARGO_TARGET_DIR=/tmp/god-genic-rust-target cargo check --manifest-path sandbox-god-genic/rust/Cargo.toml --target wasm32-unknown-unknown
          rm -f sandbox-god-genic/rust/Cargo.lock

      - name: Commit source-only cleanup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'Remove generated compiler artifacts from science v7'
            git push origin HEAD:${{ github.head_ref }}
          fi
