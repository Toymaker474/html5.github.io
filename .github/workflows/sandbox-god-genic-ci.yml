name: God Genic CI
on:
  push:
    paths: ['index.html','manifest.webmanifest','sw.js','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml','.github/workflows/sandbox-god-genic-teacher.yml']
  pull_request:
    paths: ['index.html','manifest.webmanifest','sw.js','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml','.github/workflows/sandbox-god-genic-teacher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}

      - name: Direct JavaScript syntax
        run: |
          node --check fracture-wilds/debug.js
          node --check fracture-wilds/game.js
          node --check fracture-wilds/sim.js
          node --check fracture-wilds/sw.js
          node --check sw.js
          for file in sandbox-god-genic/src/*.js; do node --check "$file"; done

      - name: Public boot architecture
        run: |
          test -f .nojekyll
          test -f fracture-wilds/index.html
          test -f fracture-wilds/style.css
          test -f fracture-wilds/debug.js
          test -f fracture-wilds/game.js
          test -f fracture-wilds/sim.js
          test -f fracture-wilds/sw.js
          grep -q "./sim.js?v=6" fracture-wilds/game.js
          grep -q "./debug.js?v=6" fracture-wilds/index.html
          grep -q "./game.js?v=6" fracture-wilds/index.html
          ! grep -q "\.payload" fracture-wilds/index.html
          ! grep -q "\.payload" fracture-wilds/game.js
          grep -q "fracture-wilds/?v=6" index.html

      - name: Local network asset test
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/god-genic-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          for asset in \
            index.html \
            manifest.webmanifest \
            sw.js \
            fracture-wilds/index.html \
            fracture-wilds/style.css \
            fracture-wilds/debug.js \
            fracture-wilds/game.js \
            fracture-wilds/sim.js \
            fracture-wilds/sw.js
          do
            curl --fail --silent --show-error "http://127.0.0.1:8000/$asset" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:8000/index.html | grep -q "ENTERING FRACTURE WILDS"
          curl --fail --silent http://127.0.0.1:8000/fracture-wilds/index.html | grep -q "FRACTURE WILDS"

      - name: Fracture Wilds runtime smoke test
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { World } from './fracture-wilds/sim.js';
          const world = new World(474);
          const input = { x: .7, y: 0, jump: false, grab: false, bite: false, dash: false };
          for (let tick = 0; tick < 2400; tick++) {
            input.jump = tick % 180 === 0;
            input.bite = tick % 95 === 0;
            world.step(1 / 60, input);
          }
          const stats = world.stats();
          assert.ok(Number.isFinite(world.player.x) && Number.isFinite(world.player.y));
          assert.ok(stats.population >= 20);
          assert.equal(world.map.dens.length, 6);
          assert.ok(world.map.food.length >= 100);
          assert.ok(world.creatures.some(creature => creature.meta.predator));
          assert.ok(['clear','warning','rain'].includes(stats.rainPhase));
          console.log(JSON.stringify(stats));
          JS

      - name: Teacher and Rust/WASM validation
        run: |
          python -m py_compile sandbox-god-genic/python/teacher.py
          cargo check --manifest-path sandbox-god-genic/rust/Cargo.toml --target wasm32-unknown-unknown
