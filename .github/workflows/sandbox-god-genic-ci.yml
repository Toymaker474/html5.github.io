name: God Genic CI
on:
  push:
    paths: ['index.html','manifest.webmanifest','sw.js','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml']
  pull_request:
    paths: ['index.html','manifest.webmanifest','sw.js','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}

      - name: Decode direct engine files
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f fracture-wilds/sim.js ]; then
            cat fracture-wilds/.payload/sim.js.part* | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > fracture-wilds/sim.js
          fi
          cat fracture-wilds/.payload/game.js.part* | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > fracture-wilds/game.js
          cat fracture-wilds/.payload/style.css.part* | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > fracture-wilds/style.css
          sed -i "s#'./sim.js?v=5'#'./sim.js?v=6'#g" fracture-wilds/game.js
          test -s fracture-wilds/sim.js
          test -s fracture-wilds/game.js
          test -s fracture-wilds/style.css

      - name: Add simple network debugger
        shell: bash
        run: |
          cat > fracture-wilds/debug.js <<'JS'
          (() => {
            'use strict';
            const assets = [
              './index.html',
              './style.css?v=6',
              './debug.js?v=6',
              './game.js?v=6',
              './sim.js?v=6',
              './sw.js?v=6'
            ];
            const state = { build: '6.0.0', errors: [], tests: [] };

            function capture(type, value) {
              state.errors.push({
                time: new Date().toISOString(),
                type,
                message: String(value && value.message ? value.message : value)
              });
              state.errors = state.errors.slice(-10);
              render();
            }

            window.addEventListener('error', event => capture('error', event.error || event.message));
            window.addEventListener('unhandledrejection', event => capture('promise', event.reason));

            function addStyles() {
              const style = document.createElement('style');
              style.textContent = `
                #fw-debug-button{position:fixed;right:12px;bottom:12px;z-index:9990;border:1px solid #70ffd566;border-radius:999px;padding:10px 13px;background:#06131dea;color:#cffff1;font:900 11px system-ui;letter-spacing:.08em;box-shadow:0 0 28px #48ffd744}
                #fw-debug-panel{display:none;position:fixed;inset:0;z-index:9999;background:#01060bf2;color:#eafffa;padding:18px;overflow:auto;font:13px system-ui}
                #fw-debug-panel.open{display:grid;place-items:center}
                #fw-debug-card{width:min(640px,100%);background:#07131d;border:1px solid #70ffd544;border-radius:22px;padding:18px;box-shadow:0 24px 90px #000}
                #fw-debug-rows{display:grid;gap:7px}.fw-debug-row{display:grid;grid-template-columns:1fr auto;gap:10px;background:#0d1d28;border-radius:11px;padding:9px}
                .fw-ok{color:#70ffd5}.fw-bad{color:#ff7893}.fw-wait{color:#ffd66e}.fw-debug-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
                .fw-debug-actions button,#fw-debug-close{min-height:44px;border:0;border-radius:12px;background:#173040;color:#fff;font-weight:800}.fw-debug-actions .accent{background:#70ffd5;color:#03110d}
                #fw-debug-log{white-space:pre-wrap;word-break:break-word;background:#02080d;padding:10px;border-radius:12px;max-height:180px;overflow:auto}
                html[data-safe-graphics="1"] *{filter:none!important;text-shadow:none!important;box-shadow:none!important}
              `;
              document.head.appendChild(style);
            }

            function boot() {
              addStyles();
              const button = document.createElement('button');
              button.id = 'fw-debug-button';
              button.textContent = '⚙ DEBUG';

              const panel = document.createElement('section');
              panel.id = 'fw-debug-panel';
              panel.innerHTML = `
                <article id="fw-debug-card">
                  <button id="fw-debug-close">CLOSE</button>
                  <h2>Fracture Debug Core</h2>
                  <p>Build 6 · direct files · network-first cache</p>
                  <div id="fw-debug-rows"></div>
                  <div class="fw-debug-actions">
                    <button class="accent" id="fw-debug-test">TEST NETWORK</button>
                    <button id="fw-debug-copy">COPY REPORT</button>
                    <button id="fw-debug-fix">FIX CACHE + RELOAD</button>
                    <button id="fw-debug-safe">SAFE GRAPHICS</button>
                  </div>
                  <pre id="fw-debug-log">No errors captured.</pre>
                </article>`;

              document.body.append(button, panel);
              button.addEventListener('click', () => panel.classList.add('open'));
              panel.querySelector('#fw-debug-close').addEventListener('click', () => panel.classList.remove('open'));
              panel.querySelector('#fw-debug-test').addEventListener('click', testNetwork);
              panel.querySelector('#fw-debug-copy').addEventListener('click', copyReport);
              panel.querySelector('#fw-debug-fix').addEventListener('click', fixCache);
              panel.querySelector('#fw-debug-safe').addEventListener('click', toggleSafeGraphics);

              if (localStorage.getItem('fw_safe_graphics') === '1') {
                document.documentElement.dataset.safeGraphics = '1';
              }
              render();
              setTimeout(testNetwork, 500);
            }

            async function testOne(url) {
              const start = performance.now();
              try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.body && response.body.cancel) response.body.cancel().catch(() => {});
                return { url, ok: response.ok, status: response.status, ms: Math.round(performance.now() - start) };
              } catch (error) {
                return { url, ok: false, status: 0, ms: Math.round(performance.now() - start), error: String(error.message || error) };
              }
            }

            async function testNetwork() {
              state.tests = assets.map(url => ({ url, pending: true }));
              render();
              state.tests = await Promise.all(assets.map(testOne));
              render();
            }

            function render() {
              const rows = document.querySelector('#fw-debug-rows');
              const log = document.querySelector('#fw-debug-log');
              if (!rows || !log) return;
              const networkRow = `<div class="fw-debug-row"><span>Network</span><b class="${navigator.onLine ? 'fw-ok' : 'fw-bad'}">${navigator.onLine ? 'ONLINE' : 'OFFLINE'}</b></div>`;
              const workerActive = Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);
              const workerRow = `<div class="fw-debug-row"><span>Service worker</span><b class="${workerActive ? 'fw-ok' : 'fw-wait'}">${workerActive ? 'ACTIVE' : 'WAITING'}</b></div>`;
              const testRows = state.tests.map(item => {
                const text = item.pending ? 'TESTING' : item.ok ? `${item.status} · ${item.ms}ms` : `FAIL ${item.status}`;
                const klass = item.pending ? 'fw-wait' : item.ok ? 'fw-ok' : 'fw-bad';
                return `<div class="fw-debug-row"><span>${item.url}</span><b class="${klass}">${text}</b></div>`;
              }).join('');
              rows.innerHTML = networkRow + workerRow + testRows;
              log.textContent = state.errors.length ? JSON.stringify(state.errors, null, 2) : 'No errors captured.';
            }

            async function report() {
              const connection = navigator.connection || {};
              return {
                ...state,
                url: location.href,
                online: navigator.onLine,
                userAgent: navigator.userAgent,
                serviceWorker: Boolean(navigator.serviceWorker && navigator.serviceWorker.controller),
                connection: {
                  type: connection.effectiveType || null,
                  rtt: connection.rtt || null,
                  downlink: connection.downlink || null,
                  saveData: connection.saveData || false
                },
                cores: navigator.hardwareConcurrency || null,
                safeGraphics: document.documentElement.dataset.safeGraphics === '1'
              };
            }

            async function copyReport() {
              const text = JSON.stringify(await report(), null, 2);
              try {
                await navigator.clipboard.writeText(text);
              } catch {
                window.prompt('Copy debug report', text);
              }
            }

            async function fixCache() {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              const registrations = navigator.serviceWorker && navigator.serviceWorker.getRegistrations
                ? await navigator.serviceWorker.getRegistrations()
                : [];
              await Promise.all(registrations.map(registration => registration.unregister()));
              location.replace(`${location.pathname}?v=6&fresh=${Date.now()}`);
            }

            function toggleSafeGraphics() {
              const enabled = document.documentElement.dataset.safeGraphics !== '1';
              document.documentElement.dataset.safeGraphics = enabled ? '1' : '0';
              localStorage.setItem('fw_safe_graphics', enabled ? '1' : '0');
            }

            window.__FW_DEBUG__ = { state, testNetwork, report, fixCache };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', boot, { once: true });
            } else {
              boot();
            }
          })();
          JS

      - name: Update pages and manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          game_page = Path('fracture-wilds/index.html')
          html = game_page.read_text()
          html = html.replace('style.css?v=5', 'style.css?v=6')
          html = html.replace(
              '<script type="module" src="./game.js?v=5"></script>',
              '<script src="./debug.js?v=6"></script><script type="module" src="./game.js?v=6"></script>'
          )
          html = html.replace('God Genic: Fracture Wilds</title>', 'God Genic: Fracture Wilds v6</title>')
          game_page.write_text(html)

          root_page = Path('index.html')
          html = root_page.read_text()
          html = html.replace('manifest.webmanifest?v=5', 'manifest.webmanifest?v=6')
          html = html.replace('sw.js?v=5', 'sw.js?v=6')
          html = html.replace('fracture-wilds/?v=5', 'fracture-wilds/?v=6')
          root_page.write_text(html)

          manifest = Path('manifest.webmanifest')
          data = json.loads(manifest.read_text())
          data.update({
              'name': 'God Genic: Fracture Wilds v6',
              'start_url': './fracture-wilds/?v=6',
              'description': 'Fast direct-file alien survival game with built-in network and AI debugging.'
          })
          data['icons'][0]['src'] = 'icon.svg?v=6'
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Add v6 caches and documentation
        shell: bash
        run: |
          cat > fracture-wilds/sw.js <<'JS'
          const CACHE = 'fracture-wilds-v6';
          const CORE = ['./','./index.html','./style.css?v=6','./debug.js?v=6','./game.js?v=6','./sim.js?v=6','../manifest.webmanifest?v=6'];
          self.addEventListener('install', event => event.waitUntil(caches.open(CACHE).then(cache => Promise.allSettled(CORE.map(url => cache.add(new Request(url, { cache: 'reload' }))))).then(() => self.skipWaiting())));
          self.addEventListener('activate', event => event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(key => key !== CACHE).map(key => caches.delete(key)))).then(() => self.clients.claim())));
          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            const url = new URL(event.request.url);
            if (url.origin !== location.origin) return;
            const networkFirst = event.request.mode === 'navigate' || ['script','style','worker'].includes(event.request.destination);
            event.respondWith(networkFirst
              ? fetch(event.request, { cache: 'no-store' }).then(response => {
                  if (response.ok) caches.open(CACHE).then(cache => cache.put(event.request, response.clone()));
                  return response;
                }).catch(() => caches.match(event.request).then(hit => hit || caches.match('./index.html')))
              : caches.match(event.request).then(hit => hit || fetch(event.request)));
          });
          JS

          cat > sw.js <<'JS'
          const CACHE = 'fracture-wilds-root-v6';
          const CORE = ['./','./index.html','./manifest.webmanifest?v=6','./fracture-wilds/','./fracture-wilds/index.html','./fracture-wilds/style.css?v=6','./fracture-wilds/debug.js?v=6','./fracture-wilds/game.js?v=6','./fracture-wilds/sim.js?v=6','./fracture-wilds/sw.js?v=6'];
          self.addEventListener('install', event => event.waitUntil(caches.open(CACHE).then(cache => Promise.allSettled(CORE.map(url => cache.add(new Request(url, { cache: 'reload' }))))).then(() => self.skipWaiting())));
          self.addEventListener('activate', event => event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(key => key !== CACHE).map(key => caches.delete(key)))).then(() => self.clients.claim())));
          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            const url = new URL(event.request.url);
            if (url.origin !== location.origin) return;
            const networkFirst = event.request.mode === 'navigate' || ['script','style','worker'].includes(event.request.destination);
            event.respondWith(networkFirst
              ? fetch(event.request, { cache: 'no-store' }).then(response => {
                  if (response.ok) caches.open(CACHE).then(cache => cache.put(event.request, response.clone()));
                  return response;
                }).catch(() => caches.match(event.request).then(hit => hit || caches.match('./fracture-wilds/index.html')))
              : caches.match(event.request).then(hit => hit || fetch(event.request)));
          });
          JS

          cat > fracture-wilds/AI_DEBUG.md <<'MD'
          # Fracture Wilds v6 AI Debug Map

          Public boot path:

          `index.html → debug.js → game.js → sim.js`

          - `game.js`: controls, HUD, renderer and animation loop.
          - `sim.js`: procedural tiles, physics, creature brains, predator/prey AI, food, dens and rain.
          - `debug.js`: global error capture, asset latency tests, cache repair and JSON report export.
          - `sw.js`: network-first scripts, styles and workers with offline fallback.

          Quick checks:

          ```bash
          node --check fracture-wilds/debug.js
          node --check fracture-wilds/game.js
          node --check fracture-wilds/sim.js
          node --check fracture-wilds/sw.js
          ```
          MD

      - name: JavaScript syntax
        run: |
          node --check fracture-wilds/debug.js
          node --check fracture-wilds/game.js
          node --check fracture-wilds/sim.js
          node --check fracture-wilds/sw.js
          node --check sw.js

      - name: Commit direct files to pull-request branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.webmanifest sw.js fracture-wilds/index.html fracture-wilds/style.css fracture-wilds/debug.js fracture-wilds/game.js fracture-wilds/sim.js fracture-wilds/sw.js fracture-wilds/AI_DEBUG.md
          if ! git diff --cached --quiet; then
            git commit -m 'Repair Fracture Wilds with direct files and debugger'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Fracture Wilds runtime smoke test
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { World } from './fracture-wilds/sim.js';
          const world = new World(474);
          const input = { x: .7, y: 0, jump: false, grab: false, bite: false, dash: false };
          for (let i = 0; i < 2400; i++) {
            input.jump = i % 180 === 0;
            input.bite = i % 95 === 0;
            world.step(1 / 60, input);
          }
          const stats = world.stats();
          assert.ok(Number.isFinite(world.player.x) && Number.isFinite(world.player.y));
          assert.ok(stats.population >= 20);
          assert.equal(world.map.dens.length, 6);
          assert.ok(world.map.food.length >= 100);
          assert.ok(world.creatures.some(creature => creature.meta.predator));
          assert.ok(['clear','warning','rain'].includes(stats.rainPhase));
          console.log(JSON.stringify(stats));
          JS

      - name: Teacher and Rust validation
        run: |
          for file in sandbox-god-genic/src/*.js; do node --check "$file"; done
          python -m py_compile sandbox-god-genic/python/teacher.py
          cargo check --manifest-path sandbox-god-genic/rust/Cargo.toml --target wasm32-unknown-unknown

      - name: Required deployment files
        run: |
          test -f .nojekyll
          test -f fracture-wilds/index.html
          test -f fracture-wilds/debug.js
          test -f fracture-wilds/game.js
          test -f fracture-wilds/sim.js
          test -f fracture-wilds/style.css
          grep -q 'FRACTURE WILDS' fracture-wilds/index.html
