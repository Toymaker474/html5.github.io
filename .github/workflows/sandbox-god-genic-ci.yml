name: God Genic CI
on:
  push:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "fracture-wilds/**"
      - "sandbox-god-genic/**"
      - ".github/workflows/sandbox-god-genic-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "fracture-wilds/**"
      - "sandbox-god-genic/**"
      - ".github/workflows/sandbox-god-genic-ci.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Decode Fracture Wilds engine
        run: |
          cat fracture-wilds/.payload/sim.js.part* | base64 -d | gzip -d > /tmp/fracture-sim.js
          cat fracture-wilds/.payload/game.js.part* | base64 -d | gzip -d > /tmp/fracture-game.js
          cat fracture-wilds/.payload/style.css.part* | base64 -d | gzip -d > /tmp/fracture-style.css
          node --check /tmp/fracture-sim.js
          node --check /tmp/fracture-game.js
          node --check fracture-wilds/game.js
          node --check fracture-wilds/sw.js
          node --check sw.js
      - name: Fracture Wilds runtime smoke test
        run: |
          cp /tmp/fracture-sim.js /tmp/fracture-sim.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {pathToFileURL} from 'node:url';
          const {World}=await import(pathToFileURL('/tmp/fracture-sim.mjs').href);
          const world=new World(474);
          const input={x:.7,y:0,jump:false,grab:false,bite:false,dash:false};
          for(let i=0;i<2400;i++){input.jump=i%180===0;input.bite=i%95===0;world.step(1/60,input)}
          const stats=world.stats();
          assert.ok(Number.isFinite(world.player.x)&&Number.isFinite(world.player.y));
          assert.ok(stats.population>=20);
          assert.equal(world.map.dens.length,6);
          assert.ok(world.map.food.length>=100);
          assert.ok(world.creatures.some(c=>c.meta.predator));
          assert.ok(['clear','warning','rain'].includes(stats.rainPhase));
          console.log(JSON.stringify({population:stats.population,phase:stats.rainPhase,dens:world.map.dens.length,food:world.map.food.length}));
          JS
      - name: Legacy source validation
        run: |
          for f in sandbox-god-genic/src/*.js; do node --check "$f"; done
          python -m py_compile sandbox-god-genic/python/teacher.py
          cargo check --manifest-path sandbox-god-genic/rust/Cargo.toml --target wasm32-unknown-unknown
      - name: Required deployment files
        run: |
          test -f .nojekyll
          test -f fracture-wilds/index.html
          test -f fracture-wilds/game.js
          test -f fracture-wilds/sw.js
          test -f fracture-wilds/.payload/sim.js.part02
          grep -q "FRACTURE WILDS" fracture-wilds/index.html
          grep -q "fracture-wilds" index.html
