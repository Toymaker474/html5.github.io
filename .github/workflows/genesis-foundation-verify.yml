name: GENESIS Foundation Verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy root redirect
        run: |
          ! grep -R "living-bodies\|god-sandbox\|pennyspawn\|voin-v3" index.html genesis-forge project canonical || (echo "Legacy prototype reference found in active foundation" && exit 1)
      - name: Verify required foundation files
        run: |
          test -f index.html
          test -f genesis-forge/index.html
          test -f genesis-forge/forge.js
          test -f project/project-state.json
          test -f canonical/GENESIS_CONSTITUTION.md
      - name: Validate Project Brain JSON
        run: python -m json.tool project/project-state.json >/dev/null
      - name: Syntax-check FORGE JavaScript
        run: node --check genesis-forge/forge.js
      - name: Verify offline manifest files exist
        run: |
          test -f manifest.webmanifest
          test -f sw.js
