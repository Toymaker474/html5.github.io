name: GENESIS Weather3D Volume Coupling V1
on:
  push:
    paths: ['world-coupling/**','genesis-codehood/native-main.js','.github/workflows/world-coupling-v1.yml']
  pull_request:
    branches: [main]
    paths: ['world-coupling/**','genesis-codehood/native-main.js','.github/workflows/world-coupling-v1.yml']
permissions:
  contents: write
jobs:
  verify-coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed one-bridge architecture gate
        run: |
          set -euo pipefail
          test -f world-coupling/weather_volume_bridge.cpp
          test -f world-coupling/weather_volume_bridge_test.cpp
          test -f world-coupling/weather_volume_bridge_wasm.test.mjs
          test -f world-coupling/worker.js
          test -f world-coupling/browser_runtime_contract.test.mjs
          grep -q '#include "../volume3d/solver.cpp"' world-coupling/weather_volume_bridge.cpp
          grep -q '#include "../world-weather/weather3d.cpp"' world-coupling/weather_volume_bridge.cpp
          grep -q 'MASS_UNITS_PER_WATER_VOXEL = 256u' world-coupling/weather_volume_bridge.cpp
          grep -q 'genesis_world_coupling_conservation_error' world-coupling/weather_volume_bridge.cpp
          ! grep -R -E '#include[[:space:]]*[<"](three|babylon|unity|unreal|bullet|box2d|jolt|physx|glm|eigen)' world-coupling
          ! grep -R -Ei '(three\.js|babylon|playcanvas|pixi|matter\.js|p5\.js)' world-coupling
          node --check world-coupling/weather_volume_bridge_wasm.test.mjs
          node --check world-coupling/browser_runtime_contract.test.mjs
          node --check world-coupling/worker.js
          node --check genesis-codehood/native-main.js
      - name: Verify fail-closed browser coupling contract
        run: |
          set -euo pipefail
          node world-coupling/browser_runtime_contract.test.mjs | tee world-coupling-browser.txt
          grep -q 'PASS GENESIS browser Weather3D-volume coupling contract' world-coupling-browser.txt
      - name: Compile native authoritative-kernel bridge
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -pedantic world-coupling/weather_volume_bridge_test.cpp -o /tmp/genesis-world-coupling
      - name: Execute deterministic native coupling tests
        run: |
          set -euo pipefail
          /tmp/genesis-world-coupling | tee world-coupling-native.txt
          grep -q 'PASS GENESIS Weather3D V2 <-> native volume coupling V1' world-coupling-native.txt
          test "$(grep 'REFERENCE_HASH' world-coupling-native.txt | awk '{print $2}')" != "0"
      - name: Compile bridge C++ to zero-import WebAssembly
        run: |
          set -euo pipefail
          clang++ --target=wasm32 -std=c++17 -O3 -nostdlib -fno-exceptions -fno-rtti \
            world-coupling/weather_volume_bridge.cpp \
            -Wl,--no-entry -Wl,--export-all -Wl,--export-memory \
            -Wl,--initial-memory=67108864 -Wl,--max-memory=67108864 \
            -o /tmp/genesis-world-coupling.wasm
          test -s /tmp/genesis-world-coupling.wasm
          sha256sum /tmp/genesis-world-coupling.wasm | tee world-coupling-wasm.sha256
          node -e "const fs=require('fs');const b=fs.readFileSync('/tmp/genesis-world-coupling.wasm');const m=new WebAssembly.Module(b);if(WebAssembly.Module.imports(m).length)process.exit(1);console.log('ZERO_IMPORT_WASM',b.length)" | tee world-coupling-wasm-architecture.txt
      - name: Verify native and WebAssembly coupling semantics
        run: |
          set -euo pipefail
          node world-coupling/weather_volume_bridge_wasm.test.mjs /tmp/genesis-world-coupling.wasm | tee world-coupling-wasm.txt
          grep -q 'PASS GENESIS Weather3D V2 <-> native volume coupling WASM parity' world-coupling-wasm.txt
          NATIVE_HASH="$(grep 'REFERENCE_HASH' world-coupling-native.txt | awk '{print $2}')"
          WASM_HASH="$(grep 'REFERENCE_HASH' world-coupling-wasm.txt | awk '{print $2}')"
          test "$NATIVE_HASH" = "$WASM_HASH"
      - name: Promote exact compiler-produced bridge payload on single lane
        if: github.event_name == 'push' && github.ref == 'refs/heads/weather-volume-coupling-v1'
        run: |
          set -euo pipefail
          cp /tmp/genesis-world-coupling.wasm world-coupling/weather_volume_bridge.wasm
          BYTES="$(wc -c < /tmp/genesis-world-coupling.wasm)"
          SHA="$(sha256sum /tmp/genesis-world-coupling.wasm | cut -d' ' -f1)"
          printf '{\n  "model":"genesis-weather3d-volume-coupling-v1",\n  "model_version":"0x00010001",\n  "authoritative_sources":["world-weather/weather3d.cpp","volume3d/solver.cpp"],\n  "mass_units_per_water_voxel":256,\n  "wasm":{"bytes":%s,"sha256":"%s","imports":0}\n}\n' "$BYTES" "$SHA" > world-coupling/weather_volume_bridge.manifest.json
          cmp -s /tmp/genesis-world-coupling.wasm world-coupling/weather_volume_bridge.wasm
          git config user.name 'GENESIS FORGE'
          git config user.email 'actions@users.noreply.github.com'
          git add world-coupling/weather_volume_bridge.wasm world-coupling/weather_volume_bridge.manifest.json
          if git diff --cached --quiet; then echo 'Exact compiler bridge payload already promoted.'; exit 0; fi
          git commit -m 'Promote exact compiler-produced weather-volume bridge WASM'
          git push origin HEAD:weather-volume-coupling-v1
      - name: Prove committed payload equals fresh compiler output
        run: |
          set -euo pipefail
          test -f world-coupling/weather_volume_bridge.wasm
          test -f world-coupling/weather_volume_bridge.manifest.json
          cmp -s /tmp/genesis-world-coupling.wasm world-coupling/weather_volume_bridge.wasm
          SHA="$(sha256sum /tmp/genesis-world-coupling.wasm | cut -d' ' -f1)"
          grep -q "$SHA" world-coupling/weather_volume_bridge.manifest.json
          python -m json.tool world-coupling/weather_volume_bridge.manifest.json >/dev/null
      - name: Preserve coupling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-weather-volume-coupling-v1-${{ github.run_id }}
          path: |
            /tmp/genesis-world-coupling.wasm
            world-coupling/weather_volume_bridge.wasm
            world-coupling/weather_volume_bridge.manifest.json
            world-coupling-native.txt
            world-coupling-wasm.txt
            world-coupling-browser.txt
            world-coupling-wasm.sha256
            world-coupling-wasm-architecture.txt
          if-no-files-found: ignore
