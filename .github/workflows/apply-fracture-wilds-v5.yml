name: Apply Fracture Wilds v5
on:
  push:
    branches: [fracture-wilds-v5]
    paths:
      - '.github/workflows/apply-fracture-wilds-v5.yml'
      - 'fracture-wilds/.payload/**'
      - 'fracture-wilds/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-replacement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fracture-wilds-v5
      - name: Reconstruct game source
        shell: bash
        run: |
          set -euo pipefail
          cat fracture-wilds/.payload/sim.js.part* | base64 -d | gzip -d > fracture-wilds/sim.js
          cat fracture-wilds/.payload/game.js.part* | base64 -d | gzip -d > fracture-wilds/game.js
          cat fracture-wilds/.payload/style.css.part* | base64 -d | gzip -d > fracture-wilds/style.css
          cat fracture-wilds/.payload/sw.js.part* | base64 -d | gzip -d > fracture-wilds/sw.js
          node --check fracture-wilds/sim.js
          node --check fracture-wilds/game.js
          node --check fracture-wilds/sw.js
      - name: Replace public root
        shell: bash
        run: |
          cat > index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020509"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fracture Wilds"><link rel="manifest" href="./manifest.webmanifest?v=5"><title>God Genic: Fracture Wilds</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#020509;color:#dff;font-family:system-ui}main{text-align:center}i{display:block;width:64px;height:64px;margin:auto;border-radius:24px;background:radial-gradient(circle at 35% 30%,#fff,#70ffd5 24%,#3c5dff 65%,#080d18);box-shadow:0 0 50px #47d9ff;animation:p 1.1s infinite alternate}@keyframes p{to{transform:scale(1.12)}}b{display:block;margin-top:18px;letter-spacing:.15em}</style></head><body><main><i></i><b>ENTERING FRACTURE WILDS</b></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=5',{updateViaCache:'none'}).catch(()=>{});location.replace('./fracture-wilds/?v=5');</script></body></html>
          HTML
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.webmanifest').read_text())
          m.update({
            'name':'God Genic: Fracture Wilds',
            'short_name':'Fracture Wilds',
            'description':'An original full-screen mobile alien survival game with physical movement, predator-prey AI, dens, rain cycles, evolution, and virtual Genic rewards.',
            'start_url':'./fracture-wilds/?v=5',
            'background_color':'#020509','theme_color':'#020509','orientation':'landscape'
          })
          m['icons'][0]['src']='icon.svg?v=5'
          Path('manifest.webmanifest').write_text(json.dumps(m,indent=2)+'\n')
          PY
          cat > sw.js <<'JS'
          const CACHE='fracture-wilds-root-v5';
          const CORE=['./','./index.html','./manifest.webmanifest?v=5','./icon.svg?v=5','./fracture-wilds/','./fracture-wilds/index.html','./fracture-wilds/style.css?v=5','./fracture-wilds/game.js?v=5','./fracture-wilds/sim.js?v=5','./fracture-wilds/sw.js?v=5'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(CORE.map(u=>c.add(new Request(u,{cache:'reload'}))))).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==location.origin)return;const nf=e.request.mode==='navigate'||['script','style','worker'].includes(e.request.destination);e.respondWith(nf?fetch(e.request,{cache:'no-store'}).then(r=>{if(r.ok)caches.open(CACHE).then(c=>c.put(e.request,r.clone()));return r}).catch(()=>caches.match(e.request).then(x=>x||caches.match('./fracture-wilds/index.html'))):caches.match(e.request).then(x=>x||fetch(e.request).then(r=>{if(r.ok)caches.open(CACHE).then(c=>c.put(e.request,r.clone()));return r}))) });
          JS
          node --check sw.js
      - name: Runtime smoke test
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {World} from './fracture-wilds/sim.js';
          const world=new World(474);
          const input={x:.65,y:0,jump:false,grab:false,bite:false,dash:false};
          for(let i=0;i<2400;i++){input.jump=i%180===0;input.bite=i%95===0;world.step(1/60,input)}
          const s=world.stats();
          assert.ok(Number.isFinite(world.player.x)&&Number.isFinite(world.player.y));
          assert.ok(s.population>=20);
          assert.equal(world.map.dens.length,6);
          assert.ok(world.map.food.length>=100);
          assert.ok(['clear','warning','rain'].includes(s.rainPhase));
          assert.ok(world.creatures.some(c=>c.meta.predator));
          console.log(JSON.stringify({population:s.population,phase:s.rainPhase,dens:world.map.dens.length,food:world.map.food.length}));
          JS
      - name: Update main CI
        shell: bash
        run: |
          cat > .github/workflows/sandbox-god-genic-ci.yml <<'YAML'
          name: God Genic CI
          on:
            push:
              paths: ['index.html','manifest.webmanifest','sw.js','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml']
            pull_request:
              paths: ['index.html','manifest.webmanifest','sw.js','fracture-wilds/**','sandbox-god-genic/**','.github/workflows/sandbox-god-genic-ci.yml']
            workflow_dispatch:
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: {node-version: '22'}
                - uses: actions/setup-python@v5
                  with: {python-version: '3.12'}
                - uses: dtolnay/rust-toolchain@stable
                  with: {targets: wasm32-unknown-unknown}
                - name: JavaScript syntax
                  run: |
                    node --check fracture-wilds/sim.js
                    node --check fracture-wilds/game.js
                    node --check fracture-wilds/sw.js
                    node --check sw.js
                    for f in sandbox-god-genic/src/*.js; do node --check "$f"; done
                - name: Fracture Wilds runtime
                  run: |
                    node --input-type=module <<'JS'
                    import assert from 'node:assert/strict';
                    import {World} from './fracture-wilds/sim.js';
                    const w=new World(474),i={x:.7,y:0,jump:false,grab:false,bite:false,dash:false};
                    for(let n=0;n<2400;n++){i.jump=n%180===0;i.bite=n%95===0;w.step(1/60,i)}
                    const s=w.stats();assert.ok(s.population>=20);assert.equal(w.map.dens.length,6);assert.ok(w.map.food.length>=100);assert.ok(Number.isFinite(w.player.x));
                    console.log(s);
                    JS
                - name: Legacy teacher and Rust syntax
                  run: |
                    python -m py_compile sandbox-god-genic/python/teacher.py
                    cargo check --manifest-path sandbox-god-genic/rust/Cargo.toml --target wasm32-unknown-unknown
                - name: Required files
                  run: |
                    test -f fracture-wilds/index.html
                    test -f fracture-wilds/game.js
                    test -f fracture-wilds/sim.js
                    grep -q 'FRACTURE WILDS' fracture-wilds/index.html
          YAML
      - name: Remove staging payload and commit
        shell: bash
        run: |
          rm -rf fracture-wilds/.payload
          rm -f .github/workflows/apply-fracture-wilds-v5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Replace dashboard with Fracture Wilds survival game'
          git push origin HEAD:fracture-wilds-v5
