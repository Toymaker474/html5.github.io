name: Sandbox God Genic iOS

on:
  push:
    paths:
      - 'ios/SandboxGodGenic/**'
      - '.github/workflows/ios-sandbox-god-genic.yml'
  pull_request:
    paths:
      - 'ios/SandboxGodGenic/**'
      - '.github/workflows/ios-sandbox-god-genic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/SandboxGodGenic
        run: xcodegen generate

      - name: Build iOS Simulator target
        working-directory: ios/SandboxGodGenic
        shell: bash
        run: |
          set +e
          xcodebuild \
            -quiet \
            -project SandboxGodGenic.xcodeproj \
            -scheme SandboxGodGenic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Compiler diagnostics:"
            grep -E -C 3 'error:|fatal error:|BUILD FAILED|Command SwiftCompile failed' build.log | tail -n 220 || true
            exit "$status"
          fi
