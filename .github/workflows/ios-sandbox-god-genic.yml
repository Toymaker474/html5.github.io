name: Sandbox God Genic iOS

on:
  push:
    paths:
      - 'ios/SandboxGodGenic/**'
      - '.github/workflows/ios-sandbox-god-genic.yml'
  pull_request:
    paths:
      - 'ios/SandboxGodGenic/**'
      - '.github/workflows/ios-sandbox-god-genic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/SandboxGodGenic
        run: xcodegen generate

      - name: Build iOS Simulator target
        working-directory: ios/SandboxGodGenic
        run: |
          xcodebuild \
            -project SandboxGodGenic.xcodeproj \
            -scheme SandboxGodGenic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
