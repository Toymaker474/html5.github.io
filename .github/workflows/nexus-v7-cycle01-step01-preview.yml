name: Publish NEXUS V7 Cycle 01 Step 01 Preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-v7-cycle01-step01-preview.yml'
      - 'nexus-science-core-v7/src/referenceLegConnectivity.js'
      - 'nexus-science-core-v7/src/main.js'
      - 'nexus-science-core-v7/src/productionArtDirection.js'
      - 'nexus-science-core-v7/src/babylonRenderer.js'

permissions:
  contents: write

concurrency:
  group: nexus-v7-cycle01-step01-preview
  cancel-in-progress: true

jobs:
  test-render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build exact V7 source
        working-directory: nexus-science-core-v7
        run: |
          npm install --ignore-scripts=false
          npm run build
          test -f dist/index.html
          test -f dist/cad/manifest.json
          grep -q 'installReferenceLegConnectivity' src/main.js
          grep -q 'nexus.reference-leg-connectivity.v1' src/referenceLegConnectivity.js
          grep -q 'floatingParts: 0' src/referenceLegConnectivity.js
          grep -q 'torso→coxa→femur→tibia→foot' src/referenceLegConnectivity.js
          ! grep -R "position\.x +=\|rotation\.y +=\|Math\.sin.*mesh" src --include='*.js'

      - name: Install browser and GIF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p cycle01-runner artifacts/frames
          cd cycle01-runner
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run full mobile simulation and capture evidence
        run: |
          cd nexus-science-core-v7
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/nexus-cycle01-preview.log 2>&1 &
          PREVIEW_PID=$!
          cd ..
          trap 'kill $PREVIEW_PID || true' EXIT
          cat > cycle01-runner/evidence.mjs <<'EOF'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const diagnostics = [];
          page.on('pageerror', error => diagnostics.push(`pageerror: ${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error' || message.type() === 'warning') {
              diagnostics.push(`${message.type()}: ${message.text()}`);
            }
          });
          page.on('requestfailed', request => {
            diagnostics.push(`requestfailed: ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`);
          });

          await page.goto('http://127.0.0.1:4173/?cycle=01&increment=01', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });

          await page.waitForFunction(() => {
            const nexus = window.__NEXUS_V7__;
            const status = document.querySelector('#status')?.textContent || '';
            return status.includes('BOOT FAILURE') ||
              status.includes('FAIL-CLOSED') ||
              (nexus?.renderer?.referenceLegConnectivity?.ready === true && Number(nexus?.runtime?.data?.time || 0) >= 1.5);
          }, null, { timeout: 120000 });

          const bootState = await page.evaluate(() => {
            const nexus = window.__NEXUS_V7__;
            const status = document.querySelector('#status')?.textContent || '';
            return {
              status,
              bootFailure: status.includes('BOOT FAILURE'),
              failClosed: status.includes('FAIL-CLOSED'),
              runtimeTime: Number(nexus?.runtime?.data?.time || 0),
              displacement: Number(nexus?.runtime?.planarDisplacement || 0),
              maxContacts: Number(nexus?.runtime?.maxFootContactsSeen || 0),
              peakPower: Number(nexus?.runtime?.maxPowerWattsSeen || 0),
              connectivity: nexus?.renderer?.referenceLegConnectivity?.report || null,
            };
          });

          if (bootState.bootFailure || bootState.failClosed) {
            throw new Error(`Boot failed closed: ${JSON.stringify(bootState)}`);
          }

          await page.click('#evolve');
          await page.waitForFunction(() => {
            const nexus = window.__NEXUS_V7__;
            return nexus?.experiment?.generation >= 1 &&
              nexus?.archive?.cells?.size >= 1 &&
              nexus?.renderer?.referenceLegConnectivity?.ready === true;
          }, null, { timeout: 60000 });
          await page.waitForTimeout(900);

          const report = await page.evaluate(() => {
            const nexus = window.__NEXUS_V7__;
            const connectivity = nexus.renderer.referenceLegConnectivity;
            const meshNames = nexus.renderer.scene.meshes.map(mesh => mesh.name);
            const status = document.querySelector('#status')?.textContent || '';
            const buttons = [...document.querySelectorAll('button')].map(button => ({
              id: button.id,
              height: button.getBoundingClientRect().height,
            }));
            const rect = selector => {
              const value = document.querySelector(selector).getBoundingClientRect();
              return { left: value.left, right: value.right, top: value.top, bottom: value.bottom, width: value.width, height: value.height };
            };
            const overlaps = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
            const identity = rect('#identity');
            const research = rect('#research-panel');
            const controls = rect('#controls');

            return {
              schema: 'nexus.cycle-evidence.v1',
              sourceCommit: document.documentElement.dataset.sourceCommit || null,
              cycle: nexus.realismCycle,
              runtimeSchema: nexus.schema,
              runtimeTime: Number(nexus.runtime.data.time || 0),
              displacementMetres: Number(nexus.runtime.planarDisplacement || 0),
              maximumFootContacts: Number(nexus.runtime.maxFootContactsSeen || 0),
              peakActuatorPowerWatts: Number(nexus.runtime.maxPowerWattsSeen || 0),
              generation: nexus.experiment.generation,
              archiveCells: nexus.archive.cells.size,
              bestFitness: Number(nexus.archive.best?.fitness || 0),
              energyJoules: Number(nexus.coordinator.lastResult?.metrics?.energyJoules || 0),
              connectivity: connectivity.report,
              connectivityReady: connectivity.ready,
              requiredHardware: {
                hipCarrier: meshNames.includes('reference-fl-hip-carrier'),
                hipAxle: meshNames.includes('reference-fl-hip-axle'),
                kneeAxle: meshNames.includes('reference-fl-knee-axle'),
                ankleAxle: meshNames.includes('reference-fl-ankle-axle'),
                coxaCad: meshNames.includes('reference-fl-coxa-cad'),
              },
              authoredCad: nexus.renderer.artDirection?.authoredCad,
              proceduralRobotShells: nexus.renderer.artDirection?.proceduralRobotShells,
              cadSourceCommit: nexus.renderer.artDirection?.sourceCommit,
              buttonHeights: buttons,
              layoutOverlap: overlaps(identity, research) || overlaps(identity, controls) || overlaps(research, controls),
              canvas: {
                width: document.querySelector('#world')?.width || 0,
                height: document.querySelector('#world')?.height || 0,
              },
              status,
              diagnostics,
            };
          });

          const hardwareReady = Object.values(report.requiredHardware).every(Boolean);
          const invalid =
            report.runtimeSchema !== 'nexus.science-runtime.v1' ||
            report.cycle?.cycle !== 1 || report.cycle?.increment !== 1 ||
            report.runtimeTime < 1.5 || report.displacementMetres <= 0.03 ||
            report.maximumFootContacts < 1 || report.peakActuatorPowerWatts <= 0.1 ||
            report.generation < 1 || report.archiveCells < 1 || report.bestFitness <= 0 || report.energyJoules <= 0 ||
            report.connectivityReady !== true || report.connectivity?.connected !== true ||
            report.connectivity?.floatingParts !== 0 || report.connectivity?.duplicateCoxa !== 0 ||
            report.connectivity?.maximumPivotGapMetres !== 0 || !hardwareReady ||
            report.authoredCad !== true || report.proceduralRobotShells !== false ||
            report.cadSourceCommit !== '7d8fc8034d715d1c9373f48281ecfa500c994d8b' ||
            report.layoutOverlap || report.buttonHeights.some(button => button.height < 42) ||
            report.canvas.width <= 0 || report.canvas.height <= 0 ||
            report.diagnostics.some(entry => entry.startsWith('pageerror:') || entry.startsWith('requestfailed:'));

          await page.screenshot({ path: 'artifacts/nexus-v7-cycle01-step01.png', fullPage: true });
          for (let frame = 0; frame < 54; frame += 1) {
            const file = `artifacts/frames/frame-${String(frame).padStart(3, '0')}.png`;
            await page.screenshot({ path: file, fullPage: true });
            await page.waitForTimeout(85);
          }
          await writeFile('artifacts/nexus-v7-cycle01-step01-report.json', JSON.stringify(report, null, 2));
          await browser.close();

          console.log(JSON.stringify(report, null, 2));
          if (invalid) throw new Error(`Cycle 01 Step 01 failed closed: ${JSON.stringify(report)}`);
          EOF
          node cycle01-runner/evidence.mjs

      - name: Encode animated GIF
        run: |
          ffmpeg -y -framerate 12 -i artifacts/frames/frame-%03d.png \
            -filter_complex "fps=12,scale=430:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=160:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" \
            -loop 0 artifacts/nexus-v7-cycle01-step01.gif
          test -s artifacts/nexus-v7-cycle01-step01.gif
          test -s artifacts/nexus-v7-cycle01-step01.png
          test -s artifacts/nexus-v7-cycle01-step01-report.json

      - name: Add preview build receipt
        run: |
          cat > nexus-science-core-v7/dist/BUILD.json <<EOF
          {
            "schema": "nexus.github-pages-preview.v1",
            "cycle": 1,
            "increment": 1,
            "sourceBranch": "${{ github.head_ref || github.ref_name }}",
            "sourceCommit": "${{ github.sha }}",
            "workflowRun": "${{ github.run_id }}"
          }
          EOF
          mkdir -p nexus-science-core-v7/dist/evidence
          cp artifacts/nexus-v7-cycle01-step01.png nexus-science-core-v7/dist/evidence/
          cp artifacts/nexus-v7-cycle01-step01.gif nexus-science-core-v7/dist/evidence/
          cp artifacts/nexus-v7-cycle01-step01-report.json nexus-science-core-v7/dist/evidence/

      - name: Publish exact tested build to GitHub.io preview path
        run: |
          git fetch origin main
          rm -rf /tmp/nexus-pages-main
          git worktree add -B nexus-cycle01-pages /tmp/nexus-pages-main origin/main
          rm -rf /tmp/nexus-pages-main/nexus-science-core-v7-preview
          mkdir -p /tmp/nexus-pages-main/nexus-science-core-v7-preview
          cp -a nexus-science-core-v7/dist/. /tmp/nexus-pages-main/nexus-science-core-v7-preview/
          cd /tmp/nexus-pages-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-science-core-v7-preview
          if git diff --cached --quiet; then
            echo 'GitHub.io preview is already current.'
            exit 0
          fi
          git commit -m 'Publish NEXUS V7 realism cycle 01 step 01 preview'
          git push origin HEAD:main

      - name: Upload screenshot GIF and full-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v7-cycle01-step01-evidence
          path: |
            artifacts/nexus-v7-cycle01-step01.png
            artifacts/nexus-v7-cycle01-step01.gif
            artifacts/nexus-v7-cycle01-step01-report.json
          if-no-files-found: warn
