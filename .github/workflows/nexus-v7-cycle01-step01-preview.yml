name: Publish NEXUS Mobile Robot World

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'nexus-science-core-v7/**'
      - '.github/workflows/nexus-v7-cycle01-step01-preview.yml'

permissions:
  contents: write

concurrency:
  group: nexus-mobile-robot-world-release
  cancel-in-progress: true

jobs:
  test-publish-live-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact V7 product branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: nexus-mujoco-science-core-v7

      - name: Bind immutable source revision
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and run source-level science gates
        working-directory: nexus-science-core-v7
        run: |
          npm install --ignore-scripts=false
          node --check src/worldCourseData.js
          node --check src/worldCourseVisuals.js
          node --check src/mobileWorldApp.js
          node --check src/controller.js
          node --check src/research/morphologyGenome.js
          node --check src/mobileCameraFraming.js
          grep -q 'nexus.robot-world-course.v1' src/worldCourseData.js
          grep -q 'compileWorldCourseMjcf' src/research/morphologyGenome.js
          grep -q 'setDriveCommand' src/controller.js
          grep -q 'nexus.mobile-robot-world-app.v1' src/mobileWorldApp.js
          grep -q 'installMobileWorldApp' src/mobileCameraFraming.js
          npm run test:science
          npm run build
          test -f dist/index.html
          test -f dist/cad/manifest.json

      - name: Install browser and GIF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p robot-world-test artifacts/robot-world/frames
          cd robot-world-test
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Test full mobile simulation and every product tool
        run: |
          cd nexus-science-core-v7
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/nexus-robot-world-preview.log 2>&1 &
          PREVIEW_PID=$!
          cd ..
          trap 'kill $PREVIEW_PID || true' EXIT
          cat > robot-world-test/verify-local.mjs <<'EOF_NODE'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const obstacleNames = [
            'course_north-service-crate',
            'course_south-service-crate',
            'course_west-low-block',
            'course_east-inspection-block',
            'course_rear-dock-stop',
          ];

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-gl=swiftshader',
              '--enable-webgl',
              '--enable-unsafe-swiftshader',
              '--ignore-gpu-blocklist',
            ],
          });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const diagnostics = [];
          page.on('pageerror', error => diagnostics.push(`pageerror: ${error.message}`));
          page.on('requestfailed', request => diagnostics.push(`requestfailed: ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`));
          page.on('console', message => {
            if (message.type() === 'error') diagnostics.push(`console-error: ${message.text()}`);
          });

          await page.goto('http://127.0.0.1:4173/?robot=explorer&release=robot-world', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });
          await page.waitForFunction(() => {
            const nexus = window.__NEXUS_V7__;
            const app = window.__NEXUS_WORLD_APP__;
            return app?.ready === true &&
              nexus?.renderer?.worldCourse?.report?.ready === true &&
              nexus?.renderer?.referenceLegConnectivity?.ready === true &&
              nexus?.renderer?.authoritativeVisualRig?.report?.ready === true &&
              nexus?.renderer?.mobileCameraFit?.readableFill === true &&
              Number(nexus?.runtime?.data?.time || 0) > 0.55;
          }, null, { timeout: 120000 });

          async function clickWorld(id, expectedAction, timeout = 25000) {
            const before = await page.evaluate(() => window.__NEXUS_WORLD_APP__.ledger.length);
            const started = Date.now();
            await page.locator(`#${id}`).click({ timeout: 15000 });
            await page.waitForFunction(({ before, expectedAction }) => {
              const rows = window.__NEXUS_WORLD_APP__?.ledger || [];
              return rows.slice(before).some(row => row.action === expectedAction && (row.status === 'pass' || row.status === 'fail'));
            }, { before, expectedAction }, { timeout });
            const receipt = await page.evaluate(({ before, expectedAction }) =>
              window.__NEXUS_WORLD_APP__.ledger.slice(before).find(row => row.action === expectedAction),
            { before, expectedAction });
            if (!receipt || receipt.status !== 'pass') throw new Error(`${id} failed: ${JSON.stringify(receipt)}`);
            return { receipt, responseMilliseconds: Date.now() - started };
          }

          const initial = await page.evaluate((obstacleNames) => {
            const nexus = window.__NEXUS_V7__;
            const model = nexus.runtime.model;
            const physicsObstacleIds = obstacleNames.map((name) => {
              const geom = model.geom(name);
              if (!geom) return -1;
              const id = Number(geom.id);
              geom.delete?.();
              return id;
            });
            return {
              time: Number(nexus.runtime.data.time),
              seed: Number(nexus.runtime.controller.genome.seed),
              drive: nexus.runtime.controller.driveCommand,
              physicsObstacleIds,
              course: nexus.renderer.worldCourse.report,
              product: nexus.renderer.worldProductProfile,
              camera: nexus.renderer.mobileCameraFit,
              connectivity: nexus.renderer.referenceLegConnectivity.report,
              rig: nexus.renderer.authoritativeVisualRig.report,
            };
          }, obstacleNames);

          const actions = [];
          actions.push(await clickWorld('world-stop', 'stop'));
          const stopped = await page.evaluate(() => window.__NEXUS_WORLD_APP__.driveCommand);
          if (stopped.mode !== 'stop' || stopped.throttle !== 0) throw new Error(`Stop command failed: ${JSON.stringify(stopped)}`);

          const beforeWalkTime = await page.evaluate(() => Number(window.__NEXUS_V7__.runtime.data.time));
          actions.push(await clickWorld('world-walk', 'walk'));
          await page.waitForFunction((start) => Number(window.__NEXUS_V7__.runtime.data.time) > start + 0.20, beforeWalkTime, { timeout: 25000 });

          actions.push(await clickWorld('world-left', 'left'));
          const left = await page.evaluate(() => window.__NEXUS_WORLD_APP__.driveCommand);
          if (!(left.turn > 0 && left.throttle > 0)) throw new Error(`Left command failed: ${JSON.stringify(left)}`);

          actions.push(await clickWorld('world-right', 'right'));
          const right = await page.evaluate(() => window.__NEXUS_WORLD_APP__.driveCommand);
          if (!(right.turn < 0 && right.throttle > 0)) throw new Error(`Right command failed: ${JSON.stringify(right)}`);

          actions.push(await clickWorld('world-reset', 'reset'));
          const resetReceipt = actions.at(-1).receipt;
          if (Math.abs(resetReceipt.after.simulationTime) > 0.005) {
            throw new Error(`Reset did not capture t=0: ${JSON.stringify(resetReceipt)}`);
          }

          actions.push(await clickWorld('world-walk', 'walk'));
          const seedBeforeMutation = await page.evaluate(() => Number(window.__NEXUS_V7__.runtime.controller.genome.seed));
          actions.push(await clickWorld('world-mutate', 'mutate', 40000));
          const seedAfterMutation = await page.evaluate(() => Number(window.__NEXUS_V7__.runtime.controller.genome.seed));
          if (seedAfterMutation === seedBeforeMutation) throw new Error('Mutate gait did not change the controller genome seed.');

          const generationBefore = await page.evaluate(() => Number(window.__NEXUS_V7__.experiment.generation));
          actions.push(await clickWorld('world-train', 'evolve', 100000));
          const training = await page.evaluate(() => ({
            generation: Number(window.__NEXUS_V7__.experiment.generation),
            result: window.__NEXUS_V7__.coordinator.lastResult,
            enabled: window.__NEXUS_V7__.coordinator.enabled,
          }));
          if (training.generation <= generationBefore || !training.result || training.enabled) {
            throw new Error(`Training did not produce one authoritative generation: ${JSON.stringify(training)}`);
          }

          await page.locator('#world-robots').click();
          await page.waitForFunction(() => document.querySelector('#preset-panel')?.dataset.open === 'true');
          await page.locator('button[data-preset-id="sandwalker"]').click();
          await page.waitForFunction(() => {
            const nexus = window.__NEXUS_V7__;
            return nexus?.activePreset?.id === 'sandwalker' &&
              nexus?.renderer?.worldCourse?.report?.ready === true &&
              nexus?.renderer?.referenceLegConnectivity?.ready === true &&
              nexus?.renderer?.authoritativeVisualRig?.report?.ready === true &&
              nexus?.renderer?.mobileCameraFit?.readableFill === true &&
              window.__NEXUS_WORLD_APP__?.ready === true;
          }, null, { timeout: 120000 });
          actions.push(await clickWorld('world-stop', 'stop'));
          actions.push(await clickWorld('world-walk', 'walk'));
          await page.waitForTimeout(1200);

          const report = await page.evaluate(() => {
            const nexus = window.__NEXUS_V7__;
            const app = window.__NEXUS_WORLD_APP__;
            const rect = (selector) => {
              const node = document.querySelector(selector);
              const value = node?.getBoundingClientRect();
              return value ? { left: value.left, right: value.right, top: value.top, bottom: value.bottom, width: value.width, height: value.height } : null;
            };
            const overlaps = (a, b) => a && b && a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
            const hud = rect('#world-hud');
            const toast = rect('#world-action-toast');
            const deck = rect('#world-drive-deck');
            const buttons = [...document.querySelectorAll('#world-drive-deck button, #world-panel-buttons button')].map(button => ({
              id: button.id,
              width: button.getBoundingClientRect().width,
              height: button.getBoundingClientRect().height,
              disabled: button.disabled,
            }));
            return {
              schema: 'nexus.mobile-robot-world-browser-proof.v1',
              appSchema: app.schema,
              activePreset: nexus.activePreset.id,
              runtimeTime: Number(nexus.runtime.data.time),
              displacementMetres: Number(nexus.runtime.planarDisplacement),
              maximumFootContacts: Number(nexus.runtime.maxFootContactsSeen),
              peakPowerWatts: Number(nexus.runtime.maxPowerWattsSeen),
              driveCommand: app.driveCommand,
              appLedger: app.ledger,
              course: app.courseReport,
              product: app.productProfile,
              camera: nexus.renderer.mobileCameraFit,
              connectivity: nexus.renderer.referenceLegConnectivity.report,
              rig: nexus.renderer.authoritativeVisualRig.report,
              operationalFrameRate: Number(window.__NEXUS_OPERATIONAL__?.latestFrameRate || 0),
              rendererBackend: nexus.renderer.backend,
              generation: Number(nexus.experiment.generation),
              lastTraining: nexus.coordinator.lastResult,
              canvas: {
                width: document.querySelector('#world')?.width || 0,
                height: document.querySelector('#world')?.height || 0,
              },
              layout: {
                hud,
                toast,
                deck,
                overlap: overlaps(hud, deck) || overlaps(toast, deck) || overlaps(hud, toast),
                buttons,
              },
              toastText: document.querySelector('#world-action-toast')?.textContent || '',
            };
          });
          report.actions = actions;
          report.diagnostics = diagnostics;
          report.initial = initial;

          const invalid =
            report.appSchema !== 'nexus.mobile-robot-world-app.v1' ||
            report.activePreset !== 'sandwalker' ||
            report.course?.ready !== true ||
            report.course?.physicsObstacleCount !== 5 ||
            report.course?.visualObstacleCount !== 5 ||
            report.course?.fakeCollisionMeshes !== 0 ||
            initial.physicsObstacleIds.some(id => !Number.isInteger(id) || id < 0) ||
            report.product?.schema !== 'nexus.mobile-robot-world-product.v1' ||
            report.product?.driveAuthority !== 'twelve actuator targets' ||
            report.camera?.readableFill !== true ||
            report.connectivity?.connectedLegs !== 6 ||
            report.connectivity?.floatingParts !== 0 ||
            report.connectivity?.maximumPivotGapMetres !== 0 ||
            report.rig?.ready !== true || report.rig?.segmentCount !== 12 ||
            report.runtimeTime <= 0.2 || report.maximumFootContacts < 1 || report.peakPowerWatts <= 0.1 ||
            report.generation < 1 || !report.lastTraining ||
            report.actions.some(action => action.receipt.status !== 'pass') ||
            report.actions.slice(0, 5).some(action => action.responseMilliseconds > 2500) ||
            report.layout.overlap ||
            report.layout.buttons.length !== 10 ||
            report.layout.buttons.some(button => button.height < 42 || button.width < 42 || button.disabled) ||
            report.canvas.width <= 0 || report.canvas.height <= 0 ||
            report.operationalFrameRate <= 1 ||
            diagnostics.length > 0;

          await page.screenshot({ path: 'artifacts/robot-world/nexus-robot-world.png', fullPage: true });
          for (let frame = 0; frame < 48; frame += 1) {
            await page.screenshot({
              path: `artifacts/robot-world/frames/frame-${String(frame).padStart(3, '0')}.png`,
              fullPage: true,
            });
            await page.waitForTimeout(95);
          }
          await writeFile('artifacts/robot-world/nexus-robot-world-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          if (invalid) throw new Error(`Mobile Robot World failed closed: ${JSON.stringify(report)}`);
          EOF_NODE
          node robot-world-test/verify-local.mjs

      - name: Encode tested Robot World motion GIF
        run: |
          ffmpeg -y -framerate 10 -i artifacts/robot-world/frames/frame-%03d.png \
            -filter_complex "fps=10,scale=430:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=176:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" \
            -loop 0 artifacts/robot-world/nexus-robot-world.gif
          test -s artifacts/robot-world/nexus-robot-world.png
          test -s artifacts/robot-world/nexus-robot-world.gif
          test -s artifacts/robot-world/nexus-robot-world-report.json

      - name: Bind exact release receipt and evidence
        run: |
          cat > nexus-science-core-v7/dist/BUILD.json <<EOF_BUILD
          {
            "schema": "nexus.robot-world-release.v1",
            "release": 1,
            "sourceBranch": "nexus-mujoco-science-core-v7",
            "sourceCommit": "${SOURCE_SHA}",
            "workflowRun": "${GITHUB_RUN_ID}",
            "physicsAuthority": "MuJoCo 3.10 WASM",
            "mobileBrowserVerified": true,
            "physicalIPhoneCertified": false
          }
          EOF_BUILD
          mkdir -p nexus-science-core-v7/dist/evidence
          cp artifacts/robot-world/nexus-robot-world.png nexus-science-core-v7/dist/evidence/
          cp artifacts/robot-world/nexus-robot-world.gif nexus-science-core-v7/dist/evidence/
          cp artifacts/robot-world/nexus-robot-world-report.json nexus-science-core-v7/dist/evidence/

      - name: Publish exact tested build to GitHub.io source
        run: |
          git fetch origin main
          rm -rf /tmp/nexus-robot-world-main
          git worktree add -B nexus-robot-world-pages /tmp/nexus-robot-world-main origin/main
          rm -rf /tmp/nexus-robot-world-main/nexus-science-core-v7-preview
          mkdir -p /tmp/nexus-robot-world-main/nexus-science-core-v7-preview
          cp -a nexus-science-core-v7/dist/. /tmp/nexus-robot-world-main/nexus-science-core-v7-preview/
          cd /tmp/nexus-robot-world-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-science-core-v7-preview
          if git diff --cached --quiet; then
            echo 'GitHub.io Robot World is already current.'
          else
            git commit -m 'Publish full NEXUS mobile Robot World'
            git push origin HEAD:main
          fi

      - name: Verify public GitHub.io world and controls
        env:
          LIVE_BASE: https://toymaker474.github.io/html5.github.io/nexus-science-core-v7-preview
        run: |
          cat > robot-world-test/verify-live.mjs <<'EOF_NODE'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const base = process.env.LIVE_BASE;
          const expectedCommit = process.env.SOURCE_SHA;
          const runId = process.env.GITHUB_RUN_ID;
          let receipt = null;
          for (let attempt = 0; attempt < 54; attempt += 1) {
            try {
              const response = await fetch(`${base}/BUILD.json?run=${runId}&attempt=${attempt}`, { cache: 'no-store' });
              if (response.ok) {
                const candidate = await response.json();
                if (candidate.schema === 'nexus.robot-world-release.v1' && candidate.sourceCommit === expectedCommit) {
                  receipt = candidate;
                  break;
                }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!receipt) throw new Error(`GitHub Pages did not expose Robot World commit ${expectedCommit}.`);

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'],
          });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const diagnostics = [];
          page.on('pageerror', error => diagnostics.push(`pageerror: ${error.message}`));
          page.on('requestfailed', request => diagnostics.push(`requestfailed: ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`));
          page.on('console', message => {
            if (message.type() === 'error') diagnostics.push(`console-error: ${message.text()}`);
          });

          await page.goto(`${base}/?release=robot-world&run=${runId}`, {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });
          await page.waitForFunction(() =>
            window.__NEXUS_WORLD_APP__?.ready === true &&
            window.__NEXUS_V7__?.renderer?.worldCourse?.report?.ready === true &&
            window.__NEXUS_V7__?.renderer?.mobileCameraFit?.readableFill === true,
          null, { timeout: 120000 });

          await page.locator('#world-stop').click();
          await page.waitForFunction(() => window.__NEXUS_WORLD_APP__?.driveCommand?.mode === 'stop');
          const startTime = await page.evaluate(() => Number(window.__NEXUS_V7__.runtime.data.time));
          await page.locator('#world-walk').click();
          await page.waitForFunction((start) =>
            window.__NEXUS_WORLD_APP__?.driveCommand?.mode === 'walk' &&
            Number(window.__NEXUS_V7__.runtime.data.time) > start + 0.18,
          startTime, { timeout: 30000 });

          const report = await page.evaluate(() => ({
            schema: 'nexus.robot-world-live-proof.v1',
            activePreset: window.__NEXUS_V7__.activePreset.id,
            runtimeTime: Number(window.__NEXUS_V7__.runtime.data.time),
            drive: window.__NEXUS_WORLD_APP__.driveCommand,
            course: window.__NEXUS_WORLD_APP__.courseReport,
            product: window.__NEXUS_WORLD_APP__.productProfile,
            camera: window.__NEXUS_V7__.renderer.mobileCameraFit,
            connectivity: window.__NEXUS_V7__.renderer.referenceLegConnectivity.report,
            rig: window.__NEXUS_V7__.renderer.authoritativeVisualRig.report,
            appLedger: window.__NEXUS_WORLD_APP__.ledger,
          }));
          report.receipt = receipt;
          report.diagnostics = diagnostics;
          await writeFile('artifacts/robot-world/nexus-robot-world-live-report.json', JSON.stringify(report, null, 2));
          await browser.close();

          const invalid =
            report.receipt.sourceCommit !== expectedCommit ||
            report.course?.physicsObstacleCount !== 5 || report.course?.visualObstacleCount !== 5 ||
            report.product?.schema !== 'nexus.mobile-robot-world-product.v1' ||
            report.camera?.readableFill !== true ||
            report.connectivity?.connectedLegs !== 6 ||
            report.rig?.ready !== true ||
            report.drive?.mode !== 'walk' || report.runtimeTime <= 0.18 ||
            diagnostics.length > 0;
          console.log(JSON.stringify(report, null, 2));
          if (invalid) throw new Error(`Public Robot World failed closed: ${JSON.stringify(report)}`);
          EOF_NODE
          node robot-world-test/verify-live.mjs

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-mobile-robot-world-${{ github.run_id }}
          path: |
            artifacts/robot-world/nexus-robot-world.png
            artifacts/robot-world/nexus-robot-world.gif
            artifacts/robot-world/nexus-robot-world-report.json
            artifacts/robot-world/nexus-robot-world-live-report.json
            /tmp/nexus-robot-world-preview.log
          if-no-files-found: warn
          retention-days: 14
