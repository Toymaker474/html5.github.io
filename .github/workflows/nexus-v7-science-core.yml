name: Validate NEXUS V7 Science Core

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-v7-science-core.yml'
      - 'nexus-science-core-v7/**'

permissions:
  contents: read

concurrency:
  group: nexus-v7-science-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: nexus-science-core-v7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact dependencies
        run: npm install --ignore-scripts=false

      - name: Build MuJoCo WASM, pinned CAD and Babylon application
        run: npm run build

      - name: Verify scientific architecture, CAD provenance and AI contract
        run: |
          test -f dist/index.html
          test -f nexus.project.json
          test -f docs/AI_EXTENSION_PROTOCOL.md
          test -f docs/VISUAL_STANDARD.md
          test -f src/productionArtDirection.js
          test -f tools/fetchCadAssets.mjs
          test -f public/cad/manifest.json
          test -f public/cad/ATTRIBUTION.txt
          test "$(find public/cad -maxdepth 1 -name '*.stl' | wc -l)" -eq 10
          node -e "JSON.parse(require('fs').readFileSync('nexus.project.json','utf8'))"
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('public/cad/manifest.json', 'utf8'));
          if (manifest.schema !== 'nexus.cad-asset-manifest.v1') throw new Error('Wrong CAD manifest schema.');
          if (manifest.sourceRepository !== 'MakeYourPet/hexapod') throw new Error('Unexpected CAD source repository.');
          if (manifest.sourceCommit !== '7d8fc8034d715d1c9373f48281ecfa500c994d8b') throw new Error('CAD source is not immutable.');
          if (manifest.license !== 'MIT' || manifest.assets.length !== 10) throw new Error('CAD license or completeness failed.');
          for (const asset of manifest.assets) {
            if (asset.bytes < 512 || !/^[a-f0-9]{64}$/.test(asset.sha256) || !/^[a-f0-9]{40}$/.test(asset.gitBlobSha1)) {
              throw new Error(`Invalid CAD receipt for ${asset.id}.`);
            }
          }
          console.log(JSON.stringify(manifest, null, 2));
          EOF
          grep -q 'MjModel.from_xml_string' src/mujocoRuntime.js
          grep -q 'mj_step' src/mujocoRuntime.js
          grep -q 'actuator_force' src/mujocoRuntime.js
          grep -q 'actuator_velocity' src/mujocoRuntime.js
          grep -q 'maxFootContactsSeen' src/mujocoRuntime.js
          grep -q 'planarDisplacement' src/mujocoRuntime.js
          grep -q 'compileMorphologyToMjcf' src/research/morphologyGenome.js
          grep -q 'validateMorphology' src/research/morphologyGenome.js
          grep -q 'touch_' src/research/morphologyGenome.js
          grep -q 'Hybrid neural central-pattern generator' src/controller.js
          grep -q 'QualityDiversityArchive' src/research/qualityDiversity.js
          grep -q 'LocomotionExperiment' src/research/experimentProtocol.js
          grep -q 'PBRMaterial' src/babylonRenderer.js
          grep -q 'ShadowGenerator' src/babylonRenderer.js
          grep -q 'SceneLoader.ImportMeshAsync' src/productionArtDirection.js
          grep -q '@babylonjs/loaders/STL/stlFileLoader.js' src/productionArtDirection.js
          grep -q "nexus.cad-authored-hexapod.v1" src/productionArtDirection.js
          grep -q 'proceduralRobotShells: false' src/productionArtDirection.js
          grep -q 'offlineAssetBundle: true' src/productionArtDirection.js
          grep -q 'EXPECTED_CAD_COMMIT' src/productionArtDirection.js
          grep -q 'QUALITY-DIVERSITY RUN' index.html
          ! grep -q 'createTaperedPrism' src/productionArtDirection.js
          ! grep -R "position\.x +=\|rotation\.y +=\|Math\.sin.*mesh" src --include='*.js'

      - name: Validate morphology mutations outside the renderer
        run: |
          node --input-type=module <<'EOF'
          import {
            compileMorphologyToMjcf,
            DEFAULT_MORPHOLOGY,
            mutateMorphology,
            validateMorphology,
          } from './src/research/morphologyGenome.js';

          const baseline = validateMorphology(DEFAULT_MORPHOLOGY);
          if (!baseline.valid) throw new Error(baseline.errors.join('\n'));
          const child = mutateMorphology(DEFAULT_MORPHOLOGY, 0x12345678, 1);
          const childValidation = validateMorphology(child);
          if (!childValidation.valid) throw new Error(childValidation.errors.join('\n'));
          const xml = compileMorphologyToMjcf(child);
          if (!xml.includes('<mujoco') || !xml.includes('touch_fl') || child.seed === DEFAULT_MORPHOLOGY.seed) {
            throw new Error('Morphology compiler did not produce an independently mutated MJCF model.');
          }
          console.log(JSON.stringify({ baseline, childValidation, childSeed: child.seed }));
          EOF

      - name: Install browser smoke-test runtime
        working-directory: .
        run: |
          mkdir -p nexus-v7-smoke artifacts
          cd nexus-v7-smoke
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Prove MuJoCo motion, CAD rendering and autonomous MAP-Elites evolution
        working-directory: .
        run: |
          cd nexus-science-core-v7
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/nexus-v7-preview.log 2>&1 &
          PREVIEW_PID=$!
          cd ..
          trap 'kill $PREVIEW_PID || true' EXIT
          cat > nexus-v7-smoke/smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const diagnostics = [];
          page.on('pageerror', error => diagnostics.push(`pageerror: ${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error' || message.type() === 'warning') diagnostics.push(`${message.type()}: ${message.text()}`);
          });
          page.on('requestfailed', request => diagnostics.push(`requestfailed: ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`));

          await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForFunction(() => {
            const text = document.querySelector('#status')?.textContent || '';
            return text.includes('MUJOCO AUTHORITY') || text.includes('BOOT FAILURE') || text.includes('FAIL-CLOSED');
          }, null, { timeout: 120000 });

          await page.waitForFunction(() => {
            const nexus = window.__NEXUS_V7__;
            const text = document.querySelector('#status')?.textContent || '';
            return text.includes('BOOT FAILURE') || text.includes('FAIL-CLOSED') || Number(nexus?.runtime?.data?.time || 0) >= 1.25;
          }, null, { timeout: 35000 });

          const preEvolution = await page.evaluate(() => {
            const nexus = window.__NEXUS_V7__;
            const status = document.querySelector('#status')?.textContent || '';
            const number = (pattern) => Number(status.match(pattern)?.[1] || 0);
            return {
              status,
              authoritativeTime: Number(nexus?.runtime?.data?.time || 0),
              simTime: number(/SIM\s+(\d+\.\d+)\s+s/),
              maxContacts: number(/MAX\s+(\d+)\/6/),
              displacement: number(/DIST\s+(\d+\.\d+)\s+m/),
              peakPower: number(/PEAK\s+(\d+\.\d+)\s+W/),
              battery: number(/BATTERY\s+(\d+\.\d+)%/),
              authority: status.includes('MUJOCO AUTHORITY'),
              bootFailure: status.includes('BOOT FAILURE'),
              failClosed: status.includes('FAIL-CLOSED'),
            };
          });

          await page.click('#evolve');
          await page.waitForFunction(() => {
            const nexus = window.__NEXUS_V7__;
            return nexus && nexus.experiment.generation >= 1 && nexus.archive.cells.size >= 1 && nexus.archive.best?.fitness > 0;
          }, null, { timeout: 45000 });
          await page.waitForTimeout(1200);

          const postEvolution = await page.evaluate(() => {
            const nexus = window.__NEXUS_V7__;
            const rect = (selector) => {
              const value = document.querySelector(selector).getBoundingClientRect();
              return { left: value.left, right: value.right, top: value.top, bottom: value.bottom, width: value.width, height: value.height };
            };
            const overlaps = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
            const identity = rect('#identity');
            const research = rect('#research-panel');
            const controls = rect('#controls');
            const buttons = [...document.querySelectorAll('button')].map((button) => ({ id: button.id, height: button.getBoundingClientRect().height }));
            const meshNames = nexus.renderer.scene.meshes.map((mesh) => mesh.name);

            return {
              runtimeSchema: nexus.schema,
              genomeSchema: nexus.runtime.controller.genome.schema,
              generation: nexus.experiment.generation,
              archiveCells: nexus.archive.cells.size,
              archiveCoverage: nexus.archive.coverage,
              bestFitness: nexus.archive.best?.fitness || 0,
              lastEnergy: nexus.coordinator.lastResult?.metrics.energyJoules || 0,
              lastDisplacement: nexus.coordinator.lastResult?.metrics.displacementMetres || 0,
              evolving: nexus.coordinator.enabled,
              evaluation: nexus.evaluation,
              artDirection: nexus.renderer.artDirection?.id,
              authoredCad: nexus.renderer.artDirection?.authoredCad,
              proceduralRobotShells: nexus.renderer.artDirection?.proceduralRobotShells,
              offlineAssetBundle: nexus.renderer.artDirection?.offlineAssetBundle,
              cadSourceCommit: nexus.renderer.artDirection?.sourceCommit,
              cadAssetCount: nexus.renderer.artDirection?.assetCount,
              cadTemplateCount: meshNames.filter((name) => name.startsWith('cad-template-')).length,
              cadInstanceCount: meshNames.filter((name) => /^cad-.*-instance-/.test(name)).length,
              hasCadPlinth: meshNames.includes('cad-specimen-plinth'),
              hasPrototypeChamber: meshNames.includes('containment-chamber'),
              prototypeVisualCount: meshNames.filter((name) => /torso-hull|core-shell|foot-shell|torso-carapace|limb-upper-shell|foot-toe/.test(name)).length,
              visualAssemblies: nexus.renderer.meshes.filter((node) => node?.isEnabled?.()).length,
              sceneMeshCount: nexus.renderer.scene.meshes.length,
              archiveCanvas: rect('#archive-map'),
              buttonHeights: buttons,
              layoutOverlap: overlaps(identity, research) || overlaps(identity, controls) || overlaps(research, controls),
              canvasWidth: document.querySelector('#world')?.width || 0,
              canvasHeight: document.querySelector('#world')?.height || 0,
            };
          });

          await page.screenshot({ path: 'artifacts/nexus-v7-science-core.png', fullPage: true });
          await browser.close();

          const evidence = { preEvolution, postEvolution, diagnostics };
          console.log(JSON.stringify(evidence, null, 2));
          const invalid =
            !preEvolution.authority || preEvolution.bootFailure || preEvolution.failClosed ||
            preEvolution.authoritativeTime < 1.25 || preEvolution.maxContacts < 1 ||
            preEvolution.displacement <= 0.03 || preEvolution.peakPower <= 0.1 || preEvolution.battery <= 0 ||
            postEvolution.runtimeSchema !== 'nexus.science-runtime.v1' ||
            postEvolution.genomeSchema !== 'nexus.neural-cpg-genome.v1' ||
            postEvolution.generation < 1 || postEvolution.archiveCells < 1 ||
            postEvolution.bestFitness <= 0 || postEvolution.lastEnergy <= 0 ||
            postEvolution.evaluation?.timeScale !== 4 ||
            postEvolution.artDirection !== 'nexus.cad-authored-hexapod.v1' ||
            postEvolution.authoredCad !== true || postEvolution.proceduralRobotShells !== false ||
            postEvolution.offlineAssetBundle !== true ||
            postEvolution.cadSourceCommit !== '7d8fc8034d715d1c9373f48281ecfa500c994d8b' ||
            postEvolution.cadAssetCount !== 10 || postEvolution.cadTemplateCount !== 10 ||
            postEvolution.cadInstanceCount < 20 || !postEvolution.hasCadPlinth ||
            postEvolution.hasPrototypeChamber || postEvolution.prototypeVisualCount !== 0 ||
            postEvolution.visualAssemblies < 10 || postEvolution.sceneMeshCount < 40 ||
            postEvolution.archiveCanvas.width <= 0 || postEvolution.layoutOverlap ||
            postEvolution.buttonHeights.some(button => button.height < 42) || postEvolution.canvasWidth <= 0;
          if (invalid) throw new Error(`V7 scientific runtime failed closed: ${JSON.stringify(evidence)}`);
          EOF
          node nexus-v7-smoke/smoke.mjs

      - name: Upload V7 scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v7-science-core-evidence
          path: artifacts/nexus-v7-science-core.png
          if-no-files-found: warn
