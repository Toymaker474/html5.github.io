name: Validate NEXUS V7 Science Core

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-v7-science-core.yml'
      - 'nexus-science-core-v7/**'

permissions:
  contents: read

concurrency:
  group: nexus-v7-science-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nexus-science-core-v7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact dependencies
        run: npm install --ignore-scripts=false

      - name: Build MuJoCo WASM and Babylon application
        run: npm run build

      - name: Verify scientific architecture markers
        run: |
          test -f dist/index.html
          grep -q 'MjModel.from_xml_string' src/mujocoRuntime.js
          grep -q 'mj_step' src/mujocoRuntime.js
          grep -q 'actuator_force' src/mujocoRuntime.js
          grep -q 'actuator_velocity' src/mujocoRuntime.js
          grep -q 'maxFootContactsSeen' src/mujocoRuntime.js
          grep -q 'planarDisplacement' src/mujocoRuntime.js
          grep -q 'touch_' src/hexapodModel.js
          grep -q 'WebGPUEngine' src/babylonRenderer.js
          grep -q 'updateFollowCamera' src/babylonRenderer.js
          ! grep -R "position\.x +=\|rotation\.y +=\|Math\.sin.*mesh" src --include='*.js'

      - name: Install browser smoke-test runtime
        working-directory: .
        run: |
          mkdir -p nexus-v7-smoke artifacts
          cd nexus-v7-smoke
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Prove MuJoCo motion in mobile-sized browser
        working-directory: .
        run: |
          cd nexus-science-core-v7
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/nexus-v7-preview.log 2>&1 &
          PREVIEW_PID=$!
          cd ..
          trap 'kill $PREVIEW_PID || true' EXIT
          cat > nexus-v7-smoke/smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const diagnostics = [];
          page.on('pageerror', error => diagnostics.push(`pageerror: ${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error' || message.type() === 'warning') {
              diagnostics.push(`${message.type()}: ${message.text()}`);
            }
          });
          page.on('requestfailed', request => {
            diagnostics.push(`requestfailed: ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`);
          });

          await page.goto('http://127.0.0.1:4173', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });

          await page.waitForFunction(() => {
            const text = document.querySelector('#status')?.textContent || '';
            return text.includes('MUJOCO AUTHORITY') ||
              text.includes('BOOT FAILURE') ||
              text.includes('FAIL-CLOSED');
          }, null, { timeout: 120000 });

          await page.waitForTimeout(7000);
          const report = await page.evaluate(() => {
            const status = document.querySelector('#status')?.textContent || '';
            const number = (pattern) => Number(status.match(pattern)?.[1] || 0);
            return {
              status,
              simTime: number(/SIM\s+(\d+\.\d+)\s+s/),
              currentContacts: number(/·\s+(\d+)\/6\s+FEET/),
              maxContacts: number(/MAX\s+(\d+)\/6/),
              displacement: number(/DIST\s+(\d+\.\d+)\s+m/),
              power: number(/POWER\s+(\d+\.\d+)\s+W/),
              peakPower: number(/PEAK\s+(\d+\.\d+)\s+W/),
              battery: number(/BATTERY\s+(\d+\.\d+)%/),
              canvasWidth: document.querySelector('#world')?.width || 0,
              canvasHeight: document.querySelector('#world')?.height || 0,
              bootFailure: status.includes('BOOT FAILURE'),
              failClosed: status.includes('FAIL-CLOSED'),
              authority: status.includes('MUJOCO AUTHORITY'),
            };
          });

          await page.screenshot({ path: 'artifacts/nexus-v7-science-core.png', fullPage: true });
          await browser.close();

          const evidence = { report, diagnostics };
          console.log(JSON.stringify(evidence, null, 2));
          const invalid =
            !report.authority ||
            report.bootFailure ||
            report.failClosed ||
            report.simTime <= 2 ||
            report.maxContacts < 1 ||
            report.displacement <= 0.03 ||
            report.peakPower <= 0.1 ||
            report.battery <= 0 ||
            report.canvasWidth <= 0;
          if (invalid) {
            throw new Error(`V7 scientific runtime failed closed: ${JSON.stringify(evidence)}`);
          }
          EOF
          node nexus-v7-smoke/smoke.mjs

      - name: Upload V7 scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v7-science-core-evidence
          path: artifacts/nexus-v7-science-core.png
          if-no-files-found: warn
