name: Render NEXUS V6 Final Presentation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-v6-final-presentation.yml'
      - '.nexus-v6-final-trigger'
      - 'nexus-glass-science-cube/patch-authored-robots-v6.py'
      - 'nexus-glass-science-cube/patch-authored-scene-v6.py'
      - 'nexus-glass-science-cube/patch-authored-presentation-v6.py'

permissions:
  contents: write

concurrency:
  group: nexus-v6-final-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Rebuild V6 from clean production foundation
        run: |
          git show origin/main:nexus-glass-science-cube/main.js > nexus-glass-science-cube/main.js
          git show origin/main:nexus-glass-science-cube/sw.js > nexus-glass-science-cube/sw.js
          git show origin/main:nexus-glass-science-cube/index.html > nexus-glass-science-cube/index.html
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts=sorted(Path('.nexus-payload').glob('main.part.*'))
          encoded=''.join(path.read_text(encoding='utf-8') for path in parts)
          source=gzip.decompress(base64.b64decode(''.join(encoded.split()))).decode('utf-8')
          Path('nexus-glass-science-cube/runtime-source.js').write_text(source,encoding='utf-8')
          PY
          python nexus-glass-science-cube/patch-robot-art.py
          python nexus-glass-science-cube/patch-robot-grounding.py
          python nexus-glass-science-cube/patch-authored-robots-v6.py
          python nexus-glass-science-cube/patch-authored-scene-v6.py
          python nexus-glass-science-cube/patch-authored-presentation-v6.py

      - name: Set final V6 identity
        shell: python
        run: |
          from pathlib import Path
          main=Path('nexus-glass-science-cube/main.js')
          text=main.read_text(encoding='utf-8').replace('robot-rig-v4-20260805','authored-robots-v6-final-20260805').replace('sw.js?v=4','sw.js?v=6')
          main.write_text(text,encoding='utf-8')
          sw=Path('nexus-glass-science-cube/sw.js')
          text=sw.read_text(encoding='utf-8').replace('nexus-field-lab-v4','nexus-authored-robots-v6-final').replace('?v=4','?v=6')
          sw.write_text(text,encoding='utf-8')
          index=Path('nexus-glass-science-cube/index.html')
          text=index.read_text(encoding='utf-8').replace('?v=4','?v=6').replace('NEXUS — Autonomous Systems Field Lab','NEXUS — Autonomous Machine Ecology Lab').replace('NEXUS CONTAINMENT LAB','NEXUS MACHINE ECOLOGY LAB').replace('ROBOT ASSEMBLY','MACHINE FABRICATION').replace('<span>Robot</span>','<span>Machine</span>')
          index.write_text(text,encoding='utf-8')

      - name: Validate final V6 source and local assets
        run: |
          node --check nexus-glass-science-cube/runtime-source.js
          node --check nexus-glass-science-cube/main.js
          node --check nexus-glass-science-cube/sw.js
          test -f nexus-glass-science-cube/assets/quaternius-scifi/Enemy_Trilobite/Enemy_Trilobite.gltf
          test -f nexus-glass-science-cube/assets/quaternius-scifi/Enemy_QuadShell/Enemy_QuadShell.gltf
          test -f nexus-glass-science-cube/assets/quaternius-scifi/Enemy_EyeDrone/Enemy_EyeDrone.gltf
          grep -q "founderD.name = 'EYE-SCOUT'" nexus-glass-science-cube/runtime-source.js
          grep -q 'camera.position.set(7.4, 4.8, 11.8)' nexus-glass-science-cube/runtime-source.js
          grep -q 'authored-robots-v6-final-20260805' nexus-glass-science-cube/main.js

      - name: Install Chromium
        run: |
          mkdir -p final-test artifacts
          cd final-test
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Test and render iPhone gameplay
        run: |
          python3 -m http.server 4173 --directory nexus-glass-science-cube >/tmp/nexus-final.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > final-test/render.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const failures=[];page.on('pageerror',e=>failures.push(`pageerror: ${e.message}`));page.on('console',m=>{if(m.type()==='error')failures.push(`console: ${m.text()}`)});
          await page.goto('http://127.0.0.1:4173/?authored-v6=final',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>Number(document.querySelector('#robotCount')?.textContent||0)>=4&&Number(document.querySelector('#fps')?.textContent||0)>0,{timeout:120000});
          await page.locator('#startBtn').click({timeout:30000});
          await page.waitForFunction(()=>document.querySelector('#tutorial')?.classList.contains('hidden'),{timeout:30000});
          await page.waitForTimeout(7000);
          const report=await page.evaluate(()=>({units:Number(document.querySelector('#robotCount')?.textContent||0),fps:Number(document.querySelector('#fps')?.textContent||0),bootFault:document.body.textContent.includes('FIELD LAB BOOT FAULT'),canvasWidth:document.querySelector('#world')?.width||0}));
          console.log(JSON.stringify(report));
          await page.screenshot({path:'artifacts/nexus-authored-v6-final.png',fullPage:true});
          await browser.close();
          if(report.units<4||report.fps<=0||report.bootFault||report.canvasWidth<=0)failures.push(JSON.stringify(report));
          if(failures.length)throw new Error(failures.join('\n'));
          EOF
          node final-test/render.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-authored-v6-final
          path: artifacts/nexus-authored-v6-final.png
          if-no-files-found: error

      - name: Commit final V6 generated build
        run: |
          if [ -z "$(git status --porcelain -- nexus-glass-science-cube/runtime-source.js nexus-glass-science-cube/main.js nexus-glass-science-cube/sw.js nexus-glass-science-cube/index.html)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-glass-science-cube/runtime-source.js nexus-glass-science-cube/main.js nexus-glass-science-cube/sw.js nexus-glass-science-cube/index.html
          git commit -m 'Finalize staged authored robot V6 presentation'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
