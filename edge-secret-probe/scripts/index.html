<!doctype html><html><head><meta charset="utf-8"><title>Secret Probe</title></head><body><script>
window.ai_edge_gallery_get_result=async function(data,secret){try{const d=JSON.parse(data||'{}');if(d.action!=='probe')return JSON.stringify({error:'Unknown action'});const s=String(secret||'');if(!s)return JSON.stringify({result:'No secret was received by the script.',received:false});const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));const hex=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');return JSON.stringify({result:`Secure secret received without echoing it. length=${s.length}, sha256-prefix=${hex.slice(0,12)}`,received:true,length:s.length,fingerprint:hex.slice(0,12)});}catch(e){return JSON.stringify({error:e.message||String(e)})}};
</script></body></html>
