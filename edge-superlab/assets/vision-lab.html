<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vision Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071019;color:#edf6ff;font:13px system-ui;padding:max(12px,env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}h1{font-size:21px;margin:2px 0 8px}.bar{display:flex;gap:6px;flex-wrap:wrap}.btn,button,input[type=range]{border:1px solid #35516a;background:#102336;color:#fff;border-radius:10px;padding:9px 11px;font:inherit}button,.btn{font-weight:700}.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}@media(min-width:760px){.grid{grid-template-columns:1fr 280px}}canvas{width:100%;background:#02070c;border:1px solid #284156;border-radius:14px;touch-action:none}.panel{background:#0b1723;border:1px solid #243d52;border-radius:14px;padding:10px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #1d3142;padding:6px 0}.hist{width:100%;height:120px}.status{color:#8ddcff;font-weight:750;margin:8px 0}</style></head><body><h1>👁️ Local Vision Lab</h1><div class="bar"><label class="btn">OPEN IMAGE<input id="file" type="file" accept="image/*" capture="environment" style="display:none"></label><button data-op="gray">GRAYSCALE</button><button data-op="invert">INVERT</button><button data-op="edge">SOBEL EDGES</button><button data-op="threshold">THRESHOLD</button><button id="reset">RESET</button><button id="save">SAVE PNG</button></div><div class="status" id="status">Choose a photo. Processing stays in this WebView.</div><div class="grid"><canvas id="c" width="900" height="600"></canvas><div class="panel"><b>Image diagnostics</b><div id="metrics"></div><canvas class="hist" id="hist" width="280" height="120"></canvas><p>Threshold <span id="tv">128</span></p><input id="th" type="range" min="0" max="255" value="128" style="width:100%"></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d',{willReadFrequently:true}),hist=document.getElementById('hist'),hx=hist.getContext('2d'),status=document.getElementById('status'),metrics=document.getElementById('metrics'),th=document.getElementById('th'),tv=document.getElementById('tv');let original=null;function fit(w,h){const max=1400,s=Math.min(1,max/Math.max(w,h));c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s))}function analyze(){if(!c.width||!c.height)return;const d=x.getImageData(0,0,c.width,c.height).data,bins=new Uint32Array(256);let sr=0,sg=0,sb=0,lum=0,lum2=0,n=d.length/4;for(let i=0;i<d.length;i+=4){sr+=d[i];sg+=d[i+1];sb+=d[i+2];const l=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];bins[Math.max(0,Math.min(255,l|0))]++;lum+=l;lum2+=l*l}const m=lum/n,std=Math.sqrt(Math.max(0,lum2/n-m*m));metrics.innerHTML=`<div class="metric"><span>Size</span><b>${c.width}×${c.height}</b></div><div class="metric"><span>Pixels</span><b>${n.toLocaleString()}</b></div><div class="metric"><span>Mean RGB</span><b>${(sr/n)|0}, ${(sg/n)|0}, ${(sb/n)|0}</b></div><div class="metric"><span>Luma mean</span><b>${m.toFixed(1)}</b></div><div class="metric"><span>Luma σ</span><b>${std.toFixed(1)}</b></div>`;hx.clearRect(0,0,hist.width,hist.height);const max=Math.max(...bins);hx.fillStyle='#8ddcff';for(let i=0;i<256;i++){const h=max?bins[i]/max*hist.height:0;hx.fillRect(i/256*hist.width,hist.height-h,hist.width/256+1,h)}}function op(name){if(!original)return;const im=x.getImageData(0,0,c.width,c.height),d=im.data;if(name==='gray'||name==='invert'||name==='threshold'){const t=+th.value;for(let i=0;i<d.length;i+=4){const l=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];if(name==='gray')d[i]=d[i+1]=d[i+2]=l;else if(name==='invert'){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2]}else d[i]=d[i+1]=d[i+2]=l>=t?255:0}x.putImageData(im,0,0)}else if(name==='edge'){const w=c.width,h=c.height,src=new Uint8ClampedArray(d),g=new Float32Array(w*h);for(let p=0,j=0;p<src.length;p+=4,j++)g[j]=.2126*src[p]+.7152*src[p+1]+.0722*src[p+2];for(let yy=1;yy<h-1;yy++)for(let xx=1;xx<w-1;xx++){const i=yy*w+xx,gx=-g[i-w-1]+g[i-w+1]-2*g[i-1]+2*g[i+1]-g[i+w-1]+g[i+w+1],gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1],v=Math.min(255,Math.hypot(gx,gy)),p=i*4;d[p]=d[p+1]=d[p+2]=v;d[p+3]=255}x.putImageData(im,0,0)}analyze();status.textContent=name+' complete ✓'}document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{fit(img.width,img.height);x.drawImage(img,0,0,c.width,c.height);original=x.getImageData(0,0,c.width,c.height);analyze();status.textContent=`Loaded ${f.name} · ${(f.size/1024).toFixed(1)} KB`};img.src=URL.createObjectURL(f)};document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>op(b.dataset.op));document.getElementById('reset').onclick=()=>{if(original){x.putImageData(original,0,0);analyze();status.textContent='Reset ✓'}};document.getElementById('save').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='superlab-vision.png';a.click()},'image/png');th.oninput=()=>tv.textContent=th.value;</script></body></html>
