<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Project Vault</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef6ff;font:13px system-ui;padding:max(12px,env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}h1{font-size:21px;margin:2px 0 8px}.bar{display:flex;gap:6px;flex-wrap:wrap}.btn,button,input,select{border:1px solid #35516a;background:#102336;color:#fff;border-radius:10px;padding:9px 11px;font:inherit}button,.btn{font-weight:700}.grid{display:grid;grid-template-columns:210px 1fr;gap:10px;margin-top:10px}.files,.editor{background:#0b1723;border:1px solid #243d52;border-radius:14px;padding:9px;min-height:420px}.file{padding:8px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file.active{background:#17334c}.editor input{width:100%;margin-bottom:7px}.editor textarea{width:100%;height:360px;border:0;background:#02070c;color:#dff3ff;border-radius:10px;padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.status{color:#8ddcff;font-weight:750;margin:8px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.files{min-height:120px}}</style></head><body><h1>🗂️ SuperLab Project Vault</h1><div class="bar"><button id="new">NEW FILE</button><button id="save">SAVE</button><button id="del">DELETE</button><button id="export">EXPORT PROJECT</button><label class="btn">IMPORT PROJECT<input id="import" type="file" accept="application/json,.json" style="display:none"></label><label class="btn">IMPORT FILE<input id="raw" type="file" style="display:none"></label></div><div class="status" id="status">Files persist in this skill's local storage.</div><div class="grid"><div class="files" id="files"></div><div class="editor"><input id="name" placeholder="filename.py"><textarea id="text" spellcheck="false"></textarea></div></div><script>const KEY='edge-superlab.workspace.v1',files=document.getElementById('files'),name=document.getElementById('name'),text=document.getElementById('text'),status=document.getElementById('status');let project;try{project=JSON.parse(localStorage.getItem(KEY)||'null')||{files:{'README.md':'# SuperLab Project\n\nLocal project vault.','main.py':'print("Hello from SuperLab")'}}}catch{project={files:{}}}let current=Object.keys(project.files)[0]||'untitled.txt';function persist(){localStorage.setItem(KEY,JSON.stringify(project))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){files.innerHTML='';Object.keys(project.files).sort().forEach(f=>{const d=document.createElement('div');d.className='file'+(f===current?' active':'');d.textContent=f;d.onclick=()=>openFile(f);files.appendChild(d)});if(!(current in project.files)){name.value=current;text.value=''}else{name.value=current;text.value=project.files[current]}}function openFile(f){current=f;render();status.textContent='Opened '+f}function save(){let n=name.value.trim()||current||'untitled.txt';if(n!==current&&current in project.files)delete project.files[current];current=n;project.files[current]=text.value;persist();render();status.textContent='Saved '+current+' ✓'}document.getElementById('new').onclick=()=>{current='untitled-'+Date.now()+'.txt';project.files[current]='';persist();render();name.focus()};document.getElementById('save').onclick=save;document.getElementById('del').onclick=()=>{if(current in project.files&&confirm('Delete '+current+'?')){delete project.files[current];current=Object.keys(project.files)[0]||'untitled.txt';persist();render();status.textContent='Deleted'}};document.getElementById('export').onclick=()=>{save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,project},null,2)],{type:'application/json'}));a.download='superlab-project.json';a.click()};document.getElementById('import').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());project=j.project||j;if(!project.files||typeof project.files!=='object')throw new Error('No files object');current=Object.keys(project.files)[0]||'untitled.txt';persist();render();status.textContent='Project imported ✓'}catch(err){status.textContent='Import failed: '+err.message}};document.getElementById('raw').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{project.files[f.name]=await f.text();current=f.name;persist();render();status.textContent='Imported '+f.name+' ✓'}catch(err){status.textContent='File import failed: '+err.message}};render();</script></body></html>
