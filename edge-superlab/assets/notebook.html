<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SuperLab Notebook</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071019;color:#e8f3ff;font:13px system-ui;padding:max(12px,env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom));max-width:980px;margin:auto}h1{font-size:21px;margin:2px 0 8px}.bar{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:#071019dd;backdrop-filter:blur(12px);padding:8px 0;z-index:5}button,input{border:1px solid #35516a;background:#102336;color:#fff;border-radius:10px;padding:9px 11px;font:inherit}button{font-weight:700}.cell{background:#0b1723;border:1px solid #243d52;border-radius:14px;margin:10px 0;padding:9px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#9fc4e2}.cell textarea{width:100%;height:150px;border:0;border-radius:9px;background:#02070c;color:#dff3ff;padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;margin-top:7px}.out{white-space:pre-wrap;word-break:break-word;background:#02070c;border-radius:9px;padding:9px;min-height:24px;margin-top:7px;color:#bfeaff}.plot{max-width:100%;display:block;margin-top:8px;border-radius:9px}.status{color:#8ddcff;font-weight:750}</style></head><body><h1>📓 SuperLab Python Notebook</h1><div class="bar"><button id="load">LOAD PYTHON</button><button id="add">+ CELL</button><button id="runall">RUN ALL</button><button id="clear">CLEAR OUTPUTS</button><button id="export">EXPORT</button><label><input id="import" type="file" accept="application/json,.json" style="display:none"><span style="display:inline-block;border:1px solid #35516a;background:#102336;border-radius:10px;padding:9px 11px;font-weight:700">IMPORT</span></label></div><div class="status" id="status">Notebook saved locally. Python not loaded.</div><div id="cells"></div><script type="module">const KEY='edge-superlab.notebook.v1';let py=null;const root=document.getElementById('cells'),status=document.getElementById('status');function loadState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||[{code:'import math\nprint("sqrt(2)=", math.sqrt(2))',out:''},{code:'import numpy as np\nx=np.linspace(0,2*np.pi,8)\nprint(np.round(np.sin(x),3))',out:''}]}catch{return[]}}let state=loadState();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){root.innerHTML='';state.forEach((c,i)=>{const d=document.createElement('div');d.className='cell';d.innerHTML=`<div class="head"><b>Cell ${i+1}</b><span><button data-run="${i}">▶</button> <button data-up="${i}">↑</button> <button data-down="${i}">↓</button> <button data-del="${i}">✕</button></span></div><textarea data-code="${i}">${esc(c.code)}</textarea><div class="out" data-out="${i}">${esc(c.out||'')}</div><img class="plot" data-plot="${i}" style="display:none">`;root.appendChild(d)});root.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{state[+t.dataset.code].code=t.value;save()});root.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runCell(+b.dataset.run));root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.splice(+b.dataset.del,1);save();render()});root.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));root.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}function move(i,d){const j=i+d;if(j<0||j>=state.length)return;[state[i],state[j]]=[state[j],state[i]];save();render()}async function ensurePy(){if(py)return true;status.textContent='Loading Pyodide…';try{const mod=await import('https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs');py=await mod.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v314.0.6/full/'});status.textContent='Python ready ✓';return true}catch(e){status.textContent='Python load failed: '+e.message;return false}}async function runCell(i){if(!await ensurePy())return;const c=state[i],o=root.querySelector(`[data-out="${i}"]`),img=root.querySelector(`[data-plot="${i}"]`);o.textContent='Running…';img.style.display='none';try{await py.loadPackagesFromImports(c.code);py.globals.set('EDGE_NOTEBOOK_CODE',c.code);const r=await py.runPythonAsync(`import io,contextlib,traceback,os\n_buf=io.StringIO()\nwith contextlib.redirect_stdout(_buf), contextlib.redirect_stderr(_buf):\n    try:\n        exec(EDGE_NOTEBOOK_CODE, globals())\n    except Exception:\n        traceback.print_exc()\n_buf.getvalue()`);c.out=String(r)||'(no output)';o.textContent=c.out;r?.destroy?.();try{const bytes=py.FS.readFile('/tmp/edge_plot.png');const blob=new Blob([bytes],{type:'image/png'});img.src=URL.createObjectURL(blob);img.style.display='block'}catch{}save();status.textContent=`Cell ${i+1} finished ✓`}catch(e){c.out=e.stack||e.message;o.textContent=c.out;save();status.textContent='Cell failed'}}document.getElementById('load').onclick=ensurePy;document.getElementById('add').onclick=()=>{state.push({code:'# new cell\n',out:''});save();render()};document.getElementById('runall').onclick=async()=>{for(let i=0;i<state.length;i++)await runCell(i)};document.getElementById('clear').onclick=()=>{state.forEach(c=>c.out='');save();render()};document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,cells:state},null,2)],{type:'application/json'}));a.download='superlab-notebook.json';a.click()};document.getElementById('import').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());state=Array.isArray(j.cells)?j.cells:[];save();render();status.textContent='Notebook imported ✓'}catch(err){status.textContent='Import failed: '+err.message}};render();</script></body></html>
