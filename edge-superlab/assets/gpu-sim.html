</style></head><body><canvas id="c"></canvas><div id="hud"><div class="pill" id="backend">probing…</div><div class="pill" id="count">0 particles</div><div class="pill" id="fps">0 fps</div><div class="pill" id="energy">field</div></div><div id="msg">Drag anywhere to bend the field.</div><div id="controls"><button data-m="0" class="active">GALAXY</button><button data-m="1">VORTEX</button><button data-m="2">WAVE</button><button data-m="3">CHAOS</button><button id="pull">PULL</button><button id="burst">BURST</button><button id="tilt">TILT</button><button id="reset">RESET</button></div><script>
(async()=>{"use strict";const c=document.getElementById('c'),backend=document.getElementById('backend'),countEl=document.getElementById('count'),fpsEl=document.getElementById('fps'),energyEl=document.getElementById('energy'),msg=document.getElementById('msg');let mode=0,pull=true,pointer={x:0,y:0,active:0},tilt={x:0,y:0,on:false};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('pull').onclick=e=>{pull=!pull;e.currentTarget.textContent=pull?'PULL':'PUSH'};function pxy(e){const r=c.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-(((e.clientY-r.top)/r.height)*2-1)}c.addEventListener('pointerdown',e=>{pointer.active=1;pxy(e);c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(pointer.active)pxy(e)});c.addEventListener('pointerup',()=>pointer.active=0);c.addEventListener('pointercancel',()=>pointer.active=0);document.getElementById('tilt').onclick=async()=>{try{if(typeof DeviceMotionEvent==='undefined')throw Error('motion API absent');if(typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted')throw Error('permission '+p)}tilt.on=!tilt.on;if(tilt.on)window.addEventListener('devicemotion',onMotion,{passive:true});else window.removeEventListener('devicemotion',onMotion);document.getElementById('tilt').textContent=tilt.on?'TILT ✓':'TILT';msg.textContent=tilt.on?'Tilt gravity enabled.':'Tilt gravity off.'}catch(e){msg.textContent='Tilt: '+e.message}};function onMotion(e){const a=e.accelerationIncludingGravity||{};tilt.x=Math.max(-1,Math.min(1,(+a.x||0)/9.8));tilt.y=Math.max(-1,Math.min(1,-(+a.y||0)/9.8))}
let burst=0;document.getElementById('burst').onclick=()=>{burst=1;setTimeout(()=>burst=0,180)};let restart=()=>{};document.getElementById('reset').onclick=()=>restart();
let frames=0,fpsT=performance.now(),fps=0;function tickFPS(){frames++;const n=performance.now();if(n-fpsT>500){fps=frames*1000/(n-fpsT);frames=0;fpsT=n;fpsEl.textContent=fps.toFixed(0)+' fps'}}
if(navigator.gpu){try{await runWebGPU();return}catch(e){console.error(e);backend.textContent='WebGPU failed → Canvas';msg.textContent='WebGPU error: '+e.message+' · using fallback';}}
runCanvas();
async function runWebGPU(){const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('no GPU adapter');const device=await adapter.requestDevice();const ctx=c.getContext('webgpu');if(!ctx)throw Error('webgpu canvas context unavailable');const fmt=navigator.gpu.getPreferredCanvasFormat();let dpr=1,w=0,h=0;function resize(){dpr=Math.min(2,devicePixelRatio||1);w=Math.max(1,innerWidth);h=Math.max(1,innerHeight);c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);ctx.configure({device,format:fmt,alphaMode:'opaque'})}addEventListener('resize',resize);resize();const N=50000,STRIDE=16;const init=new Float32Array(N*4);function seed(){for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.55)*.92;init[i*4]=Math.cos(a)*r;init[i*4+1]=Math.sin(a)*r;init[i*4+2]=-Math.sin(a)*(.08+.25*(1-r));init[i*4+3]=Math.cos(a)*(.08+.25*(1-r))}}seed();const pbuf=device.createBuffer({size:init.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(pbuf,0,init);const ubuf=device.createBuffer({size:48,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});const shader=device.createShaderModule({code:`
struct P{pos:vec2<f32>,vel:vec2<f32>};
struct U{dt:f32,time:f32,px:f32,py:f32,mode:f32,active:f32,strength:f32,burst:f32,tx:f32,ty:f32,aspect:f32,pad:f32};
@group(0) @binding(0) var<storage,read_write> ps:array<P>;
@group(0) @binding(1) var<uniform> u:U;
fn rot(v:vec2<f32>)->vec2<f32>{return vec2<f32>(-v.y,v.x);}
fn safeNorm(v:vec2<f32>)->vec2<f32>{let l=max(length(v),0.0001);return v/l;}
@compute @workgroup_size(64)
fn cs(@builtin(global_invocation_id) gid:vec3<u32>){let i=gid.x;if(i>=arrayLength(&ps)){return;}var p=ps[i];var a=vec2<f32>(0.0);let r=p.pos;let d=max(dot(r,r),0.018);let m=i32(u.mode+0.5);
 if(m==0){a+=-r*(0.24/d)+rot(r)*(0.16/sqrt(d));}
 if(m==1){let q=r-vec2<f32>(u.px,u.py);let qd=max(dot(q,q),0.012);a+=rot(q)*(0.50/qd)-q*(0.055/qd);}
 if(m==2){a+=vec2<f32>(sin(r.y*11.0+u.time*2.1),cos(r.x*9.0-u.time*1.7))*0.75;}
 if(m==3){a+=vec2<f32>(sin(r.y*17.0+u.time*2.3)+cos(r.x*7.0-u.time),cos(r.x*13.0-u.time*1.8)-sin(r.y*9.0+u.time*.7))*0.55;}
 let q=r-vec2<f32>(u.px,u.py);let qd=max(dot(q,q),0.006);if(u.active>.5){a+=-q*(u.strength/qd);}if(u.burst>.5){a+=safeNorm(q)*(2.3/(0.08+qd));}
 a+=vec2<f32>(u.tx,u.ty)*0.9;let al=length(a);if(al>8.0){a=a/al*8.0;}p.vel=(p.vel+a*u.dt)*0.997;p.pos+=p.vel*u.dt;
 if(p.pos.x>1.08){p.pos.x=-1.07;}if(p.pos.x< -1.08){p.pos.x=1.07;}if(p.pos.y>1.08){p.pos.y=-1.07;}if(p.pos.y< -1.08){p.pos.y=1.07;}ps[i]=p;}
struct O{@builtin(position) pos:vec4<f32>,@location(0) col:vec3<f32>};
@vertex fn vs(@builtin(vertex_index) vi:u32,@builtin(instance_index) ii:u32)->O{let p=ps[ii];let offs=array<vec2<f32>,6>(vec2(-1.,-1.),vec2(1.,-1.),vec2(-1.,1.),vec2(-1.,1.),vec2(1.,-1.),vec2(1.,1.));let sp=0.0023+min(length(p.vel)*0.0018,0.0045);var o:O;o.pos=vec4<f32>(p.pos+offs[vi]*sp,0.,1.);let v=min(length(p.vel)*1.8,1.);o.col=vec3<f32>(0.18+v*.45,0.55+v*.35,1.0-v*.18);return o;}
@fragment fn fs(i:O)->@location(0) vec4<f32>{return vec4<f32>(i.col,.88);}`});const compute=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'cs'}});const render=device.createRenderPipeline({layout:'auto',vertex:{module:shader,entryPoint:'vs'},fragment:{module:shader,entryPoint:'fs',targets:[{format:fmt,blend:{color:{srcFactor:'src-alpha',dstFactor:'one',operation:'add'},alpha:{srcFactor:'one',dstFactor:'one',operation:'add'}}}]},primitive:{topology:'triangle-list'}});const cbg=device.createBindGroup({layout:compute.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:pbuf}},{binding:1,resource:{buffer:ubuf}}]});const rbg=device.createBindGroup({layout:render.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:pbuf}},{binding:1,resource:{buffer:ubuf}}]});let time=0,last=performance.now();backend.textContent='WebGPU compute';countEl.textContent=N.toLocaleString()+' particles';energyEl.textContent='GPU storage + WGSL';restart=()=>{seed();device.queue.writeBuffer(pbuf,0,init);msg.textContent='GPU state reset.'};function frame(now){const dt=Math.min(.024,Math.max(.001,(now-last)/1000));last=now;time+=dt;const u=new Float32Array([dt,time,pointer.x,pointer.y,mode,pointer.active,pull?.46:-.46,burst,tilt.on?tilt.x:0,tilt.on?tilt.y:0,w/h,0]);device.queue.writeBuffer(ubuf,0,u);const enc=device.createCommandEncoder();const cp=enc.beginComputePass();cp.setPipeline(compute);cp.setBindGroup(0,cbg);cp.dispatchWorkgroups(Math.ceil(N/64));cp.end();const tex=ctx.getCurrentTexture().createView();const rp=enc.beginRenderPass({colorAttachments:[{view:tex,clearValue:{r:.004,g:.008,b:.016,a:1},loadOp:'clear',storeOp:'store'}]});rp.setPipeline(render);rp.setBindGroup(0,rbg);rp.draw(6,N);rp.end();device.queue.submit([enc.finish()]);tickFPS();requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function runCanvas(){const x=c.getContext('2d'),N=8500,px=new Float32Array(N),py=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N);let w=0,h=0,dpr=1,time=0,last=performance.now();function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function seed(){for(let i=0;i<N;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),.6)*.9;px[i]=Math.cos(a)*r;py[i]=Math.sin(a)*r;vx[i]=-Math.sin(a)*.1;vy[i]=Math.cos(a)*.1}}seed();restart=()=>{seed();msg.textContent='CPU fallback state reset.'};backend.textContent='Canvas CPU fallback';countEl.textContent=N.toLocaleString()+' particles';energyEl.textContent='typed arrays';function frame(now){let dt=Math.min(.025,(now-last)/1000||.016);last=now;time+=dt;x.fillStyle='rgba(2,5,10,.26)';x.fillRect(0,0,w,h);x.fillStyle='#7bd9ff';for(let i=0;i<N;i++){let xx=px[i],yy=py[i],ax=0,ay=0,d=Math.max(xx*xx+yy*yy,.02);if(mode===0){ax+=-xx*.22/d-yy*.15/Math.sqrt(d);ay+=-yy*.22/d+xx*.15/Math.sqrt(d)}else if(mode===1){let qx=xx-pointer.x,qy=yy-pointer.y,qd=Math.max(qx*qx+qy*qy,.014);ax+=-qy*.42/qd-qx*.05/qd;ay+=qx*.42/qd-qy*.05/qd}else if(mode===2){ax+=Math.sin(yy*11+time*2)*.7;ay+=Math.cos(xx*9-time*1.7)*.7}else{ax+=(Math.sin(yy*17+time*2.3)+Math.cos(xx*7-time))*.5;ay+=(Math.cos(xx*13-time*1.8)-Math.sin(yy*9+time*.7))*.5}let qx=xx-pointer.x,qy=yy-pointer.y,qd=Math.max(qx*qx+qy*qy,.008);if(pointer.active){let k=(pull?.42:-.42)/qd;ax-=qx*k;ay-=qy*k}if(burst){let l=Math.sqrt(qd),k=2/(.08+qd);ax+=qx/l*k;ay+=qy/l*k}if(tilt.on){ax+=tilt.x*.8;ay+=tilt.y*.8}let al=Math.hypot(ax,ay);if(al>7){ax=ax/al*7;ay=ay/al*7}vx[i]=(vx[i]+ax*dt)*.997;vy[i]=(vy[i]+ay*dt)*.997;xx+=vx[i]*dt;yy+=vy[i]*dt;if(xx>1.08)xx=-1.07;if(xx< -1.08)xx=1.07;if(yy>1.08)yy=-1.07;if(yy< -1.08)yy=1.07;px[i]=xx;py[i]=yy;const sx=(xx*.5+.5)*w,sy=(-yy*.5+.5)*h;x.fillRect(sx,sy,1.2,1.2)}tickFPS();requestAnimationFrame(frame)}requestAnimationFrame(frame)}
})();</script></body></html>
