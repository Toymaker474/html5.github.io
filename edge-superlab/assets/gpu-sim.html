<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SuperLab Adaptive Field</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eaf6ff;font:12px system-ui,-apple-system,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;z-index:5;top:max(7px,env(safe-area-inset-top));left:7px;right:7px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}.pill{padding:5px 7px;border-radius:10px;border:1px solid #264764;background:#06111edc}#controls{position:fixed;z-index:6;left:7px;right:7px;bottom:max(7px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{border:1px solid #315779;border-radius:10px;background:#0d1d31e8;color:#fff;padding:9px 3px;font-weight:750;font-size:11px}.active{outline:2px solid #63d4ff}#msg{position:fixed;left:10px;right:10px;top:68px;text-align:center;color:#ccecff;text-shadow:0 1px 2px #000;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div id="hud"><span class="pill" id="backend">probing</span><span class="pill" id="count">0</span><span class="pill" id="fps">0 fps</span><span class="pill" id="quality"></span></div><div id="msg">Drag to bend the field. ECO auto-protects frame rate.</div><div id="controls"><button data-scene="0" class="active">GALAXY</button><button data-scene="1">VORTEX</button><button data-scene="2">WAVE</button><button data-scene="3">CHAOS</button><button id="pull">PULL</button><button id="burst">BURST</button><button data-q="eco">ECO</button><button data-q="balanced">BALANCED</button></div><script>
(async()=>{'use strict';
const c=document.querySelector('#c'),backend=document.querySelector('#backend'),countEl=document.querySelector('#count'),fpsEl=document.querySelector('#fps'),qEl=document.querySelector('#quality'),msg=document.querySelector('#msg');
const KEY='edge-superlab.perf.v1',Q={eco:{gpu:8000,cpu:1200,fps:30,dpr:1.05,power:'low-power'},balanced:{gpu:18000,cpu:2500,fps:45,dpr:1.35,power:'high-performance'},turbo:{gpu:32000,cpu:4500,fps:60,dpr:1.65,power:'high-performance'}};
let q=(new URLSearchParams(location.search).get('mode')||localStorage.getItem(KEY)||'eco').toLowerCase();if(!Q[q])q='eco';localStorage.setItem(KEY,q);const cfg=Q[q];qEl.textContent=q.toUpperCase();document.querySelectorAll('[data-q]').forEach(b=>{b.classList.toggle('active',b.dataset.q===q);b.onclick=()=>{localStorage.setItem(KEY,b.dataset.q);location.replace(location.pathname+'?mode='+b.dataset.q)}});
let scene=0,pull=true,burst=0,pointer={x:0,y:0,on:0};document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=+b.dataset.scene;document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#pull').onclick=e=>{pull=!pull;e.currentTarget.textContent=pull?'PULL':'PUSH'};document.querySelector('#burst').onclick=()=>{burst=1;setTimeout(()=>burst=0,160)};
function pos(e){const r=c.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-((e.clientY-r.top)/r.height*2-1)}c.onpointerdown=e=>{pointer.on=1;pos(e);c.setPointerCapture?.(e.pointerId)};c.onpointermove=e=>{if(pointer.on)pos(e)};c.onpointerup=c.onpointercancel=()=>pointer.on=0;
let frames=0,lastFPS=performance.now(),measured=0,lowWindows=0;function meter(){frames++;const n=performance.now();if(n-lastFPS>1000){measured=frames*1000/(n-lastFPS);frames=0;lastFPS=n;fpsEl.textContent=measured.toFixed(0)+' fps';if(measured<cfg.fps*.52)lowWindows++;else lowWindows=0;if(lowWindows>=3&&q!=='eco'){const next=q==='turbo'?'balanced':'eco';localStorage.setItem(KEY,next);msg.textContent='Auto-cooling: '+next.toUpperCase();setTimeout(()=>location.replace(location.pathname+'?mode='+next),500)}}}
let hidden=false;document.addEventListener('visibilitychange',()=>hidden=document.hidden,{passive:true});
if(navigator.gpu){try{await gpu();return}catch(e){console.warn(e);backend.textContent='GPU unavailable → CPU';msg.textContent='Using small CPU fallback.'}}cpu();
async function gpu(){const adapter=await navigator.gpu.requestAdapter({powerPreference:cfg.power});if(!adapter)throw Error('no adapter');const device=await adapter.requestDevice(),ctx=c.getContext('webgpu');if(!ctx)throw Error('no context');const fmt=navigator.gpu.getPreferredCanvasFormat(),N=cfg.gpu;let w=1,h=1;function resize(){w=innerWidth;h=innerHeight;const d=Math.min(cfg.dpr,devicePixelRatio||1);c.width=Math.max(1,Math.floor(w*d));c.height=Math.max(1,Math.floor(h*d));ctx.configure({device,format:fmt,alphaMode:'opaque'})}addEventListener('resize',resize,{passive:true});resize();
const init=new Float32Array(N*4);for(let i=0;i<N;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),.58)*.92;init[i*4]=Math.cos(a)*r;init[i*4+1]=Math.sin(a)*r;init[i*4+2]=-Math.sin(a)*(.08+.20*(1-r));init[i*4+3]=Math.cos(a)*(.08+.20*(1-r))}const pbuf=device.createBuffer({size:init.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(pbuf,0,init);const ubuf=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
const mod=device.createShaderModule({code:`struct P{p:vec2<f32>,v:vec2<f32>};struct U{dt:f32,t:f32,m:f32,on:f32,px:f32,py:f32,k:f32,b:f32};@group(0)@binding(0)var<storage,read_write> ps:array<P>;@group(0)@binding(1)var<uniform>u:U;fn rot(v:vec2<f32>)->vec2<f32>{return vec2(-v.y,v.x);}@compute @workgroup_size(64)fn cs(@builtin(global_invocation_id)g:vec3<u32>){let i=g.x;if(i>=arrayLength(&ps)){return;}var z=ps[i];var a=vec2<f32>(0);let r=z.p;let d=max(dot(r,r),.02);let m=i32(u.m+.5);if(m==0){a+=-r*(.21/d)+rot(r)*(.13/sqrt(d));}else if(m==1){let q=r-vec2(u.px,u.py);let e=max(dot(q,q),.018);a+=rot(q)*(.37/e)-q*(.04/e);}else if(m==2){a+=vec2(sin(r.y*10+u.t*2),cos(r.x*8-u.t*1.5))*.55;}else{a+=vec2(sin(r.y*15+u.t*2)+cos(r.x*6-u.t),cos(r.x*11-u.t*1.7)-sin(r.y*8))*.38;}let qv=r-vec2(u.px,u.py);let qd=max(dot(qv,qv),.009);if(u.on>.5){a+=-qv*(u.k/qd);}if(u.b>.5){a+=normalize(qv+vec2(.0001))*(1.5/(.1+qd));}let al=length(a);if(al>6){a=a/al*6;}z.v=(z.v+a*u.dt)*.997;z.p+=z.v*u.dt;if(abs(z.p.x)>1.08){z.p.x=-sign(z.p.x)*1.06;}if(abs(z.p.y)>1.08){z.p.y=-sign(z.p.y)*1.06;}ps[i]=z;}struct O{@builtin(position)p:vec4<f32>,@location(0)c:vec3<f32>};@vertex fn vs(@builtin(vertex_index)v:u32,@builtin(instance_index)i:u32)->O{let z=ps[i];let o=array<vec2<f32>,4>(vec2(-1,-1),vec2(1,-1),vec2(-1,1),vec2(1,1));let s=.0022+min(length(z.v)*.0015,.003);var x:O;x.p=vec4(z.p+o[v]*s,0,1);let sp=min(length(z.v)*2,1);x.c=vec3(.22+sp*.45,.58+sp*.28,1-sp*.12);return x;}@fragment fn fs(x:O)->@location(0)vec4<f32>{return vec4(x.c,.82);}`});
const cp=device.createComputePipeline({layout:'auto',compute:{module:mod,entryPoint:'cs'}}),rp=device.createRenderPipeline({layout:'auto',vertex:{module:mod,entryPoint:'vs'},fragment:{module:mod,entryPoint:'fs',targets:[{format:fmt,blend:{color:{srcFactor:'src-alpha',dstFactor:'one',operation:'add'},alpha:{srcFactor:'one',dstFactor:'one',operation:'add'}}}]},primitive:{topology:'triangle-strip'}});const cb=device.createBindGroup({layout:cp.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:pbuf}},{binding:1,resource:{buffer:ubuf}}]}),rb=device.createBindGroup({layout:rp.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:pbuf}},{binding:1,resource:{buffer:ubuf}}]});backend.textContent='WebGPU adaptive';countEl.textContent=N.toLocaleString()+' particles';let prev=0,time=0,interval=1000/cfg.fps;function frame(now){requestAnimationFrame(frame);if(hidden||now-prev<interval)return;const dt=Math.min(.03,Math.max(.001,(now-prev)/1000||.016));prev=now;time+=dt;device.queue.writeBuffer(ubuf,0,new Float32Array([dt,time,scene,pointer.on,pointer.x,pointer.y,pull?.34:-.34,burst]));const e=device.createCommandEncoder(),p=e.beginComputePass();p.setPipeline(cp);p.setBindGroup(0,cb);p.dispatchWorkgroups(Math.ceil(N/64));p.end();const r=e.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),clearValue:{r:.003,g:.008,b:.015,a:1},loadOp:'clear',storeOp:'store'}]});r.setPipeline(rp);r.setBindGroup(0,rb);r.draw(4,N);r.end();device.queue.submit([e.finish()]);meter()}requestAnimationFrame(frame)}
function cpu(){const x=c.getContext('2d'),N=cfg.cpu,px=new Float32Array(N),py=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N);let w=1,h=1,prev=0,time=0,interval=1000/cfg.fps;function resize(){w=innerWidth;h=innerHeight;const d=Math.min(1.1,devicePixelRatio||1);c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize,{passive:true});resize();for(let i=0;i<N;i++){const a=Math.random()*6.283,r=Math.random()*.9;px[i]=Math.cos(a)*r;py[i]=Math.sin(a)*r;vx[i]=-Math.sin(a)*.1;vy[i]=Math.cos(a)*.1}backend.textContent='CPU lite';countEl.textContent=N.toLocaleString()+' particles';function frame(now){requestAnimationFrame(frame);if(hidden||now-prev<interval)return;let dt=Math.min(.03,(now-prev)/1000||.016);prev=now;time+=dt;x.fillStyle='rgba(2,5,10,.38)';x.fillRect(0,0,w,h);x.fillStyle='#7bd9ff';for(let i=0;i<N;i++){let xx=px[i],yy=py[i],ax=0,ay=0,d=Math.max(xx*xx+yy*yy,.025);if(scene===0){ax=-xx*.18/d-yy*.12/Math.sqrt(d);ay=-yy*.18/d+xx*.12/Math.sqrt(d)}else if(scene===1){let qx=xx-pointer.x,qy=yy-pointer.y,e=Math.max(qx*qx+qy*qy,.02);ax=-qy*.3/e-qx*.03/e;ay=qx*.3/e-qy*.03/e}else if(scene===2){ax=Math.sin(yy*10+time*2)*.5;ay=Math.cos(xx*8-time*1.5)*.5}else{ax=(Math.sin(yy*15+time*2)+Math.cos(xx*6-time))*.32;ay=(Math.cos(xx*11-time*1.7)-Math.sin(yy*8))*.32}if(pointer.on){let qx=xx-pointer.x,qy=yy-pointer.y,e=Math.max(qx*qx+qy*qy,.01),k=(pull?.3:-.3)/e;ax-=qx*k;ay-=qy*k}vx[i]=(vx[i]+ax*dt)*.997;vy[i]=(vy[i]+ay*dt)*.997;xx+=vx[i]*dt;yy+=vy[i]*dt;if(Math.abs(xx)>1.08)xx=-Math.sign(xx)*1.06;if(Math.abs(yy)>1.08)yy=-Math.sign(yy)*1.06;px[i]=xx;py[i]=yy;x.fillRect((xx*.5+.5)*w,(-yy*.5+.5)*h,1.2,1.2)}meter()}requestAnimationFrame(frame)}
})();
</script></body></html>
