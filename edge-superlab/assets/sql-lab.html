<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SQLite Data Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef7ff;font:13px system-ui;padding:max(12px,env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}h1{font-size:22px;margin:0 0 8px}.bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}button,label{border:1px solid #35516a;background:#102336;color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}textarea{width:100%;border:1px solid #29465e;background:#02070c;color:#dff3ff;border-radius:12px;padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.sql{height:120px}.csv{height:115px}.out{white-space:pre-wrap;overflow:auto;max-height:42vh;background:#02070c;border:1px solid #29465e;border-radius:12px;padding:10px;margin-top:8px}.status{color:#8ddcff;font-weight:700;margin:7px 0}.hint{color:#9fc4e2;font-size:12px}</style></head><body><h1>🗃️ SQLite Data Lab</h1><div class="hint">Real SQLite via CPython/Pyodide WebAssembly. Database persists while this page stays open.</div><div class="bar"><button id="load">LOAD SQLITE</button><button id="demo">DEMO DATA</button><button id="schema">SCHEMA</button><button id="clear">RESET DB</button></div><div class="status" id="status">Python not loaded.</div><b>CSV → table <code>data</code></b><textarea id="csv" class="csv" spellcheck="false">name,score,group
Ada,98,A
Linus,91,B
Grace,99,A
Ken,88,B
Margaret,97,A</textarea><div class="bar"><button id="importCsv">IMPORT CSV</button></div><b>SQL</b><textarea id="sql" class="sql" spellcheck="false">SELECT group, COUNT(*) AS n, ROUND(AVG(score),2) AS avg_score FROM data GROUP BY group ORDER BY avg_score DESC;</textarea><div class="bar"><button id="run">▶ RUN SQL</button></div><div class="out" id="out">Results appear here.</div><script type="module">let py=null;const st=document.getElementById('status'),out=document.getElementById('out');async function ensure(){if(py)return true;st.textContent='Loading Python + sqlite3…';try{const mod=await import('https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs');py=await mod.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v314.0.6/full/'});await py.runPythonAsync('import sqlite3, json, csv, io\nconn=sqlite3.connect(":memory:")');st.textContent='SQLite ready ✓';return true}catch(e){st.textContent='Load failed: '+e.message;return false}}async function run(code){if(!await ensure())return null;return await py.runPythonAsync(code)}document.getElementById('load').onclick=ensure;document.getElementById('demo').onclick=()=>{document.getElementById('csv').value='name,score,group\nAda,98,A\nLinus,91,B\nGrace,99,A\nKen,88,B\nMargaret,97,A';document.getElementById('sql').value='SELECT group, COUNT(*) AS n, ROUND(AVG(score),2) AS avg_score FROM data GROUP BY group ORDER BY avg_score DESC;'};document.getElementById('importCsv').onclick=async()=>{try{const csvText=document.getElementById('csv').value;py?.globals.set('CSV_TEXT',csvText);if(!await ensure())return;py.globals.set('CSV_TEXT',csvText);const r=await run(`import csv,io,re\nrows=list(csv.reader(io.StringIO(CSV_TEXT)))\nif not rows: raise ValueError('CSV is empty')\nheaders=[re.sub(r'[^A-Za-z0-9_]+','_',h.strip()) or f'c{i}' for i,h in enumerate(rows[0])]\nconn.execute('DROP TABLE IF EXISTS data')\nconn.execute('CREATE TABLE data ('+','.join('"'+h+'" TEXT' for h in headers)+')')\nconn.executemany('INSERT INTO data VALUES ('+','.join('?'*len(headers))+')',[r+['']*(len(headers)-len(r)) for r in rows[1:]])\nconn.commit()\nf'imported {len(rows)-1} rows, {len(headers)} columns: '+', '.join(headers)`);out.textContent=String(r);r?.destroy?.();st.textContent='CSV imported ✓'}catch(e){out.textContent=e.stack||e.message}};document.getElementById('run').onclick=async()=>{try{const sql=document.getElementById('sql').value;if(!await ensure())return;py.globals.set('SQL_TEXT',sql);const r=await run(`cur=conn.execute(SQL_TEXT)\ncols=[d[0] for d in cur.description] if cur.description else []\nrows=cur.fetchall() if cols else []\nimport json\njson.dumps({'columns':cols,'rows':rows,'rowcount':len(rows)},default=str,indent=2)`);out.textContent=String(r);r?.destroy?.();st.textContent='Query finished ✓'}catch(e){out.textContent=e.stack||e.message;st.textContent='Query failed'}};document.getElementById('schema').onclick=async()=>{try{const r=await run(`'\n'.join(x[0]+': '+x[1] for x in conn.execute("SELECT name, sql FROM sqlite_master WHERE type='table' ORDER BY name")) or '(no tables)'`);out.textContent=String(r);r?.destroy?.()}catch(e){out.textContent=e.message}};document.getElementById('clear').onclick=async()=>{if(!await ensure())return;await run(`conn.close()\nconn=sqlite3.connect(':memory:')`);out.textContent='Database reset.';st.textContent='Fresh SQLite database ✓'};</script></body></html>
