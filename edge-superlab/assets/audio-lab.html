<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audio Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef6ff;font:13px system-ui;padding:max(12px,env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom));max-width:980px;margin:auto}h1{font-size:21px;margin:2px 0 8px}.bar{display:flex;gap:6px;flex-wrap:wrap}.btn,button,input,select{border:1px solid #35516a;background:#102336;color:#fff;border-radius:10px;padding:9px 11px;font:inherit}button,.btn{font-weight:700}.panel{background:#0b1723;border:1px solid #243d52;border-radius:14px;padding:10px;margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.m{background:#07121d;border-radius:10px;padding:8px}.m b{display:block;font-size:17px;color:#8ddcff}.status{color:#8ddcff;font-weight:750;margin:8px 0}canvas{width:100%;height:180px;background:#02070c;border-radius:12px;margin-top:8px}</style></head><body><h1>🎧 Local Audio DSP Lab</h1><div class="bar"><label class="btn">OPEN AUDIO<input id="file" type="file" accept="audio/*" style="display:none"></label><button id="tone">440 Hz</button><button id="sweep">SWEEP</button><button id="noise">NOISE</button><button id="stop">STOP</button></div><div class="status" id="status">Load an audio file or generate a signal.</div><div class="panel"><div class="metrics" id="metrics"></div><canvas id="wave" width="900" height="180"></canvas><canvas id="spec" width="900" height="180"></canvas></div><script>const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),status=document.getElementById('status'),metrics=document.getElementById('metrics'),wave=document.getElementById('wave'),wx=wave.getContext('2d'),spec=document.getElementById('spec'),sx=spec.getContext('2d');let src=null;function stop(){try{src?.stop()}catch{}src=null}function draw(data,sr){let peak=0,sum=0,z=0;for(let i=0;i<data.length;i++){const v=data[i];peak=Math.max(peak,Math.abs(v));sum+=v*v;if(i&&((data[i-1]<0&&v>=0)||(data[i-1]>=0&&v<0)))z++}const rms=Math.sqrt(sum/data.length),dur=data.length/sr;metrics.innerHTML=`<div class="m">Duration<b>${dur.toFixed(3)} s</b></div><div class="m">Sample rate<b>${sr} Hz</b></div><div class="m">RMS<b>${rms.toFixed(4)}</b></div><div class="m">Peak<b>${peak.toFixed(4)}</b></div><div class="m">Zero crossings<b>${z}</b></div><div class="m">Samples<b>${data.length.toLocaleString()}</b></div>`;wx.clearRect(0,0,wave.width,wave.height);wx.strokeStyle='#8ddcff';wx.beginPath();for(let x=0;x<wave.width;x++){const i=Math.floor(x/wave.width*data.length),y=(.5-data[i]*.45)*wave.height;x?wx.lineTo(x,y):wx.moveTo(x,y)}wx.stroke();const N=1024,start=Math.max(0,Math.floor(data.length/2-N/2)),re=new Float64Array(N),im=new Float64Array(N);for(let k=0;k<N/2;k++){let rr=0,ii=0;for(let n=0;n<N;n++){const v=data[start+n]||0,a=2*Math.PI*k*n/N;rr+=v*Math.cos(a);ii-=v*Math.sin(a)}re[k]=Math.hypot(rr,ii)}const max=Math.max(...re.slice(0,N/2),1e-9);sx.clearRect(0,0,spec.width,spec.height);sx.fillStyle='#c9a7ff';for(let k=0;k<N/2;k++){const h=re[k]/max*spec.height;sx.fillRect(k/(N/2)*spec.width,spec.height-h,spec.width/(N/2)+1,h)}}async function playBuffer(buf){stop();src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start();draw(buf.getChannelData(0),buf.sampleRate);status.textContent='Playing/analyzed ✓'}document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await ctx.decodeAudioData(await f.arrayBuffer());await ctx.resume();playBuffer(b);status.textContent=`${f.name} · ${(f.size/1024).toFixed(1)} KB`}catch(err){status.textContent='Decode failed: '+err.message}};function make(kind){ctx.resume();const sr=44100,d=kind==='sweep'?2:1,N=sr*d,b=ctx.createBuffer(1,N,sr),a=b.getChannelData(0);let seed=123456789;for(let i=0;i<N;i++){const t=i/sr;if(kind==='tone')a[i]=Math.sin(2*Math.PI*440*t)*.35;else if(kind==='sweep'){const f=80*Math.pow(80,t/d);a[i]=Math.sin(2*Math.PI*f*t)*.3}else{seed=(1664525*seed+1013904223)>>>0;a[i]=((seed/4294967296)*2-1)*.22}}playBuffer(b)}document.getElementById('tone').onclick=()=>make('tone');document.getElementById('sweep').onclick=()=>make('sweep');document.getElementById('noise').onclick=()=>make('noise');document.getElementById('stop').onclick=()=>{stop();status.textContent='Stopped'};</script></body></html>
