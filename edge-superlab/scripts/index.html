<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge SuperLab Runtime</title></head>
<body><div id="qr" style="display:none"></div><canvas id="img" width="512" height="512" style="display:none"></canvas>
<script>
(()=>{"use strict";
const MEM="edge-superlab.memory.v1";
const enc=new TextEncoder();
const clean=v=>String(v??"").trim();
function json(v){return JSON.stringify(v)}
function loadMem(){try{return JSON.parse(localStorage.getItem(MEM)||"[]")}catch(_){return[]}}
function saveMem(v){localStorage.setItem(MEM,JSON.stringify(v))}
async function sha256(text){const b=await crypto.subtle.digest("SHA-256",enc.encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function wasmTest(){
 const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
 const {instance}=await WebAssembly.instantiate(bytes);return instance.exports.add(20,22);
}
function idbTest(){return new Promise(resolve=>{if(!indexedDB)return resolve({ok:false,detail:"indexedDB missing"});let done=false;const finish=x=>{if(!done){done=true;resolve(x)}};try{const r=indexedDB.open("edge-superlab-probe",1);r.onupgradeneeded=e=>{e.target.result.createObjectStore("s")};r.onerror=()=>finish({ok:false,detail:String(r.error||"open failed")});r.onsuccess=()=>{try{const db=r.result,tx=db.transaction("s","readwrite"),s=tx.objectStore("s");s.put("ok","probe");tx.oncomplete=()=>{const t2=db.transaction("s","readonly"),g=t2.objectStore("s").get("probe");g.onsuccess=()=>{db.close();finish({ok:g.result==="ok",detail:g.result})};g.onerror=()=>{db.close();finish({ok:false,detail:"read failed"})}};tx.onerror=()=>{db.close();finish({ok:false,detail:"write failed"})}}catch(e){finish({ok:false,detail:e.message})}};setTimeout(()=>finish({ok:false,detail:"timeout"}),1800)}catch(e){finish({ok:false,detail:e.message})}})}
function workerTest(){return new Promise(resolve=>{if(typeof Worker==="undefined")return resolve({ok:false,detail:"Worker missing"});try{const u=URL.createObjectURL(new Blob(["onmessage=e=>postMessage(e.data*2)"],{type:"text/javascript"}));const w=new Worker(u);let done=false;const end=x=>{if(done)return;done=true;w.terminate();URL.revokeObjectURL(u);resolve(x)};w.onmessage=e=>end({ok:e.data===42,detail:e.data});w.onerror=e=>end({ok:false,detail:e.message||"worker error"});w.postMessage(21);setTimeout(()=>end({ok:false,detail:"timeout"}),1200)}catch(e){resolve({ok:false,detail:e.message})}})}
async function fetchTest(){try{const r=await fetch("../SKILL.md",{cache:"no-store"});const t=await r.text();return{ok:r.ok&&t.includes("name: edge-superlab"),detail:`HTTP ${r.status}, ${t.length} bytes`}}catch(e){return{ok:false,detail:e.message}}}
function presence(){
 let gl2=false;try{gl2=!!document.createElement("canvas").getContext("webgl2")}catch(_){}
 return{
  webgpu:{state:navigator.gpu?"AVAILABLE":"NO",detail:navigator.gpu?"navigator.gpu exists; open /gpu for an actual device test":"navigator.gpu absent"},
  webgl2:{state:gl2?"YES":"NO",detail:gl2?"context created":"context unavailable"},
  audio:{state:(window.AudioContext||window.webkitAudioContext)?"AVAILABLE":"NO",detail:"audio usually requires a user gesture"},
  camera:{state:navigator.mediaDevices?.getUserMedia?"AVAILABLE":"NO",detail:"permission/host policy not requested by headless self-test"},
  motion:{state:("DeviceMotionEvent" in window||"DeviceOrientationEvent" in window)?"AVAILABLE":"NO",detail:"iOS may require a user gesture + permission"},
  share:{state:navigator.share?"AVAILABLE":"NO",detail:"Web Share API"},
  clipboard:{state:navigator.clipboard?"AVAILABLE":"NO",detail:"may require gesture/permission"},
  notifications:{state:("Notification" in window)?"AVAILABLE":"NO",detail:"host policy may restrict permission"},
  serviceWorker:{state:navigator.serviceWorker?"AVAILABLE":"NO",detail:"presence only; skill webviews may restrict registration"},
  filePicker:{state:(window.showOpenFilePicker||document.createElement("input").files!==undefined)?"AVAILABLE":"NO",detail:"picker requires user gesture"},
  nativePython:{state:"NO",detail:"stock downloaded skills do not receive a native Python process"},
  pythonWasm:{state:"WASM",detail:"Pyodide/CPython-WASM can run in an interactive webview; /python tests this"},
  nativeIntents:{state:"HOST",detail:"defined by Edge Gallery itself; JavaScript cannot add arbitrary new intents"}
 }
}
async function selftest(){
 const out={runtime:{userAgent:navigator.userAgent,secureContext:isSecureContext,online:navigator.onLine},tests:{},presence:presence()};
 try{out.tests.javascript={ok:(21*2===42),detail:"basic execution"}}catch(e){out.tests.javascript={ok:false,detail:e.message}}
 try{localStorage.setItem("edge-superlab.probe","42");out.tests.localStorage={ok:localStorage.getItem("edge-superlab.probe")==="42",detail:"write/read"};localStorage.removeItem("edge-superlab.probe")}catch(e){out.tests.localStorage={ok:false,detail:e.message}}
 try{out.tests.webCrypto={ok:(await sha256("edge-superlab")).length===64,detail:"SHA-256"}}catch(e){out.tests.webCrypto={ok:false,detail:e.message}}
 try{out.tests.webAssembly={ok:(await wasmTest())===42,detail:"WASM add(20,22)=42"}}catch(e){out.tests.webAssembly={ok:false,detail:e.message}}
 out.tests.indexedDB=await idbTest();out.tests.worker=await workerTest();out.tests.sameOriginFetch=await fetchTest();
 out.summary=Object.fromEntries(Object.entries(out.tests).map(([k,v])=>[k,v.ok?"YES":"NO"]));return out;
}
function memoryPut(d){const text=clean(d.text);if(!text)return{error:"Nothing to remember."};const m=loadMem();m.push({text,t:Date.now()});if(m.length>200)m.splice(0,m.length-200);saveMem(m);return{result:`Remembered. ${m.length} item(s) stored in this skill origin.`}}
function memoryGet(d){const q=clean(d.query).toLowerCase(),m=loadMem();const r=m.filter(x=>!q||x.text.toLowerCase().includes(q)).slice(-20).reverse();return{result:r.length?r.map((x,i)=>`${i+1}. ${x.text}`).join("\n"):"No matching memory.",items:r}}
function nebula(){const c=document.getElementById("img"),x=c.getContext("2d"),w=c.width,h=c.height,im=x.createImageData(w,h),a=im.data;let seed=0x51f15e;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4,dx=(xx-w*.5)/w,dy=(y-h*.5)/h,r=Math.hypot(dx,dy),n=Math.sin(xx*.035+Math.sin(y*.021)*3)+Math.sin(y*.041)+Math.sin((xx+y)*.017),g=Math.max(0,1-r*1.65),v=Math.max(0,Math.min(1,g*.72+n*.075+rnd()*.09));a[i]=18+v*70;a[i+1]=12+v*120;a[i+2]=42+v*210;a[i+3]=255}x.putImageData(im,0,0);x.globalCompositeOperation="screen";for(let i=0;i<420;i++){const px=rnd()*w,py=rnd()*h,s=Math.pow(rnd(),7)*3+.35;x.fillStyle=`rgba(255,255,255,${.25+rnd()*.75})`;x.beginPath();x.arc(px,py,s,0,7);x.fill()}x.globalCompositeOperation="source-over";x.fillStyle="#fff";x.font="700 28px system-ui";x.fillText("EDGE SUPERLAB",22,48);x.font="14px ui-monospace,monospace";x.fillText("procedural image · local canvas",24,73);return c.toDataURL("image/png")}
function loadQR(){return new Promise((res,rej)=>{if(window.QRCode)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=()=>res();s.onerror=()=>rej(new Error("Could not load QR library; network/CDN unavailable"));document.head.appendChild(s)})}
async function makeQR(text){await loadQR();const host=document.getElementById("qr");host.innerHTML="";new QRCode(host,{text,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});for(let i=0;i<80;i++){const c=host.querySelector("canvas"),im=host.querySelector("img");if(c)return c.toDataURL("image/png");if(im?.src)return im.src;await new Promise(r=>setTimeout(r,50))}throw new Error("QR generation timed out")}
async function bench(){let s=0,t=performance.now();for(let i=0;i<400000;i++)s+=Math.sin(i*.001)*Math.cos(i*.0007);const jsMs=performance.now()-t;const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);const {instance}=await WebAssembly.instantiate(bytes);let z=0;t=performance.now();for(let i=0;i<250000;i++)z=instance.exports.add(z,1);const wasmMs=performance.now()-t;return{jsTrig400kMs:+jsMs.toFixed(1),wasmCalls250kMs:+wasmMs.toFixed(1),checksum:+s.toFixed(3),wasmResult:z}}
function limits(){return{result:["Observed boundary for stock downloadable Edge Gallery skills:","YES: JS/WebView execution, structured results, image return, interactive webviews, web APIs that the host/WebKit exposes.","WASM: compiled Rust/C/C++ or CPython/Pyodide can execute through WebAssembly when packaged/loaded for the web runtime.","HOST: native intents exist only when Edge Gallery implements them.","NO by default: arbitrary shell, native Python process, arbitrary Swift/C++ dylib execution, arbitrary Metal API calls, unrestricted filesystem/process control.","Custom native LiteRT-LM app: can expose Swift/C++/Metal/Python tools because you control the host app."].join("\n")}}
window.ai_edge_gallery_get_result=async data=>{try{const d=typeof data==="string"?JSON.parse(data):data||{};switch(d.action){case"selftest":{const r=await selftest();return json({result:JSON.stringify(r,null,2),report:r})}case"capabilities":{const r=presence();return json({result:JSON.stringify(r,null,2),capabilities:r})}case"hash":return json({result:await sha256(clean(d.text))});case"wasm":return json({result:`WebAssembly executed: add(20,22) = ${await wasmTest()}`});case"benchmark":{const r=await bench();return json({result:JSON.stringify(r,null,2),benchmark:r})}case"memory_put":return json(memoryPut(d));case"memory_get":return json(memoryGet(d));case"image":return json({result:"Generated locally with Canvas.",image:{base64:nebula()}});case"qr":{const text=clean(d.text);if(!text)return json({error:"Give me text or a URL for the QR code."});return json({result:"QR generated.",image:{base64:await makeQR(text)}})}case"open_lab":return json({result:"Opening the interactive capability lab.",webview:{url:"lab.html",aspectRatio:.66}});case"open_gpu":return json({result:"Opening the GPU/particle simulation. It will probe WebGPU and fall back automatically.",webview:{url:"gpu-sim.html",aspectRatio:.62}});case"open_python":return json({result:"Opening the Python-through-WebAssembly probe. This is Pyodide/CPython-WASM, not a native Python process.",webview:{url:"python.html",aspectRatio:.7}});case"limits":return json(limits());default:return json({result:"Edge SuperLab actions: selftest, capabilities, open_lab, open_gpu, open_python, qr, image, hash, wasm, benchmark, memory_put, memory_get, limits"})}}catch(e){return json({error:`Edge SuperLab: ${e?.message||e}`})}};
})();
</script></body></html>
