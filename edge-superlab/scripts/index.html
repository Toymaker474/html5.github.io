(()=>{"use strict";
const MEM="edge-superlab.memory.v1",PY="edge-superlab.python.v2",LATEST="edge-superlab.python.latest.v2";const enc=new TextEncoder(),dec=new TextDecoder();const clean=v=>String(v??"").trim(),json=JSON.stringify;
function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(_){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
async function sha256(text){const b=await crypto.subtle.digest("SHA-256",enc.encode(text));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function wasmTest(){const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);const{instance}=await WebAssembly.instantiate(bytes);return instance.exports.add(20,22)}
function idbTest(){return new Promise(resolve=>{if(!indexedDB)return resolve({ok:false,detail:"indexedDB missing"});let done=false;const finish=x=>{if(!done){done=true;resolve(x)}};try{const r=indexedDB.open("edge-superlab-probe",1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains("s"))e.target.result.createObjectStore("s")};r.onerror=()=>finish({ok:false,detail:String(r.error||"open failed")});r.onsuccess=()=>{try{const db=r.result,tx=db.transaction("s","readwrite"),s=tx.objectStore("s");s.put("ok","probe");tx.oncomplete=()=>{const t2=db.transaction("s","readonly"),g=t2.objectStore("s").get("probe");g.onsuccess=()=>{db.close();finish({ok:g.result==="ok",detail:g.result})};g.onerror=()=>{db.close();finish({ok:false,detail:"read failed"})}};tx.onerror=()=>{db.close();finish({ok:false,detail:"write failed"})}}catch(e){finish({ok:false,detail:e.message})}};setTimeout(()=>finish({ok:false,detail:"timeout"}),1800)}catch(e){finish({ok:false,detail:e.message})}})}
function workerTest(){return new Promise(resolve=>{if(typeof Worker==="undefined")return resolve({ok:false,detail:"Worker missing"});try{const u=URL.createObjectURL(new Blob(["onmessage=e=>postMessage(e.data*2)"],{type:"text/javascript"})),w=new Worker(u);let done=false;const end=x=>{if(done)return;done=true;w.terminate();URL.revokeObjectURL(u);resolve(x)};w.onmessage=e=>end({ok:e.data===42,detail:e.data});w.onerror=e=>end({ok:false,detail:e.message||"worker error"});w.postMessage(21);setTimeout(()=>end({ok:false,detail:"timeout"}),1200)}catch(e){resolve({ok:false,detail:e.message})}})}
async function fetchTest(){try{const r=await fetch("../SKILL.md",{cache:"no-store"}),t=await r.text();return{ok:r.ok&&t.includes("name: edge-superlab"),detail:`HTTP ${r.status}, ${t.length} bytes`}}catch(e){return{ok:false,detail:e.message}}}
function presence(){let gl2=false;try{gl2=!!document.createElement("canvas").getContext("webgl2")}catch(_){}return{webgpu:{state:navigator.gpu?"AVAILABLE":"NO",detail:navigator.gpu?"navigator.gpu exists; /gpu performs a real device test":"navigator.gpu absent"},webgl2:{state:gl2?"YES":"NO",detail:gl2?"context created":"context unavailable"},audio:{state:(window.AudioContext||window.webkitAudioContext)?"AVAILABLE":"NO",detail:"usually requires user gesture"},camera:{state:navigator.mediaDevices?.getUserMedia?"AVAILABLE":"NO",detail:"permission/host policy applies"},motion:{state:("DeviceMotionEvent"in window||"DeviceOrientationEvent"in window)?"AVAILABLE":"NO",detail:"iOS may require gesture + permission"},share:{state:navigator.share?"AVAILABLE":"NO",detail:"Web Share API"},clipboard:{state:navigator.clipboard?"AVAILABLE":"NO",detail:"may require gesture/permission"},filePicker:{state:(window.showOpenFilePicker||document.createElement("input").files!==undefined)?"AVAILABLE":"NO",detail:"picker requires user gesture"},compression:{state:typeof CompressionStream!=="undefined"?"AVAILABLE":"NO",detail:"CompressionStream API"},nativePython:{state:"NO",detail:"downloaded skills do not get a native Python process"},pythonWasm:{state:"WASM",detail:"Pyodide/CPython-WASM works in the interactive WebView"},nativeIntents:{state:"HOST",detail:"defined by Edge Gallery itself"}}}
async function selftest(){const out={runtime:{userAgent:navigator.userAgent,secureContext:isSecureContext,online:navigator.onLine},tests:{},presence:presence()};out.tests.javascript={ok:21*2===42,detail:"basic execution"};try{localStorage.setItem("edge-superlab.probe","42");out.tests.localStorage={ok:localStorage.getItem("edge-superlab.probe")==="42",detail:"write/read"};localStorage.removeItem("edge-superlab.probe")}catch(e){out.tests.localStorage={ok:false,detail:e.message}}try{out.tests.webCrypto={ok:(await sha256("edge-superlab")).length===64,detail:"SHA-256"}}catch(e){out.tests.webCrypto={ok:false,detail:e.message}}try{out.tests.webAssembly={ok:(await wasmTest())===42,detail:"WASM add(20,22)=42"}}catch(e){out.tests.webAssembly={ok:false,detail:e.message}}out.tests.indexedDB=await idbTest();out.tests.worker=await workerTest();out.tests.sameOriginFetch=await fetchTest();out.summary=Object.fromEntries(Object.entries(out.tests).map(([k,v])=>[k,v.ok?"YES":"NO"]));return out}
function memoryPut(d){const text=clean(d.text);if(!text)return{error:"Nothing to remember."};const m=load(MEM);m.push({text,t:Date.now()});if(m.length>300)m.splice(0,m.length-300);save(MEM,m);return{result:`Remembered. ${m.length} item(s) stored.`}}
function memoryGet(d){const q=clean(d.query).toLowerCase(),m=load(MEM),r=m.filter(x=>!q||x.text.toLowerCase().includes(q)).slice(-25).reverse();return{result:r.length?r.map((x,i)=>`${i+1}. ${x.text}`).join("\n"):"No matching memory.",items:r}}
function nebula(){const c=document.getElementById("img"),x=c.getContext("2d"),w=c.width,h=c.height,im=x.createImageData(w,h),a=im.data;let seed=0x51f15e;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4,dx=(xx-w*.5)/w,dy=(y-h*.5)/h,r=Math.hypot(dx,dy),n=Math.sin(xx*.035+Math.sin(y*.021)*3)+Math.sin(y*.041)+Math.sin((xx+y)*.017),g=Math.max(0,1-r*1.65),v=Math.max(0,Math.min(1,g*.72+n*.075+rnd()*.09));a[i]=18+v*70;a[i+1]=12+v*120;a[i+2]=42+v*210;a[i+3]=255}x.putImageData(im,0,0);x.globalCompositeOperation="screen";for(let i=0;i<420;i++){const px=rnd()*w,py=rnd()*h,s=Math.pow(rnd(),7)*3+.35;x.fillStyle=`rgba(255,255,255,${.25+rnd()*.75})`;x.beginPath();x.arc(px,py,s,0,7);x.fill()}x.globalCompositeOperation="source-over";x.fillStyle="#fff";x.font="700 28px system-ui";x.fillText("EDGE SUPERLAB",22,48);return c.toDataURL("image/png")}
function loadQR(){return new Promise((res,rej)=>{if(window.QRCode)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=res;s.onerror=()=>rej(new Error("QR library network load failed"));document.head.appendChild(s)})}
async function makeQR(text){await loadQR();const host=document.getElementById("qr");host.innerHTML="";new QRCode(host,{text,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});for(let i=0;i<80;i++){const c=host.querySelector("canvas"),im=host.querySelector("img");if(c)return c.toDataURL("image/png");if(im?.src)return im.src;await new Promise(r=>setTimeout(r,50))}throw new Error("QR generation timed out")}
async function bench(){let s=0,t=performance.now();for(let i=0;i<400000;i++)s+=Math.sin(i*.001)*Math.cos(i*.0007);const jsMs=performance.now()-t;const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]),{instance}=await WebAssembly.instantiate(bytes);let z=0;t=performance.now();for(let i=0;i<250000;i++)z=instance.exports.add(z,1);return{jsTrig400kMs:+jsMs.toFixed(1),wasmCalls250kMs:+(performance.now()-t).toFixed(1),checksum:+s.toFixed(3),wasmResult:z}}
function b64enc(s){const a=enc.encode(s);let b="";for(let i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);return btoa(b)}function b64dec(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return dec.decode(a)}
function parseCSV(s){const rows=[];let row=[],cell="",q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"'){if(q&&s[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=""}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cell);cell="";if(row.some(v=>v!==""))rows.push(row);row=[]}else cell+=ch}row.push(cell);if(row.some(v=>v!==""))rows.push(row);return rows}
async function tool(d){const op=clean(d.op),text=String(d.text??"");if(op==="text_stats"){const words=text.trim()?text.trim().split(/\s+/):[],freq={};for(const w of words.map(x=>x.toLowerCase().replace(/[^\p{L}\p{N}'-]/gu,""))).filter(Boolean))freq[w]=(freq[w]||0)+1;return{chars:text.length,lines:text?text.split(/\r?\n/).length:0,words:words.length,uniqueWords:Object.keys(freq).length,topWords:Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12)}}if(op==="json_pretty")return{result:JSON.stringify(JSON.parse(text),null,2)};if(op==="json_minify")return{result:JSON.stringify(JSON.parse(text))};if(op==="base64_encode")return{result:b64enc(text)};if(op==="base64_decode")return{result:b64dec(text)};if(op==="url_encode")return{result:encodeURIComponent(text)};if(op==="url_decode")return{result:decodeURIComponent(text)};if(op==="uuid")return{result:crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&3|8);return v.toString(16)})};if(op==="sha256")return{result:await sha256(text)};if(op==="regex"){const re=new RegExp(String(d.pattern??""),String(d.flags??"g")),matches=[];let m;if(!re.global){m=re.exec(text);if(m)matches.push({match:m[0],index:m.index,groups:m.slice(1)});return{matches}}while((m=re.exec(text))&&matches.length<100){matches.push({match:m[0],index:m.index,groups:m.slice(1)});if(m[0]==="")re.lastIndex++}return{matches,count:matches.length,truncated:matches.length===100}}if(op==="numbers"){const a=(text.match(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g)||[]).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);if(!a.length)throw new Error("No numbers found");const n=a.length,sum=a.reduce((x,y)=>x+y,0),mean=sum/n,median=n%2?a[n>>1]:(a[n/2-1]+a[n/2])/2,variance=a.reduce((s,x)=>s+(x-mean)**2,0)/n;return{count:n,min:a[0],max:a[n-1],sum,mean,median,stddev:Math.sqrt(variance)}}if(op==="csv_info"){const rows=parseCSV(text),width=Math.max(0,...rows.map(r=>r.length));return{rows:rows.length,columns:width,header:rows[0]||[],preview:rows.slice(0,8)}}throw new Error(`Unknown tool op: ${op}`)}
function savePython(d){const name=(clean(d.name)||`program-${Date.now()}`).slice(0,80),code=String(d.code??"");if(!code.trim())return{error:"Python code is empty."};if(code.length>250000)return{error:"Python program is too large."};let p=load(PY);const item={name,request:clean(d.request),code,t:Date.now()};p=p.filter(x=>x.name!==name);p.unshift(item);p=p.slice(0,30);save(PY,p);localStorage.setItem(LATEST,name);return{result:`Saved Python program '${name}'. Opening Python Studio.`,program:{name,chars:code.length},webview:{url:`python.html?name=${encodeURIComponent(name)}${d.autorun?"&autorun=1":""}`,aspectRatio:.7}}}
