<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge SuperLab iOS Runner</title></head>
<body><div id="qr" style="display:none"></div><canvas id="canvas" width="512" height="512" style="display:none"></canvas>
<script>
(()=>{
'use strict';
const PY='edge-superlab.python.v2', LATEST='edge-superlab.python.latest.v2', MEM='edge-superlab.memory.v1';
const enc=new TextEncoder(), dec=new TextDecoder();
const clean=v=>String(v??'').trim();
const out=v=>JSON.stringify(v);
function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
async function sha256(text){const b=await crypto.subtle.digest('SHA-256',enc.encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function wasm(){const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);const {instance}=await WebAssembly.instantiate(bytes);return instance.exports.add(20,22)}
function savePython(d){const name=(clean(d.name)||`program-${Date.now()}`).slice(0,80),code=String(d.code??'');if(!code.trim())return{error:'Python code is empty.'};if(code.length>250000)return{error:'Python program is too large.'};let p=load(PY);p=p.filter(x=>x.name!==name);p.unshift({name,request:clean(d.request),code,t:Date.now()});p=p.slice(0,40);save(PY,p);localStorage.setItem(LATEST,name);return{result:`Saved Python program '${name}'. Opening Python Studio.`,webview:{url:`python.html?name=${encodeURIComponent(name)}${d.autorun?'&autorun=1':''}`,aspectRatio:.7}}}
function listPython(){const p=load(PY);return{result:p.length?p.map((x,i)=>`${i+1}. ${x.name} — ${x.request||'Python program'}`).join('\n'):'No saved Python programs yet.'}}
function putMemory(d){const text=clean(d.text);if(!text)return{error:'Nothing to remember.'};const m=load(MEM);m.push({text,t:Date.now()});if(m.length>300)m.splice(0,m.length-300);save(MEM,m);return{result:`Remembered. ${m.length} item(s) stored.`}}
function getMemory(d){const q=clean(d.query).toLowerCase(),m=load(MEM),r=m.filter(x=>!q||x.text.toLowerCase().includes(q)).slice(-25).reverse();return{result:r.length?r.map((x,i)=>`${i+1}. ${x.text}`).join('\n'):'No matching memory.'}}
function caps(){let gl2=false;try{gl2=!!document.createElement('canvas').getContext('webgl2')}catch{}return{javascript:true,webAssembly:typeof WebAssembly!=='undefined',webCrypto:!!crypto?.subtle,localStorage:true,indexedDB:!!window.indexedDB,worker:typeof Worker!=='undefined',webgpu:!!navigator.gpu,webgl2:gl2,audio:!!(window.AudioContext||window.webkitAudioContext),camera:!!navigator.mediaDevices?.getUserMedia,motion:'DeviceMotionEvent'in window||'DeviceOrientationEvent'in window,share:!!navigator.share,clipboard:!!navigator.clipboard}}
async function selftest(){const c=caps();let storage=false,hash=false,w=false;try{localStorage.setItem('edge-superlab.ios.probe','ok');storage=localStorage.getItem('edge-superlab.ios.probe')==='ok';localStorage.removeItem('edge-superlab.ios.probe')}catch{}try{hash=(await sha256('superlab')).length===64}catch{}try{w=(await wasm())===42}catch{}return{runner:'ios-compat-v1',entrypoints:['ai_edge_gallery_get_result','ai_gallery_get_result'],storage,sha256:hash,wasm:w,capabilities:c,userAgent:navigator.userAgent}}
function image(){const c=document.getElementById('canvas'),x=c.getContext('2d'),im=x.createImageData(c.width,c.height),a=im.data;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){const i=(y*c.width+xx)*4,dx=(xx-256)/256,dy=(y-256)/256,r=Math.hypot(dx,dy),v=Math.max(0,1-r)*180+30*Math.sin(xx*.05+y*.02);a[i]=Math.max(0,30+v*.35);a[i+1]=Math.max(0,20+v*.5);a[i+2]=Math.max(0,70+v);a[i+3]=255}x.putImageData(im,0,0);return c.toDataURL('image/png')}
function loadQR(){return new Promise((res,rej)=>{if(window.QRCode)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=res;s.onerror=()=>rej(new Error('QR library could not load'));document.head.appendChild(s)})}
async function qr(text){await loadQR();const h=document.getElementById('qr');h.innerHTML='';new QRCode(h,{text,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});for(let i=0;i<50;i++){const c=h.querySelector('canvas'),im=h.querySelector('img');if(c)return c.toDataURL('image/png');if(im?.src)return im.src;await new Promise(r=>setTimeout(r,40))}throw new Error('QR generation timed out')}
function numbers(text){const a=(String(text).match(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g)||[]).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);if(!a.length)throw new Error('No numbers found');const n=a.length,sum=a.reduce((s,x)=>s+x,0),mean=sum/n,median=n%2?a[n>>1]:(a[n/2-1]+a[n/2])/2;return{count:n,min:a[0],max:a[n-1],sum,mean,median}}
function view(url,msg,ratio=.7){return out({result:msg,webview:{url,aspectRatio:ratio}})}
async function handler(data){try{const d=typeof data==='string'?JSON.parse(data||'{}'):(data||{});switch(d.action){
case 'hub':case 'open_hub':return view('hub.html','Opening SuperLab Mission Control.',.66);
case 'open_lab':return view('lab.html','Opening capability lab.',.66);
case 'open_tools':return view('toolbox.html','Opening local tool library.',.69);
case 'open_python':{const n=clean(d.name)||localStorage.getItem(LATEST)||'';return view(`python.html${n?`?name=${encodeURIComponent(n)}`:''}`,'Opening Python Studio — CPython through WebAssembly.',.7)}
case 'save_python':return out(savePython(d));
case 'list_python':return out(listPython());
case 'open_notebook':return view('notebook.html','Opening persistent Python notebook.',.68);
case 'open_workspace':return view('workspace.html','Opening project workspace.',.68);
case 'open_vision':return view('vision-lab.html','Opening Vision Lab.',.68);
case 'open_audio':return view('audio-lab.html','Opening Audio/DSP Lab.',.68);
case 'open_sql':return view('sql-lab.html','Opening SQLite Data Lab.',.68);
case 'open_gpu':case 'open_compute':return view('gpu-sim.html','Opening GPU/CPU compute lab.',.62);
case 'selftest':{const r=await selftest();return out({result:JSON.stringify(r,null,2),report:r})}
case 'capabilities':{const r=caps();return out({result:JSON.stringify(r,null,2),capabilities:r})}
case 'hash':return out({result:await sha256(clean(d.text))});
case 'wasm':return out({result:`WebAssembly executed: add(20,22) = ${await wasm()}`});
case 'memory_put':return out(putMemory(d));
case 'memory_get':return out(getMemory(d));
case 'image':return out({result:'Generated locally with Canvas.',image:{base64:image()}});
case 'qr':{const t=clean(d.text);if(!t)return out({error:'Give text or a URL for the QR code.'});return out({result:'QR generated.',image:{base64:await qr(t)}})}
case 'packages':return out({result:'Core: numpy, scipy, pandas, matplotlib\nSymbolic: sympy\nML: scikit-learn\nVision: Pillow, opencv-python, scikit-image\nGraphs: networkx\nScience: astropy, statsmodels\nData: polars, pyarrow\nCompatible pure-Python wheels may install through micropip.'});
case 'tool':{if(d.op==='numbers'){const r=numbers(d.text);return out({result:JSON.stringify(r,null,2),tool:r})}if(d.op==='json_pretty')return out({result:JSON.stringify(JSON.parse(String(d.text??'')),null,2)});if(d.op==='json_minify')return out({result:JSON.stringify(JSON.parse(String(d.text??'')))});if(d.op==='base64_encode')return out({result:btoa(unescape(encodeURIComponent(String(d.text??''))))});if(d.op==='base64_decode')return out({result:decodeURIComponent(escape(atob(String(d.text??''))))});if(d.op==='sha256')return out({result:await sha256(String(d.text??''))});return out({error:`Unsupported compact tool op: ${d.op}`})}
case 'limits':return out({result:'Downloaded Edge Gallery skills can run WebView JavaScript, WebAssembly and exposed Web APIs. Python works through CPython/Pyodide WASM. Arbitrary native shell/Swift/C++/Metal execution is not granted to downloaded skills.'});
default:return out({result:'Edge SuperLab iOS runner ready. Try /hub, /python, /notebook, /workspace, /vision, /audio, /sql, /gpu, /selftest, /packages, /wasm, /qr.'});
}}catch(e){return out({error:`Edge SuperLab iOS runner: ${e?.message||e}`})}}
window['ai_edge_gallery_get_result']=handler;
window['ai_gallery_get_result']=handler;
})();
</script></body></html>
