<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070b"><title>OUROBOROS FLUID LAB</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070b;color:#dff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;background:#02070bcc;border:1px solid #8fffff44;border-radius:12px;padding:10px 12px;font-size:11px;pointer-events:none;backdrop-filter:blur(10px)}b{color:#9ff}.hint{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;background:#02070bbb;padding:8px 10px;border-radius:10px;font-size:10px;pointer-events:none}.err{color:#ff9999;white-space:pre-wrap}</style><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="c"></canvas><div class="hud"><b>OUROBOROS FLUID LAB</b><div id="stats">booting…</div><div id="mode">water + lava + steam + sediment</div></div><div class="hint">drag camera • tap/drag world = inject water</div><script>addEventListener('error',e=>{stats.textContent='BOOT ERROR';mode.className='err';mode.textContent=e.message||'unknown'});addEventListener('unhandledrejection',e=>{stats.textContent='MODULE ERROR';mode.className='err';mode.textContent=String(e.reason?.message||e.reason||'unknown')});</script><script src="./fluid.js?v=1"></script></body></html>
