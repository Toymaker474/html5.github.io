<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#05070b;color:#edf6ff;font:12px system-ui,-apple-system,sans-serif;overflow:hidden}.app{padding:7px}.top{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.title{font-weight:800;font-size:14px;margin-right:auto}.pill,button{border:1px solid #2a3d52;background:#0b1520;color:#eaf5ff;border-radius:999px;padding:6px 9px;min-height:32px}button{font-weight:650}canvas{width:100%;aspect-ratio:16/9;display:block;margin-top:6px;border-radius:12px;background:#020408;touch-action:none}.row{display:grid;grid-template-columns:2fr 1fr;gap:6px;margin-top:6px}.panel{border:1px solid #1d2c3b;background:#08111a;border-radius:10px;padding:6px;min-width:0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.s{min-width:0}.k{font-size:8px;color:#88a1b6;text-transform:uppercase}.v{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.neur{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}.n{height:31px;background:#0c1823;border-radius:5px;position:relative;overflow:hidden}.bar{position:absolute;left:0;right:0;bottom:0;background:#65b9ff;opacity:.9}.nl{position:absolute;left:3px;top:2px;font-size:7px;color:#d9ecff;z-index:2}.note{color:#8197aa;font-size:9px;margin-top:4px}@media(max-width:700px){.row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="app"><div class="top"><div class="title">🪰 NeuroFly WASM Lab</div><span class="pill" id="genome"></span><button id="pause">Pause</button><button id="storm">Storm</button><button id="mutate">Mutate</button></div><canvas id="c" width="900" height="506"></canvas><div class="row"><div class="panel"><div class="stats"><div class="s"><div class="k">Alive</div><div class="v" id="alive"></div></div><div class="s"><div class="k">Food</div><div class="v" id="food"></div></div><div class="s"><div class="k">Births</div><div class="v" id="births"></div></div><div class="s"><div class="k">Deaths</div><div class="v" id="deaths"></div></div><div class="s"><div class="k">Score</div><div class="v" id="score"></div></div></div><div class="note">C/WASM simulation core · recurrent fly brains · projected wind field · tap a fly to inspect it</div></div><div class="panel"><div class="k">Selected fly neural state</div><div class="neur" id="neur"></div></div></div></div><script>
const MODE={forager:0,explorer:1,swarm:2,chaos:3};const P=new URLSearchParams(location.search);let seed=(+P.get('seed')||42)>>>0,pop=+P.get('population')||24,mode=P.get('mode')||'forager',mutation=+P.get('mutation')||.18,wind=+P.get('wind')||1;
const c=document.getElementById('c'),x=c.getContext('2d');let E,running=true,selected=0,storm=1,last=performance.now(),fps=0;const labels=['N0','N1','N2','N3','N4','N5','N6','N7','TURN+','TURN−','THRUST','SOCIAL'];
const neur=document.getElementById('neur');for(const l of labels){const d=document.createElement('div');d.className='n';d.innerHTML=`<div class="nl">${l}</div><div class="bar"></div>`;neur.appendChild(d)}
async function load(){const t=(await (await fetch('engine.b64?v=3')).text()).trim(),b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);E=(await WebAssembly.instantiate(u,{})).instance.exports;reset()}
function reset(){E.init(seed,pop,MODE[mode],mutation,wind*storm);document.getElementById('genome').textContent=`${mode} · genome ${seed}`}
function drawWind(){const gw=E.grid_w(),gh=E.grid_h();x.lineWidth=1;x.strokeStyle='rgba(80,155,220,.22)';for(let gy=2;gy<gh;gy+=4)for(let gx=2;gx<gw;gx+=4){let u=E.wind_u(gx,gy),v=E.wind_v(gx,gy),px=(gx+.5)/gw*c.width,py=(gy+.5)/gh*c.height;x.beginPath();x.moveTo(px,py);x.lineTo(px+u*1300,py+v*1300);x.stroke()}}
function draw(){x.fillStyle='#02060a';x.fillRect(0,0,c.width,c.height);drawWind();for(let i=0;i<7;i++){x.fillStyle='#182532';x.beginPath();x.arc(E.obs_x(i)*c.width,E.obs_y(i)*c.height,E.obs_r(i)*c.width,0,7);x.fill()}for(let i=0;i<14;i++){x.fillStyle='#8cff7a';x.beginPath();x.arc(E.food_x(i)*c.width,E.food_y(i)*c.height,4,0,7);x.fill()}x.fillStyle='#ff4d5f';x.beginPath();x.arc(E.pred_x()*c.width,E.pred_y()*c.height,10,0,7);x.fill();let alive=0;for(let i=0;i<E.count();i++){if(!E.is_alive(i))continue;alive++;let px=E.x(i)*c.width,py=E.y(i)*c.height,dx=E.dx(i),dy=E.dy(i),a=i===selected?9:5; x.save();x.translate(px,py);x.rotate(Math.atan2(dy,dx));x.fillStyle=i===selected?'#fff7ad':'#86d8ff';x.beginPath();x.moveTo(a,0);x.lineTo(-a*.8,a*.55);x.lineTo(-a*.4,0);x.lineTo(-a*.8,-a*.55);x.closePath();x.fill();x.strokeStyle='rgba(220,245,255,.55)';x.beginPath();x.moveTo(-1,0);x.lineTo(-5,7);x.moveTo(-1,0);x.lineTo(-5,-7);x.stroke();x.restore()}document.getElementById('alive').textContent=alive;document.getElementById('food').textContent=E.food_eaten();document.getElementById('births').textContent=E.birth_count();document.getElementById('deaths').textContent=E.death_count();document.getElementById('score').textContent=E.score().toFixed(0);for(let n=0;n<12;n++){let z=Math.max(-1,Math.min(1,E.neuron(selected,n))),bar=neur.children[n].querySelector('.bar');bar.style.height=((z+1)*50)+'%';bar.style.background=z>=0?'#65b9ff':'#ff667a'}}
function frame(t){if(E&&running)E.step(2);if(E)draw();requestAnimationFrame(frame)}
document.getElementById('pause').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Pause':'Run'};document.getElementById('storm').onclick=()=>{storm=storm===1?2.4:1;reset()};document.getElementById('mutate').onclick=()=>{seed=(seed+101+Math.floor(Math.random()*9000))>>>0;reset()};c.addEventListener('pointerdown',ev=>{if(!E)return;const r=c.getBoundingClientRect(),mx=(ev.clientX-r.left)/r.width,my=(ev.clientY-r.top)/r.height;let best=0,bd=9;for(let i=0;i<E.count();i++)if(E.is_alive(i)){let dx=E.x(i)-mx,dy=E.y(i)-my,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}selected=best});load();requestAnimationFrame(frame);
</script></body></html>
