function antPass(){if(ant.bodyC<=0)return;const s=obsScale(),shadow=project(ant.x,ant.z,0);og.fillStyle='rgba(15,10,7,.34)';og.beginPath();og.ellipse(shadow[0]+s*.0004,shadow[1]+s*.0007,s*.0058,s*.0027,-.25,0,TAU);og.fill();const legs=[];for(let i=0;i<6;i++){const L=ant.legs[i],hip=legHipWorld(i),knee=[hip[0]+Math.cos(ant.yaw+L.q1)*LEG_L1,hip[1]+Math.sin(ant.yaw+L.q1)*LEG_L1],foot=legFK(L,i),depth=(i<3?-1:1)+(i%3)*.1;legs.push({i,L,hip,knee,foot,depth})}legs.sort((a,b)=>a.depth-b.depth);for(const q of legs){const a=project(q.hip[0],q.hip[1],.0031),b=project(q.knee[0],q.knee[1],.0022),d=project(q.foot[0],q.foot[1],.0007),r=Math.max(.38,s*.00032);capsule(a,b,r,'rgb(52,27,16)');capsule(b,d,r*.78,'rgb(44,23,14)');if(q.L.stance){og.fillStyle='rgba(16,10,6,.65)';og.beginPath();og.ellipse(d[0],d[1]+.6,Math.max(.4,r*.9),Math.max(.25,r*.3),0,0,TAU);og.fill()}}function part(lx,lz,y,rx,rz,col){const w=localToWorld(lx,lz),p=project(w[0],w[1],y);og.save();og.translate(p[0],p[1]);og.rotate(ant.yaw-.48);og.fillStyle=col;og.beginPath();og.ellipse(0,0,Math.max(1,rx*s),Math.max(.8,rz*s*.72),0,0,TAU);og.fill();og.restore();return p}const abdomen=part(-.0044,0,.0033,.0046,.0026,'rgb(43,21,13)'),petiole=part(-.0010,0,.0035,.0012,.0012,'rgb(57,29,16)'),thorax=part(.0012,0,.0037,.0027,.0022,'rgb(71,35,18)'),head=part(.0047,0,.0034,.00245,.00205,'rgb(48,24,14)');for(const side of [-1,1]){const t=antennaTip(side),a=project(t.head[0],t.head[1],.0032),b=project(t.mid[0],t.mid[1],.0028),d=project(t.tip[0],t.tip[1],.0021);capsule(a,b,Math.max(.26,s*.00013),'rgb(42,22,13)');capsule(b,d,Math.max(.22,s*.00010),'rgb(42,22,13)')}const jb=localToWorld(.0048,0);for(const t of jawTips())capsule(project(jb[0],jb[1],.0031),project(t[0],t[1],.0027),Math.max(.28,s*.00015),'rgb(28,14,10)');const band=scaleBand();if(['BODY','JOINT','MICRO'].includes(band)){og.strokeStyle='rgba(210,132,74,.34)';og.lineWidth=.55;for(const p of [abdomen,thorax,head]){og.beginPath();og.arc(p[0],p[1],Math.max(1.2,s*.0011),-.8,.6);og.stroke()}}if(['JOINT','MICRO'].includes(band)){for(let k=0;k<36;k++){const ang=hr(ant.seed,k,901)*TAU,rr=.0028*Math.sqrt(hr(ant.seed,k,902)),w=localToWorld(-.0003+rr*Math.cos(ang),rr*.55*Math.sin(ang)),p=project(w[0],w[1],.004),len=Math.max(.6,s*.00024);og.strokeStyle='rgba(135,91,56,.38)';og.lineWidth=.3;og.beginPath();og.moveTo(p[0],p[1]);og.lineTo(p[0]+Math.cos(ang)*len,p[1]+Math.sin(ang)*len);og.stroke()}}if(!ant.alive){og.fillStyle='rgba(185,160,110,.14)';og.beginPath();og.ellipse(thorax[0],thorax[1],Math.max(3,s*.006),Math.max(1.2,s*.0025),0,0,TAU);og.fill()}}
function physicalObservation(){updateQTree();worldPass();wallPass();envObjectsPass();antPass();obsData=og.getImageData(0,0,obsW,obsH).data}
function luma(r,g,b){return.2126*r+.7152*g+.0722*b}
function reconstruct(){if(prevCamVersion!==cam.version){prevBits.fill(0);prevLum.fill(0);prevCamVersion=cam.version}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050403';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.font=`${charH*1.01}px Menlo,Consolas,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';for(let cy=0;cy<rows;cy++)for(let cx=0;cx<cols;cx++){let sr=0,sg=0,sb=0,mean=0,bx=cx*2,by=cy*4;for(let sy=0;sy<4;sy++)for(let sx=0;sx<2;sx++){const p=((bx+sx)+(by+sy)*obsW)*4,r=obsData[p],g=obsData[p+1],b=obsData[p+2];sr+=r;sg+=g;sb+=b;mean+=luma(r,g,b)}mean/=8;let bits=0,fr=0,fg=0,fb=0,br=0,bg=0,bb=0,nf=0,nb=0;for(let sy=0;sy<4;sy++)for(let sx=0;sx<2;sx++){const k=sx+sy*2,p=((bx+sx)+(by+sy)*obsW)*4,r=obsData[p],g=obsData[p+1],b=obsData[p+2];if(luma(r,g,b)>mean){bits|=1<<k;fr+=r;fg+=g;fb+=b;nf++}else{br+=r;bg+=g;bb+=b;nb++}}const hi=cx+cy*cols,old=prevBits[hi];if(pop8(old^bits)<=1&&Math.abs(prevLum[hi]-mean)<7)bits=old;prevBits[hi]=bits;prevLum[hi]=mean;if(nf){fr/=nf;fg/=nf;fb/=nf}else{fr=sr/8;fg=sg/8;fb=sb/8}if(nb){br/=nb;bg/=nb;bb/=nb}else{br=sr/8;bg=sg/8;bb=sb/8}ctx.fillStyle=`rgb(${br|0},${bg|0},${bb|0})`;ctx.fillRect(cx*charW,66+cy*charH,charW+.5,charH+.5);const ch=maskBest[bits]||' ';if(ch!==' '){ctx.fillStyle=`rgb(${cl(fr*1.08,0,255)|0},${cl(fg*1.08,0,255)|0},${cl(fb*1.08,0,255)|0})`;ctx.fillText(ch,(cx+.5)*charW,66+(cy+.5)*charH)}}}

function rounded(C,x,y,w,h,r){C.beginPath();C.moveTo(x+r,y);C.arcTo(x+w,y,x+w,y+h,r);C.arcTo(x+w,y+h,x,y+h,r);C.arcTo(x,y+h,x,y,r);C.arcTo(x,y,x+w,y,r);C.closePath()}
function button(x,y,w,label,on=false){ctx.fillStyle=on?'rgba(88,56,27,.96)':'rgba(25,18,12,.94)';rounded(ctx,x,y,w,20,5);ctx.fill();ctx.strokeStyle=on?'#f0c181':'#8e6840';ctx.stroke();ctx.fillStyle='#f7eee2';ctx.font='8px Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w*.5,y+10)}
function fmtTime(s){return s<60?s.toFixed(1)+'s':s<DAY?(s/60).toFixed(1)+'m':(s/DAY).toFixed(2)+'d'}
function whyText(){if(selected.kind==='ant')return[`behavior ${ant.why}; only local odor/contact cues are used`,`${ant.legs.filter(L=>L.stance).length} stance contacts are currently supporting body motion`,`quadtree ${diag.qnodes} visible/active leaves; sparse tiles ${diag.active}`];if(selected.kind==='piece'){const p=pieceIndex.get(selected.id);return p?[`persistent piece ${p.id} state=${p.state}`,`mass ${(p.mass*1e6).toFixed(1)}mg moisture ${(p.moisture*1e6).toFixed(1)}mg`]:[]}const i=selected.index,out=[];if(A.h[i]>.0001)out.push('surface water exists from conservative HLL flux / precipitation');if(A.poreW[i]>.00004)out.push('pore water came from paired absorption/capillary transfer');if(A.fungus[i]>.000004)out.push('fungus biomass was produced by consuming local carbon');return out}
function drawInspector(){const x=8,y=69,w=Math.min(342,innerWidth-16),q=whyOpen?whyText():[];ctx.fillStyle='rgba(17,12,8,.88)';rounded(ctx,x,y,w,72+q.length*10,7);ctx.fill();ctx.strokeStyle='#8c6843';ctx.stroke();ctx.fillStyle='#f3e8da';ctx.font='8px Menlo,monospace';ctx.textAlign='left';ctx.textBaseline='top';if(selected.kind==='ant'){ctx.fillText(`ANT ${ant.alive?'ALIVE':'DEAD'} E ${ant.E.toFixed(1)} H2O ${(ant.W*1e6).toFixed(2)}mg speed ${(Math.hypot(ant.vx,ant.vz)*1000).toFixed(2)}mm/s`,x+7,y+7);ctx.fillText(`stance ${ant.legs.filter(L=>L.stance).length}/6 jaw ${ant.jaw.q.toFixed(2)} carry ${ant.carryID<0?'none':ant.carryID} seed ${ant.seed}`,x+7,y+18);ctx.fillText(`physics HLL + porous + thermal + reaction + debris + articulated contact`,x+7,y+29);ctx.fillText(`adaptive substrate tiles ${diag.active} quadtree leaves ${diag.qnodes} view ${VIEW[viewI]} ${scaleBand()}`,x+7,y+40);ctx.fillText(`provenance ${provenance()} branch B${history.current}${rewound?' REWOUND':''}`,x+7,y+51)}else ctx.fillText(selected.kind==='piece'?`PIECE ${selected.id}`:`CELL ${selected.index}`,x+7,y+7);for(let k=0;k<q.length;k++)ctx.fillText('WHY '+q[k],x+7,y+62+k*10)}
function drawUI(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='rgba(11,8,6,.94)';rounded(ctx,6,6,innerWidth-12,56,8);ctx.fill();ctx.fillStyle='#f4e9da';ctx.font='9px Menlo,monospace';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`OMEGA Ω ANT BOX V5 // ADAPTIVE SUBSTRATE // ${VIEW[viewI]} ${scaleBand()} ${provenance()}`,11,10);ctx.fillText(`${paused?'PAUSED':'RUN'} ${maxMode?'MAX':RATE[rateI]+'×'} t ${fmtTime(simT)} Q ${fmtTime(pending)} SCENE ${SCENE[sceneI]} TOOL ${TOOL[toolI]}`,11,22);ctx.fillText(`H2O ${(diag.water*1e6).toFixed(0)}mg Δ${((diag.water-(water0+externalWater))*1e6).toFixed(2)} C ${(diag.C*1e6).toFixed(0)}mg Δ${((diag.C-(c0+externalC))*1e6).toFixed(2)}`,11,34);ctx.fillText(`tiles ${diag.active} qnodes ${diag.qnodes} pieces ${diag.pieces} fungus ${(diag.fungus*1e6).toFixed(1)}mg ${tests} ${frameMs.toFixed(1)}ms`,11,46);const gap=3,w=(innerWidth-gap*7)/6,y1=innerHeight-45,y2=innerHeight-22;for(let k=0;k<6;k++){const x=gap+k*(w+gap);button(x,y1,w,['PLAY','STEP','RATE','MAX','REW','SCRUB'][k],(k===0&&!paused)||(k===3&&maxMode));button(x,y2,w,['BRANCH','VIEW','SCENE','TOOL','WHY','RESET'][k],k===4&&whyOpen)}drawInspector();if(fault){ctx.fillStyle='rgba(80,0,0,.94)';rounded(ctx,14,innerHeight*.38,innerWidth-28,66,8);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('OMEGA FAIL-CLOSED',innerWidth*.5,innerHeight*.38+20);ctx.font='9px Menlo,monospace';ctx.fillText(fault,innerWidth*.5,innerHeight*.38+43)}}

function pick(wx,wz){if(Math.hypot(wx-ant.x,wz-ant.z)<.014){selected={kind:'ant',id:1,index:-1};return}let bp=null,bd=.012*.012;for(const p of pieces){if(!p.alive)continue;const d=sq(wx-p.x)+sq(wz-p.z);if(d<bd){bd=d;bp=p}}selected=bp?{kind:'piece',id:bp.id,index:-1}:{kind:'cell',id:-1,index:cellAt(wx,wz)}}
function addFoodAt(wx,wz){ensureBranch();const f=makeFood(wx,wz,.00009);food.push(f);externalC+=f.c;externalWater+=f.w}
function rainPulse(){ensureBranch();atm.cloud+=.005;externalWater+=.005}
function cutWallAt(wx,wz){ensureBranch();let best=null,bd=.03;for(const side of ['N','S','W','E']){const arr=wallArray(side);for(let k=0;k<arr.length;k++){let x,z;if(side==='N'||side==='S'){x=BOX_X0+(k+.5)*DX;z=side==='N'?BOX_Z0:BOX_Z1}else{x=side==='W'?BOX_X0:BOX_X1;z=BOX_Z0+(k+.5)*DZ}const d=Math.hypot(wx-x,wz-z);if(d<bd){bd=d;best={side,k,x,z}}}}if(best){const arr=wallArray(best.side),m=arr[best.k];arr[best.k]=0;if(m>0)makePiece(best.x,best.z,m,.006,.002)}}
function wetPatch(wx,wz){ensureBranch();const i=cellAt(wx,wz),q=.00012;A.poreW[i]+=q;externalWater+=q;wakeTileByCell(i)}
function applyTool(wx,wz){if(toolI===0)pick(wx,wz);else if(toolI===1)addFoodAt(wx,wz);else if(toolI===2)rainPulse();else if(toolI===3)cutWallAt(wx,wz);else if(toolI===4)wetPatch(wx,wz);else resetWorld()}
function bottomAction(px,py){if(py<innerHeight-50)return false;const gap=3,w=(innerWidth-gap*7)/6,col=cl(Math.floor((px-gap)/(w+gap)),0,5),top=py<innerHeight-24;if(top){if(col===0){paused=!paused;maxMode=false}else if(col===1){if(paused)for(let n=0;n<6;n++)fineStep(BASE_DT)}else if(col===2){rateI=(rateI+1)%RATE.length;maxMode=false}else if(col===3){maxMode=!maxMode;if(maxMode)paused=false}else if(col===4)rewindOne();else scrubBack()}else{if(col===0)branch();else if(col===1){viewI=(viewI+1)%VIEW.length;cam.zoom=1;cam.panX=cam.panY=0;cam.version++}else if(col===2){sceneI=(sceneI+1)%SCENE.length;resetWorld()}else if(col===3)toolI=(toolI+1)%TOOL.length;else if(col===4)whyOpen=!whyOpen;else resetWorld()}return true}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(bottomAction(e.clientX,e.clientY))return;if(pointers.size===1){const p=screenToWorld(e.clientX,e.clientY);applyTool(p[0],p[1]);dragPointer=e.pointerId;dragSX=e.clientX;dragSY=e.clientY}else if(pointers.size===2){const p=[...pointers.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchZoom=cam.zoom}})
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);cam.zoom=pinchZoom*Math.max(.03,d/Math.max(1,pinchD));cam.version++;return}if(e.pointerId===dragPointer&&toolI===0){cam.panX+=e.clientX-dragSX;cam.panY+=e.clientY-dragSY;dragSX=e.clientX;dragSY=e.clientY;cam.version++}})
function endPointer(e){pointers.delete(e.pointerId);if(e.pointerId===dragPointer)dragPointer=-1;if(pointers.size<2)pinchD=0}c.addEventListener('pointerup',endPointer);c.addEventListener('pointercancel',endPointer);c.addEventListener('wheel',e=>{e.preventDefault();cam.zoom*=Math.exp(-e.deltaY*.0015);cam.version++},{passive:false});

function resize(){dpr=Math.min(2,devicePixelRatio||1);c.width=Math.floor(innerWidth*dpr);c.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);resizeObs();cam.version++}window.addEventListener('resize',resize)
function resetWorld(){fault='';paused=true;maxMode=false;rateI=0;cam.zoom=1;cam.panX=cam.panY=0;cam.version++;simT=pending=accField=accTherm=accBio=accWeather=accDebris=0;externalWater=externalC=0;atm.vapor=.018;atm.cloud=.004;atm.airTemp=22;atm.humidity=.55;atm.co2=.022;tileActive.fill(0);tileDirty.fill(0);tileLast.fill(0);activeTiles=[];buildQTree();generateWorld(SCENE[sceneI]);wakeTileByCell(cellAt(ant.x,ant.z));selected={kind:'ant',id:1,index:-1};water0=totalWater();c0=totalC();resetHistory();checkpoint('RESET');rewound=false;updateDiagnostics();selfTests();last=performance.now()}
function render(){resizeObs();physicalObservation();reconstruct();drawUI()}
function frame(now){const fs=performance.now(),real=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!fault){const req=maxMode?Math.max(.4,real*900):real*RATE[rateI];advance(req,7.2)}diagClock+=real;if(diagClock>.45){updateDiagnostics();validate(false);diagClock=0}render();frameMs=performance.now()-fs;avgFrame=avgFrame*.94+frameMs*.06;qualityClock+=real;if(qualityClock>2.5){if(avgFrame>34)quality=Math.max(.58,quality-.08);else if(avgFrame<22)quality=Math.min(1,quality+.04);qualityClock=0}requestAnimationFrame(frame)}
initGlyphs();resize();resetWorld();requestAnimationFrame(frame);
