<script>
'use strict';

/*
OMEGA AS Ω — ANT BOX V4
From-scratch single-file causal engine.

Authoritative world:
- finite cardboard cellulose / outside soil organic matter
- surface water + momentum, porous water, atmospheric vapor/cloud
- temperature, fungus, nutrient, two local odor fields
- finite wall segments
- persistent same-identity cardboard pieces
- one ant with articulated reduced mechanics

Active solvers:
1) HLL finite-volume shallow-water solver
2) porous absorption / capillary diffusion / evaporation solver
3) thermal diffusion + phase-free weather forcing
4) reaction / decomposition solver
5) scalar diffusion solver for local odor fields
6) sequential impulse / spring contact solver for debris and carried pieces
7) reduced articulated stance-contact solver for six ant legs

No direct desiredSpeed -> body velocity. Ant translation/rotation comes from
stance constraints, external contact forces and drag.
*/

const TAU=Math.PI*2, G=9.81, RHO_W=1000;
const NX=72,NZ=48,N=NX*NZ;
const WORLD_W=1.20,WORLD_H=.80,DX=WORLD_W/NX,DZ=WORLD_H/NZ,AREA=DX*DZ;
const BX0=11,BX1=61,BZ0=10,BZ1=38;
const BOX_X0=BX0*DX,BOX_X1=BX1*DX,BOX_Z0=BZ0*DZ,BOX_Z1=BZ1*DZ;
const WALL_H=.055,WALL_SEG_M=.00018,WALL_OPEN=.15*WALL_SEG_M;
const DAY=180,BASE_DT=.004;
const RATE=[1,10,100,1000];
const VIEW=['MACRO','ACTIVITY','BOX','WORLD'];
const SCENE=['FORAGE','BUILD','FLOOD','DECAY','BREAKOUT'];
const TOOL=['INSPECT','FOOD +MATTER','RAIN +H2O','CUT WALL','WET PATCH','RESET'];
const MAT={SOIL:0,CARD:1};
const WHY={EXPLORE:0,FOOD:1,WATER:2,SCRAP:3,HOME:4,WALL:5,REST:6,CHEW:7,CARRY:8,DEAD:9};
const WHY_NAME=['exploring from local memory','following local food odor','following local moisture','following locally sensed cardboard piece','following home odor while carrying','responding to antenna/wall contact','reducing motor output to conserve energy','chewing contacted wall material','carrying the same physical piece','dead'];

const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
let dpr=1,last=performance.now(),paused=true,rateI=0,maxMode=false,fault='',tests='TESTING';
let seed=0xA17B0A;
let simT=0,pending=0,frameMs=0,simMs=0,renderMs=0,avgFrame=16,quality=1,diagClock=0,qualityClock=0;
let viewI=0,sceneI=0,toolI=0,whyOpen=false,selected={kind:'ant',id:1,index:-1};
let cam={zoom:1,panX:0,panY:0,version:1};
let pointers=new Map(),pinchD=0,pinchZoom=1,dragPointer=-1,dragSX=0,dragSY=0;
let nextID=1000,externalWater=0,externalC=0,water0=0,c0=0;
let accField=0,accTherm=0,accBio=0,accWeather=0,accDebris=0;

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const I=(x,z)=>x+z*NX;
const X=i=>i%NX;
const Z=i=>(i/NX)|0;
const sq=v=>v*v;
function h32(a,b=0,d=0,e=0){let x=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul((d^seed)|0,2246822519)+Math.imul(e|0,3266489917))>>>0;x^=x>>>13;x=Math.imul(x,1274126177);return(x^(x>>>16))>>>0}
function hr(a,b=0,d=0,e=0){return h32(a,b,d,e)/4294967296}
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function noise(x,z,s=0){const xi=Math.floor(x),zi=Math.floor(z),tx=fade(x-xi),tz=fade(z-zi),a=hr(xi,zi,s),b=hr(xi+1,zi,s),d=hr(xi,zi+1,s),e=hr(xi+1,zi+1,s);return mix(mix(a,b,tx),mix(d,e,tx),tz)}
function wrap(a){return Math.atan2(Math.sin(a),Math.cos(a))}
function cellAt(wx,wz){return I(cl(Math.floor(wx/DX),0,NX-1),cl(Math.floor(wz/DZ),0,NZ-1))}
function worldX(x){return(x+.5)*DX}
function worldZ(z){return(z+.5)*DZ}
function insideBoxCell(x,z){return x>=BX0&&x<BX1&&z>=BZ0&&z<BZ1}
function insideBox(wx,wz){return wx>=BOX_X0&&wx<=BOX_X1&&wz>=BOX_Z0&&wz<=BOX_Z1}

/* ---------------- dense world state ---------------- */
const A={
  mat:new Uint8Array(N),
  cellulose:new Float32Array(N),
  organic:new Float32Array(N),
  poreW:new Float32Array(N),
  h:new Float32Array(N),hu:new Float32Array(N),hv:new Float32Array(N),
  temp:new Float32Array(N),fungus:new Float32Array(N),nutrient:new Float32Array(N),
  rough:new Float32Array(N),
  foodOdor:new Float32Array(N),homeOdor:new Float32Array(N),
  tmp:new Float32Array(N),tmp2:new Float32Array(N),
  dh:new Float32Array(N),dhu:new Float32Array(N),dhv:new Float32Array(N)
};
const wallN=new Float32Array(BX1-BX0),wallS=new Float32Array(BX1-BX0),wallW=new Float32Array(BZ1-BZ0),wallE=new Float32Array(BZ1-BZ0);
const wallWetN=new Float32Array(wallN.length),wallWetS=new Float32Array(wallS.length),wallWetW=new Float32Array(wallW.length),wallWetE=new Float32Array(wallE.length);
const wallFungN=new Float32Array(wallN.length),wallFungS=new Float32Array(wallS.length),wallFungW=new Float32Array(wallW.length),wallFungE=new Float32Array(wallE.length);
const atm={vapor:.015,cloud:.004,humidity:.55,airTemp:22,windX:.02,windZ:0,co2:.02};

let food=[],pieces=[],mushrooms=[];
let pieceIndex=new Map();

function makeFood(x,z,m=.00009){return{id:nextID++,kind:'food',alive:true,x,z,m,c:m*.52,n:m*.055,w:m*.58}}
function makePiece(x,z,m=.00005,w=.006,h=.002){const p={id:nextID++,kind:'piece',alive:true,state:'loose',x,z,vx:0,vz:0,angle:hr(nextID,3)*TAU,omega:0,mass:m,w,h,moisture:0,placedAge:0};pieces.push(p);pieceIndex.set(p.id,p);return p}
function addMushroom(x,z,m){mushrooms.push({id:nextID++,kind:'mushroom',alive:true,x,z,mass:m,age:0})}

/* ---------------- history ---------------- */
let history={branches:new Map(),current:0,next:1,last:-1,scrub:-1};
const SAVE_FIELDS=['cellulose','organic','poreW','h','hu','hv','temp','fungus','nutrient','foodOdor','homeOdor'];
function cloneList(L){return L.map(o=>({...o}))}
function snapshot(){const s={simT,seed,nextID,externalWater,externalC,atm:{...atm},ant:structuredCloneSafe(ant),food:cloneList(food),pieces:cloneList(pieces),mushrooms:cloneList(mushrooms),wallN:wallN.slice(),wallS:wallS.slice(),wallW:wallW.slice(),wallE:wallE.slice(),wallWetN:wallWetN.slice(),wallWetS:wallWetS.slice(),wallWetW:wallWetW.slice(),wallWetE:wallWetE.slice(),wallFungN:wallFungN.slice(),wallFungS:wallFungS.slice(),wallFungW:wallFungW.slice(),wallFungE:wallFungE.slice(),selected:{...selected},viewI,sceneI,toolI};for(const k of SAVE_FIELDS)s[k]=A[k].slice();return s}
function structuredCloneSafe(o){return JSON.parse(JSON.stringify(o))}
function restore(s){simT=s.simT;seed=s.seed;nextID=s.nextID;externalWater=s.externalWater;externalC=s.externalC;Object.assign(atm,s.atm);ant=structuredCloneSafe(s.ant);food=cloneList(s.food);pieces=cloneList(s.pieces);mushrooms=cloneList(s.mushrooms);pieceIndex=new Map();for(const p of pieces)pieceIndex.set(p.id,p);wallN.set(s.wallN);wallS.set(s.wallS);wallW.set(s.wallW);wallE.set(s.wallE);wallWetN.set(s.wallWetN);wallWetS.set(s.wallWetS);wallWetW.set(s.wallWetW);wallWetE.set(s.wallWetE);wallFungN.set(s.wallFungN);wallFungS.set(s.wallFungS);wallFungW.set(s.wallFungW);wallFungE.set(s.wallFungE);for(const k of SAVE_FIELDS)A[k].set(s[k]);selected={...s.selected};viewI=s.viewI;sceneI=s.sceneI;toolI=s.toolI;pending=0;accField=accTherm=accBio=accWeather=accDebris=0;fault='';paused=true;rewound=true;cam.version++;updateDiagnostics()}
let rewound=false;
function resetHistory(){history={branches:new Map(),current:0,next:1,last:-1,scrub:-1};history.branches.set(0,{id:0,parent:null,fork:0,cp:[],events:[]})}
function checkpoint(reason='PERIODIC'){const b=history.branches.get(history.current);if(!b)return;if(reason==='PERIODIC'&&history.last>=0&&simT-history.last<8)return;b.cp.push({t:simT,reason,s:snapshot()});if(b.cp.length>18)b.cp.shift();history.last=simT;history.scrub=b.cp.length-1}
function logEvent(type,text){const b=history.branches.get(history.current);if(!b)return;b.events.push({t:simT,type,text});if(b.events.length>80)b.events.shift()}
function rewind(){const b=history.branches.get(history.current);if(!b||b.cp.length<2)return;let k=b.cp.length-2;while(k>=0&&b.cp[k].t>=simT-.001)k--;if(k>=0){restore(b.cp[k].s);history.scrub=k}}
function scrubBack(){const b=history.branches.get(history.current);if(!b||!b.cp.length)return;if(history.scrub<0||history.scrub>=b.cp.length)history.scrub=b.cp.length-1;history.scrub=Math.max(0,history.scrub-1);restore(b.cp[history.scrub].s)}
function branch(){const parent=history.current,id=history.next++;history.branches.set(id,{id,parent,fork:simT,cp:[],events:[]});history.current=id;history.last=-1;rewound=false;checkpoint('BRANCH');logEvent('branch','new future from B'+parent)}
function ensureBranch(){if(rewound)branch();checkpoint('COMMAND')}

/* ---------------- walls / barriers ---------------- */
function wallOpen(arr,k){return k<0||k>=arr.length||arr[k]<=WALL_OPEN}
function wallMassAt(side,k){return side==='N'?wallN[k]:side==='S'?wallS[k]:side==='W'?wallW[k]:wallE[k]}
function crossingWall(x0,z0,x1,z1){
  if((x0<BX0&&x1>=BX0)||(x1<BX0&&x0>=BX0)){const z=Math.min(z0,z1);if(z>=BZ0&&z<BZ1&&!wallOpen(wallW,z-BZ0))return['W',z-BZ0]}
  if((x0<BX1&&x1>=BX1)||(x1<BX1&&x0>=BX1)){const z=Math.min(z0,z1);if(z>=BZ0&&z<BZ1&&!wallOpen(wallE,z-BZ0))return['E',z-BZ0]}
  if((z0<BZ0&&z1>=BZ0)||(z1<BZ0&&z0>=BZ0)){const x=Math.min(x0,x1);if(x>=BX0&&x<BX1&&!wallOpen(wallN,x-BX0))return['N',x-BX0]}
  if((z0<BZ1&&z1>=BZ1)||(z1<BZ1&&z0>=BZ1)){const x=Math.min(x0,x1);if(x>=BX0&&x<BX1&&!wallOpen(wallS,x-BX0))return['S',x-BX0]}
  return null;
}
function blockedFace(a,b){return!!crossingWall(X(a),Z(a),X(b),Z(b))}
function nearestWallContact(wx,wz,r=.002){let best=null,bd=1e9;
  if(wz>=BOX_Z0-r&&wz<=BOX_Z1+r){let k=cl(Math.floor((wz-BOX_Z0)/DZ),0,wallW.length-1);if(!wallOpen(wallW,k)){let d=Math.abs(wx-BOX_X0);if(d<r&&d<bd){best={side:'W',k,nx:wx<BOX_X0?-1:1,nz:0,d};bd=d}}k=cl(Math.floor((wz-BOX_Z0)/DZ),0,wallE.length-1);if(!wallOpen(wallE,k)){let d=Math.abs(wx-BOX_X1);if(d<r&&d<bd){best={side:'E',k,nx:wx<BOX_X1?-1:1,nz:0,d};bd=d}}}
  if(wx>=BOX_X0-r&&wx<=BOX_X1+r){let k=cl(Math.floor((wx-BOX_X0)/DX),0,wallN.length-1);if(!wallOpen(wallN,k)){let d=Math.abs(wz-BOX_Z0);if(d<r&&d<bd){best={side:'N',k,nx:0,nz:wz<BOX_Z0?-1:1,d};bd=d}}k=cl(Math.floor((wx-BOX_X0)/DX),0,wallS.length-1);if(!wallOpen(wallS,k)){let d=Math.abs(wz-BOX_Z1);if(d<r&&d<bd){best={side:'S',k,nx:0,nz:wz<BOX_Z1?-1:1,d};bd=d}}}
  return best;
}
function wallArray(side){return side==='N'?wallN:side==='S'?wallS:side==='W'?wallW:wallE}
function wallWetArray(side){return side==='N'?wallWetN:side==='S'?wallWetS:side==='W'?wallWetW:wallWetE}
function wallFungArray(side){return side==='N'?wallFungN:side==='S'?wallFungS:side==='W'?wallFungW:wallFungE}

/* ---------------- ant articulated state ---------------- */
const BODY_M=.0000042,BODY_I=2.2e-10,LEG_L1=.0034,LEG_L2=.0044;
const HIP_X=[.0025,.0003,-.0022,.0025,.0003,-.0022],HIP_Z=[-.00155,-.00175,-.00155,.00155,.00175,.00155];
let ant=null;
function newAnt(x,z){const legs=[];for(let i=0;i<6;i++){const side=i<3?-1:1,fore=i%3===0?1:i%3===2?-1:0,q1=side*(-.52)+fore*.45,q2=side*1.12,fx=x+HIP_X[i]+Math.cos(q1)*LEG_L1+Math.cos(q1+q2)*LEG_L2,fz=z+HIP_Z[i]+Math.sin(q1)*LEG_L1+Math.sin(q1+q2)*LEG_L2;legs.push({q1,q2,dq1:0,dq2:0,tq1:q1,tq2:q2,stance:true,ax:fx,az:fz,load:0,slip:0,targetX:fx,targetZ:fz,lastTouch:0})}
  return{id:1,kind:'ant',alive:true,x,z,vx:0,vz:0,yaw:0,omega:0,E:120,W:.0000022,bodyC:.0000019,bodyN:.00000032,gutC:0,gutN:0,wasteC:0,wasteN:0,age:0,temp:22,why:WHY.EXPLORE,
    brain:{heading:0,turnMemory:0,turnDecay:0,retarget:0,scanL:0,scanR:0},legs,
    antennae:[{q:.32,dq:0,target:.32,touch:0},{q:-.32,dq:0,target:-.32,touch:0}],jaw:{q:.42,dq:0,target:.42,torque:0},carryID:-1,nestX:x,nestZ:z,chewMass:0,chewSide:'',chewK:-1,corpseAge:0};
}
function bodyBasis(){const c0=Math.cos(ant.yaw),s0=Math.sin(ant.yaw);return[c0,s0,-s0,c0]}
function localToWorld(lx,lz){const b=bodyBasis();return[ant.x+b[0]*lx+b[2]*lz,ant.z+b[1]*lx+b[3]*lz]}
function legFK(leg,idx){const hx=HIP_X[idx],hz=HIP_Z[idx],x=hx+Math.cos(leg.q1)*LEG_L1+Math.cos(leg.q1+leg.q2)*LEG_L2,z=hz+Math.sin(leg.q1)*LEG_L1+Math.sin(leg.q1+leg.q2)*LEG_L2;return localToWorld(x,z)}
function legHipWorld(idx){return localToWorld(HIP_X[idx],HIP_Z[idx])}
function ikLeg(idx,wx,wz){const hip=legHipWorld(idx),b=bodyBasis(),dx=wx-hip[0],dz=wz-hip[1],lx=b[0]*dx+b[1]*dz,lz=b[2]*dx+b[3]*dz,r2=cl(lx*lx+lz*lz,.0000001,sq(LEG_L1+LEG_L2-.00015)),ca=cl((r2-LEG_L1*LEG_L1-LEG_L2*LEG_L2)/(2*LEG_L1*LEG_L2),-1,1);let q2=Math.acos(ca);q2*=idx<3?-1:1;const q1=Math.atan2(lz,lx)-Math.atan2(LEG_L2*Math.sin(q2),LEG_L1+LEG_L2*Math.cos(q2));return[q1,q2]}
function footVel(idx,leg){const e=.00002,old1=leg.q1,old2=leg.q2;leg.q1+=leg.dq1*e;leg.q2+=leg.dq2*e;const p2=legFK(leg,idx);leg.q1=old1;leg.q2=old2;const p1=legFK(leg,idx);return[(p2[0]-p1[0])/e+ant.vx-(p1[1]-ant.z)*ant.omega,(p2[1]-p1[1])/e+ant.vz+(p1[0]-ant.x)*ant.omega]}
function localSurfaceMu(wx,wz){const i=cellAt(wx,wz),surf=A.h[i],pore=A.poreW[i],sat=cl(pore/(A.mat[i]===MAT.CARD?.00024:.00055),0,1),fung=A.fungus[i];let mu=A.mat[i]===MAT.CARD?.78:.64;mu-=cl(surf/.0018,0,1)*.28;mu-=sat*.18;mu-=cl(fung/.00005,0,1)*.12;return cl(mu,.18,.9)}
function supportCanLift(idx){let n=0;for(let j=0;j<6;j++)if(j!==idx&&ant.legs[j].stance)n++;return n>=3}
function chooseFoothold(idx,heading){const side=idx<3?-1:1,fore=idx%3===0?1:idx%3===2?-1:0,reach=.0064,fx=Math.cos(heading),fz=Math.sin(heading),sx=-fz,sz=fx;let wx=ant.x+fx*(.0036+fore*.0018)+sx*side*(.0044+Math.abs(fore)*.0004),wz=ant.z+fz*(.0036+fore*.0018)+sz*side*(.0044+Math.abs(fore)*.0004);const wc=nearestWallContact(wx,wz,.0014);if(wc){wx+=wc.nx*.0022;wz+=wc.nz*.0022}wx=cl(wx,.002,WORLD_W-.002);wz=cl(wz,.002,WORLD_H-.002);const d=Math.hypot(wx-ant.x,wz-ant.z);if(d>reach){const q=reach/d;wx=ant.x+(wx-ant.x)*q;wz=ant.z+(wz-ant.z)*q}return[wx,wz]}
function updateLegController(dt,heading,drive){for(let i=0;i<6;i++){const L=ant.legs[i],foot=legFK(L,i),hip=legHipWorld(i),dist=Math.hypot(foot[0]-hip[0],foot[1]-hip[1]);if(L.stance){const b=bodyBasis(),relx=b[0]*(L.ax-ant.x)+b[1]*(L.az-ant.z),back=-relx,overstretch=dist>LEG_L1+LEG_L2-.0004,trailing=back>.0050+Math.abs(HIP_X[i])*.25,slip=L.slip>.003;if((overstretch||trailing||slip)&&supportCanLift(i)){L.stance=false;const t=chooseFoothold(i,heading);L.targetX=t[0];L.targetZ=t[1];L.slip=0}}if(!L.stance){const q=ikLeg(i,L.targetX,L.targetZ);L.tq1=q[0];L.tq2=q[1];const e=Math.hypot(foot[0]-L.targetX,foot[1]-L.targetZ);if(e<.00055&&dist<LEG_L1+LEG_L2-.0002){L.stance=true;L.ax=foot[0];L.az=foot[1];L.lastTouch=simT}}else{const side=i<3?-1:1,fore=i%3===0?1:i%3===2?-1:0,fx=Math.cos(heading),fz=Math.sin(heading),sx=-fz,sz=fx,desired=[ant.x+fx*(fore*.0014-drive*.00035)+sx*side*.0047,ant.z+fz*(fore*.0014-drive*.00035)+sz*side*.0047],q=ikLeg(i,desired[0],desired[1]);L.tq1=q[0];L.tq2=q[1]}}}
function solveJointMotors(dt){for(const L of ant.legs){const k=90,c0=11;let a=cl(k*wrap(L.tq1-L.q1)-c0*L.dq1,-90,90);L.dq1+=a*dt;L.q1+=L.dq1*dt;a=cl(k*wrap(L.tq2-L.q2)-c0*L.dq2,-90,90);L.dq2+=a*dt;L.q2+=L.dq2*dt;L.q1=cl(L.q1,-2.8,2.8);L.q2=cl(L.q2,-2.55,2.55)}}
function solveStance(dt){let Fx=0,Fz=0,Tq=0,stance=0;for(const L of ant.legs)if(L.stance)stance++;const Nforce=BODY_M*G/Math.max(1,stance);for(let i=0;i<6;i++){const L=ant.legs[i];L.load=0;if(!L.stance)continue;const foot=legFK(L,i),fv=footVel(i,L),ex=L.ax-foot[0],ez=L.az-foot[1];let fx=ex*.035-fv[0]*.000012,fz=ez*.035-fv[1]*.000012;const mu=localSurfaceMu(L.ax,L.az),limit=mu*Nforce,mag=Math.hypot(fx,fz);if(mag>limit){const q=limit/(mag||1);fx*=q;fz*=q;L.ax+=ex*cl(dt*5,0,.3);L.az+=ez*cl(dt*5,0,.3);L.slip+=mag-limit}else L.slip=Math.max(0,L.slip-dt*.001);Fx+=fx;Fz+=fz;Tq+=(foot[0]-ant.x)*fz-(foot[1]-ant.z)*fx;L.load=cl(Math.hypot(fx,fz)/(limit+.0000001),0,1.5)}const linDrag=insideBox(ant.x,ant.z)?18:24;ant.vx+=(Fx/BODY_M-ant.vx*linDrag)*dt;ant.vz+=(Fz/BODY_M-ant.vz*linDrag)*dt;ant.omega+=(Tq/BODY_I-ant.omega*14)*dt;ant.x+=ant.vx*dt;ant.z+=ant.vz*dt;ant.yaw=wrap(ant.yaw+ant.omega*dt)}
function resolveAntWalls(){const r=.0031;for(let it=0;it<3;it++){const wc=nearestWallContact(ant.x,ant.z,r);if(!wc)break;const pen=r-wc.d;if(pen>0){ant.x+=wc.nx*pen;ant.z+=wc.nz*pen;const vn=ant.vx*wc.nx+ant.vz*wc.nz;if(vn<0){ant.vx-=vn*wc.nx;ant.vz-=vn*wc.nz}ant.brain.turnMemory+=wc.nx*Math.sin(ant.yaw)-wc.nz*Math.cos(ant.yaw);ant.brain.turnDecay=2}}ant.x=cl(ant.x,.003,WORLD_W-.003);ant.z=cl(ant.z,.003,WORLD_H-.003)}

/* antennae are hinged tactile sensors; no proximity avoidance field */
function antennaTip(side){const A0=ant.antennae[side<0?0:1],head=localToWorld(.0045,side*.0012),base=ant.yaw+A0.q,mid=[head[0]+Math.cos(base)*.0033,head[1]+Math.sin(base)*.0033],tip=[mid[0]+Math.cos(base+side*.18)*.0030,mid[1]+Math.sin(base+side*.18)*.0030];return{head,mid,tip}}

function wallPass(){function seg(side,k,m){if(m<=WALL_OPEN)return;let a,b;if(side==='N'){const x0=BOX_X0+k*DX;a=[x0,BOX_Z0];b=[x0+DX,BOX_Z0]}else if(side==='S'){const x0=BOX_X0+k*DX;a=[x0,BOX_Z1];b=[x0+DX,BOX_Z1]}else if(side==='W'){const z0=BOX_Z0+k*DZ;a=[BOX_X0,z0];b=[BOX_X0,z0+DZ]}else{const z0=BOX_Z0+k*DZ;a=[BOX_X1,z0];b=[BOX_X1,z0+DZ]}const h=WALL_H*cl(m/WALL_SEG_M,.12,1),p0=project(a[0],a[1],.001),p1=project(b[0],b[1],.001),p2=project(b[0],b[1],h),p3=project(a[0],a[1],h),wet=cl(wallWetArray(side)[k]/Math.max(.00001,m*1.5),0,1),fung=cl(wallFungArray(side)[k]/.00003,0,1);poly([p0,p1,p2,p3],`rgb(${(118-42*wet)|0},${(80-18*wet+28*fung)|0},${(47-8*wet+15*fung)|0})`,'rgba(50,32,20,.55)',.6)}for(let k=0;k<wallN.length;k++){seg('N',k,wallN[k]);seg('S',k,wallS[k])}for(let k=0;k<wallW.length;k++){seg('W',k,wallW[k]);seg('E',k,wallE[k])}}
function piecePass(){for(const p of pieces){if(!p.alive)continue;const cs=Math.cos(p.angle),sn=Math.sin(p.angle),hw=p.w*.5,hh=p.h*.5,pts=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(q=>project(p.x+q[0]*cs-q[1]*sn,p.z+q[0]*sn+q[1]*cs,.0025)),wet=cl(p.moisture/Math.max(.00001,p.mass),0,1);poly(pts,`rgb(${(135-50*wet)|0},${(93-28*wet)|0},${(54-15*wet)|0})`,'rgba(55,35,20,.8)',.5)}}
function fungusPass(){for(const m of mushrooms){if(!m.alive)continue;const p=project(m.x,m.z,.003),s=cl(Math.pow(m.mass/.00001,.33)*obsScale()*.0006,.4,4);og.strokeStyle='rgba(221,215,180,.85)';og.lineWidth=Math.max(.4,s*.25);og.beginPath();og.moveTo(p[0],p[1]);og.lineTo(p[0],p[1]-s*1.5);og.stroke();og.fillStyle='rgba(153,130,92,.9)';og.beginPath();og.ellipse(p[0],p[1]-s*1.5,s,Math.max(.4,s*.4),0,0,TAU);og.fill()}}
function foodPass(){for(const f of food){if(!f.alive)continue;const p=project(f.x,f.z,.003),s=cl(Math.pow(f.m/.00008,.33)*obsScale()*.0011,.35,5);og.fillStyle='rgba(167,135,63,.94)';og.beginPath();og.ellipse(p[0],p[1],s*1.2,s*.7,.2,0,TAU);og.fill();og.strokeStyle='rgba(79,57,24,.7)';og.lineWidth=.4;og.stroke()}}
function antShadow(){const p=project(ant.x,ant.z,0),s=cl(obsScale()*.006,2,34);og.fillStyle='rgba(18,12,8,.32)';og.beginPath();og.ellipse(p[0]+s*.1,p[1]+s*.12,s*1.15,s*.55,-.2,0,TAU);og.fill()}
function antPass(){if(ant.bodyC<=0)return;antShadow();const s=obsScale(),band=scaleBand();function part(lx,lz,y,rx,rz,col){const w=localToWorld(lx,lz),p=project(w[0],w[1],y),ang=ant.yaw-.48;og.save();og.translate(p[0],p[1]);og.rotate(ang);og.fillStyle=col;og.beginPath();og.ellipse(0,0,Math.max(.7,rx*s),Math.max(.5,rz*s*.72),0,0,TAU);og.fill();og.restore();return p}const col='rgb(48,25,15)',hi='rgb(72,38,20)',g=part(-.0036,0,.0032,.0038,.0023,col),th=part(.0005,0,.0036,.0027,.0021,hi),hd=part(.0041,0,.0033,.00235,.0020,col);
  for(let i=0;i<6;i++){const L=ant.legs[i],hip=legHipWorld(i),q1w=[hip[0]+Math.cos(ant.yaw+L.q1)*LEG_L1,hip[1]+Math.sin(ant.yaw+L.q1)*LEG_L1],foot=legFK(L,i),a=project(hip[0],hip[1],.0031),b=project(q1w[0],q1w[1],.0023),d=project(foot[0],foot[1],.0008),r=Math.max(.35,s*.00036*(.75+.25*L.load));capsule(a,b,r,'rgba(58,31,18,.98)');capsule(b,d,r*.82,'rgba(49,26,15,.98)');if(L.stance){og.fillStyle='rgba(25,16,10,.65)';og.beginPath();og.ellipse(d[0],d[1]+.5,Math.max(.35,r*.8),Math.max(.25,r*.35),0,0,TAU);og.fill()}}
  for(const side of [-1,1]){const t=antennaTip(side),a=project(t.head[0],t.head[1],.0032),b=project(t.mid[0],t.mid[1],.0028),d=project(t.tip[0],t.tip[1],.0022);capsule(a,b,Math.max(.28,s*.00016),'rgba(45,24,14,.98)');capsule(b,d,Math.max(.24,s*.00012),'rgba(45,24,14,.98)')}
  const jt=jawTips(),jawBase=localToWorld(.0045,0);for(const t of jt){const a=project(jawBase[0],jawBase[1],.0031),b=project(t[0],t[1],.0027);capsule(a,b,Math.max(.3,s*.00018),'rgba(30,16,11,.98)')}
  if(band==='BODY'||band==='JOINT'||band==='MICRO'){og.strokeStyle='rgba(201,126,72,.35)';og.lineWidth=.5;for(const P of [g,th,hd]){og.beginPath();og.arc(P[0],P[1],Math.max(1,s*.0012),-.8,.6);og.stroke()}}
  if(band==='JOINT'||band==='MICRO'){for(let k=0;k<30;k++){const ang=hr(k,ant.id,901)*TAU,rr=.0025*Math.sqrt(hr(k,ant.id,902)),w=localToWorld(-.0005+rr*Math.cos(ang),rr*.55*Math.sin(ang)),p=project(w[0],w[1],.004),len=Math.max(.5,s*.00025);og.strokeStyle='rgba(130,86,54,.35)';og.lineWidth=.3;og.beginPath();og.moveTo(p[0],p[1]);og.lineTo(p[0]+Math.cos(ang)*len,p[1]+Math.sin(ang)*len);og.stroke()}}
  if(!ant.alive){og.fillStyle='rgba(120,95,70,.18)';og.beginPath();og.ellipse(th[0],th[1],Math.max(2,s*.005),Math.max(1,s*.002),0,0,TAU);og.fill()}
}
function physicalObservation(){worldBackdrop();fieldPass();texturePass();wallPass();piecePass();fungusPass();foodPass();antPass();obsData=og.getImageData(0,0,obsW,obsH).data}
function luma(r,g,b){return.2126*r+.7152*g+.0722*b}
function reconstruct(){if(prevCamVersion!==cam.version){prevBits.fill(0);prevLum.fill(0);prevCamVersion=cam.version}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050403';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.font=`${charH*1.01}px Menlo,Consolas,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';for(let cy=0;cy<rows;cy++)for(let cx=0;cx<cols;cx++){let sr=0,sg=0,sb=0,mean=0;const bx=cx*2,by=cy*4;for(let sy=0;sy<4;sy++)for(let sx=0;sx<2;sx++){const p=((bx+sx)+(by+sy)*obsW)*4,r=obsData[p],g=obsData[p+1],b=obsData[p+2];sr+=r;sg+=g;sb+=b;mean+=luma(r,g,b)}mean/=8;let bits=0,fr=0,fg=0,fb=0,br=0,bg=0,bb=0,nf=0,nb=0;for(let sy=0;sy<4;sy++)for(let sx=0;sx<2;sx++){const k=sx+sy*2,p=((bx+sx)+(by+sy)*obsW)*4,r=obsData[p],g=obsData[p+1],b=obsData[p+2],L=luma(r,g,b);if(L>mean){bits|=1<<k;fr+=r;fg+=g;fb+=b;nf++}else{br+=r;bg+=g;bb+=b;nb++}}const hi=cx+cy*cols,old=prevBits[hi],ham=pop8(old^bits);if(ham<=1&&Math.abs(prevLum[hi]-mean)<7)bits=old;prevBits[hi]=bits;prevLum[hi]=mean;if(nf===0){fr=sr/8;fg=sg/8;fb=sb/8}else{fr/=nf;fg/=nf;fb/=nf}if(nb===0){br=sr/8;bg=sg/8;bb=sb/8}else{br/=nb;bg/=nb;bb/=nb}ctx.fillStyle=`rgb(${br|0},${bg|0},${bb|0})`;ctx.fillRect(cx*charW,66+cy*charH,charW+.5,charH+.5);const ch=maskBest[bits]||' ';if(ch!==' '){ctx.fillStyle=`rgb(${cl(fr*1.08,0,255)|0},${cl(fg*1.08,0,255)|0},${cl(fb*1.08,0,255)|0})`;ctx.fillText(ch,(cx+.5)*charW,66+(cy+.5)*charH)}}}

/* ---------------- inspector / UI ---------------- */
function pick(wx,wz){const dA=Math.hypot(wx-ant.x,wz-ant.z);if(dA<.012){selected={kind:'ant',id:1,index:-1};return}let bp=null,bd=.012*.012;for(const p of pieces){if(!p.alive)continue;const d=sq(wx-p.x)+sq(wz-p.z);if(d<bd){bd=d;bp=p}}if(bp){selected={kind:'piece',id:bp.id,index:-1};return}selected={kind:'cell',id:-1,index:cellAt(wx,wz)}}
function whyText(){if(selected.kind==='ant')return[WHY_NAME[ant.why],ant.carryID>=0?'jaw constraint is carrying persistent piece '+ant.carryID:'no carried piece',`${ant.legs.filter(L=>L.stance).length} feet currently anchor stance constraints`];if(selected.kind==='piece'){const p=pieceIndex.get(selected.id);return p?[`piece ${p.id} state=${p.state}; identity has not changed`,`mass ${(p.mass*1e6).toFixed(1)} mg, moisture ${(p.moisture*1e6).toFixed(1)} mg`]:[];}const i=selected.index;const out=[];if(A.h[i]>.0001)out.push('surface water is present because conservative face flux/rain delivered it');if(A.poreW[i]>.00005)out.push('porous water came from finite surface-water absorption and capillary transport');if(A.fungus[i]>.000005)out.push('fungus grew by consuming local organic/cardboard carbon under moisture + temperature');return out.slice(0,3)}
function rounded(C,x,y,w,h,r){C.beginPath();C.moveTo(x+r,y);C.arcTo(x+w,y,x+w,y+h,r);C.arcTo(x+w,y+h,x,y+h,r);C.arcTo(x,y+h,x,y,r);C.arcTo(x,y,x+w,y,r);C.closePath()}
function button(x,y,w,label,on=false){ctx.fillStyle=on?'rgba(88,56,27,.96)':'rgba(25,18,12,.94)';rounded(ctx,x,y,w,20,5);ctx.fill();ctx.strokeStyle=on?'#f0c181':'#8e6840';ctx.stroke();ctx.fillStyle='#f7eee2';ctx.font='8px Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w*.5,y+10)}
function fmtTime(s){if(s<60)return s.toFixed(1)+'s';if(s<DAY)return(s/60).toFixed(1)+'m';return(s/DAY).toFixed(2)+'d'}
function drawInspector(){if(selected.kind==='ant'){const x=8,y=70,w=Math.min(326,innerWidth-16),h=whyOpen?102:72;ctx.fillStyle='rgba(18,12,8,.88)';rounded(ctx,x,y,w,h,7);ctx.fill();ctx.strokeStyle='#8c6843';ctx.stroke();ctx.fillStyle='#f3e8da';ctx.font='8px Menlo,monospace';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`ANT ${ant.alive?'ALIVE':'DEAD'}  E ${ant.E.toFixed(1)}  H2O ${(ant.W*1e6).toFixed(2)}mg  C ${(ant.bodyC*1e6).toFixed(2)}mg`,x+7,y+7);ctx.fillText(`speed ${(Math.hypot(ant.vx,ant.vz)*1000).toFixed(2)}mm/s  ω ${ant.omega.toFixed(2)}  stance ${ant.legs.filter(L=>L.stance).length}/6`,x+7,y+18);ctx.fillText(`jaw ${ant.jaw.q.toFixed(2)}rad carry ${ant.carryID<0?'none':ant.carryID}  view ${VIEW[viewI]} ${scaleBand()}`,x+7,y+29);ctx.fillText(`solver: articulated contact + debris impulse + HLL-SWE + porous + reaction`,x+7,y+40);ctx.fillText(`provenance ${provenance()}  branch B${history.current}${rewound?' REWOUND':''}`,x+7,y+51);if(whyOpen){const q=whyText();for(let k=0;k<q.length;k++)ctx.fillText('WHY '+q[k],x+7,y+64+k*10)}}else{const q=whyText(),x=8,y=70,w=Math.min(326,innerWidth-16),h=28+q.length*10;ctx.fillStyle='rgba(18,12,8,.88)';rounded(ctx,x,y,w,h,7);ctx.fill();ctx.strokeStyle='#8c6843';ctx.stroke();ctx.fillStyle='#f3e8da';ctx.font='8px Menlo,monospace';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(selected.kind==='piece'?`PIECE ${selected.id}`:`CELL ${selected.index}`,x+7,y+7);for(let k=0;k<q.length;k++)ctx.fillText(q[k],x+7,y+18+k*10)}}
function drawUI(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='rgba(11,8,6,.94)';rounded(ctx,6,6,innerWidth-12,56,8);ctx.fill();ctx.fillStyle='#f4e9da';ctx.font='9px Menlo,monospace';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`OMEGA Ω ANT BOX V4 // ${VIEW[viewI]} ${scaleBand()} ${provenance()} // ${SCENE[sceneI]}`,11,10);ctx.fillText(`${paused?'PAUSED':'RUN'} ${maxMode?'MAX':RATE[rateI]+'×'}  t ${fmtTime(simT)}  Q ${fmtTime(pending)}  TOOL ${TOOL[toolI]}`,11,22);ctx.fillText(`H2O ${(diag.water*1e6).toFixed(0)}mg Δ${((diag.water-(water0+externalWater))*1e6).toFixed(2)}  C ${(diag.C*1e6).toFixed(0)}mg Δ${((diag.C-(c0+externalC))*1e6).toFixed(2)}`,11,34);ctx.fillText(`wall ${(diag.wall*1e6).toFixed(0)}mg  pieces ${diag.pieces}  fungus ${(diag.fungus*1e6).toFixed(1)}mg  ${tests}  ${frameMs.toFixed(1)}ms`,11,46);const gap=3,w=(innerWidth-gap*7)/6,y1=innerHeight-45,y2=innerHeight-22;for(let k=0;k<6;k++){const x=gap+k*(w+gap);button(x,y1,w,['PLAY','STEP','RATE','MAX','REW','SCRUB'][k],(k===0&&!paused)||(k===3&&maxMode));button(x,y2,w,['BRANCH','VIEW','SCENE','TOOL','WHY','RESET'][k],(k===4&&whyOpen))}drawInspector();if(fault){ctx.fillStyle='rgba(80,0,0,.94)';rounded(ctx,14,innerHeight*.38,innerWidth-28,66,8);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('OMEGA FAIL-CLOSED',innerWidth*.5,innerHeight*.38+20);ctx.font='9px Menlo,monospace';ctx.fillText(fault,innerWidth*.5,innerHeight*.38+43)}}

/* ---------------- interventions ---------------- */
function addFoodAt(wx,wz){ensureBranch();const f=makeFood(wx,wz,.00009);food.push(f);externalC+=f.c;externalWater+=f.w;logEvent('boundary','food matter added '+f.id)}
function rainPulse(){ensureBranch();const q=.005;atm.cloud+=q;externalWater+=q;logEvent('boundary','water added to atmospheric cloud reservoir')}
function cutWallAt(wx,wz){ensureBranch();let best=null,bd=.03;for(const side of ['N','S','W','E']){const arr=wallArray(side);for(let k=0;k<arr.length;k++){let x,z;if(side==='N'||side==='S'){x=BOX_X0+(k+.5)*DX;z=side==='N'?BOX_Z0:BOX_Z1}else{x=side==='W'?BOX_X0:BOX_X1;z=BOX_Z0+(k+.5)*DZ}const d=Math.hypot(wx-x,wz-z);if(d<bd){bd=d;best={side,k,x,z}}}}if(best){const arr=wallArray(best.side),m=arr[best.k];arr[best.k]=0;if(m>0)makePiece(best.x,best.z,m,.006,.002);logEvent('god cut','wall mass moved into a persistent piece')}}
function wetPatch(wx,wz){ensureBranch();const i=cellAt(wx,wz),q=.00012;A.poreW[i]+=q;externalWater+=q;logEvent('boundary','water added directly to porous reservoir')}
function applyTool(wx,wz){if(toolI===0)pick(wx,wz);else if(toolI===1)addFoodAt(wx,wz);else if(toolI===2)rainPulse();else if(toolI===3)cutWallAt(wx,wz);else if(toolI===4)wetPatch(wx,wz);else resetWorld()}

/* ---------------- input ---------------- */
function bottomAction(px,py){if(py<innerHeight-50)return false;const gap=3,w=(innerWidth-gap*7)/6,col=cl(Math.floor((px-gap)/(w+gap)),0,5),top=py<innerHeight-24;if(top){if(col===0){paused=!paused;maxMode=false}else if(col===1){if(paused)fineStep(.04)}else if(col===2){rateI=(rateI+1)%RATE.length;maxMode=false}else if(col===3){maxMode=!maxMode;if(maxMode)paused=false}else if(col===4)rewind();else scrubBack()}else{if(col===0)branch();else if(col===1){viewI=(viewI+1)%VIEW.length;cam.zoom=1;cam.panX=cam.panY=0;cam.version++}else if(col===2){sceneI=(sceneI+1)%SCENE.length;resetWorld()}else if(col===3)toolI=(toolI+1)%TOOL.length;else if(col===4)whyOpen=!whyOpen;else resetWorld()}return true}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(bottomAction(e.clientX,e.clientY))return;if(pointers.size===1){const p=screenToWorld(e.clientX,e.clientY);applyTool(p[0],p[1]);dragPointer=e.pointerId;dragSX=e.clientX;dragSY=e.clientY}else if(pointers.size===2){const p=[...pointers.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchZoom=cam.zoom}});
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);cam.zoom=pinchZoom*Math.max(.03,d/Math.max(1,pinchD));cam.version++;return}if(e.pointerId===dragPointer&&toolI===0){cam.panX+=e.clientX-dragSX;cam.panY+=e.clientY-dragSY;dragSX=e.clientX;dragSY=e.clientY;cam.version++}});
function endPointer(e){pointers.delete(e.pointerId);if(e.pointerId===dragPointer)dragPointer=-1;if(pointers.size<2)pinchD=0}
c.addEventListener('pointerup',endPointer);c.addEventListener('pointercancel',endPointer);c.addEventListener('wheel',e=>{e.preventDefault();cam.zoom*=Math.exp(-e.deltaY*.0015);cam.version++},{passive:false});

/* ---------------- reset / loop ---------------- */
function resize(){dpr=Math.min(2,devicePixelRatio||1);c.width=Math.floor(innerWidth*dpr);c.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);resizeObs();cam.version++}
window.addEventListener('resize',resize);
function resetWorld(){fault='';paused=true;maxMode=false;rateI=0;cam.zoom=1;cam.panX=cam.panY=0;cam.version++;simT=0;pending=0;accField=accTherm=accBio=accWeather=accDebris=0;externalWater=externalC=0;atm.vapor=.015;atm.cloud=.004;atm.airTemp=22;atm.humidity=.55;atm.co2=.02;generateWorld(SCENE[sceneI]);selected={kind:'ant',id:1,index:-1};water0=totalWater();c0=totalC();resetHistory();checkpoint('RESET');rewound=false;updateDiagnostics();selfTests();last=performance.now()}
function render(){const st=performance.now();resizeObs();physicalObservation();reconstruct();drawUI();renderMs=performance.now()-st}
function frame(now){const fs=performance.now(),real=Math.min(.05,(now-last)/1000);last=now;const ss=performance.now();if(!paused&&!fault){const req=maxMode?Math.max(.4,real*900):real*RATE[rateI];advance(req,7.2)}simMs=performance.now()-ss;diagClock+=real;if(diagClock>.45){updateDiagnostics();validate(false);diagClock=0}render();frameMs=performance.now()-fs;avgFrame=avgFrame*.94+frameMs*.06;qualityClock+=real;if(qualityClock>2.5){if(avgFrame>34)quality=Math.max(.56,quality-.08);else if(avgFrame<22)quality=Math.min(1,quality+.04);qualityClock=0}requestAnimationFrame(frame)}

initGlyphs();resize();resetWorld();requestAnimationFrame(frame);
