<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>GENESIS Matter Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:#eafaff;font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto 1fr auto}.top{padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:rgba(3,10,15,.88);backdrop-filter:blur(18px);border-bottom:1px solid #18303d}.title{font-weight:800;letter-spacing:.08em;font-size:13px}.tag{font-size:10px;padding:5px 8px;border:1px solid #2d5363;border-radius:999px;color:#9ee9ff}.stage{position:relative;min-height:0}#view{width:100%;height:100%;display:block;touch-action:none}.stats{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.stats span,.stats b{padding:4px 7px;border:1px solid rgba(100,180,210,.2);background:rgba(2,10,15,.62);backdrop-filter:blur(8px);border-radius:9px;font-size:10px;font-weight:600}.stats b{color:#9ee9ff}.rdfWrap{position:absolute;right:10px;bottom:10px;width:min(240px,46vw);height:88px;border:1px solid rgba(100,180,210,.22);border-radius:12px;overflow:hidden;pointer-events:none}.rdfWrap canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:10px;bottom:10px;padding:6px 9px;border-radius:999px;background:rgba(2,9,14,.62);font-size:10px;color:#afcbd6;pointer-events:none;white-space:nowrap}.controls{padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(3,10,15,.94);backdrop-filter:blur(22px);border-top:1px solid #18303d;display:grid;gap:8px}.row{display:flex;gap:7px;align-items:center}.row label{min-width:86px;font-size:11px;color:#b6d3df}.row input[type=range]{flex:1}.v{width:36px;text-align:right;font:11px ui-monospace,monospace;color:#8ceaff}button{appearance:none;border:1px solid #2a5261;background:#0b1a22;color:#e8fbff;border-radius:11px;padding:9px 10px;font:700 11px system-ui;flex:1}button:active{transform:scale(.98)}.switch{display:flex;align-items:center;gap:5px;font-size:11px;color:#bdd2da}.model{position:absolute;left:12px;right:12px;bottom:12px;padding:13px;border:1px solid #2d5667;border-radius:16px;background:rgba(2,10,15,.94);backdrop-filter:blur(22px);max-height:44vh;overflow:auto;font-size:12px}.model p{margin:.55em 0;color:#c9dce4}.warn{color:#ffd58a;font-size:10px;text-align:center}</style></head><body><header class="top"><div class="title">GENESIS · MATTER LAB</div><div class="tag">VERTICAL SLICE 0.2 · STRUCTURE</div></header><main class="stage"><canvas id="view"></canvas><div id="stats" class="stats"></div><div class="hint">Tap the field to inject a physical impulse</div><div class="rdfWrap"><canvas id="rdf"></canvas></div><section id="modelInfo" class="model" hidden></section></main><footer class="controls"><div class="row"><label>Temperature</label><input id="temp" type="range" min="0.06" max="1.20" step="0.01" value="0.42"><span id="tempV" class="v"></span></div><div class="row"><label>Attraction ε</label><input id="attr" type="range" min="0.20" max="2.20" step="0.02" value="1.00"><span id="attrV" class="v"></span></div><div class="row"><label class="switch"><input id="thermostat" type="checkbox" checked> thermostat</label><button id="pause">Pause</button><button id="reset">Reset</button><button id="seed">New seed</button></div><div class="row"><button id="pulse">Center impulse</button><button id="quench">Quench to 0.12</button><button id="modelBtn">What is this?</button></div><div class="warn">REAL: coarse-grained classical particle dynamics + g(r). NOT YET: chemistry, cells, evolution, robots, or full GENESIS.</div></footer><script src="./model.js"></script><script src="./sim.js"></script></body></html>
