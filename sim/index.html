<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>GENESIS Matter Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:#eafaff;font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto 1fr auto}.top{padding:calc(8px + env(safe-area-inset-top)) 11px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(3,10,15,.9);backdrop-filter:blur(18px);border-bottom:1px solid #18303d}.title{font-weight:850;letter-spacing:.07em;font-size:12px}.tag{font-size:9px;padding:5px 7px;border:1px solid #2d5363;border-radius:999px;color:#9ee9ff}.stage{position:relative;min-height:0}#view{width:100%;height:100%;display:block;touch-action:none}.stats{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}.stats span,.stats b{padding:3px 6px;border:1px solid rgba(100,180,210,.2);background:rgba(2,10,15,.64);backdrop-filter:blur(8px);border-radius:8px;font-size:9px;font-weight:650}.stats b{color:#9ee9ff}.rdfWrap{position:absolute;right:8px;bottom:8px;width:min(230px,46vw);height:82px;border:1px solid rgba(100,180,210,.22);border-radius:12px;overflow:hidden;pointer-events:none}.rdfWrap canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:8px;bottom:8px;padding:5px 8px;border-radius:999px;background:rgba(2,9,14,.64);font-size:9px;color:#afcbd6;pointer-events:none;white-space:nowrap}.controls{padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(3,10,15,.95);backdrop-filter:blur(22px);border-top:1px solid #18303d;display:grid;gap:6px}.row{display:flex;gap:6px;align-items:center}.row label{min-width:80px;font-size:10px;color:#b6d3df}.row input[type=range]{flex:1;min-width:40px}.v{width:34px;text-align:right;font:10px ui-monospace,monospace;color:#8ceaff}button{appearance:none;border:1px solid #2a5261;background:#0b1a22;color:#e8fbff;border-radius:10px;padding:8px 8px;font:750 10px system-ui;flex:1}button:active{transform:scale(.98)}.switch{display:flex;align-items:center;gap:5px;font-size:10px;color:#bdd2da}.model{position:absolute;left:10px;right:10px;bottom:10px;padding:12px;border:1px solid #2d5667;border-radius:15px;background:rgba(2,10,15,.95);backdrop-filter:blur(22px);max-height:48vh;overflow:auto;font-size:11px}.model p{margin:.55em 0;color:#c9dce4}.warn{color:#ffd58a;font-size:9px;text-align:center}</style></head><body><header class="top"><div class="title">GENESIS · MATTER LAB</div><div class="tag">0.3 · REVERSIBLE ASSOCIATION LAB</div></header><main class="stage"><canvas id="view"></canvas><div id="stats" class="stats"></div><div class="hint">Tap field = physical impulse</div><div class="rdfWrap"><canvas id="rdf"></canvas></div><section id="modelInfo" class="model" hidden></section></main><footer class="controls"><div class="row"><label>Temperature</label><input id="temp" type="range" min="0.06" max="1.20" step="0.01" value="0.42"><span id="tempV" class="v"></span></div><div class="row"><label>Attraction ε</label><input id="attr" type="range" min="0.20" max="2.20" step="0.02" value="1.00"><span id="attrV" class="v"></span></div><div class="row"><label>Assoc. on k*</label><input id="assocOn" type="range" min="0" max="120" step="1" value="28"><span id="assocOnV" class="v"></span></div><div class="row"><label>Assoc. off k*</label><input id="assocOff" type="range" min="0" max="12" step="0.05" value="1.15"><span id="assocOffV" class="v"></span></div><div class="row"><label class="switch"><input id="thermostat" type="checkbox" checked> thermostat</label><label class="switch"><input id="association" type="checkbox" checked> associations</label><button id="pause">Pause</button><button id="reset">Reset</button></div><div class="row"><button id="seed">New seed</button><button id="pulse">Impulse</button><button id="quench">Quench</button><button id="breakPairs">Break pairs</button><button id="modelBtn">Model</button></div><div class="warn">REAL: coarse-grained particles + reversible toy association kinetics. NOT REAL CHEMICAL BONDS / REACTIONS YET.</div></footer><script src="./model.js"></script><script src="./sim.js"></script></body></html>
