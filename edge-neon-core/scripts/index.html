<!doctype html><html><head><meta charset="utf-8"><title>Edge Neon Core</title></head><body><script>
window['ai_edge_gallery_get_result'] = async function(data, secret) {
  try {
    const d = JSON.parse(data || '{}');
    const key = 'edge-neon-core.memory.v1';
    const perfKey = 'edge-neon-core.perf.v1';
    const result = (x) => JSON.stringify({result: x});

    if (d.action === 'ping') {
      return JSON.stringify({result:'PONG — Edge Neon Core is alive.', version:'1.0', runner:'index.html'});
    }

    if (d.action === 'perf') {
      const allowed = ['eco','balanced','turbo'];
      const mode = allowed.includes(String(d.mode).toLowerCase()) ? String(d.mode).toLowerCase() : 'eco';
      localStorage.setItem(perfKey, mode);
      return JSON.stringify({result:'Performance mode: ' + mode.toUpperCase(), mode});
    }

    if (d.action === 'capabilities') {
      let webgl2 = false;
      try { webgl2 = !!document.createElement('canvas').getContext('webgl2'); } catch(e) {}
      const caps = {
        wasm: typeof WebAssembly !== 'undefined',
        webCrypto: !!(window.crypto && crypto.subtle),
        localStorage: !!window.localStorage,
        indexedDB: !!window.indexedDB,
        worker: typeof Worker !== 'undefined',
        webgpu: !!navigator.gpu,
        webgl2,
        audio: !!(window.AudioContext || window.webkitAudioContext),
        share: !!navigator.share
      };
      return JSON.stringify({result: JSON.stringify(caps, null, 2), capabilities:caps});
    }

    if (d.action === 'selftest') {
      let storage = false, wasm = false, hash = false;
      try { localStorage.setItem('enc_test','1'); storage = localStorage.getItem('enc_test') === '1'; localStorage.removeItem('enc_test'); } catch(e) {}
      try {
        const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
        const obj = await WebAssembly.instantiate(bytes);
        wasm = obj.instance.exports.add(20,22) === 42;
      } catch(e) {}
      try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('neon')); hash = new Uint8Array(b).length === 32; } catch(e) {}
      const report = {runner:'edge-neon-core/index.html', version:'1.0', mode:localStorage.getItem(perfKey)||'eco', storage, wasm, sha256:hash, webgpu:!!navigator.gpu, worker:typeof Worker!=='undefined'};
      return JSON.stringify({result:JSON.stringify(report,null,2), report});
    }

    if (d.action === 'hash') {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(d.text || '')));
      const hex = Array.from(new Uint8Array(buf), x => x.toString(16).padStart(2,'0')).join('');
      return result(hex);
    }

    if (d.action === 'wasm') {
      const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
      const obj = await WebAssembly.instantiate(bytes);
      return result('WASM add(20,22) = ' + obj.instance.exports.add(20,22));
    }

    if (d.action === 'math') {
      const nums = (String(d.text || '').match(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g) || []).map(Number).filter(Number.isFinite);
      if (!nums.length) return JSON.stringify({error:'No numbers found.'});
      const sorted = nums.slice().sort((a,b)=>a-b);
      const sum = nums.reduce((a,b)=>a+b,0);
      const n = nums.length;
      const median = n % 2 ? sorted[n>>1] : (sorted[n/2-1] + sorted[n/2]) / 2;
      return JSON.stringify({result:JSON.stringify({count:n,min:sorted[0],max:sorted[n-1],sum,mean:sum/n,median},null,2)});
    }

    if (d.action === 'remember') {
      const text = String(d.text || '').trim();
      if (!text) return JSON.stringify({error:'Nothing to remember.'});
      let items = [];
      try { items = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
      items.push({text, time:Date.now()});
      if (items.length > 100) items = items.slice(-100);
      localStorage.setItem(key, JSON.stringify(items));
      return result('Remembered. ' + items.length + ' item(s) stored.');
    }

    if (d.action === 'recall') {
      let items = [];
      try { items = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
      return result(items.length ? items.slice(-20).reverse().map((x,i)=>(i+1)+'. '+x.text).join('\n') : 'No saved memory.');
    }

    return result('Edge Neon Core ready. Try /ping or /selftest.');
  } catch (e) {
    return JSON.stringify({error:'Edge Neon Core: ' + (e && e.message ? e.message : String(e))});
  }
};
</script></body></html>
